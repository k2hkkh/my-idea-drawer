                  <div class="manual-desc">
                    • **↩️ 한 획 취소**: 방금 잘못 그은 선이나 글씨를 터치 한 번으로 되돌리기<br>
                    • **🔄 도화지 싹 지우기**: 전체 화면을 깨끗한 검정 도화지로 완전 리셋<br>
                    • **더블탭 2단계 (톡톡)**: 상단 바가 열린 상태에서 빈 화면을 다시 두 번 치면 **생각서랍에 자동 저장 후 복귀**<br>
                    • **좌측 하단 쓸어올리기**: 메모지를 구겨 **휴지통으로 직행**<br>
                    • **우측 하단 쓸어올리기**: 즉시 **생각서랍에 저장 후 복귀**
                  </div>
