                    • **📋 나의계획**: `⚡ 오늘 집중`과 `🔄 진행/보관`으로 나뉜 2단 실행 대시보드<br>
                    • **📑 메모딱지**: 버튼 없는 암전 화면에서 손글씨를 자유롭게 쓰고 찢어버리는 낙서장
                  </div>
