name: Build Idea Drawer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 파일 가져오기
        uses: actions/checkout@v4

      - name: 2. 자바 JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. 생각서랍 제미나이 UI 및 반응형 웹 구성
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <title>생각서랍</title>
            <style>
              :root {
                --bg: #0b0f19;
                --card: #151e2e;
                --primary: #2563eb;
                --accent: #38bdf8;
                --pill-bg: #1e293b;
                --danger: #ef4444;
                --text: #f8fafc;
                --muted: #94a3b8;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
                background-color: var(--bg);
                color: var(--text);
                height: 100vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
              }
              header {
                padding: 10px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: var(--card);
                border-bottom: 1px solid #1e293b;
                flex-shrink: 0;
              }
              header h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
              .btn-archive {
                background: #1e293b;
                border: 1px solid #334155;
                color: var(--accent);
                padding: 6px 12px;
                border-radius: 8px;
                font-size: 0.8rem;
                font-weight: bold;
                cursor: pointer;
              }
              .stage-bar {
                display: flex;
                background: #0f172a;
                padding: 6px 12px;
                gap: 6px;
                border-bottom: 1px solid #1e293b;
                overflow-x: auto;
                flex-shrink: 0;
              }
              .stage-tag {
                font-size: 0.75rem;
                padding: 3px 8px;
                border-radius: 6px;
                background: #1e293b;
                color: var(--muted);
                cursor: pointer;
                white-space: nowrap;
              }
              .stage-tag.active {
                background: var(--accent);
                color: #0b0f19;
                font-weight: bold;
              }
              nav {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                background: var(--card);
                padding: 6px;
                gap: 4px;
                border-bottom: 1px solid #1e293b;
                flex-shrink: 0;
              }
              .tab-btn {
                padding: 8px 2px;
                background: none;
                border: none;
                color: var(--muted);
                font-size: 0.82rem;
                font-weight: 600;
                border-radius: 8px;
                cursor: pointer;
              }
              .tab-btn.active {
                background: var(--primary);
                color: #ffffff;
              }
              .container {
                flex: 1;
                min-height: 0;
                padding: 12px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                overflow: hidden;
              }
              .tab-content { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 8px; height: 100%; }
              .tab-content.active { display: flex; }

              /* 제미나이 캡슐 알약형 입력바 (Gemini Bar) */
              .gemini-pill-box {
                background: var(--pill-bg);
                border: 1px solid #334155;
                border-radius: 28px;
                padding: 6px 12px;
                display: flex;
                align-items: center;
                gap: 8px;
                width: 100%;
                flex-shrink: 0;
              }
              .gemini-plus-btn {
                background: none;
                border: none;
                color: var(--muted);
                font-size: 1.25rem;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 28px;
                height: 28px;
              }
              .gemini-input {
                flex: 1;
                background: transparent;
                border: none;
                color: #ffffff;
                font-size: 0.95rem;
                outline: none;
              }
              .gemini-input::placeholder { color: #64748b; }
              .gemini-mic-icon {
                background: none;
                border: none;
                color: var(--muted);
                font-size: 1.1rem;
                cursor: pointer;
                padding: 4px;
              }
              .gemini-wave-circle {
                width: 34px;
                height: 34px;
                border-radius: 50%;
                background: #2563eb;
                border: none;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 2px;
                flex-shrink: 0;
              }
              .wave-bar {
                width: 3px;
                height: 12px;
                background: #ffffff;
                border-radius: 2px;
              }
              .gemini-wave-circle.listening {
                background: var(--danger);
                animation: pulse 1.2s infinite;
              }
              .gemini-wave-circle.listening .wave-bar {
                animation: waveAnim 0.6s infinite alternate ease-in-out;
              }
              .gemini-wave-circle.listening .wave-bar:nth-child(2) { animation-delay: 0.15s; }
              .gemini-wave-circle.listening .wave-bar:nth-child(3) { animation-delay: 0.3s; }
              @keyframes waveAnim { 0% { height: 6px; } 100% { height: 18px; } }
              @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

              /* 화면 분할 및 미디어 영역 */
              .split-view {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: 8px;
              }
              .media-half-top {
                flex: 1;
                min-height: 0;
                background: var(--card);
                border: 2px dashed #334155;
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                position: relative;
              }
              .media-half-bottom {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
              }
              .text-area-box {
                flex: 1;
                width: 100%;
                background: var(--card);
                border: 1px solid #1e293b;
                border-radius: 12px;
                padding: 10px 12px;
                color: #ffffff;
                font-size: 0.95rem;
                resize: none;
                line-height: 1.4;
              }

              /* 스케치 캔버스 */
              .canvas-box {
                width: 100%;
                height: 100%;
                background: #ffffff;
                border-radius: 10px;
                touch-action: none;
              }
              canvas { width: 100%; height: 100%; display: block; border-radius: 10px; }

              /* 하단 일괄 버튼 그룹 */
              .action-buttons {
                display: grid;
                grid-template-columns: 1fr 1fr 1.4fr;
                gap: 6px;
                flex-shrink: 0;
                padding-top: 2px;
              }
              .btn-action-del {
                background: #1e293b;
                color: #f8fafc;
                padding: 10px;
                border: 1px solid #334155;
                border-radius: 10px;
                font-size: 0.8rem;
                font-weight: bold;
                cursor: pointer;
              }
              .btn-action-save {
                background: #10b981;
                color: #ffffff;
                padding: 10px;
                border: none;
                border-radius: 10px;
                font-size: 0.85rem;
                font-weight: bold;
                cursor: pointer;
              }

              /* 생각보관함 모달 */
              .modal-overlay {
                display: none;
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: var(--bg);
                z-index: 100;
                flex-direction: column;
              }
              .modal-overlay.active { display: flex; }
              .modal-header {
                padding: 12px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: var(--card);
                border-bottom: 1px solid #1e293b;
              }
              .archive-list {
                flex: 1;
                overflow-y: auto;
                padding: 12px;
                display: flex;
                flex-direction: column;
                gap: 8px;
              }
              .archive-card {
                background: var(--card);
                padding: 12px;
                border-radius: 10px;
                border-left: 4px solid var(--accent);
                display: flex;
                flex-direction: column;
                gap: 6px;
              }
            </style>
          </head>
          <body>

            <header>
              <h1>💡 생각서랍</h1>
              <button class="btn-archive" onclick="openArchive()">📂 생각보관함</button>
            </header>

            <div class="stage-bar">
              <span style="font-size:0.75rem; color:var(--muted); line-height:22px;">단계:</span>
              <div class="stage-tag active" onclick="setStage(this, '1.발상')">💡 1.발상</div>
              <div class="stage-tag" onclick="setStage(this, '2.구체화')">📐 2.구체화</div>
              <div class="stage-tag" onclick="setStage(this, '3.검증')">🧪 3.검증</div>
              <div class="stage-tag" onclick="setStage(this, '4.실행')">🚀 4.실행</div>
            </div>

            <nav>
              <button class="tab-btn active" onclick="switchTab('voice')">✨ 음성</button>
              <button class="tab-btn" onclick="switchTab('photo')">📷 사진</button>
              <button class="tab-btn" onclick="switchTab('sketch')">🎨 스케치</button>
              <button class="tab-btn" onclick="switchTab('video')">🎬 동영상</button>
            </nav>

            <div class="container">
              <!-- 1. 음성 탭 -->
              <div id="tab-voice" class="tab-content active">
                <textarea id="voice-input-text" class="text-area-box" placeholder="음성인식 결과 및 생각을 입력하세요..."></textarea>
                <div class="gemini-pill-box">
                  <button class="gemini-plus-btn" onclick="clearSpecific('voice-input-text')">＋</button>
                  <input type="text" id="voice-quick-input" class="gemini-input" placeholder="생각을 적거나 말씀하세요..." onkeydown="if(event.key==='Enter') appendQuickText('voice-input-text', this)" />
                  <button class="gemini-mic-icon" onclick="triggerVoice('voice-input-text', 'wave-voice')">🎙️</button>
                  <button id="wave-voice" class="gemini-wave-circle" onclick="triggerVoice('voice-input-text', 'wave-voice')">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                  </button>
                </div>
                <div class="action-buttons" style="grid-template-columns: 1fr 2fr;">
                  <button class="btn-action-del" onclick="clearSpecific('voice-input-text')">🗑️ 내용 지우기</button>
                  <button class="btn-action-save" onclick="saveIdea('음성', document.getElementById('voice-input-text').value)">💾 서랍에 저장</button>
                </div>
              </div>

              <!-- 2. 사진 탭 -->
              <div id="tab-photo" class="tab-content">
                <div class="split-view">
                  <div class="media-half-top" onclick="document.getElementById('photo-input').click()">
                    <input type="file" accept="image/*" capture="environment" id="photo-input" style="display:none;" onchange="previewMediaFile(this, 'photo-view', 'photo-prompt')" />
                    <p id="photo-prompt" style="color:var(--muted); font-size:0.85rem;">📷 터치하여 촬영 또는 사진 선택</p>
                    <img id="photo-view" style="max-width:100%; max-height:100%; border-radius:8px; display:none;" />
                  </div>
                  <div class="media-half-bottom">
                    <textarea id="photo-memo" class="text-area-box" placeholder="사진에 대한 생각과 메모를 적어주세요..."></textarea>
                  </div>
                </div>
                <div class="gemini-pill-box">
                  <button class="gemini-plus-btn" onclick="document.getElementById('photo-input').click()">＋</button>
                  <input type="text" class="gemini-input" placeholder="사진에 대한 음성 메모..." onkeydown="if(event.key==='Enter') appendQuickText('photo-memo', this)" />
                  <button class="gemini-mic-icon" onclick="triggerVoice('photo-memo', 'wave-photo')">🎙️</button>
                  <button id="wave-photo" class="gemini-wave-circle" onclick="triggerVoice('photo-memo', 'wave-photo')">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                  </button>
                </div>
                <div class="action-buttons">
                  <button class="btn-action-del" onclick="clearMedia('photo-input', 'photo-view', 'photo-prompt')">📷 사진 삭제</button>
                  <button class="btn-action-del" onclick="clearSpecific('photo-memo')">📝 메모 삭제</button>
                  <button class="btn-action-save" onclick="saveMediaIdea('사진', 'photo-memo', 'photo-view')">💾 서랍에 저장</button>
                </div>
              </div>

              <!-- 3. 스케치 탭 -->
              <div id="tab-sketch" class="tab-content">
                <div class="split-view">
                  <div class="media-half-top" style="border-style:solid; border-color:#1e293b;">
                    <div style="position:absolute; top:6px; right:6px; z-index:10; background:rgba(15,23,42,0.8); padding:3px 6px; border-radius:6px; display:flex; align-items:center; gap:4px;">
                      <span style="font-size:0.75rem; color:var(--muted);">펜:</span>
                      <input type="color" id="sketch-color" value="#000000" style="width:24px; height:24px; border:none; border-radius:4px; cursor:pointer;" />
                    </div>
                    <div class="canvas-box" id="canvas-wrapper">
                      <canvas id="sketch-board"></canvas>
                    </div>
                  </div>
                  <div class="media-half-bottom">
                    <textarea id="sketch-memo" class="text-area-box" placeholder="스케치에 대한 설명과 메모를 적어주세요..."></textarea>
                  </div>
                </div>
                <div class="gemini-pill-box">
                  <button class="gemini-plus-btn" onclick="clearCanvas()">＋</button>
                  <input type="text" class="gemini-input" placeholder="스케치에 대한 음성 메모..." onkeydown="if(event.key==='Enter') appendQuickText('sketch-memo', this)" />
                  <button class="gemini-mic-icon" onclick="triggerVoice('sketch-memo', 'wave-sketch')">🎙️</button>
                  <button id="wave-sketch" class="gemini-wave-circle" onclick="triggerVoice('sketch-memo', 'wave-sketch')">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                  </button>
                </div>
                <div class="action-buttons">
                  <button class="btn-action-del" onclick="clearCanvas()">🎨 그림 삭제</button>
                  <button class="btn-action-del" onclick="clearSpecific('sketch-memo')">📝 메모 삭제</button>
                  <button class="btn-action-save" onclick="saveIdea('스케치', document.getElementById('sketch-memo').value || '스케치 드로잉')">💾 서랍에 저장</button>
                </div>
              </div>

              <!-- 4. 동영상 탭 -->
              <div id="tab-video" class="tab-content">
                <div class="split-view">
                  <div class="media-half-top" onclick="document.getElementById('video-input').click()">
                    <input type="file" accept="video/*" capture="environment" id="video-input" style="display:none;" onchange="previewMediaFile(this, 'video-view', 'video-prompt')" />
                    <p id="video-prompt" style="color:var(--muted); font-size:0.85rem;">🎬 터치하여 영상 촬영 또는 비디오 선택</p>
                    <video id="video-view" controls style="max-width:100%; max-height:100%; border-radius:8px; display:none;"></video>
                  </div>
                  <div class="media-half-bottom">
                    <textarea id="video-memo" class="text-area-box" placeholder="영상에 대한 생각과 메모를 적어주세요..."></textarea>
                  </div>
                </div>
                <div class="gemini-pill-box">
                  <button class="gemini-plus-btn" onclick="document.getElementById('video-input').click()">＋</button>
                  <input type="text" class="gemini-input" placeholder="영상에 대한 음성 메모..." onkeydown="if(event.key==='Enter') appendQuickText('video-memo', this)" />
                  <button class="gemini-mic-icon" onclick="triggerVoice('video-memo', 'wave-video')">🎙️</button>
                  <button id="wave-video" class="gemini-wave-circle" onclick="triggerVoice('video-memo', 'wave-video')">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                  </button>
                </div>
                <div class="action-buttons">
                  <button class="btn-action-del" onclick="clearMedia('video-input', 'video-view', 'video-prompt')">🎬 영상 삭제</button>
                  <button class="btn-action-del" onclick="clearSpecific('video-memo')">📝 메모 삭제</button>
                  <button class="btn-action-save" onclick="saveMediaIdea('동영상', 'video-memo', 'video-view')">💾 서랍에 저장</button>
                </div>
              </div>
            </div>

            <!-- 생각보관함 모달 -->
            <div id="archive-modal" class="modal-overlay">
              <div class="modal-header">
                <h2 style="font-size:1.05rem; color:var(--accent);">📂 저장된 생각서랍</h2>
                <button class="btn-archive" style="background:#ef4444; color:#fff;" onclick="closeArchive()">닫기</button>
              </div>
              <div class="archive-list" id="archive-item-list"></div>
            </div>

            <script>
              let currentStage = '1.발상';
              let activeInputId = 'voice-input-text';
              let activeWaveBtnId = 'wave-voice';
              let editingIndex = -1;

              function setStage(el, stage) {
                document.querySelectorAll('.stage-tag').forEach(t => t.classList.remove('active'));
                el.classList.add('active');
                currentStage = stage;
              }

              function switchTab(tabId) {
                const tabs = ['voice', 'photo', 'sketch', 'video'];
                document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                  btn.classList.toggle('active', tabs[idx] === tabId);
                });
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById('tab-' + tabId).classList.add('active');
                if (tabId === 'sketch') setTimeout(initCanvas, 50);
              }

              function clearSpecific(id) { document.getElementById(id).value = ''; }
              function clearMedia(inputId, viewId, promptId) {
                document.getElementById(inputId).value = '';
                const v = document.getElementById(viewId);
                v.src = '';
                v.style.display = 'none';
                document.getElementById(promptId).style.display = 'block';
              }
              function previewMediaFile(input, viewId, promptId) {
                const file = input.files[0];
                if (file) {
                  const el = document.getElementById(viewId);
                  el.src = URL.createObjectURL(file);
                  el.style.display = 'block';
                  document.getElementById(promptId).style.display = 'none';
                }
              }

              function appendQuickText(targetId, inputEl) {
                const val = inputEl.value.trim();
                if (val) {
                  appendVoiceText(targetId, val);
                  inputEl.value = '';
                }
              }

              /* 음성 인식 */
              function triggerVoice(targetId, waveId) {
                activeInputId = targetId;
                activeWaveBtnId = waveId;
                const btn = document.getElementById(waveId);
                if (btn) btn.classList.add('listening');

                if (window.AndroidBridge && window.AndroidBridge.startSpeechRecognition) {
                  window.AndroidBridge.startSpeechRecognition();
                } else {
                  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                  if (!Speech) {
                    alert('음성인식 기능을 지원하지 않는 기기입니다.');
                    if (btn) btn.classList.remove('listening');
                    return;
                  }
                  const rec = new Speech();
                  rec.lang = 'ko-KR';
                  rec.onresult = (e) => appendVoiceText(activeInputId, e.results[0][0].transcript);
                  rec.onend = () => { if (btn) btn.classList.remove('listening'); };
                  rec.start();
                }
              }

              function appendVoiceText(targetId, newText) {
                const area = document.getElementById(targetId);
                if (!area) return;
                const prev = area.value.trim();
                area.value = prev ? prev + ' ' + newText : newText;
              }

              window.receiveVoiceResult = function(text) {
                const btn = document.getElementById(activeWaveBtnId);
                if (btn) btn.classList.remove('listening');
                appendVoiceText(activeInputId, text);
              };

              /* 플로팅 데이터 수신 검사 */
              setInterval(() => {
                if (window.AndroidBridge && window.AndroidBridge.getPendingVoiceText) {
                  const text = window.AndroidBridge.getPendingVoiceText();
                  if (text && text.trim().length > 0) {
                    switchTab('voice');
                    appendVoiceText('voice-input-text', text);
                  }
                }
              }, 400);

              /* 캔버스 고정 */
              const canvas = document.getElementById('sketch-board');
              const ctx = canvas.getContext('2d');
              let isDrawing = false;
              let isCanvasSet = false;

              function initCanvas() {
                if (isCanvasSet) return;
                const holder = document.getElementById('canvas-wrapper');
                if (holder.clientWidth > 0 && holder.clientHeight > 0) {
                  canvas.width = holder.clientWidth;
                  canvas.height = holder.clientHeight;
                  ctx.lineWidth = 4;
                  ctx.lineCap = 'round';
                  ctx.strokeStyle = document.getElementById('sketch-color').value;
                  isCanvasSet = true;
                }
              }
              function getPos(e) {
                const r = canvas.getBoundingClientRect();
                const t = e.touches ? e.touches[0] : e;
                return { x: t.clientX - r.left, y: t.clientY - r.top };
              }
              canvas.addEventListener('mousedown', (e) => { isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
              canvas.addEventListener('mousemove', (e) => { if (!isDrawing) return; ctx.strokeStyle = document.getElementById('sketch-color').value; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
              canvas.addEventListener('mouseup', () => { isDrawing = false; });
              canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }, { passive: false });
              canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (!isDrawing) return; ctx.strokeStyle = document.getElementById('sketch-color').value; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }, { passive: false });
              canvas.addEventListener('touchend', () => { isDrawing = false; });
              function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

              /* 보관함 관리 */
              function getStorage() {
                const saved = localStorage.getItem('idea_drawer_storage') || '[]';
                try { return JSON.parse(saved); } catch(e) { return []; }
              }
              function setStorage(arr) { localStorage.setItem('idea_drawer_storage', JSON.stringify(arr)); }

              function saveIdea(type, content) {
                if (!content || content.trim() === '') {
                  alert('저장할 내용이 없습니다.');
                  return;
                }
                const list = getStorage();
                if (editingIndex >= 0) {
                  list[editingIndex].content = content;
                  list[editingIndex].stage = currentStage;
                  list[editingIndex].time = new Date().toLocaleTimeString('ko-KR') + ' (수정됨)';
                  editingIndex = -1;
                  alert('성공적으로 수정되었습니다.');
                } else {
                  list.unshift({ type, stage: currentStage, content, time: new Date().toLocaleTimeString('ko-KR') });
                  alert(`[${type}] 생각이 보관되었습니다.`);
                }
                setStorage(list);
              }

              function saveMediaIdea(type, memoId, viewId) {
                const memo = document.getElementById(memoId).value.trim();
                const view = document.getElementById(viewId);
                if (!memo && (!view.src || view.style.display === 'none')) {
                  alert('촬영된 미디어나 메모를 입력해 주세요.');
                  return;
                }
                saveIdea(type, memo || `[${type} 파일 저장됨]`);
              }

              function openArchive() {
                document.getElementById('archive-modal').classList.add('active');
                renderArchive();
              }
              function closeArchive() { document.getElementById('archive-modal').classList.remove('active'); }

              function renderArchive() {
                const list = getStorage();
                const container = document.getElementById('archive-item-list');
                if (list.length === 0) {
                  container.innerHTML = '<p style="color:var(--muted); text-align:center; margin-top:40px;">저장된 생각이 없습니다.</p>';
                  return;
                }
                container.innerHTML = list.map((item, idx) => `
                  <div class="archive-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <div>
                        <strong style="color:var(--accent);">[${item.type}]</strong>
                        <span style="font-size:0.75rem; background:#334155; padding:2px 6px; border-radius:4px; margin-left:4px;">${item.stage || '1.발상'}</span>
                      </div>
                      <span style="font-size:0.75rem; color:#64748b;">${item.time}</span>
                    </div>
                    <p style="font-size:0.95rem; margin:4px 0; white-space:pre-wrap;">${item.content}</p>
                    <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:4px;">
                      <button style="background:#2563eb; color:#fff; border:none; padding:4px 10px; border-radius:6px; font-size:0.75rem; cursor:pointer;" onclick="editIdea(${idx})">✏️ 수정</button>
                      <button style="background:#ef4444; color:#fff; border:none; padding:4px 10px; border-radius:6px; font-size:0.75rem; cursor:pointer;" onclick="deleteIdea(${idx})">🗑️ 삭제</button>
                    </div>
                  </div>
                `).join('');
              }

              function editIdea(idx) {
                const list = getStorage();
                const item = list[idx];
                editingIndex = idx;
                closeArchive();
                if (item.type === '음성') { switchTab('voice'); document.getElementById('voice-input-text').value = item.content; }
                else if (item.type === '사진') { switchTab('photo'); document.getElementById('photo-memo').value = item.content; }
                else if (item.type === '스케치') { switchTab('sketch'); document.getElementById('sketch-memo').value = item.content; }
                else if (item.type === '동영상') { switchTab('video'); document.getElementById('video-memo').value = item.content; }
              }

              function deleteIdea(idx) {
                if (confirm('이 생각을 서랍에서 삭제하시겠습니까?')) {
                  const list = getStorage();
                  list.splice(idx, 1);
                  setStorage(list);
                  renderArchive();
                }
              }
            </script>
          </body>
          </html>
          EOF

      - name: 5. 영구 서명키 및 투명 오버레이 음성 시스템 주입
        run: |
          cat << 'EOF' > package.json
          {
            "name": "my-idea-drawer",
