            <script>
              let currentMainMode = 'idea';
              let currentCategory = '첫 생각';
              let currentAttachments = [];
              let editingThoughtId = null;
              let editingMediaList = [];
              let editingPlanId = null;

              let activeTargetContext = 'main';
              let activeVoiceTarget = 'main';
              let isListeningContinuous = false;

              let cursorPositions = {
                'prompt-input': { start: 0, end: 0 },
                'edit-input': { start: 0, end: 0 },
                'plan-edit-newnote': { start: 0, end: 0 },
                'memopad-text-input': { start: 0, end: 0 }
              };

              function trackCursor(el) {
                if (el && el.id && cursorPositions.hasOwnProperty(el.id)) {
                  if (typeof el.selectionStart === 'number') {
                    cursorPositions[el.id] = { start: el.selectionStart, end: el.selectionEnd };
                  }
                }
              }

              document.addEventListener('selectionchange', () => {
                const el = document.activeElement;
                if (el && el.id && cursorPositions.hasOwnProperty(el.id)) {
                  trackCursor(el);
                }
              });

              let lastProcessedVoice = '';
              let lastProcessedTime = 0;

              function switchMainMode(mode) {
                currentMainMode = mode;
                document.getElementById('tab-btn-idea').classList.toggle('active', mode === 'idea');
                document.getElementById('tab-btn-plan').classList.toggle('active', mode === 'plan');
                document.getElementById('tab-btn-pad').classList.remove('active');

                const ideaCategoryBar = document.getElementById('idea-category-bar');
                const ideaFeed = document.getElementById('idea-feed-container');
                const planFeed = document.getElementById('plan-feed-container');
                const plusBtn = document.getElementById('btn-plus');
                const input = document.getElementById('prompt-input');

                if (mode === 'idea') {
                  ideaCategoryBar.style.display = 'flex';
                  ideaFeed.style.display = 'flex';
                  planFeed.style.display = 'none';
                  plusBtn.style.display = 'flex';
                  input.placeholder = '생각을 입력하거나 사진·영상을 덧붙이세요...';
                  renderFeed();
                } else if (mode === 'plan') {
                  ideaCategoryBar.style.display = 'none';
                  ideaFeed.style.display = 'none';
                  planFeed.style.display = 'flex';
                  plusBtn.style.display = 'none';
                  input.placeholder = '⚡ 오늘 할 일 또는 새로운 계획을 등록하세요...';
                  renderPlanView();
                }
              }

              function resetToIdeaDrawer() {
                switchMainMode('idea');
                selectCategory('첫 생각');
              }

              function selectCategory(cat) {
                currentCategory = cat;
                document.querySelectorAll('.category-pill').forEach(p => {
                  p.classList.toggle('active', p.innerText.includes(cat));
                });
                renderFeed();
              }

              function togglePlusMenu() {
                const menu = document.getElementById('plus-menu');
                const btn = document.getElementById('btn-plus');
                menu.classList.toggle('active');
                btn.classList.toggle('open');
              }
              function closePlusMenu() {
                document.getElementById('plus-menu').classList.remove('active');
                document.getElementById('btn-plus').classList.remove('open');
              }

              function triggerCamera(context = 'main') { activeTargetContext = context; closePlusMenu(); document.getElementById('camera-file').click(); }
              function triggerGallery(context = 'main') { activeTargetContext = context; closePlusMenu(); document.getElementById('gallery-file').click(); }
              function triggerVideo(context = 'main') { activeTargetContext = context; closePlusMenu(); document.getElementById('video-file').click(); }

              function compressImage(file, maxWidth = 800, quality = 0.65) {
                return new Promise((resolve) => {
                  const reader = new FileReader();
                  reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                      const canvas = document.createElement('canvas');
                      let w = img.width, h = img.height;
                      if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
                      canvas.width = w; canvas.height = h;
                      const ctx = canvas.getContext('2d');
                      ctx.drawImage(img, 0, 0, w, h);
                      resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                  };
                  reader.readAsDataURL(file);
                });
              }

              function captureVideoThumbnail(file) {
                return new Promise((resolve) => {
                  const url = URL.createObjectURL(file);
                  const video = document.createElement('video');
                  video.src = url; video.muted = true; video.playsInline = true; video.currentTime = 0.5;
                  video.onloadeddata = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 400;
                    canvas.height = Math.round((video.videoHeight * 400) / video.videoWidth) || 240;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                  };
                  video.onerror = () => { URL.revokeObjectURL(url); resolve(''); };
                });
              }

              async function processMediaFiles(input, type) {
                const files = input.files;
                if (files && files.length > 0) {
                  for (let file of Array.from(files)) {
                    const compressedData = await compressImage(file);
                    const item = { type: type, data: compressedData, isVideo: false };
                    if (activeTargetContext === 'edit') {
                      editingMediaList.push(item);
                      renderEditMediaPreview();
                    } else {
                      currentAttachments.push(item);
                      renderAttachmentTray();
                      updateSendButtonState();
                    }
                  }
                  input.value = '';
                }
              }

              async function processVideoFile(input) {
                const file = input.files[0];
                if (file) {
                  const thumb = await captureVideoThumbnail(file);
                  const item = { type: '동영상', data: thumb || '', isVideo: true };
                  if (activeTargetContext === 'edit') {
                    editingMediaList.push(item);
                    renderEditMediaPreview();
                  } else {
                    currentAttachments.push(item);
                    renderAttachmentTray();
                    updateSendButtonState();
                  }
                  input.value = '';
                }
              }

              function renderAttachmentTray() {
                const tray = document.getElementById('attachment-tray');
                if (currentAttachments.length === 0) { tray.classList.remove('active'); tray.innerHTML = ''; return; }
                tray.classList.add('active');
                tray.innerHTML = currentAttachments.map((item, idx) => `
                  <div class="tray-item">
                    <img src="${item.data}" class="tray-thumb" />
                    <button class="tray-remove-btn" onclick="removeAttachment(${idx})">✕</button>
                  </div>
                `).join('');
              }

              function removeAttachment(idx) {
                currentAttachments.splice(idx, 1);
                renderAttachmentTray();
                updateSendButtonState();
              }

              function handleInputChange(textarea) {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 90) + 'px';
                updateSendButtonState();
              }

              function updateSendButtonState() {
                const text = document.getElementById('prompt-input').value.trim();
                const hasAttachments = currentAttachments.length > 0;
                const waveBtn = document.getElementById('btn-wave');
                if (text || hasAttachments) {
                  waveBtn.innerHTML = '↑';
                } else {
                  waveBtn.innerHTML = '<div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>';
                }
              }

              function handleSendAction() {
                const input = document.getElementById('prompt-input');
                const text = input.value.trim();
                const hasAttachments = currentAttachments.length > 0;
                
                if (text || hasAttachments) {
                  if (isListeningContinuous) stopContinuousVoice();

                  if (currentMainMode === 'idea') {
                    let category = '노트';
                    if (hasAttachments) {
                      const hasVideo = currentAttachments.some(a => a.type === '동영상');
                      const hasPhoto = currentAttachments.some(a => a.type === '사진');
                      if (hasVideo) category = '동영상';
                      else if (hasPhoto) category = '사진';
                    }
                    saveThought(category, text, [...currentAttachments]);
                    selectCategory('첫 생각');
                  } else {
                    savePlan(text, true);
                    renderPlanView();
                  }

                  input.value = '';
                  input.style.height = 'auto';
                  currentAttachments = [];
                  cursorPositions['prompt-input'] = { start: 0, end: 0 };
                  renderAttachmentTray();
                  updateSendButtonState();
                } else {
                  toggleContinuousVoice('main');
                }
              }

              function toggleContinuousVoice(target) {
                activeVoiceTarget = target;
                closePlusMenu();

                let targetId = 'prompt-input';
                if (target === 'edit') targetId = 'edit-input';
                else if (target === 'plan-edit') targetId = 'plan-edit-newnote';
                else if (target === 'pad') targetId = 'memopad-text-input';

                const el = document.getElementById(targetId);
                if (el && typeof el.selectionStart === 'number') {
                  trackCursor(el);
                }

                if (isListeningContinuous) {
                  stopContinuousVoice();
                } else {
                  startContinuousVoice(target);
                }
              }

              function startContinuousVoice(target) {
                isListeningContinuous = true;
                updateVoiceButtonUI(true);

                if (window.AndroidBridge && window.AndroidBridge.startContinuousSpeech) {
                  window.AndroidBridge.startContinuousSpeech();
                } else {
                  startWebSpeechContinuous();
                }
              }

              function stopContinuousVoice() {
                isListeningContinuous = false;
                updateVoiceButtonUI(false);
                if (window.AndroidBridge && window.AndroidBridge.stopContinuousSpeech) {
                  window.AndroidBridge.stopContinuousSpeech();
                }
              }

              function updateVoiceButtonUI(listening) {
                const btnWave = document.getElementById('btn-wave');
                const btnMicMain = document.getElementById('btn-mic-main');
                const btnMicEdit = document.getElementById('edit-mic-btn');
                const btnMicPlan = document.getElementById('plan-mic-btn');
                const btnMicPad = document.getElementById('memopad-mic-btn');

                [btnWave, btnMicMain, btnMicEdit, btnMicPlan].forEach(btn => {
                  if (btn) {
                    if (listening) btn.classList.add('listening');
                    else btn.classList.remove('listening');
                  }
                });

                if (btnMicPad) {
                  if (listening) btnMicPad.classList.add('listening');
                  else btnMicPad.classList.remove('listening');
                }
              }

              let webSpeechInstance = null;
              function startWebSpeechContinuous() {
                const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Speech) { alert('음성인식 기능을 지원하지 않는 기기입니다.'); stopContinuousVoice(); return; }
                webSpeechInstance = new Speech();
                webSpeechInstance.lang = 'ko-KR';
                webSpeechInstance.continuous = true;
                webSpeechInstance.interimResults = false;

                webSpeechInstance.onresult = (e) => {
                  const lastText = e.results[e.results.length - 1][0].transcript;
                  appendVoiceResult(lastText);
                };
                webSpeechInstance.onend = () => {
                  if (isListeningContinuous) {
                    try { webSpeechInstance.start(); } catch (e) {}
                  }
                };
                webSpeechInstance.start();
              }

              /* 모든 영역 공통 커서 중간 삽입 로직 */
              function appendVoiceResult(text) {
                if (!text || !text.trim()) return;
                const clean = text.trim();
                const now = Date.now();

                if (clean === lastProcessedVoice && (now - lastProcessedTime < 1800)) return;
                lastProcessedVoice = clean;
                lastProcessedTime = now;

                let targetId = 'prompt-input';
                if (activeVoiceTarget === 'edit') targetId = 'edit-input';
                else if (activeVoiceTarget === 'plan-edit') targetId = 'plan-edit-newnote';
                else if (activeVoiceTarget === 'pad') targetId = 'memopad-text-input';

                const el = document.getElementById(targetId);
                if (!el) return;

                let pos = cursorPositions[targetId];
                let start = (pos && typeof pos.start === 'number' && pos.start >= 0 && pos.start <= el.value.length) 
                  ? pos.start 
                  : el.value.length;
                let end = (pos && typeof pos.end === 'number' && pos.end >= start && pos.end <= el.value.length) 
                  ? pos.end 
                  : start;

                const val = el.value;
                const before = val.substring(0, start);
                const after = val.substring(end);

                const needsPreSpace = before.length > 0 && !before.endsWith(' ') && !before.endsWith('\n');
                const needsPostSpace = after.length > 0 && !after.startsWith(' ') && !after.startsWith('\n');

                const insertChunk = (needsPreSpace ? ' ' : '') + clean + (needsPostSpace ? ' ' : '');
                el.value = before + insertChunk + after;

                const nextPos = start + insertChunk.length;
                if (typeof el.setSelectionRange === 'function') {
                  el.setSelectionRange(nextPos, nextPos);
                }
                cursorPositions[targetId] = { start: nextPos, end: nextPos };

                if (targetId === 'prompt-input') handleInputChange(el);
                if (targetId === 'memopad-text-input') handlePadTextInput(el.value);
              }

              window.receiveVoiceResult = function(text) {
                if (text && text.trim()) appendVoiceResult(text);
              };

              window.onSpeechEndedNative = function() {
                if (!isListeningContinuous) updateVoiceButtonUI(false);
              };

              function pollFloatingVoiceText() {
                if (window.AndroidBridge && window.AndroidBridge.getPendingVoiceText) {
                  try {
                    const text = window.AndroidBridge.getPendingVoiceText();
                    if (text && text.trim().length > 0) {
                      switchMainMode('idea');
                      selectCategory('첫 생각');
                      activeVoiceTarget = 'main';
                      appendVoiceResult(text);
                    }
                  } catch (e) {}
                }
              }
              setInterval(pollFloatingVoiceText, 300);
              window.addEventListener('DOMContentLoaded', pollFloatingVoiceText);

              function getThoughtStorage() {
                const data = localStorage.getItem('idea_drawer_storage') || '[]';
                try { return JSON.parse(data); } catch (e) { return []; }
              }
              function setThoughtStorage(arr) {
                try { localStorage.setItem('idea_drawer_storage', JSON.stringify(arr)); } catch (e) {}
                renderFeed();
              }
              function saveThought(category, content, mediaList) {
                const list = getThoughtStorage();
                list.unshift({
                  id: Date.now(),
                  category: category,
                  content: content || '',
                  mediaList: mediaList || [],
                  time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
                });
                setThoughtStorage(list);
              }

              function getPlanStorage() {
                const data = localStorage.getItem('plan_drawer_storage') || '[]';
                try { return JSON.parse(data); } catch (e) { return []; }
              }
              function setPlanStorage(arr) {
                try { localStorage.setItem('plan_drawer_storage', JSON.stringify(arr)); } catch (e) {}
                renderPlanView();
              }
              function savePlan(title, isToday = true) {
                if (!title || !title.trim()) return;
                const list = getPlanStorage();
                list.unshift({
                  id: Date.now(),
                  title: title.trim(),
                  status: '대기',
                  isToday: isToday,
                  notes: [],
                  updatedAt: new Date().toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })
                });
                setPlanStorage(list);
              }

              function getPadTrashStorage() {
                const data = localStorage.getItem('memopad_trash_storage') || '[]';
                try { return JSON.parse(data); } catch (e) { return []; }
              }
              function setPadTrashStorage(arr) {
                try { localStorage.setItem('memopad_trash_storage', JSON.stringify(arr)); } catch (e) {}
              }

              function sendThoughtToPlan(id) {
                const thought = getThoughtStorage().find(t => t.id === id);
                if (thought) {
                  const title = thought.content ? thought.content.split('\n')[0] : `[${thought.category}] 계획 항목`;
                  savePlan(title, true);
                  alert('⚡ 오늘 할 일 목록에 등록되었습니다!');
                }
              }

              function renderFeed() {
                const list = getThoughtStorage();
                const feed = document.getElementById('idea-feed-container');

                if (currentCategory === '첫 생각') {
                  feed.innerHTML = `
                    <div class="empty-canvas">
                      떠오르는 생각을 자유롭게 기록하세요.<br>
                      저장 즉시 서랍으로 들어가 깨끗한 화면이 유지됩니다.
                    </div>
                  `;
                  return;
                }

                const filtered = (currentCategory === '전체') 
                  ? list 
                  : list.filter(i => (i.category || i.type || '').includes(currentCategory));

                if (filtered.length === 0) {
                  feed.innerHTML = `<div class="empty-canvas">저장된 [${currentCategory}] 생각이 없습니다.</div>`;
                  return;
                }

                feed.innerHTML = filtered.map(item => `
                  <div class="thought-card">
                    <div class="card-header">
                      <span class="card-badge">${item.category || item.type || '노트'}</span>
                      <span class="card-time">${item.time}</span>
                    </div>
                    ${item.mediaList && item.mediaList.length > 0 ? `
                      <div class="card-media-grid">
                        ${item.mediaList.map(m => `<img src="${m.data}" class="media-thumb-item" />`).join('')}
                      </div>
                    ` : ''}
                    ${item.content ? `<div class="card-content">${item.content}</div>` : ''}
                    <div class="card-actions">
                      <button class="card-btn plan-send" onclick="sendThoughtToPlan(${item.id})">📋 계획으로</button>
                      <button class="card-btn" onclick="openEditModal(${item.id})">✏️ 수정</button>
                      <button class="card-btn" onclick="copyThought('${encodeURIComponent(item.content || '')}')">📋 복사</button>
                      <button class="card-btn delete" onclick="deleteThought(${item.id})">🗑️ 삭제</button>
                    </div>
                  </div>
                `).join('');
              }

              function copyThought(encoded) {
                const text = decodeURIComponent(encoded);
                navigator.clipboard.writeText(text).then(() => alert('클립보드에 복사되었습니다.'));
              }

              function deleteThought(id) {
                if (confirm('이 생각을 삭제하시겠습니까?')) {
                  const list = getThoughtStorage().filter(i => i.id !== id);
                  setThoughtStorage(list);
                }
              }

              function renderPlanView() {
                const list = getPlanStorage();
                const todayList = list.filter(p => p.isToday);
                const backlogList = list.filter(p => !p.isToday);

                document.getElementById('today-count-badge').innerText = `${todayList.length}건`;
                document.getElementById('backlog-count-badge').innerText = `${backlogList.length}건`;

                const todayContainer = document.getElementById('today-plan-list');
                const backlogContainer = document.getElementById('backlog-plan-list');

                if (todayList.length === 0) {
                  todayContainer.innerHTML = '<div style="color:#52525b; font-size:0.85rem; padding:10px 4px;">오늘 집중할 계획이 없습니다. 아래 입력창으로 추가하세요.</div>';
                } else {
                  todayContainer.innerHTML = todayList.map(p => renderPlanCardHtml(p)).join('');
                }

                if (backlogList.length === 0) {
                  backlogContainer.innerHTML = '<div style="color:#52525b; font-size:0.85rem; padding:10px 4px;">보관된 장기 프로젝트나 대기 작업이 없습니다.</div>';
                } else {
                  backlogContainer.innerHTML = backlogList.map(p => renderPlanCardHtml(p)).join('');
                }
              }

              function renderPlanCardHtml(p) {
                const isDone = p.status === '완료';
                const statusClass = (p.status === '진행중') ? 'progress' : (isDone ? 'done' : 'waiting');

                return `
                  <div class="plan-card ${isDone ? 'completed' : ''}">
                    <div class="plan-card-top">
                      <span class="status-tag ${statusClass}" onclick="cyclePlanStatus(${p.id})">${p.status}</span>
                      <div class="plan-title ${isDone ? 'completed' : ''}">${p.title}</div>
                      <span style="font-size:0.75rem; color:var(--muted);">${p.updatedAt}</span>
                    </div>

                    ${p.notes && p.notes.length > 0 ? `
                      <div class="plan-notes-box">
                        ${p.notes.map(n => `<div class="plan-note-item">• ${n}</div>`).join('')}
                      </div>
                    ` : ''}

                    <div class="card-actions" style="margin-top:2px;">
                      <button class="card-btn" onclick="toggleTodayFlag(${p.id})">${p.isToday ? '🔄 보관으로' : '⚡ 오늘로'}</button>
                      <button class="card-btn" onclick="openPlanEditModal(${p.id})">✏️ 메모/수정</button>
                      <button class="card-btn delete" onclick="deletePlan(${p.id})">🗑️ 삭제</button>
                    </div>
                  </div>
                `;
              }

              function cyclePlanStatus(id) {
                const list = getPlanStorage();
                const item = list.find(p => p.id === id);
                if (item) {
                  if (item.status === '대기') item.status = '진행중';
                  else if (item.status === '진행중') item.status = '완료';
                  else item.status = '대기';
                  setPlanStorage(list);
                }
              }

              function toggleTodayFlag(id) {
                const list = getPlanStorage();
                const item = list.find(p => p.id === id);
                if (item) {
                  item.isToday = !item.isToday;
                  setPlanStorage(list);
                }
              }

              function deletePlan(id) {
                if (confirm('이 계획을 삭제하시겠습니까?')) {
                  const list = getPlanStorage().filter(p => p.id !== id);
                  setPlanStorage(list);
                }
              }

              function openEditModal(id) {
                const item = getThoughtStorage().find(i => i.id === id);
                if (item) {
                  editingThoughtId = id;
                  editingMediaList = JSON.parse(JSON.stringify(item.mediaList || []));
                  const editArea = document.getElementById('edit-input');
                  editArea.value = item.content || '';
                  cursorPositions['edit-input'] = { start: editArea.value.length, end: editArea.value.length };
                  
                  const cat = item.category || item.type || '노트';
                  document.getElementById('edit-modal-title').innerText = `✏️ [${cat}] 풀스크린 수정`;
                  renderEditMediaPreview();
                  document.getElementById('edit-modal').classList.add('active');
                }
              }

              function renderEditMediaPreview() {
                const mediaBox = document.getElementById('edit-media-preview');
                if (editingMediaList.length === 0) { mediaBox.innerHTML = ''; return; }
                mediaBox.innerHTML = editingMediaList.map((m, idx) => `
                  <div style="position:relative; width:100%; height:110px;">
                    <img src="${m.data}" class="media-thumb-item" style="width:100%; height:100%; object-fit:cover;" />
                    <button onclick="removeEditMedia(${idx})" style="position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:var(--danger); color:#fff; border:none; font-size:0.75rem; cursor:pointer;">✕</button>
                  </div>
                `).join('');
              }
              function removeEditMedia(idx) { editingMediaList.splice(idx, 1); renderEditMediaPreview(); }

              function closeEditModal() {
                if (isListeningContinuous) stopContinuousVoice();
                document.getElementById('edit-modal').classList.remove('active');
                editingThoughtId = null;
                editingMediaList = [];
              }

              function confirmEditThought() {
                if (isListeningContinuous) stopContinuousVoice();
                const text = document.getElementById('edit-input').value.trim();
                const list = getThoughtStorage();
                const target = list.find(i => i.id === editingThoughtId);
                if (target) {
                  target.content = text;
                  target.mediaList = editingMediaList;
                  target.time = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + ' (수정됨)';
                  setThoughtStorage(list);
                }
                closeEditModal();
              }

              function openPlanEditModal(id) {
                const item = getPlanStorage().find(p => p.id === id);
                if (item) {
                  editingPlanId = id;
                  document.getElementById('plan-edit-title').value = item.title;
                  document.getElementById('plan-edit-newnote').value = '';
                  
                  const hist = document.getElementById('plan-edit-history');
                  hist.innerHTML = (item.notes && item.notes.length > 0)
                    ? item.notes.map(n => `<div>• ${n}</div>`).join('')
                    : '<span style="color:#52525b;">기록된 진행 메모가 없습니다.</span>';

                  cursorPositions['plan-edit-newnote'] = { start: 0, end: 0 };
                  document.getElementById('plan-edit-modal').classList.add('active');
                }
              }

              function closePlanEditModal() {
                if (isListeningContinuous) stopContinuousVoice();
                document.getElementById('plan-edit-modal').classList.remove('active');
                editingPlanId = null;
              }

              function confirmEditPlan() {
                const title = document.getElementById('plan-edit-title').value.trim();
                const newNote = document.getElementById('plan-edit-newnote').value.trim();
                const list = getPlanStorage();
                const target = list.find(p => p.id === editingPlanId);

                if (target && title) {
                  target.title = title;
                  if (newNote) {
                    const timeStamp = new Date().toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' });
                    target.notes.push(`[${timeStamp}] ${newNote}`);
                  }
                  target.updatedAt = new Date().toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' });
                  setPlanStorage(list);
                }
                closePlanEditModal();
              }

              /* ================== 암전 풀스크린 메모딱지 엔진 ================== */
              const padScreen = document.getElementById('memopad-screen');
              const padCanvas = document.getElementById('memopad-canvas');
              const padCtx = padCanvas.getContext('2d');
              const padToolbar = document.getElementById('memopad-toolbar');
              const padTextStrip = document.getElementById('memopad-text-strip');
              const padTextDisplay = document.getElementById('memopad-text-display');

              let padDrawing = false;
              let isMoving = false;
              let padColor = '#ffffff';
              let isPadEraser = false;
              const MOVE_THRESHOLD = 5;

              let lastTapTime = 0;
              let lastTapX = 0, lastTapY = 0;

              let touchStartX = 0, touchStartY = 0;
              let isCornerGesture = null;

              /* 실행 취소(Undo) 히스토리 스택 */
              let padHistory = [];

              function savePadState() {
                if (padHistory.length > 20) padHistory.shift();
                padHistory.push(padCtx.getImageData(0, 0, padCanvas.width, padCanvas.height));
              }

              function undoPadStroke() {
                if (padHistory.length > 0) {
                  const prevState = padHistory.pop();
                  padCtx.putImageData(prevState, 0, 0);
                } else {
                  padCtx.fillStyle = '#000000';
                  padCtx.fillRect(0, 0, padCanvas.width, padCanvas.height);
                }
              }

              function clearPadCanvas() {
                if (confirm('도화지를 깨끗하게 모두 지우시겠습니까?')) {
                  savePadState();
                  padCtx.fillStyle = '#000000';
                  padCtx.fillRect(0, 0, padCanvas.width, padCanvas.height);
                }
              }

              function openMemoPadDirect() {
                closePlusMenu();
                padScreen.classList.add('active');
                padToolbar.classList.remove('active');
                padTextStrip.style.display = 'none';
                document.getElementById('memopad-text-input').value = '';
                padTextDisplay.innerText = '';
                padHistory = [];

                setTimeout(() => {
                  padCanvas.width = window.innerWidth;
                  padCanvas.height = window.innerHeight;
                  padCtx.fillStyle = '#000000';
                  padCtx.fillRect(0, 0, padCanvas.width, padCanvas.height);
                  setPadColor('#ffffff');
                }, 30);
              }

              function closeMemoPadDirect() {
                if (isListeningContinuous) stopContinuousVoice();
                padScreen.classList.remove('active');
                padToolbar.classList.remove('active');
              }

              function setPadColor(color, el) {
                padColor = color;
                isPadEraser = false;
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                if (el) el.classList.add('active');
                document.getElementById('pad-eraser-btn').classList.remove('active');
                padCtx.strokeStyle = padColor;
                padCtx.lineWidth = 3.5;
                padCtx.lineCap = 'round';
                padCtx.lineJoin = 'round';
              }

              function togglePadEraser() {
                isPadEraser = !isPadEraser;
                document.getElementById('pad-eraser-btn').classList.toggle('active', isPadEraser);
                if (isPadEraser) {
                  padCtx.strokeStyle = '#000000';
                  padCtx.lineWidth = 26;
                } else {
                  setPadColor(padColor);
                }
              }

              function handlePadTextInput(val) {
                if (val && val.trim().length > 0) {
                  padTextStrip.style.display = 'block';
                  padTextDisplay.innerText = val.trim();
                } else {
                  padTextStrip.style.display = 'none';
                }
              }

              padCanvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const t = e.touches[0];
                const x = t.clientX, y = t.clientY;
                const winW = window.innerWidth, winH = window.innerHeight;

                if (y > winH - 120 && x < 120) {
                  isCornerGesture = 'left';
                  touchStartX = x; touchStartY = y;
                  return;
                } else if (y > winH - 120 && x > winW - 120) {
                  isCornerGesture = 'right';
                  touchStartX = x; touchStartY = y;
                  return;
                }

                const now = Date.now();
                if (now - lastTapTime < 320 && Math.abs(x - lastTapX) < 25 && Math.abs(y - lastTapY) < 25) {
                  if (padToolbar.classList.contains('active')) {
                    saveMemoPadToDrawer();
                    lastTapTime = 0;
                    return;
                  } else {
                    padToolbar.classList.add('active');
                    lastTapTime = 0;
                    return;
                  }
                }
                lastTapTime = now;
                lastTapX = x;
                lastTapY = y;

                touchStartX = x;
                touchStartY = y;
                isMoving = false;
                padDrawing = false;
              }, { passive: false });

              padCanvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const t = e.touches[0];
                const x = t.clientX, y = t.clientY;

                if (isCornerGesture) {
                  const dy = touchStartY - y;
                  if (dy > 80) {
                    if (isCornerGesture === 'left') trashMemoPad();
                    else if (isCornerGesture === 'right') saveMemoPadToDrawer();
                    isCornerGesture = null;
                  }
                  return;
                }

                if (!isMoving) {
                  const dist = Math.hypot(x - touchStartX, y - touchStartY);
                  if (dist > MOVE_THRESHOLD) {
                    savePadState(); // 새 획 시작 직전 상태 저장
                    isMoving = true;
                    padDrawing = true;
                    padCtx.beginPath();
                    padCtx.moveTo(touchStartX, touchStartY);
                  }
                }

                if (padDrawing) {
                  padCtx.lineTo(x, y);
                  padCtx.stroke();
                }
              }, { passive: false });

              padCanvas.addEventListener('touchend', () => {
                padDrawing = false;
                isMoving = false;
                isCornerGesture = null;
              });

              function trashMemoPad() {
                const dataUrl = padCanvas.toDataURL('image/jpeg', 0.8);
                const text = document.getElementById('memopad-text-input').value.trim();
                const trashList = getPadTrashStorage();

                trashList.unshift({
                  id: Date.now(),
                  imageData: dataUrl,
                  text: text,
                  time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }),
                  date: new Date().toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })
                });
                setPadTrashStorage(trashList);

                closeMemoPadDirect();
                alert('🗑️ 메모딱지가 휴지통으로 버려졌습니다.');
              }

              function saveMemoPadToDrawer() {
                const text = document.getElementById('memopad-text-input').value.trim();
                
                if (text) {
                  padCtx.fillStyle = '#2563eb';
                  padCtx.fillRect(10, 10, padCanvas.width - 20, 44);
                  padCtx.fillStyle = '#ffffff';
                  padCtx.font = 'bold 16px -apple-system, BlinkMacSystemFont, sans-serif';
                  padCtx.fillText(text, 22, 38);
                }

                const dataUrl = padCanvas.toDataURL('image/jpeg', 0.85);
                const item = { type: '메모딱지', data: dataUrl, isVideo: false };

                saveThought('메모딱지', text, [item]);
                closeMemoPadDirect();
                switchMainMode('idea');
                selectCategory('전체');
                alert('💾 메모딱지가 생각서랍에 안전하게 보관되었습니다!');
              }

              function openArchiveModal() {
                document.getElementById('archive-modal').classList.add('active');
                switchArchiveTab('archive');
              }
              function closeArchiveModal() { document.getElementById('archive-modal').classList.remove('active'); }

              function switchArchiveTab(tab) {
                document.getElementById('subtab-archive').classList.toggle('active', tab === 'archive');
                document.getElementById('subtab-trash').classList.toggle('active', tab === 'trash');
                document.getElementById('subtab-backup').classList.toggle('active', tab === 'backup');

                const archiveFeed = document.getElementById('archive-feed');
                const trashFeed = document.getElementById('trash-feed');
                const backupPane = document.getElementById('backup-pane');

                archiveFeed.style.display = (tab === 'archive') ? 'flex' : 'none';
                trashFeed.style.display = (tab === 'trash') ? 'flex' : 'none';
                backupPane.style.display = (tab === 'backup') ? 'flex' : 'none';

                if (tab === 'archive') renderArchiveFeed();
                else if (tab === 'trash') renderTrashFeed();
              }

              function renderArchiveFeed() {
                const list = getThoughtStorage();
                const feed = document.getElementById('archive-feed');
                if (list.length === 0) {
                  feed.innerHTML = '<p style="color:#55555c; text-align:center; margin-top:40px;">보관된 생각이 없습니다.</p>';
                  return;
                }
                feed.innerHTML = list.map(item => `
                  <div class="thought-card">
                    <div class="card-header">
                      <span class="card-badge">${item.category || item.type || '노트'}</span>
                      <span class="card-time">${item.time}</span>
                    </div>
                    ${item.mediaList && item.mediaList.length > 0 ? `
                      <div class="card-media-grid">
                        ${item.mediaList.map(m => `<img src="${m.data}" class="media-thumb-item" />`).join('')}
                      </div>
                    ` : ''}
                    ${item.content ? `<div class="card-content">${item.content}</div>` : ''}
                    <div class="card-actions">
                      <button class="card-btn plan-send" onclick="sendThoughtToPlan(${item.id})">📋 계획으로</button>
                      <button class="card-btn" onclick="openEditModal(${item.id})">✏️ 수정</button>
                      <button class="card-btn delete" onclick="deleteThought(${item.id}); renderArchiveFeed();">🗑️ 삭제</button>
                    </div>
                  </div>
                `).join('');
              }

              function renderTrashFeed() {
                const list = getPadTrashStorage();
                const feed = document.getElementById('trash-feed');
                if (list.length === 0) {
                  feed.innerHTML = '<p style="color:#55555c; text-align:center; margin-top:40px;">휴지통이 비어 있습니다.</p>';
                  return;
                }

                feed.innerHTML = `
                  <div style="display:flex; justify-content:flex-end; margin-bottom:4px;">
                    <button class="card-btn delete" onclick="clearAllTrash()">🗑️ 휴지통 전체 비우기</button>
                  </div>
                ` + list.map(item => `
                  <div class="thought-card">
                    <div class="card-header">
                      <span class="card-badge" style="color:var(--danger);">🗑️ 버려진 떡메모</span>
                      <span class="card-time">${item.date} ${item.time}</span>
                    </div>
                    <img src="${item.imageData}" style="width:100%; max-height:180px; object-fit:contain; border-radius:8px; border:1px solid var(--border); background:#000;" />
                    ${item.text ? `<div class="card-content">${item.text}</div>` : ''}
                    <div class="card-actions">
                      <button class="card-btn" style="background:var(--primary);" onclick="restoreTrashItem(${item.id})">↩️ 다시 꺼내기 (복원)</button>
                      <button class="card-btn delete" onclick="deleteTrashItemPermanently(${item.id})">영구 삭제</button>
                    </div>
                  </div>
                `).join('');
              }

              function restoreTrashItem(id) {
                const trashList = getPadTrashStorage();
                const item = trashList.find(t => t.id === id);
                if (item) {
                  saveThought('메모딱지', item.text || '', [{ type: '메모딱지', data: item.imageData, isVideo: false }]);
                  setPadTrashStorage(trashList.filter(t => t.id !== id));
                  renderTrashFeed();
                  alert('✨ 메모딱지가 생각서랍으로 복원되었습니다!');
                }
              }

              function deleteTrashItemPermanently(id) {
                if (confirm('이 메모딱지를 완전히 영구 삭제하시겠습니까?')) {
                  const list = getPadTrashStorage().filter(t => t.id !== id);
                  setPadTrashStorage(list);
                  renderTrashFeed();
                }
              }

              function clearAllTrash() {
                if (confirm('휴지통을 완전히 비우시겠습니까? 복원할 수 없습니다.')) {
                  setPadTrashStorage([]);
                  renderTrashFeed();
                }
              }

              function exportBackupData() {
                const backupObj = {
                  version: '1.0',
                  exportDate: new Date().toISOString(),
                  thoughts: getThoughtStorage(),
                  plans: getPlanStorage(),
                  trash: getPadTrashStorage()
                };

                const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `idea_drawer_backup_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
              }

              function importBackupData(input) {
                const file = input.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                  try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.thoughts && Array.isArray(parsed.thoughts)) {
                      setThoughtStorage(parsed.thoughts);
                    }
                    if (parsed.plans && Array.isArray(parsed.plans)) {
                      setPlanStorage(parsed.plans);
                    }
                    if (parsed.trash && Array.isArray(parsed.trash)) {
                      setPadTrashStorage(parsed.trash);
                    }
                    alert('🎉 모든 데이터가 성공적으로 완벽 복원되었습니다!');
                    location.reload();
                  } catch (err) {
                    alert('잘못된 백업 파일 형식입니다.');
                  }
                };
                reader.readAsText(file);
                input.value = '';
              }

              function openManualModal() { document.getElementById('manual-modal').classList.add('active'); }
              function closeManualModal() { document.getElementById('manual-modal').classList.remove('active'); }

              selectCategory('첫 생각');
            </script>
          </body>
          </html>
          EOF

