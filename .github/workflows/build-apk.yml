                <button class="card-btn" style="background:var(--danger);" onclick="closeManualModal()">닫기</button>
              </div>
              <div class="modal-body" style="gap:12px;">
                <div class="manual-card">
                  <div class="manual-title">1. 노란 전구(💡) 플로팅 버튼</div>
                  <div class="manual-desc">
                    다른 앱을 사용하는 중에도 노란 전구를 터치하고 말씀하시면, 음성이 자동으로 **[생각서랍]**에 안전하게 보관됩니다.
                  </div>
