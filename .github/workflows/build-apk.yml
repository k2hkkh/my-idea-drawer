name: Build Idea Drawer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 파일 가져오기
        uses: actions/checkout@v4

      - name: 2. 자바 JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. 생각서랍 전체 UI 및 4단계 실행방안 웹 화면 구성
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <title>생각서랍</title>
            <style>
              :root {
                --bg: #0f172a;
                --card: #1e293b;
                --primary: #4f46e5;
                --accent: #38bdf8;
                --danger: #ef4444;
                --text: #f8fafc;
                --muted: #94a3b8;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
                background-color: var(--bg);
                color: var(--text);
                height: 100vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
              }
              header {
                padding: 12px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: var(--card);
                border-bottom: 1px solid #334155;
              }
              header h1 { font-size: 1.15rem; font-weight: 700; color: var(--accent); }
              .btn-archive {
                background: #334155;
                border: 1px solid #475569;
                color: var(--accent);
                padding: 6px 12px;
                border-radius: 8px;
                font-size: 0.85rem;
                font-weight: bold;
                cursor: pointer;
              }
              nav {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                background: var(--card);
                padding: 6px;
                gap: 6px;
                border-bottom: 1px solid #334155;
              }
              .tab-btn {
                padding: 8px 2px;
                background: none;
                border: none;
                color: var(--muted);
                font-size: 0.82rem;
                font-weight: 600;
                border-radius: 8px;
                cursor: pointer;
                transition: all 0.2s;
              }
              .tab-btn.active {
                background: var(--primary);
                color: #ffffff;
              }
              .stage-bar {
                display: flex;
                background: #1e293b;
                padding: 6px 12px;
                gap: 6px;
                border-bottom: 1px solid #334155;
                overflow-x: auto;
              }
              .stage-tag {
                font-size: 0.75rem;
                padding: 4px 8px;
                border-radius: 6px;
                background: #0f172a;
                color: var(--muted);
                cursor: pointer;
                white-space: nowrap;
                border: 1px solid #334155;
              }
              .stage-tag.active {
                background: var(--accent);
                color: #0f172a;
                font-weight: bold;
              }
              .container {
                flex: 1;
                padding: 12px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                overflow: hidden;
              }
              .tab-content { display: none; flex: 1; flex-direction: column; gap: 10px; height: 100%; }
              .tab-content.active { display: flex; }

              /* 화면 1/2 분할 레이아웃 */
              .split-container {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 10px;
                height: 100%;
              }
              .half-box-top {
                flex: 1;
                background: var(--card);
                border: 2px dashed #475569;
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                position: relative;
                overflow: hidden;
              }
              .half-box-bottom {
                flex: 1;
                display: flex;
                flex-direction: column;
                position: relative;
              }

              /* 텍스트 입력창 & 제미나이 마이크 */
              .memo-wrapper {
                flex: 1;
                position: relative;
                display: flex;
                width: 100%;
                height: 100%;
              }
              .text-area {
                flex: 1;
                width: 100%;
                height: 100%;
                background: var(--card);
                border: 1px solid #334155;
                border-radius: 12px;
                padding: 12px 50px 12px 14px;
                color: #ffffff;
                font-size: 1rem;
                line-height: 1.5;
                resize: none;
              }
              .gemini-mini-btn {
                position: absolute;
                right: 12px;
                bottom: 12px;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: linear-gradient(135deg, #4f46e5, #38bdf8);
                border: none;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
              }
              .gemini-mini-btn.listening {
                animation: pulse 1.2s infinite;
                background: linear-gradient(135deg, #ef4444, #f97316);
              }
              .wave-bar-mini {
                width: 3px;
                height: 10px;
                background: #ffffff;
                border-radius: 2px;
                margin: 0 1px;
              }
              .gemini-mini-btn.listening .wave-bar-mini {
                animation: soundWave 0.6s infinite alternate ease-in-out;
              }
              .gemini-mini-btn.listening .wave-bar-mini:nth-child(2) { animation-delay: 0.15s; }
              .gemini-mini-btn.listening .wave-bar-mini:nth-child(3) { animation-delay: 0.3s; }
              @keyframes soundWave { 0% { height: 6px; } 100% { height: 18px; } }
              @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

              /* 스케치 캔버스 */
              .canvas-holder {
                width: 100%;
                height: 100%;
                background: #ffffff;
                border-radius: 10px;
                touch-action: none;
              }
              canvas { width: 100%; height: 100%; display: block; border-radius: 10px; }

              /* 일괄 통일 하단 액션바 */
              .btn-group-unified {
                display: grid;
                grid-template-columns: 1fr 1fr 1.5fr;
                gap: 6px;
                width: 100%;
                padding-top: 4px;
              }
              .btn-del-main {
                background: #334155;
                color: #f8fafc;
                padding: 10px;
                border: 1px solid #475569;
                border-radius: 10px;
                font-size: 0.8rem;
                font-weight: bold;
                cursor: pointer;
              }
              .btn-del-memo {
                background: #334155;
                color: #f8fafc;
                padding: 10px;
                border: 1px solid #475569;
                border-radius: 10px;
                font-size: 0.8rem;
                font-weight: bold;
                cursor: pointer;
              }
              .btn-save-unified {
                background: #10b981;
                color: #ffffff;
                padding: 10px;
                border: none;
                border-radius: 10px;
                font-size: 0.85rem;
                font-weight: bold;
                cursor: pointer;
              }

              /* 보관함 모달 */
              .archive-modal {
                display: none;
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: var(--bg);
                z-index: 100;
                flex-direction: column;
              }
              .archive-modal.active { display: flex; }
              .archive-header {
                padding: 14px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: var(--card);
                border-bottom: 1px solid #334155;
              }
              .archive-filters {
                display: flex;
                gap: 6px;
                padding: 10px 14px;
                background: var(--card);
                overflow-x: auto;
              }
              .filter-pill {
                padding: 4px 10px;
                border-radius: 16px;
                background: #0f172a;
                border: 1px solid #334155;
                font-size: 0.78rem;
                color: var(--muted);
                cursor: pointer;
                white-space: nowrap;
              }
              .filter-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
              .archive-list {
                flex: 1;
                overflow-y: auto;
                padding: 14px;
                display: flex;
                flex-direction: column;
                gap: 10px;
              }
              .archive-card {
                background: var(--card);
                padding: 12px;
                border-radius: 10px;
                border-left: 4px solid var(--accent);
                display: flex;
                flex-direction: column;
                gap: 6px;
              }
            </style>
          </head>
          <body>

            <header>
              <h1>💡 생각서랍</h1>
              <button class="btn-archive" onclick="openArchive()">📂 생각보관함</button>
            </header>

            <!-- 생각의 4단계 실행방안 태그 바 -->
            <div class="stage-bar">
              <span style="font-size:0.75rem; color:var(--muted); line-height:22px;">실행단계:</span>
              <div class="stage-tag active" onclick="setStage(this, '1.발상')">💡 1.발상</div>
              <div class="stage-tag" onclick="setStage(this, '2.구체화')">📐 2.구체화</div>
              <div class="stage-tag" onclick="setStage(this, '3.검증')">🧪 3.검증</div>
              <div class="stage-tag" onclick="setStage(this, '4.실행')">🚀 4.실행</div>
            </div>

            <nav>
              <button class="tab-btn active" onclick="switchTab('voice')">✨ 음성</button>
              <button class="tab-btn" onclick="switchTab('photo')">📷 사진</button>
              <button class="tab-btn" onclick="switchTab('sketch')">🎨 스케치</button>
              <button class="tab-btn" onclick="switchTab('video')">🎬 동영상</button>
            </nav>

            <div class="container">
              <!-- 1. 음성 탭 (화면 꽉 찬 구성) -->
              <div id="tab-voice" class="tab-content active">
                <div class="memo-wrapper">
                  <textarea id="voice-input-text" class="text-area" placeholder="음성인식 결과가 여기에 자동으로 이어집니다..."></textarea>
                  <button id="mic-voice" class="gemini-mini-btn" onclick="triggerNativeVoice('voice-input-text', 'mic-voice')">
                    <div class="wave-bar-mini"></div>
                    <div class="wave-bar-mini"></div>
                    <div class="wave-bar-mini"></div>
                  </button>
                </div>
                <div class="btn-group-unified" style="grid-template-columns: 1fr 2fr;">
                  <button class="btn-del-memo" onclick="clearMemo('voice-input-text')">🗑️ 내용 지우기</button>
                  <button class="btn-save-unified" onclick="saveIdea('음성', document.getElementById('voice-input-text').value)">💾 서랍에 저장</button>
                </div>
              </div>

              <!-- 2. 사진 탭 (1:1 50:50 분할) -->
              <div id="tab-photo" class="tab-content">
                <div class="split-container">
                  <div class="half-box-top" onclick="document.getElementById('photo-input').click()">
                    <input type="file" accept="image/*" capture="environment" id="photo-input" style="display:none;" onchange="handleMediaSelect(this, 'photo-view')" />
                    <p id="photo-prompt" style="color:var(--muted); font-size:0.85rem;">📷 터치하여 촬영 또는 사진 선택</p>
                    <img id="photo-view" style="max-width:100%; max-height:100%; border-radius:8px; display:none;" />
                  </div>
                  <div class="half-box-bottom">
                    <div class="memo-wrapper">
                      <textarea id="photo-memo" class="text-area" placeholder="사진에 대한 생각을 적거나 마이크를 누르세요..."></textarea>
                      <button id="mic-photo" class="gemini-mini-btn" onclick="triggerNativeVoice('photo-memo', 'mic-photo')">
                        <div class="wave-bar-mini"></div>
                        <div class="wave-bar-mini"></div>
                        <div class="wave-bar-mini"></div>
                      </button>
                    </div>
                  </div>
                </div>
                <div class="btn-group-unified">
                  <button class="btn-del-main" onclick="clearMedia('photo-input', 'photo-view', 'photo-prompt')">📷 사진 삭제</button>
                  <button class="btn-del-memo" onclick="clearMemo('photo-memo')">📝 메모 삭제</button>
                  <button class="btn-save-unified" onclick="saveMediaIdea('사진', 'photo-memo', 'photo-view')">💾 서랍에 저장</button>
                </div>
              </div>

              <!-- 3. 스케치 탭 (1:1 50:50 분할 & 그림 보존) -->
              <div id="tab-sketch" class="tab-content">
                <div class="split-container">
                  <div class="half-box-top" style="border-style:solid; border-color:#334155;" id="sketch-container">
                    <div style="position:absolute; top:6px; right:6px; z-index:10; background:rgba(15,23,42,0.8); padding:3px 6px; border-radius:6px; display:flex; align-items:center; gap:4px;">
                      <span style="font-size:0.75rem; color:var(--muted);">색:</span>
                      <input type="color" id="sketch-color" value="#000000" style="width:24px; height:24px; border:none; border-radius:4px; cursor:pointer;" />
                    </div>
                    <div class="canvas-holder" id="canvas-wrapper">
                      <canvas id="sketch-board"></canvas>
                    </div>
                  </div>
                  <div class="half-box-bottom">
                    <div class="memo-wrapper">
                      <textarea id="sketch-memo" class="text-area" placeholder="스케치에 대한 설명을 적거나 마이크를 누르세요..."></textarea>
                      <button id="mic-sketch" class="gemini-mini-btn" onclick="triggerNativeVoice('sketch-memo', 'mic-sketch')">
                        <div class="wave-bar-mini"></div>
                        <div class="wave-bar-mini"></div>
                        <div class="wave-bar-mini"></div>
                      </button>
                    </div>
                  </div>
                </div>
                <div class="btn-group-unified">
                  <button class="btn-del-main" onclick="clearSketchCanvas()">🎨 스케치 삭제</button>
                  <button class="btn-del-memo" onclick="clearMemo('sketch-memo')">📝 메모 삭제</button>
                  <button class="btn-save-unified" onclick="saveIdea('스케치', document.getElementById('sketch-memo').value || '스케치 드로잉')">💾 서랍에 저장</button>
                </div>
              </div>

              <!-- 4. 동영상 탭 (1:1 50:50 분할) -->
              <div id="tab-video" class="tab-content">
                <div class="split-container">
                  <div class="half-box-top" onclick="document.getElementById('video-input').click()">
                    <input type="file" accept="video/*" capture="environment" id="video-input" style="display:none;" onchange="handleMediaSelect(this, 'video-view')" />
                    <p id="video-prompt" style="color:var(--muted); font-size:0.85rem;">🎬 터치하여 영상 촬영 또는 비디오 선택</p>
                    <video id="video-view" controls style="max-width:100%; max-height:100%; border-radius:8px; display:none;"></video>
                  </div>
                  <div class="half-box-bottom">
                    <div class="memo-wrapper">
                      <textarea id="video-memo" class="text-area" placeholder="동영상에 대한 생각을 적거나 마이크를 누르세요..."></textarea>
                      <button id="mic-video" class="gemini-mini-btn" onclick="triggerNativeVoice('video-memo', 'mic-video')">
                        <div class="wave-bar-mini"></div>
                        <div class="wave-bar-mini"></div>
                        <div class="wave-bar-mini"></div>
                      </button>
                    </div>
                  </div>
                </div>
                <div class="btn-group-unified">
                  <button class="btn-del-main" onclick="clearMedia('video-input', 'video-view', 'video-prompt')">🎬 영상 삭제</button>
                  <button class="btn-del-memo" onclick="clearMemo('video-memo')">📝 메모 삭제</button>
                  <button class="btn-save-unified" onclick="saveMediaIdea('동영상', 'video-memo', 'video-view')">💾 서랍에 저장</button>
                </div>
              </div>
            </div>

            <!-- 독립형 생각보관함 모달 창 -->
            <div id="archive-modal" class="archive-modal">
              <div class="archive-header">
                <h2 style="font-size:1.1rem; color:var(--accent);">📂 저장된 생각서랍</h2>
                <button class="btn-archive" style="background:#ef4444; color:#fff;" onclick="closeArchive()">닫기</button>
              </div>
              <div class="archive-filters">
                <div class="filter-pill active" onclick="filterArchive('전체', this)">전체</div>
                <div class="filter-pill" onclick="filterArchive('음성', this)">✨ 음성</div>
                <div class="filter-pill" onclick="filterArchive('사진', this)">📷 사진</div>
                <div class="filter-pill" onclick="filterArchive('스케치', this)">🎨 스케치</div>
                <div class="filter-pill" onclick="filterArchive('동영상', this)">🎬 동영상</div>
              </div>
              <div class="archive-list" id="archive-item-list"></div>
            </div>

            <script>
              let currentStage = '1.발상';
              let activeTargetInputId = 'voice-input-text';
              let activeMicButtonId = 'mic-voice';
              let currentFilter = '전체';
              let editingIndex = -1;

              function setStage(el, stage) {
                document.querySelectorAll('.stage-tag').forEach(t => t.classList.remove('active'));
                el.classList.add('active');
                currentStage = stage;
              }

              function switchTab(tabId) {
                const tabs = ['voice', 'photo', 'sketch', 'video'];
                document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                  btn.classList.toggle('active', tabs[idx] === tabId);
                });
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById('tab-' + tabId).classList.add('active');
                if (tabId === 'sketch') setTimeout(initCanvas, 50);
              }

              /* 미디어 및 메모 지우기 */
              function clearMemo(id) { document.getElementById(id).value = ''; }
              function clearMedia(inputId, viewId, promptId) {
                document.getElementById(inputId).value = '';
                const v = document.getElementById(viewId);
                v.src = '';
                v.style.display = 'none';
                document.getElementById(promptId).style.display = 'block';
              }
              function handleMediaSelect(input, viewId) {
                const file = input.files[0];
                if (file) {
                  const el = document.getElementById(viewId);
                  el.src = URL.createObjectURL(file);
                  el.style.display = 'block';
                  const prompt = el.previousElementSibling;
                  if (prompt) prompt.style.display = 'none';
                }
              }

              /* 음성 인식 호출 */
              function triggerNativeVoice(targetId, micBtnId) {
                activeTargetInputId = targetId;
                activeMicButtonId = micBtnId;
                const btn = document.getElementById(micBtnId);
                if (btn) btn.classList.add('listening');

                if (window.AndroidBridge && window.AndroidBridge.startSpeechRecognition) {
                  window.AndroidBridge.startSpeechRecognition();
                } else {
                  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                  if (!Speech) {
                    alert('음성인식 기능을 지원하지 않는 기기입니다.');
                    if (btn) btn.classList.remove('listening');
                    return;
                  }
                  const rec = new Speech();
                  rec.lang = 'ko-KR';
                  rec.onresult = (e) => appendVoiceText(e.results[0][0].transcript);
                  rec.onend = () => { if (btn) btn.classList.remove('listening'); };
                  rec.start();
                }
              }

              function appendVoiceText(newText) {
                const area = document.getElementById(activeTargetInputId);
                if (!area) return;
                const prev = area.value.trim();
                area.value = prev ? prev + ' ' + newText : newText;
              }

              window.receiveVoiceResult = function(text) {
                const btn = document.getElementById(activeMicButtonId);
                if (btn) btn.classList.remove('listening');
                appendVoiceText(text);
              };

              /* 플로팅 서비스 데이터 주기적 점검 */
              setInterval(() => {
                if (window.AndroidBridge && window.AndroidBridge.getPendingVoiceText) {
                  const text = window.AndroidBridge.getPendingVoiceText();
                  if (text && text.trim().length > 0) {
                    switchTab('voice');
                    appendVoiceText(text);
                  }
                }
              }, 400);

              /* 스케치 캔버스 고정 */
              const canvas = document.getElementById('sketch-board');
              const ctx = canvas.getContext('2d');
              let isDrawing = false;
              let isInit = false;

              function initCanvas() {
                if (isInit) return;
                const holder = document.getElementById('canvas-wrapper');
                if (holder.clientWidth > 0 && holder.clientHeight > 0) {
                  canvas.width = holder.clientWidth;
                  canvas.height = holder.clientHeight;
                  ctx.lineWidth = 4;
                  ctx.lineCap = 'round';
                  ctx.strokeStyle = document.getElementById('sketch-color').value;
                  isInit = true;
                }
              }
              function getPos(e) {
                const r = canvas.getBoundingClientRect();
                const t = e.touches ? e.touches[0] : e;
                return { x: t.clientX - r.left, y: t.clientY - r.top };
              }
              canvas.addEventListener('mousedown', (e) => { isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
              canvas.addEventListener('mousemove', (e) => { if (!isDrawing) return; ctx.strokeStyle = document.getElementById('sketch-color').value; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
              canvas.addEventListener('mouseup', () => { isDrawing = false; });
              canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }, { passive: false });
              canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (!isDrawing) return; ctx.strokeStyle = document.getElementById('sketch-color').value; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }, { passive: false });
              canvas.addEventListener('touchend', () => { isDrawing = false; });
              function clearSketchCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

              /* 생각서랍 저장 및 보관함 관리 */
              function getStorage() {
                // 이전 레거시 데이터 통합 복원
                const saved = localStorage.getItem('idea_drawer_storage') || localStorage.getItem('user_ideas') || localStorage.getItem('my_ideas') || '[]';
                try { return JSON.parse(saved); } catch(e) { return []; }
              }
              function setStorage(arr) {
                localStorage.setItem('idea_drawer_storage', JSON.stringify(arr));
              }

              function saveIdea(type, content) {
                if (!content || content.trim() === '') {
                  alert('저장할 내용이 없습니다.');
                  return;
                }
                const list = getStorage();
                if (editingIndex >= 0) {
                  list[editingIndex].content = content;
                  list[editingIndex].stage = currentStage;
                  list[editingIndex].time = new Date().toLocaleTimeString('ko-KR') + ' (수정됨)';
                  editingIndex = -1;
                  alert('아이디어가 성공적으로 수정되었습니다.');
                } else {
                  list.unshift({
                    type,
                    stage: currentStage,
                    content,
                    time: new Date().toLocaleTimeString('ko-KR')
                  });
                  alert(`[${type}] 아이디어가 생각서랍에 보관되었습니다.`);
                }
                setStorage(list);
              }

              function saveMediaIdea(type, memoId, viewId) {
                const memo = document.getElementById(memoId).value.trim();
                const view = document.getElementById(viewId);
                if (!memo && (!view.src || view.style.display === 'none')) {
                  alert('촬영된 미디어나 메모를 입력해 주세요.');
                  return;
                }
                saveIdea(type, memo || `[${type} 파일 저장됨]`);
              }

              function openArchive() {
                document.getElementById('archive-modal').classList.add('active');
                renderArchive();
              }
              function closeArchive() {
                document.getElementById('archive-modal').classList.remove('active');
              }

              function filterArchive(cat, el) {
                currentFilter = cat;
                document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
                el.classList.add('active');
                renderArchive();
              }

              function renderArchive() {
                const list = getStorage();
                const container = document.getElementById('archive-item-list');
                const filtered = currentFilter === '전체' ? list : list.filter(i => i.type === currentFilter);

                if (filtered.length === 0) {
                  container.innerHTML = '<p style="color:var(--muted); text-align:center; margin-top:40px;">저장된 생각이 없습니다.</p>';
                  return;
                }

                container.innerHTML = filtered.map((item, idx) => `
                  <div class="archive-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <div>
                        <strong style="color:var(--accent);">[${item.type}]</strong>
                        <span style="font-size:0.75rem; background:#334155; padding:2px 6px; border-radius:4px; margin-left:4px;">${item.stage || '1.발상'}</span>
                      </div>
                      <span style="font-size:0.75rem; color:#64748b;">${item.time}</span>
                    </div>
                    <p style="font-size:0.95rem; margin:4px 0; white-space:pre-wrap;">${item.content}</p>
                    <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:4px;">
                      <button style="background:#4f46e5; color:#fff; border:none; padding:4px 10px; border-radius:6px; font-size:0.75rem; cursor:pointer;" onclick="editIdea(${idx})">✏️ 수정</button>
                      <button style="background:#ef4444; color:#fff; border:none; padding:4px 10px; border-radius:6px; font-size:0.75rem; cursor:pointer;" onclick="deleteIdea(${idx})">🗑️ 삭제</button>
                    </div>
                  </div>
                `).join('');
              }

              function editIdea(idx) {
                const list = getStorage();
                const item = list[idx];
                editingIndex = idx;
                closeArchive();

                if (item.type === '음성') {
                  switchTab('voice');
                  document.getElementById('voice-input-text').value = item.content;
                } else if (item.type === '사진') {
                  switchTab('photo');
                  document.getElementById('photo-memo').value = item.content;
                } else if (item.type === '스케치') {
                  switchTab('sketch');
                  document.getElementById('sketch-memo').value = item.content;
                } else if (item.type === '동영상') {
                  switchTab('video');
                  document.getElementById('video-memo').value = item.content;
                }
              }

              function deleteIdea(idx) {
                if (confirm('이 생각을 서랍에서 삭제하시겠습니까?')) {
                  const list = getStorage();
                  list.splice(idx, 1);
                  setStorage(list);
                  renderArchive();
                }
              }
            </script>
          </body>
          </html>
          EOF

      - name: 5. 플로팅 텍스트 2중 전달 및 네이티브 엔진 주입
        run: |
          cat << 'EOF' > package.json
          {
            "name": "my-idea-drawer",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.k2hkkh.ideadrawer",
            "appName": "생각서랍",
            "webDir": "www"
          }
          EOF

          npm install
          npx cap add android

          # 자동 버전 증가
          BUILD_NUM=${{ github.run_number }}
          sed -i "s/versionCode 1/versionCode $BUILD_NUM/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.$BUILD_NUM\"/g" android/app/build.gradle

          # 권한 및 서비스 주입
          node -e '
          const fs = require("fs");
          const p = "android/app/src/main/AndroidManifest.xml";
          let xml = fs.readFileSync(p, "utf8");
          const perms = "\n    <uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\" />\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-permission android:name=\"android.permission.VIBRATE\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MICROPHONE\" />\n";
          const srv = "\n    <service android:name=\"com.k2hkkh.ideadrawer.FloatingWidgetService\" android:enabled=\"true\" android:exported=\"false\" android:foregroundServiceType=\"microphone\" />\n";
          xml = xml.replace("<application", perms + "    <application");
          xml = xml.replace("</application>", srv + "    </application>");
          fs.writeFileSync(p, xml, "utf8");
          '

          mkdir -p android/app/src/main/java/com/k2hkkh/ideadrawer

          # 플로팅 위젯 소스코드 (SharedPreferences 2중 안전 저장)
          cat << 'EOF' > android/app/src/main/java/com/k2hkkh/ideadrawer/FloatingWidgetService.java
          package com.k2hkkh.ideadrawer;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.Vibrator;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.core.app.NotificationCompat;
          import java.util.ArrayList;

          public class FloatingWidgetService extends Service {
              private WindowManager windowManager;
              private TextView floatingView;
              private SpeechRecognizer speechRecognizer;
              private boolean isListening = false;
              private GradientDrawable normalBg, activeBg;

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();

                  try {
                      Notification notification = new NotificationCompat.Builder(this, "floating_channel")
                              .setContentTitle("생각서랍 플로팅 실행 중")
                              .setContentText("터치하여 바로 음성으로 기록하세요.")
                              .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                              .setPriority(NotificationCompat.PRIORITY_LOW)
                              .build();
                      startForeground(1001, notification);
                  } catch (Exception ignored) {}

                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);

                  floatingView = new TextView(this);
                  floatingView.setText("✨");
                  floatingView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 26);
                  floatingView.setGravity(Gravity.CENTER);

                  normalBg = new GradientDrawable();
                  normalBg.setShape(GradientDrawable.OVAL);
                  normalBg.setColor(Color.parseColor("#4F46E5"));

                  activeBg = new GradientDrawable();
                  activeBg.setShape(GradientDrawable.OVAL);
                  activeBg.setColor(Color.parseColor("#EF4444"));

                  floatingView.setBackground(normalBg);

                  int layoutType = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ?
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY :
                          WindowManager.LayoutParams.TYPE_PHONE;

                  final WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          160, 160,
                          layoutType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                  );

                  params.gravity = Gravity.TOP | Gravity.START;
                  params.x = 60;
                  params.y = 300;

                  floatingView.setOnTouchListener(new View.OnTouchListener() {
                      private int initialX, initialY;
                      private float initialTouchX, initialTouchY;

                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  initialX = params.x;
                                  initialY = params.y;
                                  initialTouchX = event.getRawX();
                                  initialTouchY = event.getRawY();
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  params.x = initialX + (int) (event.getRawX() - initialTouchX);
                                  params.y = initialY + (int) (event.getRawY() - initialTouchY);
                                  windowManager.updateViewLayout(floatingView, params);
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  float diffX = Math.abs(event.getRawX() - initialTouchX);
                                  float diffY = Math.abs(event.getRawY() - initialTouchY);
                                  if (diffX < 15 && diffY < 15) {
                                      startFloatingVoice();
                                  }
                                  return true;
                          }
                          return false;
                      }
                  });

                  windowManager.addView(floatingView, params);
              }

              private void startFloatingVoice() {
                  new Handler(Looper.getMainLooper()).post(() -> {
                      if (isListening) {
                          if (speechRecognizer != null) speechRecognizer.stopListening();
                          return;
                      }

                      vibrateDevice();

                      try {
                          if (speechRecognizer != null) {
                              speechRecognizer.destroy();
                              speechRecognizer = null;
                          }

                          speechRecognizer = SpeechRecognizer.createSpeechRecognizer(getApplicationContext());
                          Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                          intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                          intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ko-KR");
                          intent.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, getPackageName());

                          speechRecognizer.setRecognitionListener(new RecognitionListener() {
                              @Override
                              public void onReadyForSpeech(Bundle params) {
                                  isListening = true;
                                  floatingView.setBackground(activeBg);
                                  floatingView.setText("🎙️");
                                  Toast.makeText(getApplicationContext(), "💡 말씀하세요 (듣는 중...)", Toast.LENGTH_SHORT).show();
                              }

                              @Override public void onBeginningOfSpeech() {}
                              @Override public void onRmsChanged(float rmsdB) {}
                              @Override public void onBufferReceived(byte[] buffer) {}
                              @Override public void onEndOfSpeech() {}

                              @Override
                              public void onError(int error) {
                                  resetFloatingButton();
                                  Intent appIntent = new Intent(FloatingWidgetService.this, MainActivity.class);
                                  appIntent.putExtra("TRIGGER_VOICE", true);
                                  appIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                                  startActivity(appIntent);
                              }

                              @Override
                              public void onResults(Bundle results) {
                                  resetFloatingButton();
                                  vibrateDevice();
                                  ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                  if (matches != null && !matches.isEmpty()) {
                                      String spokenText = matches.get(0);
                                      
                                      // SharedPreferences에 2중 백업 저장
                                      SharedPreferences prefs = getSharedPreferences("IdeaPrefs", MODE_PRIVATE);
                                      prefs.edit().putString("PENDING_VOICE", spokenText).apply();

                                      Intent appIntent = new Intent(FloatingWidgetService.this, MainActivity.class);
                                      appIntent.putExtra("VOICE_RESULT", spokenText);
                                      appIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                                      startActivity(appIntent);
                                  }
                              }

                              @Override public void onPartialResults(Bundle partialResults) {}
                              @Override public void onEvent(int eventType, Bundle params) {}
                          });

                          speechRecognizer.startListening(intent);
                      } catch (Exception e) {
                          resetFloatingButton();
                          Intent appIntent = new Intent(FloatingWidgetService.this, MainActivity.class);
                          appIntent.putExtra("TRIGGER_VOICE", true);
                          appIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                          startActivity(appIntent);
                      }
                  });
              }

              private void vibrateDevice() {
                  try {
                      Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (v != null) v.vibrate(60);
                  } catch (Exception ignored) {}
              }

              private void resetFloatingButton() {
                  isListening = false;
                  floatingView.setBackground(normalBg);
                  floatingView.setText("✨");
                  if (speechRecognizer != null) {
                      try { speechRecognizer.destroy(); } catch (Exception ignored) {}
                      speechRecognizer = null;
                  }
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel("floating_channel", "생각서랍 플로팅", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  resetFloatingButton();
                  if (floatingView != null && windowManager != null) {
                      try { windowManager.removeView(floatingView); } catch (Exception ignored) {}
                  }
              }
          }
          EOF

          # 메인 액티비티 소스코드
          cat << 'EOF' > android/app/src/main/java/com/k2hkkh/ideadrawer/MainActivity.java
          package com.k2hkkh.ideadrawer;

          import android.Manifest;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;

          public class MainActivity extends BridgeActivity {
              private SpeechRecognizer inAppRecognizer;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestAppPermissions();
                  startWidgetIfAllowed();

                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void startSpeechRecognition() {
                              new Handler(Looper.getMainLooper()).post(() -> startInAppVoice());
                          }

                          @JavascriptInterface
                          public String getPendingVoiceText() {
                              SharedPreferences prefs = getSharedPreferences("IdeaPrefs", MODE_PRIVATE);
                              String pending = prefs.getString("PENDING_VOICE", "");
                              if (!pending.isEmpty()) {
                                  prefs.edit().remove("PENDING_VOICE").apply();
                              }
                              return pending;
                          }
                      }, "AndroidBridge");
                  }

                  handleIntents(getIntent());
              }

              private void requestAppPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED ||
                          ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{
                                  Manifest.permission.RECORD_AUDIO,
                                  Manifest.permission.CAMERA
                          }, 200);
                      }
                  }
              }

              public void startInAppVoice() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestAppPermissions();
                      return;
                  }

                  try {
                      if (inAppRecognizer != null) inAppRecognizer.destroy();
                      inAppRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                      Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ko-KR");

                      inAppRecognizer.setRecognitionListener(new RecognitionListener() {
                          @Override public void onReadyForSpeech(Bundle params) {
                              Toast.makeText(MainActivity.this, "💡 말씀하세요...", Toast.LENGTH_SHORT).show();
                          }
                          @Override public void onBeginningOfSpeech() {}
                          @Override public void onRmsChanged(float rmsdB) {}
                          @Override public void onBufferReceived(byte[] buffer) {}
                          @Override public void onEndOfSpeech() {}
                          @Override public void onError(int error) {
                              Toast.makeText(MainActivity.this, "음성 인식이 취소되었습니다.", Toast.LENGTH_SHORT).show();
                              evalJS("if (window.receiveVoiceResult) window.receiveVoiceResult('');");
                          }
                          @Override
                          public void onResults(Bundle results) {
                              ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                              if (matches != null && !matches.isEmpty()) {
                                  sendTextToWebView(matches.get(0));
                              }
                          }
                          @Override public void onPartialResults(Bundle partialResults) {}
                          @Override public void onEvent(int eventType, Bundle params) {}
                      });

                      inAppRecognizer.startListening(intent);
                  } catch (Exception e) {
                      Toast.makeText(this, "음성 인식기를 구동할 수 없습니다.", Toast.LENGTH_SHORT).show();
                  }
              }

              private void evalJS(String script) {
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript(script, null));
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  startWidgetIfAllowed();
              }

              @Override
              public void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIntents(intent);
              }

              private void handleIntents(Intent intent) {
                  if (intent != null) {
                      if (intent.hasExtra("VOICE_RESULT")) {
                          String voiceText = intent.getStringExtra("VOICE_RESULT");
                          new Handler(Looper.getMainLooper()).postDelayed(() -> sendTextToWebView(voiceText), 300);
                      } else if (intent.getBooleanExtra("TRIGGER_VOICE", false)) {
                          new Handler(Looper.getMainLooper()).postDelayed(() -> startInAppVoice(), 400);
                      }
                  }
              }

              private void sendTextToWebView(String text) {
                if (text != null) {
                    String cleanText = text.replace("\\", "\\\\").replace("'", "\\'").replace("\n", " ");
                    evalJS("if (window.receiveVoiceResult) window.receiveVoiceResult('" + cleanText + "');");
                }
              }

              private void startWidgetIfAllowed() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (Settings.canDrawOverlays(this)) {
                          Intent intent = new Intent(this, FloatingWidgetService.class);
                          try {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  startForegroundService(intent);
                              } else {
                                  startService(intent);
                              }
                          } catch (Exception ignored) {}
                      }
                  } else {
                      Intent intent = new Intent(this, FloatingWidgetService.class);
                      startService(intent);
                  }
              }
          }
          EOF

