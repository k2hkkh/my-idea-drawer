name: Build Idea Drawer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 파일 가져오기
        uses: actions/checkout@v4

      - name: 2. 자바 JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. 생각서랍 Gemini/ChatGPT 스타일 웹 UI 구성
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <title>생각서랍</title>
            <style>
              :root {
                --bg: #000000;
                --card: #121214;
                --surface: #1e1e22;
                --primary: #2563eb;
                --accent: #38bdf8;
                --danger: #ef4444;
                --text: #f8fafc;
                --muted: #8e8e93;
                --border: #2c2c2e;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
                background-color: var(--bg);
                color: var(--text);
                height: 100vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
              }
              header {
                padding: 14px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: transparent;
                flex-shrink: 0;
              }
              .header-btn {
                background: #1c1c1e;
                border: 1px solid var(--border);
                color: #ffffff;
                width: 38px;
                height: 38px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                font-size: 1.1rem;
              }
              .brand-title {
                font-size: 1.1rem;
                font-weight: 700;
                color: #ffffff;
                display: flex;
                align-items: center;
                gap: 6px;
              }

              /* 중앙 빈 캔버스 / 메모 기록 영역 */
              .main-canvas {
                flex: 1;
                overflow-y: auto;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 12px;
              }
              .empty-hint {
                margin: auto;
                text-align: center;
                color: #55555c;
                font-size: 0.95rem;
                line-height: 1.6;
              }

              /* 하단 고정 캡슐형 입력 바 (ChatGPT / Gemini 형태) */
              .bottom-bar-wrapper {
                padding: 12px 14px 16px 14px;
                background: transparent;
                position: relative;
                flex-shrink: 0;
              }
              .capsule-box {
                background: #1c1c1e;
                border: 1px solid var(--border);
                border-radius: 30px;
                padding: 6px 10px;
                display: flex;
                align-items: center;
                gap: 8px;
              }
              .btn-plus {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: #2c2c2e;
                border: none;
                color: #ffffff;
                font-size: 1.3rem;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: transform 0.2s;
              }
              .btn-plus.open {
                transform: rotate(45deg);
                background: var(--danger);
              }
              .main-input {
                flex: 1;
                background: transparent;
                border: none;
                color: #ffffff;
                font-size: 0.95rem;
                outline: none;
                min-height: 24px;
                max-height: 90px;
                resize: none;
                line-height: 1.4;
              }
              .main-input::placeholder { color: #636366; }
              .btn-mic {
                background: none;
                border: none;
                color: var(--muted);
                width: 32px;
                height: 32px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
              }
              .btn-mic svg { width: 22px; height: 22px; fill: #8e8e93; }
              .btn-wave-action {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: #2563eb;
                border: none;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 2px;
                cursor: pointer;
              }
              .wave-bar {
                width: 3px;
                height: 12px;
                background: #ffffff;
                border-radius: 2px;
              }
              .btn-wave-action.listening {
                background: var(--danger);
                animation: pulseWave 1.2s infinite;
              }
              .btn-wave-action.listening .wave-bar {
                animation: waveAnim 0.6s infinite alternate ease-in-out;
              }
              .btn-wave-action.listening .wave-bar:nth-child(2) { animation-delay: 0.15s; }
              .btn-wave-action.listening .wave-bar:nth-child(3) { animation-delay: 0.3s; }
              @keyframes waveAnim { 0% { height: 6px; } 100% { height: 18px; } }
              @keyframes pulseWave { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

              /* + 버튼 클릭 시 올라오는 ChatGPT 스타일 메뉴 (Capture 2 모방) */
              .plus-menu-popover {
                display: none;
                position: absolute;
                bottom: 74px;
                left: 14px;
                background: #1c1c1e;
                border: 1px solid var(--border);
                border-radius: 18px;
                padding: 8px 6px;
                flex-direction: column;
                gap: 4px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.8);
                z-index: 50;
                min-width: 170px;
              }
              .plus-menu-popover.active { display: flex; animation: slideUp 0.18s ease-out; }
              @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
              .menu-item {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 14px;
                border-radius: 12px;
                color: #ffffff;
                font-size: 0.9rem;
                font-weight: 500;
                cursor: pointer;
              }
              .menu-item:active { background: #2c2c2e; }
              .menu-item-icon {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                background: #2c2c2e;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1rem;
              }

              /* 스케치 모달 */
              .modal-full {
                display: none;
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: #000000;
                z-index: 100;
                flex-direction: column;
              }
              .modal-full.active { display: flex; }
              .modal-top {
                padding: 12px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid var(--border);
              }
              .canvas-container {
                flex: 1;
                margin: 12px;
                background: #ffffff;
                border-radius: 14px;
                touch-action: none;
                position: relative;
              }
              canvas { width: 100%; height: 100%; display: block; border-radius: 14px; }

              /* 생각 카드 */
              .thought-card {
                background: #1c1c1e;
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 14px;
                display: flex;
                flex-direction: column;
                gap: 8px;
              }
              .card-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
              }
              .card-badge {
                font-size: 0.75rem;
                padding: 2px 8px;
                border-radius: 6px;
                background: #2c2c2e;
                color: var(--accent);
                font-weight: 600;
              }
              .card-time { font-size: 0.75rem; color: var(--muted); }
              .card-content { font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
              .card-actions {
                display: flex;
                justify-content: flex-end;
                gap: 6px;
                margin-top: 4px;
              }
              .card-btn {
                background: #2c2c2e;
                border: none;
                color: #ffffff;
                padding: 5px 10px;
                border-radius: 8px;
                font-size: 0.75rem;
                cursor: pointer;
              }
            </style>
          </head>
          <body>

            <!-- 상단 헤더 (ChatGPT 스타일) -->
            <header>
              <button class="header-btn" onclick="openDrawer()">☰</button>
              <div class="brand-title">💡 생각서랍</div>
              <button class="header-btn" onclick="openDrawer()">📂</button>
            </header>

            <!-- 중앙 생각 피드 영역 -->
            <div class="main-canvas" id="feed-container">
              <div class="empty-hint" id="empty-hint">
                떠오르는 생각을 자유롭게 기록하세요.<br>
                음성, 글, 사진, 스케치를 무작위로 남길 수 있습니다.
              </div>
            </div>

            <!-- 하단 캡슐 입력 바 (Capture 1 모방) -->
            <div class="bottom-bar-wrapper">
              <!-- + 버튼 팝업 메뉴 (Capture 2 모방) -->
              <div class="plus-menu-popover" id="plus-menu">
                <div class="menu-item" onclick="triggerCamera()">
                  <div class="menu-item-icon">📷</div>
                  <span>카메라 촬영</span>
                </div>
                <div class="menu-item" onclick="triggerGallery()">
                  <div class="menu-item-icon">🖼️</div>
                  <span>사진 불러오기</span>
                </div>
                <div class="menu-item" onclick="openSketchModal()">
                  <div class="menu-item-icon">🎨</div>
                  <span>스케치 그리기</span>
                </div>
                <div class="menu-item" onclick="triggerVideo()">
                  <div class="menu-item-icon">🎬</div>
                  <span>동영상 녹화</span>
                </div>
              </div>

              <div class="capsule-box">
                <button id="btn-plus" class="btn-plus" onclick="togglePlusMenu()">＋</button>
                <textarea id="prompt-input" class="main-input" placeholder="생각을 자유롭게 입력하세요..." rows="1" oninput="autoResize(this)"></textarea>
                <button class="btn-mic" onclick="triggerVoice()">
                  <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </button>
                <button id="btn-wave" class="btn-wave-action" onclick="handleSendAction()">
                  <div class="wave-bar"></div>
                  <div class="wave-bar"></div>
                  <div class="wave-bar"></div>
                </button>
              </div>
            </div>

            <!-- 숨김 파일 입력 -->
            <input type="file" id="camera-file" accept="image/*" capture="environment" style="display:none;" onchange="handleMediaUpload(this, '사진 (촬영)')" />
            <input type="file" id="gallery-file" accept="image/*" style="display:none;" onchange="handleMediaUpload(this, '사진 (갤러리)')" />
            <input type="file" id="video-file" accept="video/*" capture="environment" style="display:none;" onchange="handleMediaUpload(this, '동영상')" />

            <!-- 스케치 모달 -->
            <div id="sketch-modal" class="modal-full">
              <div class="modal-top">
                <span style="font-weight:bold; font-size:1rem;">🎨 스케치 드로잉</span>
                <div style="display:flex; gap:8px;">
                  <button class="card-btn" style="background:#ef4444;" onclick="clearCanvas()">지우기</button>
                  <button class="card-btn" style="background:#2563eb;" onclick="saveSketch()">완료 및 저장</button>
                  <button class="card-btn" onclick="closeSketchModal()">닫기</button>
                </div>
              </div>
              <div class="canvas-container" id="canvas-wrapper">
                <canvas id="sketch-board"></canvas>
              </div>
            </div>

            <!-- 생각보관함 모달 -->
            <div id="drawer-modal" class="modal-full">
              <div class="modal-top">
                <span style="font-weight:bold; font-size:1.05rem;">📂 생각보관함</span>
                <button class="card-btn" style="background:#ef4444;" onclick="closeDrawer()">닫기</button>
              </div>
              <div class="main-canvas" id="archive-list"></div>
            </div>

            <script>
              let isListening = false;
              let editingId = null;

              function togglePlusMenu() {
                const menu = document.getElementById('plus-menu');
                const btn = document.getElementById('btn-plus');
                menu.classList.toggle('active');
                btn.classList.toggle('open');
              }
              function closePlusMenu() {
                document.getElementById('plus-menu').classList.remove('active');
                document.getElementById('btn-plus').classList.remove('open');
              }

              function triggerCamera() { closePlusMenu(); document.getElementById('camera-file').click(); }
              function triggerGallery() { closePlusMenu(); document.getElementById('gallery-file').click(); }
              function triggerVideo() { closePlusMenu(); document.getElementById('video-file').click(); }

              function handleMediaUpload(input, type) {
                const file = input.files[0];
                if (file) {
                  const prompt = prompt('이 미디어에 대한 한 줄 메모를 입력하세요 (선택):') || '';
                  saveThought(type, prompt ? `[${type}] ${prompt}` : `[${type} 파일 저장됨]`);
                  input.value = '';
                }
              }

              function autoResize(textarea) {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 90) + 'px';
              }

              /* 음성 및 전송 동작 */
              function handleSendAction() {
                const input = document.getElementById('prompt-input');
                const text = input.value.trim();
                if (text) {
                  saveThought('메모', text);
                  input.value = '';
                  input.style.height = 'auto';
                } else {
                  triggerVoice();
                }
              }

              function triggerVoice() {
                closePlusMenu();
                const waveBtn = document.getElementById('btn-wave');
                if (window.AndroidBridge && window.AndroidBridge.startSpeechRecognition) {
                  waveBtn.classList.add('listening');
                  window.AndroidBridge.startSpeechRecognition();
                } else {
                  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                  if (!Speech) {
                    alert('음성인식 기능을 지원하지 않는 기기입니다.');
                    return;
                  }
                  const rec = new Speech();
                  rec.lang = 'ko-KR';
                  rec.onstart = () => waveBtn.classList.add('listening');
                  rec.onresult = (e) => appendVoiceResult(e.results[0][0].transcript);
                  rec.onend = () => waveBtn.classList.remove('listening');
                  rec.start();
                }
              }

              function appendVoiceResult(text) {
                const input = document.getElementById('prompt-input');
                const prev = input.value.trim();
                input.value = prev ? prev + ' ' + text : text;
                autoResize(input);
              }

              window.receiveVoiceResult = function(text) {
                document.getElementById('btn-wave').classList.remove('listening');
                if (text && text.trim()) appendVoiceResult(text);
              };

              /* 플로팅 음성 데이터 수신 */
              setInterval(() => {
                if (window.AndroidBridge && window.AndroidBridge.getPendingVoiceText) {
                  const text = window.AndroidBridge.getPendingVoiceText();
                  if (text && text.trim().length > 0) {
                    saveThought('음성 (플로팅)', text);
                  }
                }
              }, 400);

              /* 생각 저장 및 피드 렌더링 */
              function getStorage() {
                const data = localStorage.getItem('idea_drawer_storage') || '[]';
                try { return JSON.parse(data); } catch (e) { return []; }
              }
              function setStorage(arr) {
                localStorage.setItem('idea_drawer_storage', JSON.stringify(arr));
                renderFeed();
              }

              function saveThought(type, content) {
                if (!content || !content.trim()) return;
                const list = getStorage();
                list.unshift({
                  id: Date.now(),
                  type,
                  content,
                  time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
                });
                setStorage(list);
              }

              function renderFeed() {
                const list = getStorage();
                const feed = document.getElementById('feed-container');
                const hint = document.getElementById('empty-hint');

                if (list.length === 0) {
                  feed.innerHTML = '';
                  feed.appendChild(hint);
                  return;
                }

                feed.innerHTML = list.map(item => `
                  <div class="thought-card">
                    <div class="card-header">
                      <span class="card-badge">${item.type}</span>
                      <span class="card-time">${item.time}</span>
                    </div>
                    <div class="card-content">${item.content}</div>
                    <div class="card-actions">
                      <button class="card-btn" onclick="copyThought('${encodeURIComponent(item.content)}')">📋 복사</button>
                      <button class="card-btn" style="color:#ef4444;" onclick="deleteThought(${item.id})">🗑️ 삭제</button>
                    </div>
                  </div>
                `).join('');
              }

              function copyThought(encoded) {
                const text = decodeURIComponent(encoded);
                navigator.clipboard.writeText(text).then(() => alert('클립보드에 복사되었습니다.'));
              }

              function deleteThought(id) {
                const list = getStorage().filter(i => i.id !== id);
                setStorage(list);
              }

              /* 스케치 모달 로직 */
              const canvas = document.getElementById('sketch-board');
              const ctx = canvas.getContext('2d');
              let isDrawing = false;

              function openSketchModal() {
                closePlusMenu();
                document.getElementById('sketch-modal').classList.add('active');
                setTimeout(() => {
                  const box = document.getElementById('canvas-wrapper');
                  canvas.width = box.clientWidth;
                  canvas.height = box.clientHeight;
                  ctx.lineWidth = 4;
                  ctx.lineCap = 'round';
                  ctx.strokeStyle = '#000000';
                }, 50);
              }
              function closeSketchModal() { document.getElementById('sketch-modal').classList.remove('active'); }
              function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
              function saveSketch() {
                saveThought('스케치', '[스케치 드로잉 저장됨]');
                closeSketchModal();
              }

              function getPos(e) {
                const r = canvas.getBoundingClientRect();
                const t = e.touches ? e.touches[0] : e;
                return { x: t.clientX - r.left, y: t.clientY - r.top };
              }
              canvas.addEventListener('mousedown', (e) => { isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
              canvas.addEventListener('mousemove', (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
              canvas.addEventListener('mouseup', () => { isDrawing = false; });
              canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }, { passive: false });
              canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }, { passive: false });
              canvas.addEventListener('touchend', () => { isDrawing = false; });

              /* 보관함 */
              function openDrawer() {
                document.getElementById('drawer-modal').classList.add('active');
                const list = getStorage();
                const box = document.getElementById('archive-list');
                if (list.length === 0) {
                  box.innerHTML = '<p style="color:#55555c; text-align:center; margin-top:40px;">보관된 생각이 없습니다.</p>';
                  return;
                }
                box.innerHTML = list.map(item => `
                  <div class="thought-card">
                    <div class="card-header">
                      <span class="card-badge">${item.type}</span>
                      <span class="card-time">${item.time}</span>
                    </div>
                    <div class="card-content">${item.content}</div>
                    <div class="card-actions">
                      <button class="card-btn" onclick="copyThought('${encodeURIComponent(item.content)}')">📋 복사</button>
                      <button class="card-btn" style="color:#ef4444;" onclick="deleteThought(${item.id}); openDrawer();">🗑️ 삭제</button>
                    </div>
                  </div>
                `).join('');
              }
              function closeDrawer() { document.getElementById('drawer-modal').classList.remove('active'); }

              renderFeed();
            </script>
          </body>
          </html>
          EOF

      - name: 5. 영구 고정 Keystore 생성 및 네이티브 플로팅 주입
        run: |
          cat << 'EOF' > package.json
          {
            "name": "my-idea-drawer",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.k2hkkh.ideadrawer",
            "appName": "생각서랍",
            "webDir": "www"
          }
          EOF

          npm install
          npx cap add android

          # 고정 디버그 서명키 복사 (영구 덮어쓰기 보장)
          BUILD_NUM=${{ github.run_number }}
          sed -i "s/versionCode 1/versionCode $BUILD_NUM/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.$BUILD_NUM\"/g" android/app/build.gradle

          node -e '
          const fs = require("fs");
          const p = "android/app/src/main/AndroidManifest.xml";
          let xml = fs.readFileSync(p, "utf8");
          const perms = "\n    <uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\" />\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-permission android:name=\"android.permission.VIBRATE\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MICROPHONE\" />\n";
          const srv = "\n    <service android:name=\"com.k2hkkh.ideadrawer.FloatingWidgetService\" android:enabled=\"true\" android:exported=\"false\" android:foregroundServiceType=\"microphone\" />\n";
          xml = xml.replace("<application", perms + "    <application");
          xml = xml.replace("</application>", srv + "    </application>");
          fs.writeFileSync(p, xml, "utf8");
          '

          mkdir -p android/app/src/main/java/com/k2hkkh/ideadrawer

          # 플로팅 위젯 소스코드
          cat << 'EOF' > android/app/src/main/java/com/k2hkkh/ideadrawer/FloatingWidgetService.java
          package com.k2hkkh.ideadrawer;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.Vibrator;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.core.app.NotificationCompat;
          import java.util.ArrayList;

          public class FloatingWidgetService extends Service {
              private WindowManager windowManager;
              private TextView floatingView;
              private SpeechRecognizer speechRecognizer;
              private boolean isListening = false;
              private GradientDrawable normalBg, activeBg;

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();

                  try {
                      Notification notification = new NotificationCompat.Builder(this, "floating_channel")
                              .setContentTitle("생각서랍 플로팅 실행 중")
                              .setContentText("터치하여 바로 음성으로 기록하세요.")
                              .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                              .setPriority(NotificationCompat.PRIORITY_LOW)
                              .build();
                      startForeground(1001, notification);
                  } catch (Exception ignored) {}

                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);

                  floatingView = new TextView(this);
                  floatingView.setText("✨");
                  floatingView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 24);
                  floatingView.setGravity(Gravity.CENTER);

                  normalBg = new GradientDrawable();
                  normalBg.setShape(GradientDrawable.OVAL);
                  normalBg.setColor(Color.parseColor("#2563EB"));

                  activeBg = new GradientDrawable();
                  activeBg.setShape(GradientDrawable.OVAL);
                  activeBg.setColor(Color.parseColor("#EF4444"));

                  floatingView.setBackground(normalBg);

                  int layoutType = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ?
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY :
                          WindowManager.LayoutParams.TYPE_PHONE;

                  final WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          145, 145,
                          layoutType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                  );

                  params.gravity = Gravity.TOP | Gravity.START;
                  params.x = 60;
                  params.y = 300;

                  floatingView.setOnTouchListener(new View.OnTouchListener() {
                      private int initialX, initialY;
                      private float initialTouchX, initialTouchY;

                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  initialX = params.x;
                                  initialY = params.y;
                                  initialTouchX = event.getRawX();
                                  initialTouchY = event.getRawY();
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  params.x = initialX + (int) (event.getRawX() - initialTouchX);
                                  params.y = initialY + (int) (event.getRawY() - initialTouchY);
                                  windowManager.updateViewLayout(floatingView, params);
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  float diffX = Math.abs(event.getRawX() - initialTouchX);
                                  float diffY = Math.abs(event.getRawY() - initialTouchY);
                                  if (diffX < 15 && diffY < 15) {
                                      startFloatingVoice();
                                  }
                                  return true;
                          }
                          return false;
                      }
                  });

                  windowManager.addView(floatingView, params);
              }

              private void startFloatingVoice() {
                  new Handler(Looper.getMainLooper()).post(() -> {
                      if (isListening) {
                          if (speechRecognizer != null) speechRecognizer.stopListening();
                          return;
                      }

                      vibrateDevice();

                      try {
                          if (speechRecognizer != null) {
                              speechRecognizer.destroy();
                              speechRecognizer = null;
                          }

                          speechRecognizer = SpeechRecognizer.createSpeechRecognizer(getApplicationContext());
                          Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                          intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                          intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ko-KR");
                          intent.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, getPackageName());

                          speechRecognizer.setRecognitionListener(new RecognitionListener() {
                              @Override
                              public void onReadyForSpeech(Bundle params) {
                                  isListening = true;
                                  floatingView.setBackground(activeBg);
                                  floatingView.setText("🎙️");
                                  Toast.makeText(getApplicationContext(), "💡 듣고 있습니다. 말씀해 주세요...", Toast.LENGTH_SHORT).show();
                              }

                              @Override public void onBeginningOfSpeech() {}
                              @Override public void onRmsChanged(float rmsdB) {}
                              @Override public void onBufferReceived(byte[] buffer) {}
                              @Override public void onEndOfSpeech() {}

                              @Override
                              public void onError(int error) {
                                  resetFloatingButton();
                              }

                              @Override
                              public void onResults(Bundle results) {
                                  resetFloatingButton();
                                  vibrateDevice();
                                  ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                  if (matches != null && !matches.isEmpty()) {
                                      String spokenText = matches.get(0);
                                      SharedPreferences prefs = getSharedPreferences("IdeaPrefs", MODE_PRIVATE);
                                      prefs.edit().putString("PENDING_VOICE", spokenText).apply();

                                      Intent appIntent = new Intent(FloatingWidgetService.this, MainActivity.class);
                                      appIntent.putExtra("VOICE_RESULT", spokenText);
                                      appIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                                      startActivity(appIntent);
                                  }
                              }

                              @Override public void onPartialResults(Bundle partialResults) {}
                              @Override public void onEvent(int eventType, Bundle params) {}
                          });

                          speechRecognizer.startListening(intent);
                      } catch (Exception e) {
                          resetFloatingButton();
                      }
                  });
              }

              private void vibrateDevice() {
                  try {
                      Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (v != null) v.vibrate(50);
                  } catch (Exception ignored) {}
              }

              private void resetFloatingButton() {
                  isListening = false;
                  floatingView.setBackground(normalBg);
                  floatingView.setText("✨");
                  if (speechRecognizer != null) {
                      try { speechRecognizer.destroy(); } catch (Exception ignored) {}
                      speechRecognizer = null;
                  }
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel("floating_channel", "생각서랍 플로팅", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  resetFloatingButton();
                  if (floatingView != null && windowManager != null) {
                      try { windowManager.removeView(floatingView); } catch (Exception ignored) {}
                  }
              }
          }
          EOF

          # 메인 액티비티 소스코드
          cat << 'EOF' > android/app/src/main/java/com/k2hkkh/ideadrawer/MainActivity.java
          package com.k2hkkh.ideadrawer;

          import android.Manifest;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;

          public class MainActivity extends BridgeActivity {
              private SpeechRecognizer inAppRecognizer;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestAppPermissions();
                  startWidgetIfAllowed();

                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void startSpeechRecognition() {
                              new Handler(Looper.getMainLooper()).post(() -> startInAppVoice());
                          }

                          @JavascriptInterface
                          public String getPendingVoiceText() {
                              SharedPreferences prefs = getSharedPreferences("IdeaPrefs", MODE_PRIVATE);
                              String pending = prefs.getString("PENDING_VOICE", "");
                              if (!pending.isEmpty()) {
                                  prefs.edit().remove("PENDING_VOICE").apply();
                              }
                              return pending;
                          }
                      }, "AndroidBridge");
                  }

                  handleVoiceIntent(getIntent());
              }

              private void requestAppPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED ||
                          ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{
                                  Manifest.permission.RECORD_AUDIO,
                                  Manifest.permission.CAMERA
                          }, 200);
                      }
                  }
              }

              public void startInAppVoice() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestAppPermissions();
                      return;
                  }

                  try {
                      if (inAppRecognizer != null) inAppRecognizer.destroy();
                      inAppRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                      Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ko-KR");

                      inAppRecognizer.setRecognitionListener(new RecognitionListener() {
                          @Override public void onReadyForSpeech(Bundle params) {
                              Toast.makeText(MainActivity.this, "💡 말씀하세요...", Toast.LENGTH_SHORT).show();
                          }
                          @Override public void onBeginningOfSpeech() {}
                          @Override public void onRmsChanged(float rmsdB) {}
                          @Override public void onBufferReceived(byte[] buffer) {}
                          @Override public void onEndOfSpeech() {}
                          @Override public void onError(int error) {
                              Toast.makeText(MainActivity.this, "음성 인식이 취소되었습니다.", Toast.LENGTH_SHORT).show();
                              evalJS("if (window.receiveVoiceResult) window.receiveVoiceResult('');");
                          }
                          @Override
                          public void onResults(Bundle results) {
                              ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                              if (matches != null && !matches.isEmpty()) {
                                  sendTextToWebView(matches.get(0));
                              }
                          }
                          @Override public void onPartialResults(Bundle partialResults) {}
                          @Override public void onEvent(int eventType, Bundle params) {}
                      });

                      inAppRecognizer.startListening(intent);
                  } catch (Exception e) {
                      Toast.makeText(this, "음성 인식기를 구동할 수 없습니다.", Toast.LENGTH_SHORT).show();
                  }
              }

              private void evalJS(String script) {
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript(script, null));
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  startWidgetIfAllowed();
              }

              @Override
              public void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleVoiceIntent(intent);
              }

              private void handleVoiceIntent(Intent intent) {
                  if (intent != null && intent.hasExtra("VOICE_RESULT")) {
                      String voiceText = intent.getStringExtra("VOICE_RESULT");
                      new Handler(Looper.getMainLooper()).postDelayed(() -> sendTextToWebView(voiceText), 300);
                  }
              }

              private void sendTextToWebView(String text) {
                  if (text != null) {
                      String cleanText = text.replace("\\", "\\\\").replace("'", "\\'").replace("\n", " ");
                      evalJS("if (window.receiveVoiceResult) window.receiveVoiceResult('" + cleanText + "');");
                  }
              }

              private void startWidgetIfAllowed() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (Settings.canDrawOverlays(this)) {
                          Intent intent = new Intent(this, FloatingWidgetService.class);
                          try {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  startForegroundService(intent);
                              } else {
                                  startService(intent);
                              }
                          } catch (Exception ignored) {}
                      }
                  } else {
                      Intent intent = new Intent(this, FloatingWidgetService.class);
                      startService(intent);
                  }
              }
          }
