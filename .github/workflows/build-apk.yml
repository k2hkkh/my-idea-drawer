<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>생각서랍</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border-bottom: 1px solid #334155;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
    nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--card-bg);
      padding: 6px;
      gap: 6px;
      border-bottom: 1px solid #334155;
    }
    .tab-btn {
      padding: 10px 4px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
    }
    .container {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .tab-content { display: none; flex: 1; flex-direction: column; gap: 14px; }
    .tab-content.active { display: flex; }

    /* 제미나이 음성 스타일 */
    .voice-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .gemini-mic-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #38bdf8);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
      transition: transform 0.2s;
    }
    .gemini-mic-btn.listening {
      animation: pulse 1.4s infinite;
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.7);
      background: linear-gradient(135deg, #ef4444, #f97316);
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .voice-waves {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 36px;
    }
    .wave-bar {
      width: 5px;
      height: 14px;
      background: #ffffff;
      border-radius: 4px;
    }
    .gemini-mic-btn.listening .wave-bar {
      animation: soundWave 0.8s infinite ease-in-out alternate;
    }
    .gemini-mic-btn.listening .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .gemini-mic-btn.listening .wave-bar:nth-child(3) { animation-delay: 0.4s; }
    .gemini-mic-btn.listening .wave-bar:nth-child(4) { animation-delay: 0.1s; }
    @keyframes soundWave {
      0% { height: 8px; }
      100% { height: 34px; }
    }
    .text-preview {
      width: 100%;
      min-height: 120px;
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      color: #ffffff;
      font-size: 1rem;
      resize: none;
    }

    /* 스케치 캔버스 */
    .canvas-container {
      flex: 1;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      touch-action: none;
      position: relative;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .sketch-tools {
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--card-bg);
      padding: 10px;
      border-radius: 10px;
      justify-content: space-between;
    }

    /* 사진/비디오 */
    .media-box {
      flex: 1;
      border: 2px dashed #475569;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--card-bg);
      padding: 20px;
      text-align: center;
    }
    .btn-action {
      background: var(--primary);
      color: #fff;
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    .save-btn {
      width: 100%;
      background: #10b981;
      color: #ffffff;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .history-card {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 10px;
      border-left: 4px solid var(--accent);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>💡 생각서랍</h1>
    <span id="storage-count" style="font-size:0.8rem; color:var(--text-muted);">기록 0건</span>
  </header>

  <nav>
    <button class="tab-btn active" onclick="switchTab('voice')">✨ 음성</button>
    <button class="tab-btn" onclick="switchTab('photo')">📷 사진</button>
    <button class="tab-btn" onclick="switchTab('sketch')">🎨 스케치</button>
    <button class="tab-btn" onclick="switchTab('video')">🎬 동영상</button>
  </nav>

  <div class="container">
    <!-- 1. 음성 탭 -->
    <div id="tab-voice" class="tab-content active">
      <div class="voice-box">
        <button id="voice-record-btn" class="gemini-mic-btn" onclick="toggleSpeech()">
          <div class="voice-waves">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
          </div>
        </button>
        <p id="voice-status" style="color:var(--text-muted); font-size:0.9rem;">버튼을 누르고 생각을 말씀하세요</p>
        <textarea id="voice-text" class="text-preview" placeholder="음성인식 결과가 여기에 자동으로 입력됩니다..."></textarea>
      </div>
      <button class="save-btn" onclick="saveIdea('음성', document.getElementById('voice-text').value)">서랍에 저장하기</button>
    </div>

    <!-- 2. 사진 탭 -->
    <div id="tab-photo" class="tab-content">
      <div class="media-box">
        <p>현장의 모습을 바로 촬영해 아이디어로 보관하세요.</p>
        <input type="file" accept="image/*" capture="environment" id="photo-input" style="display:none;" onchange="previewMedia(this, 'photo-preview')" />
        <button class="btn-action" onclick="document.getElementById('photo-input').click()">📷 카메라 촬영 / 사진 선택</button>
        <img id="photo-preview" style="max-width:100%; max-height:180px; border-radius:8px; display:none;" />
      </div>
      <button class="save-btn" onclick="saveIdea('사진', '사진 메모가 저장되었습니다.')">사진 저장하기</button>
    </div>

    <!-- 3. 스케치 탭 -->
    <div id="tab-sketch" class="tab-content">
      <div class="sketch-tools">
        <input type="color" id="pen-color" value="#000000" style="width:36px; height:36px; border:none; border-radius:6px; cursor:pointer;" />
        <button class="btn-action" style="padding:6px 14px; background:#ef4444;" onclick="clearCanvas()">지우기</button>
      </div>
      <div class="canvas-container" id="canvas-wrapper">
        <canvas id="sketch-pad"></canvas>
      </div>
      <button class="save-btn" onclick="saveIdea('스케치', '스케치 드로잉이 저장되었습니다.')">스케치 저장하기</button>
    </div>

    <!-- 4. 동영상 탭 -->
    <div id="tab-video" class="tab-content">
      <div class="media-box">
        <p>짧은 영상으로 아이디어와 상황을 생생하게 남기세요.</p>
        <input type="file" accept="video/*" capture="environment" id="video-input" style="display:none;" onchange="previewMedia(this, 'video-preview')" />
        <button class="btn-action" onclick="document.getElementById('video-input').click()">🎬 비디오 녹화 / 동영상 선택</button>
        <video id="video-preview" controls style="max-width:100%; max-height:180px; border-radius:8px; display:none;"></video>
      </div>
      <button class="save-btn" onclick="saveIdea('동영상', '동영상 메모가 저장되었습니다.')">동영상 저장하기</button>
    </div>

    <!-- 저장 목록 확인 -->
    <div id="ideas-list" style="margin-top:20px;"></div>
  </div>

  <script>
    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach((b, i) => {
        b.classList.toggle('active', ['voice', 'photo', 'sketch', 'video'][i] === name);
      });
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      if (name === 'sketch') resizeCanvas();
    }

    /* 플로팅 서비스에서 음성 전달받기 */
    window.receiveNativeVoiceText = function(text) {
      switchTab('voice');
      const textarea = document.getElementById('voice-text');
      textarea.value = text;
      document.getElementById('voice-status').innerText = '✨ 플로팅 음성 입력이 완료되었습니다.';
    };

    /* 웹 음성인식 */
    let recognition;
    let isRecognizing = false;
    function toggleSpeech() {
      const btn = document.getElementById('voice-record-btn');
      const status = document.getElementById('voice-status');
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!Speech) {
        alert('이 기기에서는 내장 음성인식을 지원하지 않습니다.');
        return;
      }

      if (isRecognizing) {
        recognition.stop();
        return;
      }

      recognition = new Speech();
      recognition.lang = 'ko-KR';
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isRecognizing = true;
        btn.classList.add('listening');
        status.innerText = '듣고 있습니다... 말씀해 주세요.';
      };

      recognition.onresult = (e) => {
        const text = Array.from(e.results).map(r => r[0].transcript).join('');
        document.getElementById('voice-text').value = text;
      };

      recognition.onend = () => {
        isRecognizing = false;
        btn.classList.remove('listening');
        status.innerText = '음성 입력 완료. 내용을 확인하고 저장하세요.';
      };

      recognition.start();
    }

    /* 캔버스 드로잉 스크립트 */
    const canvas = document.getElementById('sketch-pad');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    function resizeCanvas() {
      const wrapper = document.getElementById('canvas-wrapper');
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.strokeStyle = document.getElementById('pen-color').value;
    }
    window.addEventListener('resize', resizeCanvas);

    function startDraw(e) {
      drawing = true;
      ctx.beginPath();
      const pos = getPos(e);
      ctx.moveTo(pos.x, pos.y);
    }
    function draw(e) {
      if (!drawing) return;
      ctx.strokeStyle = document.getElementById('pen-color').value;
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }
    function stopDraw() { drawing = false; }
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
    canvas.addEventListener('touchend', stopDraw);

    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    /* 미디어 미리보기 */
    function previewMedia(input, previewId) {
      const file = input.files[0];
      if (file) {
        const el = document.getElementById(previewId);
        el.src = URL.createObjectURL(file);
        el.style.display = 'block';
      }
    }

    /* 저장소 기능 */
    function saveIdea(type, content) {
      if (!content || content.trim() === '') {
        alert('저장할 내용이 없습니다.');
        return;
      }
      const ideas = JSON.parse(localStorage.getItem('my_ideas') || '[]');
      ideas.unshift({ type, content, time: new Date().toLocaleTimeString('ko-KR') });
      localStorage.setItem('my_ideas', JSON.stringify(ideas));
      renderIdeas();
      alert(type + ' 아이디어가 생각서랍에 저장되었습니다!');
    }

    function renderIdeas() {
      const ideas = JSON.parse(localStorage.getItem('my_ideas') || '[]');
      document.getElementById('storage-count').innerText = `기록 ${ideas.length}건`;
      const list = document.getElementById('ideas-list');
      list.innerHTML = ideas.map(item => `
        <div class="history-card">
          <strong style="color:var(--accent);">[${item.type}]</strong> <span style="font-size:0.8rem; color:#64748b;">${item.time}</span>
          <p style="margin-top:4px;">${item.content}</p>
        </div>
      `).join('');
    }
    renderIdeas();
  </script>
</body>
</html>
