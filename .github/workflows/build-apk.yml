name: Build Idea Drawer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node 환경 세팅
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java JDK 세팅
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK 설정
        uses: android-actions/setup-android@v3

      - name: 앱 빌드 준비 및 동기화
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "생각서랍" "com.k2hkkh.ideadrawer" --web-dir "."
          npx cap add android
          npx cap sync android

      - name: 안드로이드 권한 설정
        run: |
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' android/app/src/main/AndroidManifest.xml

      - name: APK 파일 생성
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 완성된 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: 생각서랍-설치파일-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
