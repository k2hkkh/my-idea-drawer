name: Build Idea Drawer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Android SDK 설정
        uses: android-actions/setup-android@v3

      - name: Android 라이선스 자동 동의
        run: |
          yes | sdkmanager --licenses || true

      - name: 웹 파일 복사 및 안드로이드 프로젝트 초기화
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "생각서랍" "com.k2hkkh.ideadrawer" --web-dir www
          npx cap add android
          sed -i '/<\/manifest>/i <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" /><uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: APK 파일 빌드
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 완성된 APK 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: 생각서랍-설치파일-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
