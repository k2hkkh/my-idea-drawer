name: Build Idea Drawer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node.js 18 설정
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Java JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 앱 빌드 파일 정리 및 구성
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "생각서랍" "com.k2hkkh.ideadrawer" --web-dir "www"
          npx cap add android
          sed -i 's/<\/manifest>/    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n<\/manifest>/g' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: APK 파일 조립 (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 완성된 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: 생각서랍-설치파일-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
