name: Build Idea Drawer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 파일 가져오기
        uses: actions/checkout@v4

      - name: 2. 자바 JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. 생각서랍 멀티 미디어 복수 첨부 UI (HTML/JS) 구성
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <title>생각서랍</title>
            <style>
              :root {
                --bg: #000000;
                --card: #1c1c1e;
                --surface: #2c2c2e;
                --primary: #2563eb;
                --accent: #38bdf8;
                --danger: #ef4444;
                --text: #f8fafc;
                --muted: #8e8e93;
                --border: #2c2c2e;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
                background-color: var(--bg);
                color: var(--text);
                height: 100vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
              }
              header {
                padding: 12px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: var(--bg);
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
              }
              .header-btn {
                background: var(--card);
                border: 1px solid var(--border);
                color: #ffffff;
                width: 38px;
                height: 38px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                font-size: 1.1rem;
              }
              .brand-title {
                font-size: 1.1rem;
                font-weight: 700;
                color: #ffffff;
                display: flex;
                align-items: center;
                gap: 6px;
              }

              /* 카테고리 필터 바 */
              .filter-bar {
                display: none;
                padding: 8px 14px;
                background: #121214;
                gap: 6px;
                overflow-x: auto;
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
              }
              .filter-bar.active { display: flex; }
              .filter-pill {
                padding: 4px 10px;
                border-radius: 14px;
                background: var(--card);
                border: 1px solid var(--border);
                font-size: 0.75rem;
                color: var(--muted);
                cursor: pointer;
                white-space: nowrap;
              }
              .filter-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }

              /* 메인 피드 */
              .main-feed {
                flex: 1;
                overflow-y: auto;
                padding: 14px;
                display: flex;
                flex-direction: column;
                gap: 12px;
              }
              .empty-hint {
                margin: auto;
                text-align: center;
                color: #55555c;
                font-size: 0.95rem;
                line-height: 1.6;
              }

              /* 생각 카드 */
              .thought-card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 14px;
                display: flex;
                flex-direction: column;
                gap: 8px;
              }
              .card-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
              }
              .card-badge {
                font-size: 0.75rem;
                padding: 3px 8px;
                border-radius: 6px;
                background: var(--surface);
                color: var(--accent);
                font-weight: 600;
              }
              .card-time { font-size: 0.75rem; color: var(--muted); }
              
              /* 카드 내부 멀티 미디어 그리드 */
              .card-media-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
                gap: 6px;
                margin-top: 4px;
              }
              .media-thumb-item {
                width: 100%;
                height: 120px;
                object-fit: cover;
                border-radius: 8px;
                border: 1px solid var(--border);
                background: #000;
              }

              .card-content { font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
              .card-actions {
                display: flex;
                justify-content: flex-end;
                gap: 6px;
                margin-top: 6px;
              }
              .card-btn {
                background: var(--surface);
                border: none;
                color: #ffffff;
                padding: 5px 10px;
                border-radius: 6px;
                font-size: 0.75rem;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 4px;
              }
              .card-btn.delete { color: var(--danger); }

              /* 첨부 미디어 미리보기 트레이 (입력창 위) */
              .attachment-tray {
                display: none;
                padding: 8px 14px;
                gap: 8px;
                overflow-x: auto;
                background: #121214;
                border-top: 1px solid var(--border);
                align-items: center;
              }
              .attachment-tray.active { display: flex; }
              .tray-item {
                position: relative;
                width: 60px;
                height: 60px;
                flex-shrink: 0;
              }
              .tray-thumb {
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 8px;
                border: 1px solid var(--accent);
              }
              .tray-remove-btn {
                position: absolute;
                top: -4px;
                right: -4px;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: var(--danger);
                color: #fff;
                font-size: 0.7rem;
                border: none;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
              }

              /* 하단 캡슐 입력 바 */
              .bottom-bar-wrapper {
                padding: 8px 14px 14px 14px;
                background: var(--bg);
                position: relative;
                flex-shrink: 0;
              }
              .capsule-box {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 30px;
                padding: 6px 10px;
                display: flex;
                align-items: center;
                gap: 8px;
              }
              .btn-plus {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: var(--surface);
                border: none;
                color: #ffffff;
                font-size: 1.3rem;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: transform 0.2s;
              }
              .btn-plus.open {
                transform: rotate(45deg);
                background: var(--danger);
              }
              .main-input {
                flex: 1;
                background: transparent;
                border: none;
                color: #ffffff;
                font-size: 0.95rem;
                outline: none;
                min-height: 24px;
                max-height: 90px;
                resize: none;
                line-height: 1.4;
              }
              .main-input::placeholder { color: #636366; }
              .btn-mic {
                background: none;
                border: none;
                color: var(--muted);
                width: 32px;
                height: 32px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
              }
              .btn-mic svg { width: 22px; height: 22px; fill: #8e8e93; }
              .btn-wave-action {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: #2563eb;
                border: none;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 2px;
                cursor: pointer;
              }
              .wave-bar { width: 3px; height: 12px; background: #ffffff; border-radius: 2px; }
              .btn-wave-action.listening {
                background: var(--danger);
                animation: pulseWave 1.2s infinite;
              }
              .btn-wave-action.listening .wave-bar {
                animation: waveAnim 0.6s infinite alternate ease-in-out;
              }
              .btn-wave-action.listening .wave-bar:nth-child(2) { animation-delay: 0.15s; }
              .btn-wave-action.listening .wave-bar:nth-child(3) { animation-delay: 0.3s; }
              @keyframes waveAnim { 0% { height: 6px; } 100% { height: 18px; } }
              @keyframes pulseWave { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

              /* + 팝업 메뉴 */
              .plus-menu-popover {
                display: none;
                position: absolute;
                bottom: 74px;
                left: 14px;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 18px;
                padding: 8px 6px;
                flex-direction: column;
                gap: 4px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.8);
                z-index: 50;
                min-width: 170px;
              }
              .plus-menu-popover.active { display: flex; animation: slideUp 0.18s ease-out; }
              @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
              .menu-item {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 14px;
                border-radius: 12px;
                color: #ffffff;
                font-size: 0.9rem;
                font-weight: 500;
                cursor: pointer;
              }
              .menu-item:active { background: var(--surface); }
              .menu-item-icon {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                background: var(--surface);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1rem;
              }

              /* 모달 공통 */
              .modal-full {
                display: none;
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: #000000;
                z-index: 100;
                flex-direction: column;
              }
              .modal-full.active { display: flex; }
              .modal-top {
                padding: 12px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid var(--border);
                background: var(--card);
              }
              .modal-body {
                flex: 1;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 12px;
                overflow-y: auto;
              }

              /* 스케치 전용 팔레트 */
              .palette-bar {
                display: flex;
                gap: 8px;
                align-items: center;
              }
              .color-dot {
                width: 26px;
                height: 26px;
                border-radius: 50%;
                border: 2px solid transparent;
                cursor: pointer;
              }
              .color-dot.active { border-color: #ffffff; transform: scale(1.1); }
              .canvas-container {
                flex: 1;
                background: #ffffff;
                border-radius: 14px;
                touch-action: none;
                position: relative;
                min-height: 260px;
              }
              canvas { width: 100%; height: 100%; display: block; border-radius: 14px; }
            </style>
          </head>
          <body>

            <!-- 헤더 -->
            <header>
              <button class="header-btn" onclick="toggleFilterBar()">☰</button>
              <div class="brand-title">💡 생각서랍</div>
              <button class="header-btn" onclick="openArchiveModal()">📂</button>
            </header>

            <!-- 필터 바 -->
            <div class="filter-bar" id="filter-bar">
              <div class="filter-pill active" onclick="applyFilter('전체', this)">전체</div>
              <div class="filter-pill" onclick="applyFilter('메모', this)">📝 메모</div>
              <div class="filter-pill" onclick="applyFilter('음성', this)">✨ 음성</div>
              <div class="filter-pill" onclick="applyFilter('사진', this)">📷 사진</div>
              <div class="filter-pill" onclick="applyFilter('스케치', this)">🎨 스케치</div>
              <div class="filter-pill" onclick="applyFilter('동영상', this)">🎬 동영상</div>
            </div>

            <!-- 피드 영역 -->
            <div class="main-feed" id="feed-container">
              <div class="empty-hint" id="empty-hint">
                떠오르는 생각을 자유롭게 기록하세요.<br>
                사진 여러 장, 동영상, 스케치를 한 번에 담을 수 있습니다.
              </div>
            </div>

            <!-- 첨부된 미디어 트레이 -->
            <div class="attachment-tray" id="attachment-tray"></div>

            <!-- 하단 캡슐 입력 바 -->
            <div class="bottom-bar-wrapper">
              <div class="plus-menu-popover" id="plus-menu">
                <div class="menu-item" onclick="triggerCamera()">
                  <div class="menu-item-icon">📷</div>
                  <span>카메라 촬영 추가</span>
                </div>
                <div class="menu-item" onclick="triggerGallery()">
                  <div class="menu-item-icon">🖼️</div>
                  <span>사진 선택 (다중)</span>
                </div>
                <div class="menu-item" onclick="openSketchModal()">
                  <div class="menu-item-icon">🎨</div>
                  <span>스케치 그려서 추가</span>
                </div>
                <div class="menu-item" onclick="triggerVideo()">
                  <div class="menu-item-icon">🎬</div>
                  <span>동영상 추가</span>
                </div>
              </div>

              <div class="capsule-box">
                <button id="btn-plus" class="btn-plus" onclick="togglePlusMenu()">＋</button>
                <textarea id="prompt-input" class="main-input" placeholder="생각을 입력하거나 사진·영상을 덧붙이세요..." rows="1" oninput="autoResize(this)"></textarea>
                <button class="btn-mic" onclick="triggerVoice()">
                  <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </button>
                <button id="btn-wave" class="btn-wave-action" onclick="handleSendAction()">
                  <div class="wave-bar"></div>
                  <div class="wave-bar"></div>
                  <div class="wave-bar"></div>
                </button>
              </div>
            </div>

            <!-- 숨김 파일 인풋 (다중 선택 지원) -->
            <input type="file" id="camera-file" accept="image/*" capture="environment" style="display:none;" onchange="processMediaFiles(this, '사진')" />
            <input type="file" id="gallery-file" accept="image/*" multiple style="display:none;" onchange="processMediaFiles(this, '사진')" />
            <input type="file" id="video-file" accept="video/*" capture="environment" style="display:none;" onchange="processMediaFiles(this, '동영상')" />

            <!-- 스케치 모달 -->
            <div id="sketch-modal" class="modal-full">
              <div class="modal-top">
                <div class="palette-bar">
                  <div class="color-dot active" style="background:#000000;" onclick="setDrawColor('#000000', this)"></div>
                  <div class="color-dot" style="background:#ef4444;" onclick="setDrawColor('#ef4444', this)"></div>
                  <div class="color-dot" style="background:#2563eb;" onclick="setDrawColor('#2563eb', this)"></div>
                  <div class="color-dot" style="background:#10b981;" onclick="setDrawColor('#10b981', this)"></div>
                  <div class="color-dot" style="background:#f59e0b;" onclick="setDrawColor('#f59e0b', this)"></div>
                </div>
                <div style="display:flex; gap:6px;">
                  <button class="card-btn" style="background:var(--surface);" onclick="clearCanvas()">지우기</button>
                  <button class="card-btn" style="background:var(--primary);" onclick="attachSketch()">＋ 첨부 추가</button>
                  <button class="card-btn" style="background:var(--danger);" onclick="closeSketchModal()">닫기</button>
                </div>
              </div>
              <div class="canvas-container" id="canvas-wrapper">
                <canvas id="sketch-board"></canvas>
              </div>
            </div>

            <!-- 수정 전용 모달 -->
            <div id="edit-modal" class="modal-full">
              <div class="modal-top">
                <span style="font-weight:bold; font-size:1rem;">✏️ 생각 및 메모 수정</span>
                <div style="display:flex; gap:8px;">
                  <button class="card-btn" style="background:var(--primary);" onclick="confirmEditThought()">💾 수정 완료</button>
                  <button class="card-btn" style="background:var(--danger);" onclick="closeEditModal()">취소</button>
                </div>
              </div>
              <div class="modal-body">
                <div id="edit-media-preview" class="card-media-grid"></div>
                <textarea id="edit-input" class="main-input" style="background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; min-height:160px; width:100%;" placeholder="수정할 메모를 입력하세요..."></textarea>
              </div>
            </div>

            <!-- 보관함 모달 -->
            <div id="archive-modal" class="modal-full">
              <div class="modal-top">
                <span style="font-weight:bold; font-size:1.05rem;">📂 생각보관함</span>
                <button class="card-btn" style="background:var(--danger);" onclick="closeArchiveModal()">닫기</button>
              </div>
              <div class="main-feed" id="archive-feed"></div>
            </div>

            <script>
              let currentFilter = '전체';
              let currentAttachments = []; // 현재 입력창에 첨부된 미디어 배열 [{type, data, isVideo}]
              let editingThoughtId = null;

              function toggleFilterBar() {
                document.getElementById('filter-bar').classList.toggle('active');
              }

              function applyFilter(cat, el) {
                currentFilter = cat;
                document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
                el.classList.add('active');
                renderFeed();
              }

              function togglePlusMenu() {
                const menu = document.getElementById('plus-menu');
                const btn = document.getElementById('btn-plus');
                menu.classList.toggle('active');
                btn.classList.toggle('open');
              }
              function closePlusMenu() {
                document.getElementById('plus-menu').classList.remove('active');
                document.getElementById('btn-plus').classList.remove('open');
              }

              function triggerCamera() { closePlusMenu(); document.getElementById('camera-file').click(); }
              function triggerGallery() { closePlusMenu(); document.getElementById('gallery-file').click(); }
              function triggerVideo() { closePlusMenu(); document.getElementById('video-file').click(); }

              /* 복수 미디어 파일 처리 및 트레이 등록 */
              function processMediaFiles(input, type) {
                const files = input.files;
                if (files && files.length > 0) {
                  Array.from(files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                      currentAttachments.push({
                        type: type,
                        data: e.target.result,
                        isVideo: file.type.startsWith('video')
                      });
                      renderAttachmentTray();
                    };
                    reader.readAsDataURL(file);
                  });
                  input.value = '';
                }
              }

              function renderAttachmentTray() {
                const tray = document.getElementById('attachment-tray');
                if (currentAttachments.length === 0) {
                  tray.classList.remove('active');
                  tray.innerHTML = '';
                  return;
                }
                tray.classList.add('active');
                tray.innerHTML = currentAttachments.map((item, idx) => `
                  <div class="tray-item">
                    ${item.isVideo 
                      ? `<video src="${item.data}" class="tray-thumb"></video>`
                      : `<img src="${item.data}" class="tray-thumb" />`}
                    <button class="tray-remove-btn" onclick="removeAttachment(${idx})">✕</button>
                  </div>
                `).join('');
              }

              function removeAttachment(idx) {
                currentAttachments.splice(idx, 1);
                renderAttachmentTray();
              }

              function autoResize(textarea) {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 90) + 'px';
              }

              /* 생각 저장 (메모 + 복수 첨부파일) */
              function handleSendAction() {
                const input = document.getElementById('prompt-input');
                const text = input.value.trim();
                
                if (text || currentAttachments.length > 0) {
                  let badge = '메모';
                  if (currentAttachments.length > 0) {
                    const types = [...new Set(currentAttachments.map(a => a.type))];
                    badge = types.join('+');
                  }
                  saveThought(badge, text, [...currentAttachments]);
                  
                  input.value = '';
                  input.style.height = 'auto';
                  currentAttachments = [];
                  renderAttachmentTray();
                } else {
                  triggerVoice();
                }
              }

              /* 음성 인식 */
              function triggerVoice() {
                closePlusMenu();
                const waveBtn = document.getElementById('btn-wave');
                if (window.AndroidBridge && window.AndroidBridge.startSpeechRecognition) {
                  waveBtn.classList.add('listening');
                  window.AndroidBridge.startSpeechRecognition();
                } else {
                  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                  if (!Speech) {
                    alert('음성인식 기능을 지원하지 않는 기기입니다.');
                    return;
                  }
                  const rec = new Speech();
                  rec.lang = 'ko-KR';
                  rec.onstart = () => waveBtn.classList.add('listening');
                  rec.onresult = (e) => appendVoiceResult(e.results[0][0].transcript);
                  rec.onend = () => waveBtn.classList.remove('listening');
                  rec.start();
                }
              }

              function appendVoiceResult(text) {
                const input = document.getElementById('prompt-input');
                const prev = input.value.trim();
                input.value = prev ? prev + ' ' + text : text;
                autoResize(input);
              }

              window.receiveVoiceResult = function(text) {
                document.getElementById('btn-wave').classList.remove('listening');
                if (text && text.trim()) appendVoiceResult(text);
              };

              /* 플로팅 데이터 수신 */
              setInterval(() => {
                if (window.AndroidBridge && window.AndroidBridge.getPendingVoiceText) {
                  const text = window.AndroidBridge.getPendingVoiceText();
                  if (text && text.trim().length > 0) {
                    saveThought('음성 (플로팅)', text, []);
                  }
                }
              }, 400);

              /* 저장소 관리 */
              function getStorage() {
                const data = localStorage.getItem('idea_drawer_storage') || '[]';
                try { return JSON.parse(data); } catch (e) { return []; }
              }
              function setStorage(arr) {
                localStorage.setItem('idea_drawer_storage', JSON.stringify(arr));
                renderFeed();
              }

              function saveThought(type, content, mediaList) {
                const list = getStorage();
                list.unshift({
                  id: Date.now(),
                  type,
                  content: content || '',
                  mediaList: mediaList || [],
                  time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
                });
                setStorage(list);
              }

              function renderFeed() {
                const list = getStorage();
                const feed = document.getElementById('feed-container');
                const hint = document.getElementById('empty-hint');
                const filtered = currentFilter === '전체' ? list : list.filter(i => i.type.includes(currentFilter));

                if (filtered.length === 0) {
                  feed.innerHTML = '';
                  feed.appendChild(hint);
                  return;
                }

                feed.innerHTML = filtered.map(item => `
                  <div class="thought-card">
                    <div class="card-header">
                      <span class="card-badge">${item.type}</span>
                      <span class="card-time">${item.time}</span>
                    </div>
                    ${item.mediaList && item.mediaList.length > 0 ? `
                      <div class="card-media-grid">
                        ${item.mediaList.map(m => m.isVideo 
                          ? `<video src="${m.data}" controls class="media-thumb-item"></video>`
                          : `<img src="${m.data}" class="media-thumb-item" />`
                        ).join('')}
                      </div>
                    ` : ''}
                    ${item.content ? `<div class="card-content">${item.content}</div>` : ''}
                    <div class="card-actions">
                      <button class="card-btn" onclick="openEditModal(${item.id})">✏️ 수정</button>
                      <button class="card-btn" onclick="copyThought('${encodeURIComponent(item.content || '')}')">📋 복사</button>
                      <button class="card-btn delete" onclick="deleteThought(${item.id})">🗑️ 삭제</button>
                    </div>
                  </div>
                `).join('');
              }

              function copyThought(encoded) {
                const text = decodeURIComponent(encoded);
                navigator.clipboard.writeText(text).then(() => alert('클립보드에 복사되었습니다.'));
              }

              function deleteThought(id) {
                if (confirm('이 생각을 삭제하시겠습니까?')) {
                  const list = getStorage().filter(i => i.id !== id);
                  setStorage(list);
                }
              }

              /* 수정 모달 */
              function openEditModal(id) {
                const item = getStorage().find(i => i.id === id);
                if (item) {
                  editingThoughtId = id;
                  document.getElementById('edit-input').value = item.content || '';
                  const mediaBox = document.getElementById('edit-media-preview');
                  mediaBox.innerHTML = (item.mediaList || []).map(m => m.isVideo
                    ? `<video src="${m.data}" controls class="media-thumb-item"></video>`
                    : `<img src="${m.data}" class="media-thumb-item" />`
                  ).join('');
                  document.getElementById('edit-modal').classList.add('active');
                }
              }
              function closeEditModal() {
                document.getElementById('edit-modal').classList.remove('active');
                editingThoughtId = null;
              }
              function confirmEditThought() {
                const text = document.getElementById('edit-input').value.trim();
                const list = getStorage();
                const target = list.find(i => i.id === editingThoughtId);
                if (target) {
                  target.content = text;
                  target.time = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + ' (수정됨)';
                  setStorage(list);
                }
                closeEditModal();
              }

              /* 스케치 모달 */
              const canvas = document.getElementById('sketch-board');
              const ctx = canvas.getContext('2d');
              let isDrawing = false;
              let currentColor = '#000000';

              function setDrawColor(color, el) {
                currentColor = color;
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                if (el) el.classList.add('active');
                ctx.strokeStyle = currentColor;
              }

              function openSketchModal() {
                closePlusMenu();
                document.getElementById('sketch-modal').classList.add('active');
                setTimeout(() => {
                  const box = document.getElementById('canvas-wrapper');
                  canvas.width = box.clientWidth;
                  canvas.height = box.clientHeight;
                  ctx.lineWidth = 4;
                  ctx.lineCap = 'round';
                  ctx.strokeStyle = currentColor;
                }, 50);
              }
              function closeSketchModal() { document.getElementById('sketch-modal').classList.remove('active'); }
              function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

              function attachSketch() {
                const dataUrl = canvas.toDataURL('image/png');
                currentAttachments.push({
                  type: '스케치',
                  data: dataUrl,
                  isVideo: false
                });
                renderAttachmentTray();
                closeSketchModal();
              }

              function getPos(e) {
                const r = canvas.getBoundingClientRect();
                const t = e.touches ? e.touches[0] : e;
                return { x: t.clientX - r.left, y: t.clientY - r.top };
              }
              canvas.addEventListener('mousedown', (e) => { isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
              canvas.addEventListener('mousemove', (e) => { if (!isDrawing) return; ctx.strokeStyle = currentColor; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
              canvas.addEventListener('mouseup', () => { isDrawing = false; });
              canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }, { passive: false });
              canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (!isDrawing) return; ctx.strokeStyle = currentColor; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }, { passive: false });
              canvas.addEventListener('touchend', () => { isDrawing = false; });

              /* 보관함 모달 */
              function openArchiveModal() {
                document.getElementById('archive-modal').classList.add('active');
                const list = getStorage();
                const feed = document.getElementById('archive-feed');
                if (list.length === 0) {
                  feed.innerHTML = '<p style="color:#55555c; text-align:center; margin-top:40px;">보관된 생각이 없습니다.</p>';
                  return;
                }
                feed.innerHTML = list.map(item => `
                  <div class="thought-card">
                    <div class="card-header">
                      <span class="card-badge">${item.type}</span>
                      <span class="card-time">${item.time}</span>
                    </div>
                    ${item.mediaList && item.mediaList.length > 0 ? `
                      <div class="card-media-grid">
                        ${item.mediaList.map(m => m.isVideo 
                          ? `<video src="${m.data}" controls class="media-thumb-item"></video>`
                          : `<img src="${m.data}" class="media-thumb-item" />`
                        ).join('')}
                      </div>
                    ` : ''}
                    ${item.content ? `<div class="card-content">${item.content}</div>` : ''}
                    <div class="card-actions">
                      <button class="card-btn" onclick="openEditModal(${item.id})">✏️ 수정</button>
                      <button class="card-btn" onclick="copyThought('${encodeURIComponent(item.content || '')}')">📋 복사</button>
                      <button class="card-btn delete" onclick="deleteThought(${item.id}); openArchiveModal();">🗑️ 삭제</button>
                    </div>
                  </div>
                `).join('');
              }
              function closeArchiveModal() { document.getElementById('archive-modal').classList.remove('active'); }

              renderFeed();
            </script>
          </body>
          </html>
          EOF

      - name: 5. 고정 Keystore 및 플로팅 백그라운드 엔진 주입
        run: |
          cat << 'EOF' > package.json
          {
            "name": "my-idea-drawer",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
