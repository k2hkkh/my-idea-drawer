name: Build Idea Drawer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 파일 가져오기
        uses: actions/checkout@v4

      - name: 2. 자바 JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. 앱 구성 및 플로팅 샤잠 서비스 구축
        run: |
          mkdir -p www
          cp index.html www/index.html
          
          cat << 'EOF' > package.json
          {
            "name": "my-idea-drawer",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.k2hkkh.ideadrawer",
            "appName": "생각서랍",
            "webDir": "www"
          }
          EOF

          npm install
          npx cap add android

          # 안드로이드 최신 규격(Android 14) 권한 및 서비스 주입
          sed -i 's/<application/    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" \/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/application>/i \    <service android:name=".FloatingWidgetService" android:enabled="true" android:exported="false" android:foregroundServiceType="microphone" />' android/app/src/main/AndroidManifest.xml

          mkdir -p android/app/src/main/java/com/k2hkkh/ideadrawer

          cat << 'EOF' > android/app/src/main/java/com/k2hkkh/ideadrawer/FloatingWidgetService.java
          package com.k2hkkh.ideadrawer;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;
          import androidx.core.app.NotificationCompat;

          public class FloatingWidgetService extends Service {
              private WindowManager windowManager;
              private View floatingView;

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();

                  Intent notificationIntent = new Intent(this, MainActivity.class);
                  PendingIntent pendingIntent = PendingIntent.getActivity(
                          this, 0, notificationIntent,
                          Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0
                  );

                  Notification notification = new NotificationCompat.Builder(this, "floating_service_channel")
                          .setContentTitle("생각서랍 플로팅 버튼 동작 중")
                          .setContentText("터치하면 바로 생각서랍으로 이동합니다.")
                          .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                          .setContentIntent(pendingIntent)
                          .build();

                  startForeground(101, notification);

                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  
                  TextView btn = new TextView(this);
                  btn.setText("💡");
                  btn.setTextSize(26);
                  btn.setGravity(Gravity.CENTER);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setShape(GradientDrawable.OVAL);
                  bg.setColor(Color.parseColor("#4f46e5"));
                  btn.setBackground(bg);

                  final WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          160, 160,
                          Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                  );

                  params.gravity = Gravity.TOP | Gravity.START;
                  params.x = 50;
                  params.y = 300;

                  btn.setOnTouchListener(new View.OnTouchListener() {
                      private int initialX, initialY;
                      private float initialTouchX, initialTouchY;

                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  initialX = params.x;
                                  initialY = params.y;
                                  initialTouchX = event.getRawX();
                                  initialTouchY = event.getRawY();
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  params.x = initialX + (int) (event.getRawX() - initialTouchX);
                                  params.y = initialY + (int) (event.getRawY() - initialTouchY);
                                  windowManager.updateViewLayout(floatingView, params);
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (Math.abs(event.getRawX() - initialTouchX) < 15 && Math.abs(event.getRawY() - initialTouchY) < 15) {
                                      Intent appIntent = new Intent(FloatingWidgetService.this, MainActivity.class);
                                      appIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                                      startActivity(appIntent);
                                  }
                                  return true;
                          }
                          return false;
                      }
                  });

                  floatingView = btn;
                  windowManager.addView(floatingView, params);
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                              "floating_service_channel",
                              "생각서랍 플로팅 서비스",
                              NotificationManager.IMPORTANCE_LOW
                          );
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (floatingView != null && windowManager != null) {
                      windowManager.removeView(floatingView);
                  }
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/k2hkkh/ideadrawer/MainActivity.java
          package com.k2hkkh.ideadrawer;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (!Settings.canDrawOverlays(this)) {
                          Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                          startActivity(intent);
                      } else {
                          startFloatingService();
                      }
                  } else {
                      startFloatingService();
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && Settings.canDrawOverlays(this)) {
                      startFloatingService();
                  }
              }

              private void startFloatingService() {
                  Intent serviceIntent = new Intent(this, FloatingWidgetService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent);
                  } else {
                      startService(serviceIntent);
                  }
              }
          }
          EOF

          npx cap sync android

      - name: 5. APK 파일 빌드
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 6. 완성된 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: 생각서랍-설치파일-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
