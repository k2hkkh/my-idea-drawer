name: Build Idea Drawer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 파일 가져오기
        uses: actions/checkout@v4

      - name: 2. 자바 JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. 생각서랍 4대 탭 UI 및 기능 구성 (HTML/JS)
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <title>생각서랍</title>
            <style>
              :root {
                --bg: #0f172a;
                --card: #1e293b;
                --primary: #4f46e5;
                --accent: #38bdf8;
                --danger: #ef4444;
                --text: #f8fafc;
                --muted: #94a3b8;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
                background-color: var(--bg);
                color: var(--text);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
              }
              header {
                padding: 14px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: var(--card);
                border-bottom: 1px solid #334155;
              }
              header h1 { font-size: 1.15rem; font-weight: 700; color: var(--accent); }
              nav {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                background: var(--card);
                padding: 6px;
                gap: 6px;
                border-bottom: 1px solid #334155;
              }
              .tab-btn {
                padding: 10px 2px;
                background: none;
                border: none;
                color: var(--muted);
                font-size: 0.85rem;
                font-weight: 600;
                border-radius: 8px;
                cursor: pointer;
                transition: all 0.2s;
              }
              .tab-btn.active {
                background: var(--primary);
                color: #ffffff;
              }
              .container {
                flex: 1;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 14px;
              }
              .tab-content { display: none; flex: 1; flex-direction: column; gap: 12px; }
              .tab-content.active { display: flex; }

              /* 제미나이 스타일 음성 버튼 */
              .voice-container {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
              }
              .gemini-btn {
                width: 90px;
                height: 90px;
                border-radius: 50%;
                background: linear-gradient(135deg, #4f46e5, #38bdf8);
                border: none;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
                transition: transform 0.2s;
              }
              .gemini-btn.listening {
                animation: pulse 1.3s infinite;
                background: linear-gradient(135deg, #ef4444, #f97316);
                box-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
              }
              @keyframes pulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.08); }
                100% { transform: scale(1); }
              }
              .wave-container {
                display: flex;
                align-items: center;
                gap: 4px;
                height: 32px;
              }
              .wave-bar {
                width: 4px;
                height: 14px;
                background: #ffffff;
                border-radius: 4px;
              }
              .gemini-btn.listening .wave-bar {
                animation: wave 0.7s infinite alternate ease-in-out;
              }
              .gemini-btn.listening .wave-bar:nth-child(2) { animation-delay: 0.15s; }
              .gemini-btn.listening .wave-bar:nth-child(3) { animation-delay: 0.3s; }
              .gemini-btn.listening .wave-bar:nth-child(4) { animation-delay: 0.45s; }
              @keyframes wave {
                0% { height: 8px; }
                100% { height: 32px; }
              }

              .text-area-box {
                width: 100%;
                position: relative;
              }
              .text-area {
                width: 100%;
                min-height: 110px;
                background: var(--card);
                border: 1px solid #334155;
                border-radius: 12px;
                padding: 12px;
                color: #ffffff;
                font-size: 1rem;
                resize: none;
              }

              /* 캔버스 드로잉 */
              .canvas-box {
                flex: 1;
                min-height: 240px;
                background: #ffffff;
                border-radius: 12px;
                touch-action: none;
                position: relative;
              }
              canvas { width: 100%; height: 100%; display: block; border-radius: 12px; }
              .tools {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: var(--card);
                padding: 8px 12px;
                border-radius: 10px;
              }

              /* 미디어 박스 */
              .media-panel {
                flex: 1;
                border: 2px dashed #475569;
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
                background: var(--card);
                padding: 16px;
                text-align: center;
              }
              .btn-action {
                background: var(--primary);
                color: #fff;
                padding: 12px 20px;
                border-radius: 10px;
                border: none;
                font-weight: bold;
                font-size: 0.95rem;
                cursor: pointer;
              }
              .btn-group {
                display: flex;
                gap: 8px;
                width: 100%;
              }
              .btn-delete {
                flex: 1;
                background: #475569;
                color: #ffffff;
                padding: 14px;
                border: none;
                border-radius: 12px;
                font-size: 0.95rem;
                font-weight: bold;
                cursor: pointer;
              }
              .btn-delete:active { background: var(--danger); }
              .save-btn {
                flex: 2;
                background: #10b981;
                color: #ffffff;
                padding: 14px;
                border: none;
                border-radius: 12px;
                font-size: 0.95rem;
                font-weight: bold;
                cursor: pointer;
              }
              .card {
                background: var(--card);
                padding: 12px;
                border-radius: 10px;
                border-left: 4px solid var(--accent);
                margin-top: 10px;
              }
            </style>
          </head>
          <body>

            <header>
              <h1>💡 생각서랍</h1>
              <span id="storage-count" style="font-size:0.8rem; color:var(--muted);">기록 0건</span>
            </header>

            <nav>
              <button class="tab-btn active" onclick="switchTab('voice')">✨ 음성</button>
              <button class="tab-btn" onclick="switchTab('photo')">📷 사진</button>
              <button class="tab-btn" onclick="switchTab('sketch')">🎨 스케치</button>
              <button class="tab-btn" onclick="switchTab('video')">🎬 동영상</button>
            </nav>

            <div class="container">
              <!-- 1. 음성 탭 -->
              <div id="tab-voice" class="tab-content active">
                <div class="voice-container">
                  <button id="gemini-mic" class="gemini-btn" onclick="triggerNativeVoice()">
                    <div class="wave-container">
                      <div class="wave-bar"></div>
                      <div class="wave-bar"></div>
                      <div class="wave-bar"></div>
                      <div class="wave-bar"></div>
                    </div>
                  </button>
                  <p id="voice-status" style="color:var(--muted); font-size:0.9rem;">버튼을 누르고 생각을 말씀하세요</p>
                  <div class="text-area-box">
                    <textarea id="voice-input-text" class="text-area" placeholder="음성인식 결과가 여기에 작성됩니다..."></textarea>
                  </div>
                </div>
                <div class="btn-group">
                  <button class="btn-delete" onclick="clearVoiceText()">🗑️ 지우기</button>
                  <button class="save-btn" onclick="saveIdea('음성', document.getElementById('voice-input-text').value)">서랍에 저장</button>
                </div>
              </div>

              <!-- 2. 사진 탭 -->
              <div id="tab-photo" class="tab-content">
                <div class="media-panel">
                  <p style="color:var(--muted); font-size:0.9rem;">카메라로 즉시 촬영하거나 사진을 불러옵니다.</p>
                  <input type="file" accept="image/*" capture="environment" id="photo-input" style="display:none;" onchange="handleMediaSelected(this, 'photo-view', 'photo-actions')" />
                  <button class="btn-action" onclick="document.getElementById('photo-input').click()">📷 카메라 촬영 / 사진 선택</button>
                  <img id="photo-view" style="max-width:100%; max-height:180px; border-radius:8px; display:none;" />
                </div>
                <div id="photo-actions" class="btn-group" style="display:none;">
                  <button class="btn-delete" onclick="deleteMedia('photo-input', 'photo-view', 'photo-actions')">🗑️ 사진 삭제</button>
                  <button class="save-btn" onclick="saveIdea('사진', '사진 메모가 저장되었습니다.')">사진 저장</button>
                </div>
              </div>

              <!-- 3. 스케치 탭 -->
              <div id="tab-sketch" class="tab-content">
                <div class="tools">
                  <div style="display:flex; align-items:center; gap:8px;">
                    <span style="font-size:0.85rem; color:var(--muted);">펜 색상:</span>
                    <input type="color" id="draw-color" value="#000000" style="width:36px; height:36px; border:none; border-radius:6px; cursor:pointer;" />
                  </div>
                  <button class="btn-delete" style="padding:6px 14px; flex:none;" onclick="clearCanvas()">지우기</button>
                </div>
                <div class="canvas-box" id="canvas-wrapper">
                  <canvas id="sketch-board"></canvas>
                </div>
                <button class="save-btn" style="width:100%;" onclick="saveIdea('스케치', '스케치 드로잉이 저장되었습니다.')">스케치 저장</button>
              </div>

              <!-- 4. 동영상 탭 -->
              <div id="tab-video" class="tab-content">
                <div class="media-panel">
                  <p style="color:var(--muted); font-size:0.9rem;">동영상을 촬영하여 상황을 생생하게 남깁니다.</p>
                  <input type="file" accept="video/*" capture="environment" id="video-input" style="display:none;" onchange="handleMediaSelected(this, 'video-view', 'video-actions')" />
                  <button class="btn-action" onclick="document.getElementById('video-input').click()">🎬 영상 녹화 / 비디오 선택</button>
                  <video id="video-view" controls style="max-width:100%; max-height:180px; border-radius:8px; display:none;"></video>
                </div>
                <div id="video-actions" class="btn-group" style="display:none;">
                  <button class="btn-delete" onclick="deleteMedia('video-input', 'video-view', 'video-actions')">🗑️ 영상 삭제</button>
                  <button class="save-btn" onclick="saveIdea('동영상', '동영상 메모가 저장되었습니다.')">영상 저장</button>
                </div>
              </div>

              <!-- 저장 목록 -->
              <div id="idea-list" style="margin-top:10px;"></div>
            </div>

            <script>
              function switchTab(tabId) {
                const tabs = ['voice', 'photo', 'sketch', 'video'];
                document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                  btn.classList.toggle('active', tabs[idx] === tabId);
                });
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById('tab-' + tabId).classList.add('active');
                if (tabId === 'sketch') initCanvasSize();
              }

              /* 텍스트 및 미디어 삭제/초기화 */
              function clearVoiceText() {
                document.getElementById('voice-input-text').value = '';
                document.getElementById('voice-status').innerText = '버튼을 누르고 생각을 말씀하세요';
              }

              function handleMediaSelected(input, viewId, actionsId) {
                const file = input.files[0];
                if (file) {
                  const el = document.getElementById(viewId);
                  el.src = URL.createObjectURL(file);
                  el.style.display = 'block';
                  document.getElementById(actionsId).style.display = 'flex';
                }
              }

              function deleteMedia(inputId, viewId, actionsId) {
                document.getElementById(inputId).value = '';
                const view = document.getElementById(viewId);
                view.src = '';
                view.style.display = 'none';
                document.getElementById(actionsId).style.display = 'none';
              }

              /* 음성 인식 호출 */
              function triggerNativeVoice() {
                const btn = document.getElementById('gemini-mic');
                const status = document.getElementById('voice-status');
                
                if (window.AndroidBridge && window.AndroidBridge.startSpeechRecognition) {
                  btn.classList.add('listening');
                  status.innerText = '듣고 있습니다... 말씀해 주세요.';
                  window.AndroidBridge.startSpeechRecognition();
                } else {
                  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                  if (!Speech) {
                    alert('음성인식 기능을 지원하지 않는 브라우저입니다.');
                    return;
                  }
                  const rec = new Speech();
                  rec.lang = 'ko-KR';
                  rec.onstart = () => {
                    btn.classList.add('listening');
                    status.innerText = '듣고 있습니다... 말씀해 주세요.';
                  };
                  rec.onresult = (e) => {
                    document.getElementById('voice-input-text').value = e.results[0][0].transcript;
                  };
                  rec.onend = () => {
                    btn.classList.remove('listening');
                    status.innerText = '음성 입력 완료. 확인 후 저장하세요.';
                  };
                  rec.start();
                }
              }

              /* 네이티브 음성인식 결과 수신 */
              window.receiveVoiceResult = function(text) {
                switchTab('voice');
                document.getElementById('gemini-mic').classList.remove('listening');
                document.getElementById('voice-input-text').value = text;
                document.getElementById('voice-status').innerText = '✨ 음성 입력이 완료되었습니다.';
              };

              /* 스케치 드로잉 */
              const canvas = document.getElementById('sketch-board');
              const ctx = canvas.getContext('2d');
              let isDrawing = false;

              function initCanvasSize() {
                const box = document.getElementById('canvas-wrapper');
                canvas.width = box.clientWidth;
                canvas.height = box.clientHeight;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.strokeStyle = document.getElementById('draw-color').value;
              }
              window.addEventListener('resize', initCanvasSize);

              function getPos(e) {
                const r = canvas.getBoundingClientRect();
                const t = e.touches ? e.touches[0] : e;
                return { x: t.clientX - r.left, y: t.clientY - r.top };
              }
              canvas.addEventListener('mousedown', (e) => { isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
              canvas.addEventListener('mousemove', (e) => { if (!isDrawing) return; ctx.strokeStyle = document.getElementById('draw-color').value; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
              canvas.addEventListener('mouseup', () => { isDrawing = false; });
              canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }, { passive: false });
              canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (!isDrawing) return; ctx.strokeStyle = document.getElementById('draw-color').value; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }, { passive: false });
              canvas.addEventListener('touchend', () => { isDrawing = false; });
              function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

              /* 보관함 */
              function saveIdea(type, text) {
                if (!text || text.trim() === '') {
                  alert('저장할 내용이 없습니다.');
                  return;
                }
                const list = JSON.parse(localStorage.getItem('user_ideas') || '[]');
                list.unshift({ type, content: text, time: new Date().toLocaleTimeString('ko-KR') });
                localStorage.setItem('user_ideas', JSON.stringify(list));
                renderStorage();
                alert(type + ' 저장이 완료되었습니다!');
              }

              function renderStorage() {
                const list = JSON.parse(localStorage.getItem('user_ideas') || '[]');
                document.getElementById('storage-count').innerText = `기록 ${list.length}건`;
                const box = document.getElementById('idea-list');
                box.innerHTML = list.map(item => `
                  <div class="card">
                    <strong style="color:var(--accent);">[${item.type}]</strong> <span style="font-size:0.8rem; color:#64748b;">${item.time}</span>
                    <p style="margin-top:4px;">${item.content}</p>
                  </div>
                `).join('');
              }
              renderStorage();
            </script>
          </body>
          </html>
          EOF

      - name: 5. 네이티브 서비스 및 액티비티 구축
        run: |
          cat << 'EOF' > package.json
          {
            "name": "my-idea-drawer",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.k2hkkh.ideadrawer",
            "appName": "생각서랍",
            "webDir": "www"
          }
          EOF

          npm install
          npx cap add android

          # 최신 안드로이드 권한 및 서비스 주입
          node -e '
          const fs = require("fs");
          const p = "android/app/src/main/AndroidManifest.xml";
          let xml = fs.readFileSync(p, "utf8");
          const perms = "\n    <uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\" />\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_SPECIAL_USE\" />\n";
          const srv = "\n    <service android:name=\"com.k2hkkh.ideadrawer.FloatingWidgetService\" android:enabled=\"true\" android:exported=\"false\" android:foregroundServiceType=\"specialUse\" />\n";
          xml = xml.replace("<application", perms + "    <application");
          xml = xml.replace("</application>", srv + "    </application>");
          fs.writeFileSync(p, xml, "utf8");
          '

          mkdir -p android/app/src/main/java/com/k2hkkh/ideadrawer

          # 플로팅 위젯 소스코드 (원터치 시 메인 화면으로 즉시 전환하여 음성 인식 자동 트리거)
          cat << 'EOF' > android/app/src/main/java/com/k2hkkh/ideadrawer/FloatingWidgetService.java
          package com.k2hkkh.ideadrawer;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.IBinder;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;
          import androidx.core.app.NotificationCompat;

          public class FloatingWidgetService extends Service {
              private WindowManager windowManager;
              private TextView floatingView;

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();

                  try {
                      Notification notification = new NotificationCompat.Builder(this, "floating_channel")
                              .setContentTitle("생각서랍 플로팅 실행 중")
                              .setContentText("버튼을 터치하면 바로 음성 녹음이 시작됩니다.")
                              .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                              .setPriority(NotificationCompat.PRIORITY_LOW)
                              .build();
                      startForeground(1001, notification);
                  } catch (Exception ignored) {}

                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);

                  floatingView = new TextView(this);
                  floatingView.setText("✨");
                  floatingView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 26);
                  floatingView.setGravity(Gravity.CENTER);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setShape(GradientDrawable.OVAL);
                  bg.setColor(Color.parseColor("#4F46E5"));
                  floatingView.setBackground(bg);

                  int layoutType = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ?
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY :
                          WindowManager.LayoutParams.TYPE_PHONE;

                  final WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          160, 160,
                          layoutType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                  );

                  params.gravity = Gravity.TOP | Gravity.START;
                  params.x = 60;
                  params.y = 300;

                  floatingView.setOnTouchListener(new View.OnTouchListener() {
                      private int initialX, initialY;
                      private float initialTouchX, initialTouchY;

                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  initialX = params.x;
                                  initialY = params.y;
                                  initialTouchX = event.getRawX();
                                  initialTouchY = event.getRawY();
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  params.x = initialX + (int) (event.getRawX() - initialTouchX);
                                  params.y = initialY + (int) (event.getRawY() - initialTouchY);
                                  windowManager.updateViewLayout(floatingView, params);
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  float diffX = Math.abs(event.getRawX() - initialTouchX);
                                  float diffY = Math.abs(event.getRawY() - initialTouchY);
                                  if (diffX < 15 && diffY < 15) {
                                      Intent appIntent = new Intent(FloatingWidgetService.this, MainActivity.class);
                                      appIntent.putExtra("TRIGGER_VOICE", true);
                                      appIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                                      startActivity(appIntent);
                                  }
                                  return true;
                          }
                          return false;
                      }
                  });

                  windowManager.addView(floatingView, params);
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel("floating_channel", "생각서랍 플로팅", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (floatingView != null && windowManager != null) {
                      try { windowManager.removeView(floatingView); } catch (Exception ignored) {}
                  }
              }
          }
          EOF

          # 메인 액티비티 소스코드 (자동 음성 트리거 + 네이티브 음성 엔진)
          cat << 'EOF' > android/app/src/main/java/com/k2hkkh/ideadrawer/MainActivity.java
          package com.k2hkkh.ideadrawer;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;

          public class MainActivity extends BridgeActivity {
              private SpeechRecognizer speechRecognizer;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestAppPermissions();
                  startWidgetIfAllowed();

                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void startSpeechRecognition() {
                              new Handler(Looper.getMainLooper()).post(() -> startVoiceInput());
                          }
                      }, "AndroidBridge");
                  }

                  handleTriggerIntent(getIntent());
              }

              private void requestAppPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED ||
                          ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{
                                  Manifest.permission.RECORD_AUDIO,
                                  Manifest.permission.CAMERA
                          }, 200);
                      }
                  }
              }

              public void startVoiceInput() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestAppPermissions();
                      return;
                  }

                  try {
                      if (speechRecognizer != null) speechRecognizer.destroy();
                      speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                      Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ko-KR");

                      speechRecognizer.setRecognitionListener(new RecognitionListener() {
                          @Override public void onReadyForSpeech(Bundle params) {
                              Toast.makeText(MainActivity.this, "💡 말씀해 주세요...", Toast.LENGTH_SHORT).show();
                          }
                          @Override public void onBeginningOfSpeech() {}
                          @Override public void onRmsChanged(float rmsdB) {}
                          @Override public void onBufferReceived(byte[] buffer) {}
                          @Override public void onEndOfSpeech() {}
                          @Override public void onError(int error) {
                              Toast.makeText(MainActivity.this, "음성 인식이 취소되었습니다.", Toast.LENGTH_SHORT).show();
                              evalJS("if (document.getElementById('gemini-mic')) document.getElementById('gemini-mic').classList.remove('listening');");
                          }
                          @Override
                          public void onResults(Bundle results) {
                              ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                              if (matches != null && !matches.isEmpty()) {
                                  String recognized = matches.get(0);
                                  String clean = recognized.replace("\\", "\\\\").replace("'", "\\'").replace("\n", " ");
                                  evalJS("if (window.receiveVoiceResult) window.receiveVoiceResult('" + clean + "');");
                              }
                          }
                          @Override public void onPartialResults(Bundle partialResults) {}
                          @Override public void onEvent(int eventType, Bundle params) {}
                      });

                      evalJS("if (document.getElementById('gemini-mic')) document.getElementById('gemini-mic').classList.add('listening');");
                      speechRecognizer.startListening(intent);
                  } catch (Exception e) {
                      Toast.makeText(this, "음성 인식기를 구동할 수 없습니다.", Toast.LENGTH_SHORT).show();
                  }
              }

              private void evalJS(String script) {
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript(script, null));
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  startWidgetIfAllowed();
              }

              @Override
              public void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleTriggerIntent(intent);
              }

              private void handleTriggerIntent(Intent intent) {
                  if (intent != null && intent.getBooleanExtra("TRIGGER_VOICE", false)) {
                      new Handler(Looper.getMainLooper()).postDelayed(() -> startVoiceInput(), 400);
                  }
              }

              private void startWidgetIfAllowed() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (Settings.canDrawOverlays(this)) {
                          Intent intent = new Intent(this, FloatingWidgetService.class);
                          try {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  startForegroundService(intent);
                              } else {
                                  startService(intent);
                              }
                          } catch (Exception ignored) {}
                      }
                  } else {
                      Intent intent = new Intent(this, FloatingWidgetService.class);
                      startService(intent);
                  }
              }
          }
          EOF

