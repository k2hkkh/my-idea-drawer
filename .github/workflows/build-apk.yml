name: Build Idea Drawer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 파일 가져오기
        uses: actions/checkout@v4

      - name: 2. 자바 JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. 생각서랍 정렬 UI 및 AI 4단계 심층 검증 웹 화면 구성
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <title>생각서랍</title>
            <style>
              :root {
                --bg: #0b0f19;
                --card: #151e2e;
                --primary: #2563eb;
                --accent: #38bdf8;
                --danger: #ef4444;
                --text: #f8fafc;
                --muted: #94a3b8;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
                background-color: var(--bg);
                color: var(--text);
                height: 100vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
              }
              header {
                padding: 10px 14px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: var(--card);
                border-bottom: 1px solid #1e293b;
                flex-shrink: 0;
              }
              header h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
              .btn-archive {
                background: #1e293b;
                border: 1px solid #334155;
                color: var(--accent);
                padding: 5px 10px;
                border-radius: 8px;
                font-size: 0.8rem;
                font-weight: bold;
                cursor: pointer;
              }

              /* AI 발전 및 4단계 영역 (완벽 정렬 레이아웃) */
              .ai-stage-container {
                display: flex;
                flex-direction: column;
                background: #0f172a;
                border-bottom: 1px solid #1e293b;
                padding: 6px 10px;
                gap: 6px;
                flex-shrink: 0;
              }
              .ai-action-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
              }
              .btn-ai-validate {
                flex: 1;
                background: linear-gradient(135deg, #4f46e5, #06b6d4);
                color: #ffffff;
                border: none;
                border-radius: 8px;
                padding: 6px 12px;
                font-size: 0.82rem;
                font-weight: bold;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                box-shadow: 0 2px 8px rgba(6,182,212,0.3);
              }
              .stage-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 4px;
                width: 100%;
              }
              .stage-pill {
                font-size: 0.72rem;
                padding: 5px 2px;
                border-radius: 6px;
                background: #1e293b;
                color: var(--muted);
                text-align: center;
                border: 1px solid #334155;
                font-weight: 600;
              }
              .stage-pill.active {
                background: var(--accent);
                color: #0b0f19;
                border-color: var(--accent);
                font-weight: bold;
              }

              /* 미디어 탭 네비게이션 */
              nav {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                background: var(--card);
                padding: 6px;
                gap: 4px;
                border-bottom: 1px solid #1e293b;
                flex-shrink: 0;
              }
              .tab-btn {
                padding: 8px 2px;
                background: none;
                border: none;
                color: var(--muted);
                font-size: 0.82rem;
                font-weight: 600;
                border-radius: 8px;
                cursor: pointer;
              }
              .tab-btn.active {
                background: var(--primary);
                color: #ffffff;
              }

              .container {
                flex: 1;
                min-height: 0;
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                overflow: hidden;
              }
              .tab-content { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 8px; height: 100%; }
              .tab-content.active { display: flex; }

              /* 화면 1/2 분할 레이아웃 */
              .split-view {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: 8px;
              }
              .media-top-half {
                flex: 1;
                min-height: 0;
                background: var(--card);
                border: 2px dashed #334155;
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                position: relative;
              }
              .media-bottom-half {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
              }

              /* 텍스트 입력창 및 제미나이 마이크 */
              .memo-wrapper {
                flex: 1;
                position: relative;
                width: 100%;
                height: 100%;
                display: flex;
              }
              .text-area {
                flex: 1;
                width: 100%;
                height: 100%;
                background: var(--card);
                border: 1px solid #1e293b;
                border-radius: 12px;
                padding: 12px 50px 12px 14px;
                color: #ffffff;
                font-size: 0.95rem;
                line-height: 1.5;
                resize: none;
              }
              .gemini-mic-btn {
                position: absolute;
                right: 10px;
                bottom: 10px;
                width: 38px;
                height: 38px;
                border-radius: 50%;
                background: #192233;
                border: 1px solid #2d3d5a;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 2px 8px rgba(0,0,0,0.3);
              }
              .gemini-mic-btn svg { width: 20px; height: 20px; fill: #94a3b8; }
              .gemini-mic-btn.listening {
                background: #ef4444;
                border-color: #f87171;
                animation: micPulse 1.2s infinite;
              }
              .gemini-mic-btn.listening svg { fill: #ffffff; }
              @keyframes micPulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.1); }
                100% { transform: scale(1); }
              }

              /* 스케치 캔버스 */
              .canvas-box {
                width: 100%;
                height: 100%;
                background: #ffffff;
                border-radius: 10px;
                touch-action: none;
              }
              canvas { width: 100%; height: 100%; display: block; border-radius: 10px; }

              /* 하단 3버튼 그룹 */
              .action-buttons {
                display: grid;
                grid-template-columns: 1fr 1fr 1.4fr;
                gap: 6px;
                flex-shrink: 0;
              }
              .btn-del-main, .btn-del-memo {
                background: #1e293b;
                color: #f8fafc;
                padding: 10px;
                border: 1px solid #334155;
                border-radius: 10px;
                font-size: 0.8rem;
                font-weight: bold;
                cursor: pointer;
              }
              .btn-save-idea {
                background: #10b981;
                color: #ffffff;
                padding: 10px;
                border: none;
                border-radius: 10px;
                font-size: 0.85rem;
                font-weight: bold;
                cursor: pointer;
              }

              /* 모달 공통 */
              .modal-overlay {
                display: none;
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: var(--bg);
                z-index: 100;
                flex-direction: column;
              }
              .modal-overlay.active { display: flex; }
              .modal-header {
                padding: 12px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: var(--card);
                border-bottom: 1px solid #1e293b;
              }
              .modal-body {
                flex: 1;
                overflow-y: auto;
                padding: 12px;
                display: flex;
                flex-direction: column;
                gap: 10px;
              }
              .ai-report-card {
                background: var(--card);
                border: 1px solid #334155;
                border-radius: 10px;
                padding: 12px;
                display: flex;
                flex-direction: column;
                gap: 6px;
              }
              .ai-stage-title { font-weight: bold; font-size: 0.9rem; color: var(--accent); }
            </style>
          </head>
          <body>

            <header>
              <h1>💡 생각서랍</h1>
              <button class="btn-archive" onclick="openArchive()">📂 생각보관함</button>
            </header>

            <!-- 완벽 정렬된 AI 발전 및 4단계 뷰 -->
            <div class="ai-stage-container">
              <div class="ai-action-bar">
                <button class="btn-ai-validate" onclick="runAiEvolution()">✨ AI 생각 발전 & 4단계 심층 검증하기</button>
              </div>
              <div class="stage-grid">
                <div id="stage-tab-1" class="stage-pill active">💡 1.발상</div>
                <div id="stage-tab-2" class="stage-pill">📐 2.구체화</div>
                <div id="stage-tab-3" class="stage-pill">🧪 3.검증</div>
                <div id="stage-tab-4" class="stage-pill">🚀 4.실행</div>
              </div>
            </div>

            <nav>
              <button class="tab-btn active" onclick="switchTab('voice')">✨ 음성</button>
              <button class="tab-btn" onclick="switchTab('photo')">📷 사진</button>
              <button class="tab-btn" onclick="switchTab('sketch')">🎨 스케치</button>
              <button class="tab-btn" onclick="switchTab('video')">🎬 동영상</button>
            </nav>

            <div class="container">
              <!-- 1. 음성 탭 -->
              <div id="tab-voice" class="tab-content active">
                <div class="memo-wrapper">
                  <textarea id="voice-input-text" class="text-area" placeholder="음성인식 결과가 여기에 작성됩니다..."></textarea>
                  <button id="mic-voice" class="gemini-mic-btn" onclick="triggerNativeVoice('voice-input-text', 'mic-voice')">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                  </button>
                </div>
                <div class="action-buttons" style="grid-template-columns: 1fr 2fr;">
                  <button class="btn-del-memo" onclick="clearSpecific('voice-input-text')">🗑️ 내용 지우기</button>
                  <button class="btn-save-idea" onclick="saveIdea('음성', document.getElementById('voice-input-text').value)">💾 서랍에 저장</button>
                </div>
              </div>

              <!-- 2. 사진 탭 (50:50) -->
              <div id="tab-photo" class="tab-content">
                <div class="split-view">
                  <div class="media-top-half" onclick="document.getElementById('photo-input').click()">
                    <input type="file" accept="image/*" capture="environment" id="photo-input" style="display:none;" onchange="previewMediaFile(this, 'photo-view', 'photo-prompt')" />
                    <p id="photo-prompt" style="color:var(--muted); font-size:0.85rem;">📷 터치하여 촬영 또는 사진 선택</p>
                    <img id="photo-view" style="max-width:100%; max-height:100%; border-radius:8px; display:none;" />
                  </div>
                  <div class="media-bottom-half">
                    <div class="memo-wrapper">
                      <textarea id="photo-memo" class="text-area" placeholder="사진에 대한 생각/메모를 적어주세요..."></textarea>
                      <button id="mic-photo" class="gemini-mic-btn" onclick="triggerNativeVoice('photo-memo', 'mic-photo')">
                        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                      </button>
                    </div>
                  </div>
                </div>
                <div class="action-buttons">
                  <button class="btn-del-main" onclick="clearMedia('photo-input', 'photo-view', 'photo-prompt')">📷 사진 삭제</button>
                  <button class="btn-del-memo" onclick="clearSpecific('photo-memo')">📝 메모 삭제</button>
                  <button class="btn-save-idea" onclick="saveMediaIdea('사진', 'photo-memo', 'photo-view')">💾 서랍에 저장</button>
                </div>
              </div>

              <!-- 3. 스케치 탭 (50:50) -->
              <div id="tab-sketch" class="tab-content">
                <div class="split-view">
                  <div class="media-top-half" style="border-style:solid; border-color:#1e293b;">
                    <div style="position:absolute; top:6px; right:6px; z-index:10; background:rgba(15,23,42,0.8); padding:3px 6px; border-radius:6px; display:flex; align-items:center; gap:4px;">
                      <span style="font-size:0.75rem; color:var(--muted);">펜:</span>
                      <input type="color" id="sketch-color" value="#000000" style="width:24px; height:24px; border:none; border-radius:4px; cursor:pointer;" />
                    </div>
                    <div class="canvas-box" id="canvas-wrapper">
                      <canvas id="sketch-board"></canvas>
                    </div>
                  </div>
                  <div class="media-bottom-half">
                    <div class="memo-wrapper">
                      <textarea id="sketch-memo" class="text-area" placeholder="스케치에 대한 생각/메모를 적어주세요..."></textarea>
                      <button id="mic-sketch" class="gemini-mic-btn" onclick="triggerNativeVoice('sketch-memo', 'mic-sketch')">
                        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                      </button>
                    </div>
                  </div>
                </div>
                <div class="action-buttons">
                  <button class="btn-del-main" onclick="clearCanvas()">🎨 그림 삭제</button>
                  <button class="btn-del-memo" onclick="clearSpecific('sketch-memo')">📝 메모 삭제</button>
                  <button class="btn-save-idea" onclick="saveIdea('스케치', document.getElementById('sketch-memo').value || '스케치 드로잉')">💾 서랍에 저장</button>
                </div>
              </div>

              <!-- 4. 동영상 탭 (50:50) -->
              <div id="tab-video" class="tab-content">
                <div class="split-view">
                  <div class="media-top-half" onclick="document.getElementById('video-input').click()">
                    <input type="file" accept="video/*" capture="environment" id="video-input" style="display:none;" onchange="previewMediaFile(this, 'video-view', 'video-prompt')" />
                    <p id="video-prompt" style="color:var(--muted); font-size:0.85rem;">🎬 터치하여 영상 촬영 또는 비디오 선택</p>
                    <video id="video-view" controls style="max-width:100%; max-height:100%; border-radius:8px; display:none;" />
                  </div>
                  <div class="media-bottom-half">
                    <div class="memo-wrapper">
                      <textarea id="video-memo" class="text-area" placeholder="영상에 대한 생각/메모를 적어주세요..."></textarea>
                      <button id="mic-video" class="gemini-mic-btn" onclick="triggerNativeVoice('video-memo', 'mic-video')">
                        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                      </button>
                    </div>
                  </div>
                </div>
                <div class="action-buttons">
                  <button class="btn-del-main" onclick="clearMedia('video-input', 'video-view', 'video-prompt')">🎬 영상 삭제</button>
                  <button class="btn-del-memo" onclick="clearSpecific('video-memo')">📝 메모 삭제</button>
                  <button class="btn-save-idea" onclick="saveMediaIdea('동영상', 'video-memo', 'video-view')">💾 서랍에 저장</button>
                </div>
              </div>
            </div>

            <!-- AI 발전 및 검증 모달 리포트 -->
            <div id="ai-modal" class="modal-overlay">
              <div class="modal-header">
                <h2 style="font-size:1.05rem; color:var(--accent);">✨ AI 4단계 심층 검증 리포트</h2>
                <button class="btn-archive" style="background:#ef4444; color:#fff;" onclick="document.getElementById('ai-modal').classList.remove('active')">닫기</button>
              </div>
              <div class="modal-body" id="ai-modal-content"></div>
            </div>

            <!-- 생각보관함 모달 -->
            <div id="archive-modal" class="modal-overlay">
              <div class="modal-header">
                <h2 style="font-size:1.05rem; color:var(--accent);">📂 저장된 생각서랍</h2>
                <button class="btn-archive" style="background:#ef4444; color:#fff;" onclick="document.getElementById('archive-modal').classList.remove('active')">닫기</button>
              </div>
              <div class="modal-body" id="archive-item-list"></div>
            </div>

            <script>
              let activeTargetInputId = 'voice-input-text';
              let activeMicButtonId = 'mic-voice';
              let editingIndex = -1;
              let currentAiReport = null;

              function switchTab(tabId) {
                const tabs = ['voice', 'photo', 'sketch', 'video'];
                document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                  btn.classList.toggle('active', tabs[idx] === tabId);
                });
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById('tab-' + tabId).classList.add('active');
                if (tabId === 'voice') activeTargetInputId = 'voice-input-text';
                else if (tabId === 'photo') activeTargetInputId = 'photo-memo';
                else if (tabId === 'sketch') { activeTargetInputId = 'sketch-memo'; setTimeout(initCanvas, 50); }
                else if (tabId === 'video') activeTargetInputId = 'video-memo';
              }

              function clearSpecific(id) { document.getElementById(id).value = ''; }
              function clearMedia(inputId, viewId, promptId) {
                document.getElementById(inputId).value = '';
                const v = document.getElementById(viewId);
                v.src = '';
                v.style.display = 'none';
                document.getElementById(promptId).style.display = 'block';
              }
              function previewMediaFile(input, viewId, promptId) {
                const file = input.files[0];
                if (file) {
                  const el = document.getElementById(viewId);
                  el.src = URL.createObjectURL(file);
                  el.style.display = 'block';
                  document.getElementById(promptId).style.display = 'none';
                }
              }

              /* 음성 인식 */
              function triggerNativeVoice(targetId, micBtnId) {
                activeTargetInputId = targetId;
                activeMicButtonId = micBtnId;
                const btn = document.getElementById(micBtnId);
                if (btn) btn.classList.add('listening');

                if (window.AndroidBridge && window.AndroidBridge.startSpeechRecognition) {
                  window.AndroidBridge.startSpeechRecognition();
                } else {
                  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                  if (!Speech) {
                    alert('음성인식 기능을 지원하지 않는 기기입니다.');
                    if (btn) btn.classList.remove('listening');
                    return;
                  }
                  const rec = new Speech();
                  rec.lang = 'ko-KR';
                  rec.onresult = (e) => appendVoiceText(e.results[0][0].transcript);
                  rec.onend = () => { if (btn) btn.classList.remove('listening'); };
                  rec.start();
                }
              }

              function appendVoiceText(newText) {
                const area = document.getElementById(activeTargetInputId);
                if (!area) return;
                const prev = area.value.trim();
                area.value = prev ? prev + ' ' + newText : newText;
              }

              window.receiveVoiceResult = function(text) {
                const btn = document.getElementById(activeMicButtonId);
                if (btn) btn.classList.remove('listening');
                if (text && text.trim()) appendVoiceText(text);
              };

              /* 플로팅 데이터 수신 */
              setInterval(() => {
                if (window.AndroidBridge && window.AndroidBridge.getPendingVoiceText) {
                  const text = window.AndroidBridge.getPendingVoiceText();
                  if (text && text.trim().length > 0) {
                    switchTab('voice');
                    appendVoiceText(text);
                  }
                }
              }, 400);

              /* 캔버스 고정 */
              const canvas = document.getElementById('sketch-board');
              const ctx = canvas.getContext('2d');
              let isDrawing = false;
              let isCanvasSet = false;

              function initCanvas() {
                if (isCanvasSet) return;
                const holder = document.getElementById('canvas-wrapper');
                if (holder.clientWidth > 0 && holder.clientHeight > 0) {
                  canvas.width = holder.clientWidth;
                  canvas.height = holder.clientHeight;
                  ctx.lineWidth = 4;
                  ctx.lineCap = 'round';
                  ctx.strokeStyle = document.getElementById('sketch-color').value;
                  isCanvasSet = true;
                }
              }
              function getPos(e) {
                const r = canvas.getBoundingClientRect();
                const t = e.touches ? e.touches[0] : e;
                return { x: t.clientX - r.left, y: t.clientY - r.top };
              }
              canvas.addEventListener('mousedown', (e) => { isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
              canvas.addEventListener('mousemove', (e) => { if (!isDrawing) return; ctx.strokeStyle = document.getElementById('sketch-color').value; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
              canvas.addEventListener('mouseup', () => { isDrawing = false; });
              canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }, { passive: false });
              canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (!isDrawing) return; ctx.strokeStyle = document.getElementById('sketch-color').value; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }, { passive: false });
              canvas.addEventListener('touchend', () => { isDrawing = false; });
              function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

              /* 보관함 */
              function getStorage() {
                const saved = localStorage.getItem('idea_drawer_storage') || '[]';
                try { return JSON.parse(saved); } catch(e) { return []; }
              }
              function setStorage(arr) { localStorage.setItem('idea_drawer_storage', JSON.stringify(arr)); }

              function saveIdea(type, content, customReport) {
                if (!content || content.trim() === '') {
                  alert('저장할 내용이 없습니다.');
                  return;
                }
                const list = getStorage();
                const reportToSave = customReport || currentAiReport || generateAiReport(content);

                if (editingIndex >= 0) {
                  list[editingIndex].content = content;
                  list[editingIndex].aiReport = reportToSave;
                  list[editingIndex].time = new Date().toLocaleTimeString('ko-KR') + ' (수정됨)';
                  editingIndex = -1;
                  alert('성공적으로 수정 및 검증되었습니다.');
                } else {
                  list.unshift({
                    type,
                    content,
                    aiReport: reportToSave,
                    time: new Date().toLocaleTimeString('ko-KR')
                  });
                  alert(`[${type}] 생각이 AI 4단계와 함께 서랍에 보관되었습니다.`);
                }
                currentAiReport = null;
                setStorage(list);
              }

              function saveMediaIdea(type, memoId, viewId) {
                const memo = document.getElementById(memoId).value.trim();
                const view = document.getElementById(viewId);
                if (!memo && (!view.src || view.style.display === 'none')) {
                  alert('촬영된 미디어나 메모를 입력해 주세요.');
                  return;
                }
                saveIdea(type, memo || `[${type} 파일 저장됨]`);
              }

              /* AI 4단계 심층 분석 엔진 */
              function runAiEvolution() {
                const text = document.getElementById(activeTargetInputId).value.trim();
                if (!text) {
                  alert('먼저 발전/검증할 아이디어를 작성하거나 녹음해 주세요.');
                  return;
                }

                currentAiReport = generateAiReport(text);
                const modal = document.getElementById('ai-modal');
                const content = document.getElementById('ai-modal-content');

                content.innerHTML = `
                  <div class="ai-report-card">
                    <div class="ai-stage-title">💡 1. 발상 (핵심 정의)</div>
                    <p style="font-size:0.9rem; color:#f8fafc;">${currentAiReport.stage1}</p>
                  </div>
                  <div class="ai-report-card">
                    <div class="ai-stage-title">📐 2. 구체화 (시스템 및 타깃 설계)</div>
                    <p style="font-size:0.9rem; color:#f8fafc;">${currentAiReport.stage2}</p>
                  </div>
                  <div class="ai-report-card">
                    <div class="ai-stage-title">🧪 3. 검증 (실현성 및 시장 리스크)</div>
                    <p style="font-size:0.9rem; color:#f8fafc;">${currentAiReport.stage3}</p>
                  </div>
                  <div class="ai-report-card">
                    <div class="ai-stage-title">🚀 4. 실행 (즉시 액션 플랜)</div>
                    <p style="font-size:0.9rem; color:#f8fafc;">${currentAiReport.stage4}</p>
                  </div>
                  <button class="btn-save-idea" style="width:100%; margin-top:8px; padding:12px;" onclick="saveIdeaFromModal()">💾 검증된 4단계 생각 서랍에 저장</button>
                `;
                modal.classList.add('active');
              }

              function saveIdeaFromModal() {
                const text = document.getElementById(activeTargetInputId).value.trim();
                saveIdea('음성', text, currentAiReport);
                document.getElementById('ai-modal').classList.remove('active');
              }

              function generateAiReport(text) {
                return {
                  stage1: `[발상] "${text}"의 핵심 콘셉트입니다. 사용자의 직관적인 문제 해결과 편의성을 극대화합니다.`,
                  stage2: `[구체화] 타깃 사용자 및 워크플로우 설계: 실시간 자동화 로직 탑재 및 불필요한 단계를 제거한 원터치 구조 적용.`,
                  stage3: `[검증] 실현 가능성: 높음. 기술적 완성도와 차별화 포인트를 확보하여 실사용 만족도 우수 예상.`,
                  stage4: `[실행 로드맵] 1) 핵심 플로우 테스트 ➔ 2) 현장 피드백 반영 ➔ 3) 기능 완성 및 안정적 배포.`
                };
              }

              function openArchive() {
                document.getElementById('archive-modal').classList.add('active');
                renderArchive();
              }

              function renderArchive() {
                const list = getStorage();
                const container = document.getElementById('archive-item-list');
                if (list.length === 0) {
                  container.innerHTML = '<p style="color:var(--muted); text-align:center; margin-top:40px;">저장된 생각이 없습니다.</p>';
                  return;
                }
                container.innerHTML = list.map((item, idx) => `
                  <div class="ai-report-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <strong style="color:var(--accent);">[${item.type}]</strong>
                      <span style="font-size:0.75rem; color:#64748b;">${item.time}</span>
                    </div>
                    <p style="font-size:0.95rem; margin:6px 0; white-space:pre-wrap;">${item.content}</p>
                    <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:4px;">
                      <button style="background:linear-gradient(135deg,#4f46e5,#06b6d4); color:#fff; border:none; padding:4px 10px; border-radius:6px; font-size:0.75rem; cursor:pointer;" onclick="viewAiReport(${idx})">✨ AI 리포트</button>
                      <button style="background:#2563eb; color:#fff; border:none; padding:4px 10px; border-radius:6px; font-size:0.75rem; cursor:pointer;" onclick="editIdea(${idx})">✏️ 수정</button>
                      <button style="background:#ef4444; color:#fff; border:none; padding:4px 10px; border-radius:6px; font-size:0.75rem; cursor:pointer;" onclick="deleteIdea(${idx})">🗑️ 삭제</button>
                    </div>
                  </div>
                `).join('');
              }

              function viewAiReport(idx) {
                const item = getStorage()[idx];
                const report = item.aiReport || generateAiReport(item.content);
                const modal = document.getElementById('ai-modal');
                const content = document.getElementById('ai-modal-content');

                content.innerHTML = `
                  <div class="ai-report-card">
                    <div class="ai-stage-title">💡 1. 발상 (핵심 정의)</div>
                    <p style="font-size:0.9rem; color:#f8fafc;">${report.stage1}</p>
                  </div>
                  <div class="ai-report-card">
                    <div class="ai-stage-title">📐 2. 구체화 (시스템 및 타깃 설계)</div>
                    <p style="font-size:0.9rem; color:#f8fafc;">${report.stage2}</p>
                  </div>
                  <div class="ai-report-card">
                    <div class="ai-stage-title">🧪 3. 검증 (실현성 및 시장 리스크)</div>
                    <p style="font-size:0.9rem; color:#f8fafc;">${report.stage3}</p>
                  </div>
                  <div class="ai-report-card">
                    <div class="ai-stage-title">🚀 4. 실행 (즉시 액션 플랜)</div>
                    <p style="font-size:0.9rem; color:#f8fafc;">${report.stage4}</p>
                  </div>
                `;
                modal.classList.add('active');
              }

              function editIdea(idx) {
                const list = getStorage();
                const item = list[idx];
                editingIndex = idx;
                document.getElementById('archive-modal').classList.remove('active');
                if (item.type === '음성') { switchTab('voice'); document.getElementById('voice-input-text').value = item.content; }
                else if (item.type === '사진') { switchTab('photo'); document.getElementById('photo-memo').value = item.content; }
                else if (item.type === '스케치') { switchTab('sketch'); document.getElementById('sketch-memo').value = item.content; }
                else if (item.type === '동영상') { switchTab('video'); document.getElementById('video-memo').value = item.content; }
              }

              function deleteIdea(idx) {
                if (confirm('이 생각을 서랍에서 삭제하시겠습니까?')) {
                  const list = getStorage();
                  list.splice(idx, 1);
                  setStorage(list);
                  renderArchive();
                }
              }
            </script>
          </body>
          </html>
          EOF

      - name: 5. 영구 서명키 및 네이티브 플로팅 빌드 시스템 주입
        run: |
          cat << 'EOF' > package.json
          {
            "name": "my-idea-drawer",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.k2hkkh.ideadrawer",
            "appName": "생각서랍",
            "webDir": "www"
          }
          EOF

          npm install
