            <div id="manual-modal" class="modal-full">
              <div class="modal-top">
                <span style="font-weight:bold; font-size:1.05rem;">💡 생각서랍 가이드</span>
                <button class="card-btn" style="background:var(--danger); border:none; color:#fff; padding:6px 12px; border-radius:8px;" onclick="closeManualModal()">닫기</button>
              </div>
              <div class="modal-body">
                <div class="thought-card">
                  <div style="font-weight:bold; color:var(--accent);">1. 생각서랍 ➔ 나의계획 즉시 연동</div>
                  <div style="font-size:0.85rem; color:#ccc; line-height:1.5;">
                    생각서랍 카드 하단의 가로 스크롤 바에서 `[⚡집중] [오전] [오후] [저녁] [심야] [대기]`를 누르면 계획표로 옮겨지며 서랍에서 자동 정리됩니다.
                  </div>
                </div>
                <div class="thought-card">
                  <div style="font-weight:bold; color:var(--accent);">2. 나의계획 시간대 자유 이동</div>
                  <div style="font-size:0.85rem; color:#ccc; line-height:1.5;">
                    나의계획 카드 하단의 시간대 칩을 누르면 다른 시간대로 언제든 자유롭게 재배치됩니다.
                  </div>
                </div>
              </div>
            </div>

            <script>
              let currentMainMode = 'idea';
              let currentCategory = '첫 생각';
              let currentAttachments = [];
              let currentPlanSubtab = 'focus';

              let activeTargetContext = 'main';
              let activeVoiceTarget = 'main';
              let isListeningContinuous = false;

              let cursorPositions = {
                'prompt-input': { start: 0, end: 0 },
                'memopad-text-input': { start: 0, end: 0 }
              };

              function trackCursor(el) {
                if (el && typeof el.selectionStart === 'number') {
                  cursorPositions[el.id] = { start: el.selectionStart, end: el.selectionEnd };
                }
              }

              document.addEventListener('selectionchange', () => {
                const el = document.activeElement;
                if (el && el.id && cursorPositions.hasOwnProperty(el.id)) {
                  trackCursor(el);
                }
              });

              let lastProcessedVoice = '';
              let lastProcessedTime = 0;

              /* 쪽잠 타이머 */
              let napTimerInterval = null;
              let napEndTime = null;

              function startNapTimer(mins) {
                stopNapTimer();
                napEndTime = Date.now() + mins * 60 * 1000;
                document.getElementById('nap-stop-btn').style.display = 'block';
                updateNapTimerDisplay();
                napTimerInterval = setInterval(checkNapTimer, 1000);
              }

              function stopNapTimer() {
                if (napTimerInterval) clearInterval(napTimerInterval);
                napTimerInterval = null;
                napEndTime = null;
                document.getElementById('nap-time-display').innerText = '대기';
                document.getElementById('nap-stop-btn').style.display = 'none';
              }

              function checkNapTimer() {
                if (!napEndTime) return;
                const remaining = napEndTime - Date.now();
                if (remaining <= 0) {
                  stopNapTimer();
                  triggerNapAlarm();
                } else {
                  updateNapTimerDisplay(remaining);
                }
              }

              function updateNapTimerDisplay(remaining) {
                if (!remaining) return;
                const totalSec = Math.floor(remaining / 1000);
                const m = Math.floor(totalSec / 60);
                const s = totalSec % 60;
                document.getElementById('nap-time-display').innerText = 
                  `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
              }

              function triggerNapAlarm() {
                try {
                  if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 600]);
                  const ctx = new (window.AudioContext || window.webkitAudioContext)();
                  const osc = ctx.createOscillator();
                  osc.type = 'sine';
                  osc.frequency.setValueAtTime(880, ctx.currentTime);
                  osc.connect(ctx.destination);
                  osc.start();
                  osc.stop(ctx.currentTime + 1.2);
                } catch(e) {}
                alert('⏰ 쪽잠 시간이 종료되었습니다. 일과를 재개합니다.');
              }

              function switchMainMode(mode) {
                currentMainMode = mode;
                document.getElementById('tab-btn-idea').classList.toggle('active', mode === 'idea');
                document.getElementById('tab-btn-plan').classList.toggle('active', mode === 'plan');
                document.getElementById('tab-btn-pad').classList.remove('active');

                const ideaCategoryBar = document.getElementById('idea-category-bar');
                const ideaFeed = document.getElementById('idea-feed-container');
                const planFeed = document.getElementById('plan-feed-container');
                const plusBtn = document.getElementById('btn-plus');
                const input = document.getElementById('prompt-input');

                if (mode === 'idea') {
                  ideaCategoryBar.style.display = 'flex';
                  ideaFeed.style.display = 'flex';
                  planFeed.style.display = 'none';
                  plusBtn.style.display = 'flex';
                  input.placeholder = '생각을 입력하거나 사진·영상을 덧붙이세요...';
                  renderFeed();
                } else if (mode === 'plan') {
                  ideaCategoryBar.style.display = 'none';
                  ideaFeed.style.display = 'none';
                  planFeed.style.display = 'flex';
                  plusBtn.style.display = 'none';
                  input.placeholder = '새로운 계획/일과를 입력하세요...';
                  renderPlanView();
                }
              }

              function resetToIdeaDrawer() {
                switchMainMode('idea');
                selectCategory('첫 생각');
              }

              function selectCategory(cat) {
                currentCategory = cat;
                document.querySelectorAll('.category-pill').forEach(p => {
                  p.classList.toggle('active', p.innerText.includes(cat));
                });
                renderFeed();
              }

              function togglePlusMenu() {
                const menu = document.getElementById('plus-menu');
                const btn = document.getElementById('btn-plus');
                menu.classList.toggle('active');
                btn.classList.toggle('open');
              }
              function closePlusMenu() {
                document.getElementById('plus-menu').classList.remove('active');
                document.getElementById('btn-plus').classList.remove('open');
              }

              function triggerCamera(context = 'main') {
                activeTargetContext = context;
                closePlusMenu();
                document.getElementById('camera-file').click();
              }
              function triggerGallery(context = 'main') {
                activeTargetContext = context;
                closePlusMenu();
                document.getElementById('gallery-file').click();
              }
              function triggerVideo(context = 'main') {
                activeTargetContext = context;
                closePlusMenu();
                document.getElementById('video-file').click();
              }

              function compressImage(file, maxWidth = 800, quality = 0.65) {
                return new Promise((resolve) => {
                  const reader = new FileReader();
                  reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                      const canvas = document.createElement('canvas');
                      let w = img.width, h = img.height;
                      if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
                      canvas.width = w; canvas.height = h;
                      const ctx = canvas.getContext('2d');
                      ctx.drawImage(img, 0, 0, w, h);
                      resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                  };
                  reader.readAsDataURL(file);
                });
              }

              function captureVideoThumbnail(file) {
                return new Promise((resolve) => {
                  const url = URL.createObjectURL(file);
                  const video = document.createElement('video');
                  video.src = url; video.muted = true; video.playsInline = true; video.currentTime = 0.5;
                  video.onloadeddata = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 400;
                    canvas.height = Math.round((video.videoHeight * 400) / video.videoWidth) || 240;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                  };
                  video.onerror = () => { URL.revokeObjectURL(url); resolve(''); };
                });
              }

              async function processMediaFiles(input, type) {
                const files = input.files;
                if (files && files.length > 0) {
                  for (let file of Array.from(files)) {
                    const compressedData = await compressImage(file);
                    currentAttachments.push({ type: type, data: compressedData, isVideo: false });
                  }
                  renderAttachmentTray();
                  updateSendButtonState();
                  input.value = '';
                }
              }

              async function processVideoFile(input) {
                const file = input.files[0];
                if (file) {
                  const thumb = await captureVideoThumbnail(file);
                  currentAttachments.push({ type: '동영상', data: thumb || '', isVideo: true });
                  renderAttachmentTray();
                  updateSendButtonState();
                  input.value = '';
                }
              }

              function renderAttachmentTray() {
                const tray = document.getElementById('attachment-tray');
                if (currentAttachments.length === 0) { tray.classList.remove('active'); tray.innerHTML = ''; return; }
                tray.classList.add('active');
                tray.innerHTML = currentAttachments.map((item, idx) => `
                  <div class="tray-item">
                    <img src="${item.data}" class="tray-thumb" />
                    <button class="tray-remove-btn" onclick="removeAttachment(${idx})">✕</button>
                  </div>
                `).join('');
              }

              function removeAttachment(idx) {
                currentAttachments.splice(idx, 1);
                renderAttachmentTray();
                updateSendButtonState();
              }

              function handleInputChange(textarea) {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 90) + 'px';
                updateSendButtonState();
              }

              function updateSendButtonState() {
                const text = document.getElementById('prompt-input').value.trim();
                const hasAttachments = currentAttachments.length > 0;
                const waveBtn = document.getElementById('btn-wave');
                if (text || hasAttachments) {
                  waveBtn.innerHTML = '↑';
                } else {
                  waveBtn.innerHTML = '<div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>';
                }
              }

              function handleSendAction() {
                const input = document.getElementById('prompt-input');
                const text = input.value.trim();
                const hasAttachments = currentAttachments.length > 0;
                
                if (text || hasAttachments) {
                  if (isListeningContinuous) stopContinuousVoice();

                  if (currentMainMode === 'idea') {
                    let category = '노트';
                    if (hasAttachments) {
                      const hasVideo = currentAttachments.some(a => a.type === '동영상');
                      const hasPhoto = currentAttachments.some(a => a.type === '사진');
                      if (hasVideo) category = '동영상';
                      else if (hasPhoto) category = '사진';
                    }
                    saveThought(category, text, [...currentAttachments]);
                    selectCategory('첫 생각');
                  } else {
                    savePlanCurrentSlot(text);
                    renderPlanView();
                  }

                  input.value = '';
                  input.style.height = 'auto';
                  currentAttachments = [];
                  cursorPositions['prompt-input'] = { start: 0, end: 0 };
                  renderAttachmentTray();
                  updateSendButtonState();
                } else {
                  toggleContinuousVoice('main');
                }
              }

              /* 음성 제어: 네이티브 브릿지 + 비프음 음소거 결합 */
              function toggleContinuousVoice(target) {
                activeVoiceTarget = target;
                closePlusMenu();

                let targetId = (target === 'pad') ? 'memopad-text-input' : 'prompt-input';
                const el = document.getElementById(targetId);
                if (el && typeof el.selectionStart === 'number') {
                  trackCursor(el);
                }

                if (isListeningContinuous) {
                  stopContinuousVoice();
                } else {
                  startContinuousVoice();
                }
              }

              function startContinuousVoice() {
                isListeningContinuous = true;
                updateVoiceButtonUI(true);

                if (window.AndroidBridge && window.AndroidBridge.startContinuousSpeech) {
                  window.AndroidBridge.startContinuousSpeech();
                } else {
                  // 브라우저 테스트 환경용 대체
                  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                  if (Speech) {
                    try {
                      window.tempWebRec = new Speech();
                      window.tempWebRec.lang = 'ko-KR';
                      window.tempWebRec.continuous = true;
                      window.tempWebRec.onresult = (e) => {
                        appendVoiceResult(e.results[e.results.length - 1][0].transcript);
                      };
                      window.tempWebRec.start();
                    } catch(e) {}
                  }
                }
              }

              function stopContinuousVoice() {
                isListeningContinuous = false;
                updateVoiceButtonUI(false);
                if (window.AndroidBridge && window.AndroidBridge.stopContinuousSpeech) {
                  window.AndroidBridge.stopContinuousSpeech();
                }
                if (window.tempWebRec) {
                  try { window.tempWebRec.stop(); } catch(e) {}
                }
              }

              function updateVoiceButtonUI(listening) {
                const btnWave = document.getElementById('btn-wave');
                const btnMicMain = document.getElementById('btn-mic-main');
                const btnMicPad = document.getElementById('memopad-mic-btn');

                [btnWave, btnMicMain].forEach(btn => {
                  if (btn) btn.classList.toggle('listening', listening);
                });
                if (btnMicPad) btnMicPad.classList.toggle('listening', listening);
              }

              /* 띄어쓰기 2중 공백 강제 정규화 */
              function appendVoiceResult(text) {
                if (!text || !text.trim()) return;
                const clean = text.trim().replace(/\s+/g, ' ');
                const now = Date.now();

                if (clean === lastProcessedVoice && (now - lastProcessedTime < 350)) return;
                lastProcessedVoice = clean;
                lastProcessedTime = now;

                let targetId = (activeVoiceTarget === 'pad') ? 'memopad-text-input' : 'prompt-input';
                const el = document.getElementById(targetId);
                if (!el) return;

                let start = el.selectionStart;
                let end = el.selectionEnd;

                if (typeof start !== 'number' || document.activeElement !== el) {
                  const saved = cursorPositions[targetId];
                  if (saved && typeof saved.start === 'number') {
                    start = saved.start;
                    end = saved.end;
                  } else {
                    start = el.value.length;
                    end = el.value.length;
                  }
                }

                if (start < 0 || start > el.value.length) start = el.value.length;
                if (end < start || end > el.value.length) end = start;

                const val = el.value;
                const before = val.substring(0, start);
                const after = val.substring(end);

                const needLeadSpace = before.length > 0 && !/\s$/.test(before);
                const needTrailSpace = after.length > 0 && !/^\s/.test(after);

                const rawCombined = before + (needLeadSpace ? ' ' : '') + clean + (needTrailSpace ? ' ' : '') + after;
                el.value = rawCombined.replace(/\s{2,}/g, ' ');

                const nextPos = Math.min(el.value.length, start + (needLeadSpace ? 1 : 0) + clean.length);
                cursorPositions[targetId] = { start: nextPos, end: nextPos };

                try { el.setSelectionRange(nextPos, nextPos); } catch (e) {}

                if (targetId === 'prompt-input') handleInputChange(el);
                if (targetId === 'memopad-text-input') handlePadTextInput(el.value);
              }

              window.receiveVoiceResult = function(text) {
                if (text && text.trim()) appendVoiceResult(text);
              };

              window.onSpeechEndedNative = function() {
                if (!isListeningContinuous) updateVoiceButtonUI(false);
              };

              function pollFloatingVoiceText() {
                if (window.AndroidBridge && window.AndroidBridge.getPendingVoiceText) {
                  try {
                    const text = window.AndroidBridge.getPendingVoiceText();
                    if (text && text.trim().length > 0) {
                      switchMainMode('idea');
                      selectCategory('첫 생각');
                      activeVoiceTarget = 'main';
                      appendVoiceResult(text);
                    }
                  } catch (e) {}
                }
              }
              setInterval(pollFloatingVoiceText, 300);
              window.addEventListener('DOMContentLoaded', pollFloatingVoiceText);

              function getThoughtStorage() {
                const data = localStorage.getItem('idea_drawer_storage') || '[]';
                try { return JSON.parse(data); } catch (e) { return []; }
              }
              function setThoughtStorage(arr) {
                try { localStorage.setItem('idea_drawer_storage', JSON.stringify(arr)); } catch (e) {}
                renderFeed();
              }
              function saveThought(category, content, mediaList) {
                const list = getThoughtStorage();
                list.unshift({
                  id: Date.now(),
                  category: category,
                  content: content || '',
                  mediaList: mediaList || [],
                  time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
                });
                setThoughtStorage(list);
              }

              function getPlanStorage() {
                const data = localStorage.getItem('plan_drawer_storage') || '[]';
                try { return JSON.parse(data); } catch (e) { return []; }
              }
              function setPlanStorage(arr) {
                try { localStorage.setItem('plan_drawer_storage', JSON.stringify(arr)); } catch (e) {}
                renderPlanView();
              }

              function getAutoTimeSlot() {
                const hour = new Date().getHours();
                if (hour >= 6 && hour < 12) return 'morning';
                if (hour >= 12 && hour < 18) return 'afternoon';
                if (hour >= 18 && hour < 24) return 'evening';
                return 'night';
              }

              function savePlanCurrentSlot(title) {
                if (!title || !title.trim()) return;
                const list = getPlanStorage();
                const slot = (currentPlanSubtab === 'focus') ? getAutoTimeSlot() : ((currentPlanSubtab === 'backlog') ? 'none' : currentPlanSubtab);
                const isFocus = (currentPlanSubtab === 'focus');

                list.unshift({
                  id: Date.now(),
                  title: title.trim(),
                  status: '대기',
                  timeSlot: slot,
                  isFocus: isFocus,
                  notes: [],
                  updatedAt: new Date().toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })
                });
                setPlanStorage(list);
              }

              /* 생각서랍 ➔ 나의계획 이동 (서랍에서 즉시 삭제) */
              function transferThoughtToPlan(id, targetSlot) {
                const thoughts = getThoughtStorage();
                const item = thoughts.find(t => t.id === id);
                if (!item) return;

                const title = item.content ? item.content.trim() : `[${item.category || '노트'}] 메모`;
                const plans = getPlanStorage();

                const isFocus = (targetSlot === 'focus');
                const slot = isFocus ? getAutoTimeSlot() : (targetSlot === 'backlog' ? 'none' : targetSlot);

                plans.unshift({
                  id: Date.now(),
                  title: title,
                  status: '대기',
                  timeSlot: slot,
                  isFocus: isFocus,
                  notes: [],
                  mediaList: item.mediaList || [],
                  updatedAt: new Date().toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })
                });
                setPlanStorage(plans);

                // 원본 생각서랍에서 완전 삭제
                const remainingThoughts = thoughts.filter(t => t.id !== id);
                setThoughtStorage(remainingThoughts);

                const slotLabels = {
                  focus: '⚡ 집중',
                  morning: '🌅 오전',
                  afternoon: '☀️ 오후',
                  evening: '🌙 저녁',
                  night: '⏱️ 심야',
                  backlog: '🔄 대기'
                };
                alert(`📋 [${slotLabels[targetSlot]}] 일과로 이동되었습니다!`);
              }

              /* 카드 본문 클립보드 복사 */
              function copyCardContent(text) {
                if (!text || !text.trim()) {
                  alert('복사할 텍스트가 없습니다.');
                  return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(text).then(() => {
                    alert('📋 내용이 클립보드에 복사되었습니다.');
                  }).catch(() => {
                    fallbackCopy(text);
                  });
                } else {
                  fallbackCopy(text);
                }
              }

              function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('📋 내용이 복사되었습니다.');
              }

              /* 생각서랍 피드 렌더링 (가로 1열 스크롤 8버튼 칩 바 탑재) */
              function renderFeed() {
                const list = getThoughtStorage();
                const feed = document.getElementById('idea-feed-container');

                if (currentCategory === '첫 생각') {
                  feed.innerHTML = `
                    <div class="empty-canvas">
                      떠오르는 생각을 자유롭게 기록하세요.<br>
                      저장 즉시 서랍으로 들어가 깨끗한 화면이 유지됩니다.
                    </div>
                  `;
                  return;
                }

                const filtered = (currentCategory === '전체') 
                  ? list 
                  : list.filter(i => (i.category || i.type || '').includes(currentCategory));

                if (filtered.length === 0) {
                  feed.innerHTML = `
                    <div class="empty-canvas">
                      저장된 [${currentCategory}] 생각이 없습니다.<br><br>
                      ${currentCategory === '사진' ? '<button class="card-btn" style="background:#2563eb; color:#fff; padding:8px 16px; border-radius:8px; border:none;" onclick="triggerCamera(\'main\')">📷 새 사진 촬영하기</button>' : ''}
                      ${currentCategory === '동영상' ? '<button class="card-btn" style="background:#2563eb; color:#fff; padding:8px 16px; border-radius:8px; border:none;" onclick="triggerVideo(\'main\')">🎬 새 동영상 촬영하기</button>' : ''}
                    </div>
                  `;
                  return;
                }

                feed.innerHTML = filtered.map(item => {
                  const safeContent = (item.content || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                  return `
                    <div class="thought-card">
                      <div class="card-header">
                        <span class="card-badge">${item.category || item.type || '노트'}</span>
                        <span class="card-time">${item.time}</span>
                      </div>
                      ${item.mediaList && item.mediaList.length > 0 ? `
                        <div>
                          ${item.mediaList.map(m => `
                            <img src="${m.data}" style="width:100%; max-height:240px; object-fit:contain; border-radius:8px; border:1px solid var(--border); background:#000; display:block;" />
                          `).join('')}
                        </div>
                      ` : ''}
                      ${item.content ? `<div class="card-content">${item.content}</div>` : ''}
                      
                      <!-- 가로 1열 스크롤 칩 바 (8개 버튼) -->
                      <div class="thought-slot-scroll">
                        <button class="thought-slot-chip focus" onclick="transferThoughtToPlan(${item.id}, 'focus')">⚡ 집중</button>
                        <button class="thought-slot-chip" onclick="transferThoughtToPlan(${item.id}, 'morning')">🌅 오전</button>
                        <button class="thought-slot-chip" onclick="transferThoughtToPlan(${item.id}, 'afternoon')">☀️ 오후</button>
                        <button class="thought-slot-chip" onclick="transferThoughtToPlan(${item.id}, 'evening')">🌙 저녁</button>
                        <button class="thought-slot-chip" onclick="transferThoughtToPlan(${item.id}, 'night')">⏱️ 심야</button>
                        <button class="thought-slot-chip" onclick="transferThoughtToPlan(${item.id}, 'backlog')">🔄 대기</button>
                        <button class="thought-slot-chip copy" onclick="copyCardContent('${safeContent}')">📋 복사</button>
                        <button class="thought-slot-chip delete" onclick="deleteThought(${item.id})">🗑️ 삭제</button>
                      </div>
                    </div>
                  `;
                }).join('');
              }

              function deleteThought(id) {
                if (confirm('이 생각을 삭제하시겠습니까?')) {
                  const list = getThoughtStorage().filter(i => i.id !== id);
                  setThoughtStorage(list);
                }
              }

              /* 나의계획 탭 전환 및 대형 카드 렌더링 (집중/시간대 상호 배타적 분리) */
              function switchPlanSubtab(tab) {
                currentPlanSubtab = tab;
                document.querySelectorAll('.plan-time-tab').forEach(b => b.classList.remove('active'));
                const curBtn = document.getElementById(`ptab-${tab}`);
                if (curBtn) curBtn.classList.add('active');
                renderPlanView();
              }

              function renderPlanView() {
                const list = getPlanStorage();
                const container = document.getElementById('plan-card-list');

                let filtered = [];
                if (currentPlanSubtab === 'focus') {
                  // 집중 탭: isFocus가 true인 것만
                  filtered = list.filter(p => p.isFocus);
                } else if (currentPlanSubtab === 'backlog') {
                  // 대기 탭: isFocus가 아니고 시간대 미지정/대기인 것
                  filtered = list.filter(p => !p.isFocus && (!p.timeSlot || p.timeSlot === 'none' || p.timeSlot === 'backlog'));
                } else {
                  // 일반 시간대 탭: isFocus가 아니며 해당 시간대인 것만 (오후에 집중 항목 중복 노출 차단)
                  filtered = list.filter(p => !p.isFocus && p.timeSlot === currentPlanSubtab);
                }

                if (filtered.length === 0) {
                  container.innerHTML = '<div class="empty-canvas" style="padding:40px 0;">해당 탭에 등록된 일과가 없습니다.</div>';
                  return;
                }

                container.innerHTML = filtered.map(p => {
                  const isDone = p.status === '완료';
                  const statusClass = (p.status === '진행중') ? 'progress' : (isDone ? 'done' : 'waiting');
                  const safeTitle = (p.title || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

                  return `
                    <div class="plan-big-card ${isDone ? 'completed' : ''}">
                      <div class="plan-big-card-top">
                        <span class="status-badge-lg ${statusClass}" onclick="cyclePlanStatus(${p.id})">${p.status}</span>
                        <div class="plan-big-title ${isDone ? 'completed' : ''}">${p.title}</div>
                      </div>

                      ${p.mediaList && p.mediaList.length > 0 ? `
                        <div>
                          ${p.mediaList.map(m => `
                            <img src="${m.data}" style="width:100%; max-height:180px; object-fit:contain; border-radius:8px; border:1px solid var(--border); background:#000; display:block;" />
                          `).join('')}
                        </div>
                      ` : ''}

                      <!-- 나의계획 하단 가로 스크롤 이동 및 관리 바 -->
                      <div class="plan-relocate-scroll">
                        <button class="relocate-chip focus ${p.isFocus ? 'active' : ''}" onclick="reassignPlanSlot(${p.id}, 'focus')">⚡집중</button>
                        <button class="relocate-chip ${p.timeSlot === 'morning' && !p.isFocus ? 'active' : ''}" onclick="reassignPlanSlot(${p.id}, 'morning')">오전</button>
                        <button class="relocate-chip ${p.timeSlot === 'afternoon' && !p.isFocus ? 'active' : ''}" onclick="reassignPlanSlot(${p.id}, 'afternoon')">오후</button>
                        <button class="relocate-chip ${p.timeSlot === 'evening' && !p.isFocus ? 'active' : ''}" onclick="reassignPlanSlot(${p.id}, 'evening')">저녁</button>
                        <button class="relocate-chip ${p.timeSlot === 'night' && !p.isFocus ? 'active' : ''}" onclick="reassignPlanSlot(${p.id}, 'night')">심야</button>
                        <button class="relocate-chip ${p.timeSlot === 'none' && !p.isFocus ? 'active' : ''}" onclick="reassignPlanSlot(${p.id}, 'none')">대기</button>
                        <button class="relocate-chip copy" onclick="copyCardContent('${safeTitle}')">📋 복사</button>
                        <button class="relocate-chip delete" onclick="deletePlan(${p.id})">🗑️ 삭제</button>
                      </div>
                    </div>
                  `;
                }).join('');
              }

              function cyclePlanStatus(id) {
                const list = getPlanStorage();
                const item = list.find(p => p.id === id);
                if (item) {
                  if (item.status === '대기') item.status = '진행중';
                  else if (item.status === '진행중') item.status = '완료';
                  else item.status = '대기';
                  setPlanStorage(list);
                }
              }

              function reassignPlanSlot(id, newSlot) {
                const list = getPlanStorage();
                const item = list.find(p => p.id === id);
                if (item) {
                  if (newSlot === 'focus') {
                    item.isFocus = true;
                  } else {
                    item.isFocus = false;
                    item.timeSlot = newSlot;
                  }
                  setPlanStorage(list);
                }
              }

              function deletePlan(id) {
                if (confirm('이 계획을 삭제하시겠습니까?')) {
                  const list = getPlanStorage().filter(p => p.id !== id);
                  setPlanStorage(list);
                }
              }

              /* 암전 메모딱지 */
              const padScreen = document.getElementById('memopad-screen');
              const padCanvas = document.getElementById('memopad-canvas');
              const padCtx = padCanvas.getContext('2d');
              const padToolbar = document.getElementById('memopad-toolbar');
              const padTextStrip = document.getElementById('memopad-text-strip');
              const padTextDisplay = document.getElementById('memopad-text-display');

              let padDrawing = false;
              let isMoving = false;
              let padColor = '#ffffff';
              let isPadEraser = false;
              const MOVE_THRESHOLD = 5;

              let lastTapTime = 0;
              let lastTapX = 0, lastTapY = 0;
              let touchStartX = 0, touchStartY = 0;
              let isCornerGesture = null;
              let padHistory = [];
              let customStripPosition = null;

              function savePadState() {
                if (padHistory.length > 25) padHistory.shift();
                try { padHistory.push(padCtx.getImageData(0, 0, padCanvas.width, padCanvas.height)); } catch(e) {}
              }

              function undoPadStroke() {
                if (padHistory.length > 0) {
                  const prevState = padHistory.pop();
                  padCtx.putImageData(prevState, 0, 0);
                } else {
                  padCtx.fillStyle = '#000000';
                  padCtx.fillRect(0, 0, padCanvas.width, padCanvas.height);
                }
              }

              function clearPadCanvas() {
                if (confirm('도화지를 모두 지우시겠습니까?')) {
                  savePadState();
                  padCtx.fillStyle = '#000000';
                  padCtx.fillRect(0, 0, padCanvas.width, padCanvas.height);
                }
              }

              function openMemoPadDirect() {
                closePlusMenu();
                padScreen.classList.add('active');
                padToolbar.classList.remove('active');
                padTextStrip.style.display = 'none';
                customStripPosition = null;
                document.getElementById('memopad-text-input').value = '';
                padTextDisplay.innerText = '';
                padHistory = [];

                setTimeout(() => {
                  padCanvas.width = window.innerWidth;
                  padCanvas.height = window.innerHeight;
                  padCtx.fillStyle = '#000000';
                  padCtx.fillRect(0, 0, padCanvas.width, padCanvas.height);
                  setPadColor('#ffffff');
                }, 30);
              }

              function closeMemoPadDirect() {
                if (isListeningContinuous) stopContinuousVoice();
                padScreen.classList.remove('active');
                padToolbar.classList.remove('active');
              }

              function setPadColor(color, el) {
                padColor = color;
                isPadEraser = false;
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                if (el) el.classList.add('active');
                document.getElementById('pad-eraser-btn').classList.remove('active');
                padCtx.strokeStyle = padColor;
                padCtx.lineWidth = 3.5;
                padCtx.lineCap = 'round';
                padCtx.lineJoin = 'round';
              }

              function togglePadEraser() {
                isPadEraser = !isPadEraser;
                document.getElementById('pad-eraser-btn').classList.toggle('active', isPadEraser);
                if (isPadEraser) {
                  padCtx.strokeStyle = '#000000';
                  padCtx.lineWidth = 26;
                } else {
                  setPadColor(padColor);
                }
              }

              function handlePadTextInput(val) {
                if (val && val.trim().length > 0) {
                  padTextStrip.style.display = 'block';
                  padTextDisplay.innerText = val.trim();
                  if (!customStripPosition) {
                    const rect = padToolbar.getBoundingClientRect();
                    padTextStrip.style.top = (rect.bottom + 10) + 'px';
                  }
                } else {
                  padTextStrip.style.display = 'none';
                }
              }

              padCanvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const t = e.touches[0];
                const x = t.clientX, y = t.clientY;
                const winW = window.innerWidth, winH = window.innerHeight;

                if (y > winH - 120 && x < 120) { isCornerGesture = 'left'; touchStartX = x; touchStartY = y; return; }
                if (y > winH - 120 && x > winW - 120) { isCornerGesture = 'right'; touchStartX = x; touchStartY = y; return; }

                const now = Date.now();
                if (now - lastTapTime < 320 && Math.abs(x - lastTapX) < 25 && Math.abs(y - lastTapY) < 25) {
                  if (padToolbar.classList.contains('active')) {
                    saveMemoPadToDrawer();
                    lastTapTime = 0;
                    return;
                  } else {
                    padToolbar.classList.add('active');
                    lastTapTime = 0;
                    return;
                  }
                }
                lastTapTime = now;
                lastTapX = x;
                lastTapY = y;
                touchStartX = x;
                touchStartY = y;
                isMoving = false;
                padDrawing = false;
              }, { passive: false });

              padCanvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const t = e.touches[0];
                const x = t.clientX, y = t.clientY;

                if (isCornerGesture) {
                  const dy = touchStartY - y;
                  if (dy > 80) {
                    if (isCornerGesture === 'left') trashMemoPad();
                    else if (isCornerGesture === 'right') saveMemoPadToDrawer();
                    isCornerGesture = null;
                  }
                  return;
                }

                if (!isMoving) {
                  const dist = Math.hypot(x - touchStartX, y - touchStartY);
                  if (dist > MOVE_THRESHOLD) {
                    savePadState();
                    isMoving = true;
                    padDrawing = true;
                    padCtx.beginPath();
                    padCtx.moveTo(touchStartX, touchStartY);
                  }
                }

                if (padDrawing) {
                  padCtx.lineTo(x, y);
                  padCtx.stroke();
                }
              }, { passive: false });

              padCanvas.addEventListener('touchend', () => { padDrawing = false; isMoving = false; isCornerGesture = null; });

              function getPadTrashStorage() {
                const data = localStorage.getItem('memopad_trash_storage') || '[]';
                try { return JSON.parse(data); } catch (e) { return []; }
              }
              function setPadTrashStorage(arr) {
                try { localStorage.setItem('memopad_trash_storage', JSON.stringify(arr)); } catch (e) {}
              }

              function trashMemoPad() {
                const dataUrl = padCanvas.toDataURL('image/jpeg', 0.8);
                const text = document.getElementById('memopad-text-input').value.trim();
                const trashList = getPadTrashStorage();

                trashList.unshift({
                  id: Date.now(),
                  imageData: dataUrl,
                  text: text,
                  time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }),
                  date: new Date().toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })
                });
                setPadTrashStorage(trashList);

                closeMemoPadDirect();
                alert('🗑️ 메모딱지가 휴지통으로 버려졌습니다.');
              }

              function saveMemoPadToDrawer() {
                const text = document.getElementById('memopad-text-input').value.trim();
                if (text) {
                  let drawY = customStripPosition ? customStripPosition.y : 14;
                  if (drawY > padCanvas.height - 60) drawY = padCanvas.height - 60;
                  padCtx.fillStyle = '#2563eb';
                  padCtx.fillRect(10, drawY, padCanvas.width - 20, 46);
                  padCtx.fillStyle = '#ffffff';
                  padCtx.font = 'bold 16px -apple-system, BlinkMacSystemFont, sans-serif';
                  padCtx.fillText(text, 20, drawY + 29);
                }

                const dataUrl = padCanvas.toDataURL('image/jpeg', 0.85);
                const item = { type: '메모딱지', data: dataUrl, isVideo: false };

                saveThought('메모딱지', text, [item]);
                closeMemoPadDirect();
                switchMainMode('idea');
                selectCategory('전체');
                alert('💾 생각서랍에 보관되었습니다.');
              }

              function openArchiveModal() { document.getElementById('archive-modal').classList.add('active'); switchArchiveTab('archive'); }
              function closeArchiveModal() { document.getElementById('archive-modal').classList.remove('active'); }

              function switchArchiveTab(tab) {
                document.getElementById('subtab-archive').classList.toggle('active', tab === 'archive');
                document.getElementById('subtab-trash').classList.toggle('active', tab === 'trash');
                document.getElementById('subtab-backup').classList.toggle('active', tab === 'backup');

                document.getElementById('archive-feed').style.display = (tab === 'archive') ? 'flex' : 'none';
                document.getElementById('trash-feed').style.display = (tab === 'trash') ? 'flex' : 'none';
                document.getElementById('backup-pane').style.display = (tab === 'backup') ? 'flex' : 'none';

                if (tab === 'archive') renderArchiveFeed();
                else if (tab === 'trash') renderTrashFeed();
              }

              function renderArchiveFeed() {
                const list = getThoughtStorage();
                const feed = document.getElementById('archive-feed');
                feed.innerHTML = list.length === 0 ? '<p style="color:#555; text-align:center; padding:40px 0;">보관된 생각이 없습니다.</p>' : list.map(item => `
                  <div class="thought-card">
                    <div class="card-header">
                      <span class="card-badge">${item.category || item.type || '노트'}</span>
                      <span class="card-time">${item.time}</span>
                    </div>
                    ${item.content ? `<div class="card-content">${item.content}</div>` : ''}
                    <div style="display:flex; justify-content:flex-end; gap:6px;">
                      <button class="thought-slot-chip delete" onclick="deleteThought(${item.id}); renderArchiveFeed();">🗑️ 삭제</button>
                    </div>
                  </div>
                `).join('');
              }

              /* 휴지통: 영구 삭제 및 전체 비우기 정상 렌더링 */
              function renderTrashFeed() {
                const list = getPadTrashStorage();
                const feed = document.getElementById('trash-feed');
                if (list.length === 0) {
                  feed.innerHTML = '<p style="color:#555; text-align:center; padding:40px 0;">휴지통이 비어 있습니다.</p>';
                  return;
                }

                feed.innerHTML = `
                  <div style="display:flex; justify-content:flex-end; margin-bottom:6px;">
                    <button class="thought-slot-chip delete" onclick="clearAllTrash()">🗑️ 휴지통 전체 비우기</button>
                  </div>
                ` + list.map(item => `
                  <div class="thought-card">
                    <div class="card-header">
                      <span class="card-badge" style="color:var(--danger);">🗑️ 버려진 떡메모</span>
                      <span class="card-time">${item.date} ${item.time}</span>
                    </div>
                    <img src="${item.imageData}" style="width:100%; max-height:180px; object-fit:contain; border-radius:8px; border:1px solid var(--border); background:#000;" />
                    ${item.text ? `<div class="card-content">${item.text}</div>` : ''}
                    <div style="display:flex; justify-content:flex-end; gap:6px;">
                      <button class="thought-slot-chip" style="background:var(--primary);" onclick="restoreTrashItem(${item.id})">↩️ 복원</button>
                      <button class="thought-slot-chip delete" onclick="deleteTrashItemPermanently(${item.id})">🗑️ 영구 삭제</button>
                    </div>
                  </div>
                `).join('');
              }

              function restoreTrashItem(id) {
                const trashList = getPadTrashStorage();
                const item = trashList.find(t => t.id === id);
                if (item) {
                  saveThought('메모딱지', item.text || '', [{ type: '메모딱지', data: item.imageData, isVideo: false }]);
                  setPadTrashStorage(trashList.filter(t => t.id !== id));
                  renderTrashFeed();
                  alert('✨ 메모딱지가 생각서랍으로 복원되었습니다.');
                }
              }

              function deleteTrashItemPermanently(id) {
                if (confirm('이 메모딱지를 완전히 영구 삭제하시겠습니까?')) {
                  const list = getPadTrashStorage().filter(t => t.id !== id);
                  setPadTrashStorage(list);
                  renderTrashFeed();
                }
              }

              function clearAllTrash() {
                if (confirm('휴지통을 완전히 비우시겠습니까? 영구 삭제되어 되돌릴 수 없습니다.')) {
                  setPadTrashStorage([]);
                  renderTrashFeed();
                }
              }

              function exportBackupData() {
                const backupObj = {
                  version: '3.0',
                  exportDate: new Date().toISOString(),
                  thoughts: getThoughtStorage(),
                  plans: getPlanStorage(),
                  trash: getPadTrashStorage()
                };
                const jsonStr = JSON.stringify(backupObj, null, 2);

                if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(jsonStr).catch(() => {});
                }

                try {
                  const blob = new Blob([jsonStr], { type: 'application/json' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url;
                  a.download = `idea_drawer_backup_${new Date().toISOString().slice(0,10)}.json`;
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
                  URL.revokeObjectURL(url);
                  alert('💾 백업 파일 다운로드 및 클립보드 복사가 완료되었습니다!');
                } catch (e) {
                  copyBackupToClipboard();
                }
              }

              function copyBackupToClipboard() {
                const backupObj = {
                  version: '3.0',
                  exportDate: new Date().toISOString(),
                  thoughts: getThoughtStorage(),
                  plans: getPlanStorage(),
                  trash: getPadTrashStorage()
                };
                const jsonStr = JSON.stringify(backupObj, null, 2);
                navigator.clipboard.writeText(jsonStr).then(() => {
                  alert('📋 모든 백업 데이터가 클립보드에 복사되었습니다!\n카카오톡이나 메모장에 붙여넣으세요.');
                });
              }

              function importBackupData(input) {
                const file = input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                  try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.thoughts) setThoughtStorage(parsed.thoughts);
                    if (parsed.plans) setPlanStorage(parsed.plans);
                    if (parsed.trash) setPadTrashStorage(parsed.trash);
                    alert('🎉 모든 데이터가 완벽하게 복원되었습니다.');
                    location.reload();
                  } catch (err) { alert('백업 파일 형식이 올바르지 않습니다.'); }
                };
                reader.readAsText(file);
                input.value = '';
              }

              function openManualModal() { document.getElementById('manual-modal').classList.add('active'); }
              function closeManualModal() { document.getElementById('manual-modal').classList.remove('active'); }

              selectCategory('첫 생각');
            </script>
          </body>
          </html>
          EOF

