name: Build Idea Drawer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 세팅
        uses: actions/setup-node@v2
        with:
          node-version: 18

      - name: Java JDK 17 세팅
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Android SDK 설정
        uses: android-actions/setup-android@v3

      - name: Capacitor CLI 및 의존성 설치
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "생각서랍" "com.k2hkkh.ideadrawer" --web-dir "."
          npx cap add android

      - name: 플로팅 오버레이 권한 주입
        run: |
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' android/app/src/main/AndroidManifest.xml

      - name: APK 빌드 실행
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 완성된 APK 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: 생각서랍-설치파일(APK)
          path: android/app/build/outputs/apk/debug/app-debug.apk
