name: Build Idea Drawer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 파일 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 자바 JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. 생각서랍 전체 통합 웹 UI 구성
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
            <title>생각서랍</title>
            <style>
              :root {
                --bg: #000000;
                --card: #1c1c1e;
                --surface: #2c2c2e;
                --primary: #2563eb;
                --accent: #38bdf8;
                --success: #10b981;
                --warning: #f59e0b;
                --danger: #ef4444;
                --text: #f8fafc;
                --muted: #8e8e93;
                --border: #2c2c2e;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
                background-color: var(--bg);
                color: var(--text);
                height: 100vh;
                height: 100dvh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                padding-top: env(safe-area-inset-top, 0px);
              }
              header {
                padding: 10px 12px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: var(--bg);
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
                gap: 6px;
              }
              .header-btn {
                background: var(--card);
                border: 1px solid var(--border);
                color: #ffffff;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                font-size: 1.05rem;
                flex-shrink: 0;
              }

              .main-mode-switch {
                display: flex;
                background: #141416;
                padding: 3px;
                border-radius: 20px;
                border: 1px solid var(--border);
                gap: 2px;
                flex: 1;
                justify-content: center;
                max-width: 320px;
              }
              .mode-btn {
                padding: 6px clamp(6px, 1.8vw, 10px);
                border-radius: 16px;
                border: none;
                background: transparent;
                color: var(--muted);
                font-size: clamp(0.72rem, 2.2vw, 0.8rem);
                font-weight: 700;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 3px;
                white-space: nowrap;
                transition: all 0.2s;
              }
              .mode-btn.active {
                background: var(--primary);
                color: #ffffff;
                box-shadow: 0 2px 8px rgba(37,99,235,0.4);
              }

              .category-bar {
                display: flex;
                padding: 8px 12px;
                background: #121214;
                gap: 6px;
                overflow-x: auto;
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
              }
              .category-pill {
                padding: 5px 12px;
                border-radius: 14px;
                background: var(--card);
                border: 1px solid var(--border);
                font-size: 0.78rem;
                color: var(--muted);
                cursor: pointer;
                white-space: nowrap;
                font-weight: 600;
              }
              .category-pill.active {
                background: var(--primary);
                color: #ffffff;
                border-color: var(--primary);
              }

              .view-container {
                flex: 1;
                overflow-y: auto;
                padding: 14px;
                display: flex;
                flex-direction: column;
                gap: 12px;
              }
              .empty-canvas {
                margin: auto;
                text-align: center;
                color: #52525b;
                font-size: 0.95rem;
                line-height: 1.6;
              }

              .thought-card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 14px;
                display: flex;
                flex-direction: column;
                gap: 10px;
              }
              .card-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
              }
              .card-badge {
                font-size: 0.75rem;
                padding: 3px 8px;
                border-radius: 6px;
                background: var(--surface);
                color: var(--accent);
                font-weight: 600;
              }
              .card-time { font-size: 0.75rem; color: var(--muted); }
              .card-content { font-size: clamp(0.92rem, 2.7vw, 1.05rem); line-height: 1.5; white-space: pre-wrap; color: #ffffff; }

              /* 가로 1열 스크롤 칩 바 (생각서랍 카드 하단 8버튼) */
              .thought-slot-scroll {
                display: flex;
                gap: 6px;
                overflow-x: auto;
                white-space: nowrap;
                padding: 8px 2px 2px 2px;
                border-top: 1px solid #27272a;
                -webkit-overflow-scrolling: touch;
              }
              .thought-slot-scroll::-webkit-scrollbar { display: none; }
              
              .thought-slot-chip {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 6px 12px;
                border-radius: 8px;
                border: 1px solid #3f3f46;
                background: var(--surface);
                color: #ffffff;
                font-size: 0.76rem;
                font-weight: 600;
                cursor: pointer;
                flex-shrink: 0;
                transition: background 0.15s;
              }
              .thought-slot-chip:active { transform: scale(0.96); }
              .thought-slot-chip.focus { background: #3f2214; border-color: #ea580c; color: #fed7aa; }
              .thought-slot-chip.copy { background: #1e293b; border-color: #475569; color: #cbd5e1; }
              .thought-slot-chip.delete { background: #3b1414; border-color: #ef4444; color: #fca5a5; }

              /* 쪽잠 1줄 슬림 바 */
              .nap-slim-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: #141416;
                border: 1px solid #27272a;
                border-radius: 12px;
                padding: 6px 10px;
                gap: 6px;
                flex-shrink: 0;
              }
              .nap-label { font-size: 0.78rem; font-weight: bold; color: #a1a1aa; white-space: nowrap; }
              .nap-display { font-size: 0.78rem; font-family: monospace; color: var(--accent); font-weight: bold; }
              .nap-btn-mini {
                background: var(--surface);
                border: 1px solid #3f3f46;
                color: #ffffff;
                padding: 4px 8px;
                border-radius: 6px;
                font-size: 0.74rem;
                font-weight: 600;
                cursor: pointer;
                white-space: nowrap;
              }
              .nap-btn-mini.stop { background: var(--danger); border-color: #f87171; }

              /* 나의계획: 단일 화면 대형 탭 바 */
              .plan-time-tabs {
                display: flex;
                gap: 6px;
                overflow-x: auto;
                padding-bottom: 2px;
                flex-shrink: 0;
              }
              .plan-time-tab {
                flex: 1;
                min-width: 65px;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 9px 4px;
                color: var(--muted);
                font-size: clamp(0.74rem, 2.2vw, 0.82rem);
                font-weight: bold;
                text-align: center;
                cursor: pointer;
                white-space: nowrap;
                transition: all 0.2s;
              }
              .plan-time-tab.active {
                background: #1e3a8a;
                color: #60a5fa;
                border-color: #3b82f6;
              }
              .plan-time-tab.focus-tab.active {
                background: #9a3412;
                color: #fdba74;
                border-color: #f97316;
              }

              /* 큼직한 계획 카드 */
              .plan-big-card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 16px 14px;
                display: flex;
                flex-direction: column;
                gap: 12px;
                box-shadow: 0 4px 14px rgba(0,0,0,0.5);
              }
              .plan-big-card.completed { opacity: 0.45; border-color: #27272a; }
              .plan-big-card-top { display: flex; align-items: flex-start; gap: 10px; }
              .plan-big-title {
                flex: 1;
                font-size: clamp(1.1rem, 3.4vw, 1.3rem);
                font-weight: 700;
                color: #ffffff;
                line-height: 1.45;
                word-break: break-word;
              }
              .plan-big-title.completed { text-decoration: line-through; color: var(--muted); }

              .status-badge-lg {
                font-size: 0.82rem;
                font-weight: 800;
                padding: 5px 10px;
                border-radius: 8px;
                cursor: pointer;
                white-space: nowrap;
                flex-shrink: 0;
              }
              .status-badge-lg.waiting { background: #3f3f46; color: #f4f4f5; }
              .status-badge-lg.progress { background: #1e3a8a; color: #93c5fd; }
              .status-badge-lg.done { background: #064e3b; color: #6ee7b7; }

              /* 계획 카드 하단 스크롤 재배치 바 */
              .plan-relocate-scroll {
                display: flex;
                align-items: center;
                gap: 6px;
                overflow-x: auto;
                white-space: nowrap;
                border-top: 1px solid #27272a;
                padding-top: 10px;
                -webkit-overflow-scrolling: touch;
              }
              .plan-relocate-scroll::-webkit-scrollbar { display: none; }
              
              .relocate-chip {
                background: var(--surface);
                border: 1px solid #3f3f46;
                color: #a1a1aa;
                padding: 6px 10px;
                border-radius: 6px;
                font-size: 0.74rem;
                font-weight: 600;
                cursor: pointer;
                flex-shrink: 0;
              }
              .relocate-chip.active {
                background: #2563eb;
                color: #ffffff;
                border-color: #38bdf8;
              }
              .relocate-chip.focus.active {
                background: #ea580c;
                color: #ffffff;
                border-color: #fdba74;
              }
              .relocate-chip.copy { background: #1e293b; border-color: #475569; color: #cbd5e1; }
              .relocate-chip.delete { background: #3b1414; border-color: #ef4444; color: #fca5a5; }

              .attachment-tray {
                display: none;
                padding: 8px 14px;
                gap: 8px;
                overflow-x: auto;
                background: #121214;
                border-top: 1px solid var(--border);
                align-items: center;
                flex-shrink: 0;
              }
              .attachment-tray.active { display: flex; }
              .tray-item { position: relative; width: 60px; height: 60px; flex-shrink: 0; }
              .tray-thumb { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid var(--accent); background: #fff; }
              .tray-remove-btn {
                position: absolute; top: -4px; right: -4px; width: 18px; height: 18px; border-radius: 50%;
                background: var(--danger); color: #fff; font-size: 0.7rem; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;
              }

              .bottom-bar-wrapper {
                padding: 8px 14px calc(14px + env(safe-area-inset-bottom, 0px)) 14px;
                background: var(--bg);
                position: relative;
                flex-shrink: 0;
              }
              .capsule-box {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 30px;
                padding: 6px 10px;
                display: flex;
                align-items: center;
                gap: 8px;
              }
              .btn-plus {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: var(--surface);
                border: none;
                color: #ffffff;
                font-size: 1.3rem;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: transform 0.2s;
              }
              .btn-plus.open { transform: rotate(45deg); background: var(--danger); }
              .main-input {
                flex: 1;
                background: transparent;
                border: none;
                color: #ffffff;
                font-size: clamp(0.88rem, 2.6vw, 0.95rem);
                outline: none;
                min-height: 24px;
                max-height: 90px;
                resize: none;
                line-height: 1.4;
                user-select: text;
              }
              .main-input::placeholder { color: #636366; }
              .btn-mic {
                background: none;
                border: none;
                width: 32px;
                height: 32px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                flex-shrink: 0;
              }
              .btn-mic svg { width: 22px; height: 22px; fill: #8e8e93; }
              .btn-mic.listening svg { fill: #ef4444; animation: micPulse 1.2s infinite; }
              
              .btn-action-send {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: #2563eb;
                border: none;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 2px;
                cursor: pointer;
                color: #ffffff;
                font-size: 1.2rem;
                font-weight: bold;
                flex-shrink: 0;
              }
              .wave-bar { width: 3px; height: 12px; background: #ffffff; border-radius: 2px; }
              .btn-action-send.listening { background: var(--danger); animation: pulseWave 1.2s infinite; }
              .btn-action-send.listening .wave-bar { animation: waveAnim 0.6s infinite alternate ease-in-out; }
              .btn-action-send.listening .wave-bar:nth-child(2) { animation-delay: 0.15s; }
              .btn-action-send.listening .wave-bar:nth-child(3) { animation-delay: 0.3s; }
              @keyframes waveAnim { 0% { height: 6px; } 100% { height: 18px; } }
              @keyframes pulseWave { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
              @keyframes micPulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

              .plus-menu-popover {
                display: none;
                position: absolute;
                bottom: calc(74px + env(safe-area-inset-bottom, 0px));
                left: 14px;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 18px;
                padding: 8px 6px;
                flex-direction: column;
                gap: 4px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.8);
                z-index: 50;
                min-width: 170px;
              }
              .plus-menu-popover.active { display: flex; animation: slideUp 0.18s ease-out; }
              @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
              .menu-item {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 14px;
                border-radius: 12px;
                color: #ffffff;
                font-size: 0.9rem;
                font-weight: 500;
                cursor: pointer;
              }
              .menu-item:active { background: var(--surface); }
              .menu-item-icon {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                background: var(--surface);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1rem;
              }

              .modal-full {
                display: none;
                position: fixed;
                top: 0; left: 0; width: 100vw;
                height: 100vh;
                height: 100dvh;
                background: #000000;
                z-index: 1000;
                flex-direction: column;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
              }
              .modal-full.active { display: flex; }
              .modal-top {
                padding: 12px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid var(--border);
                background: var(--card);
                flex-shrink: 0;
              }
              .modal-body {
                flex: 1;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 12px;
                overflow-y: auto;
              }

              /* 암전 메모딱지 */
              #memopad-screen {
                display: none;
                position: fixed;
                top: 0; left: 0; width: 100vw;
                height: 100vh;
                height: 100dvh;
                background: #000000;
                z-index: 2000;
                touch-action: none;
                overflow: hidden;
              }
              #memopad-screen.active { display: block; }
              #memopad-canvas {
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                display: block;
                background: #000000;
              }
              
              .memopad-toolbar {
                display: none;
                position: absolute;
                top: calc(8px + env(safe-area-inset-top, 0px));
                left: 8px;
                right: 8px;
                background: rgba(28, 28, 30, 0.97);
                backdrop-filter: blur(14px);
                border: 1px solid #3a3a3c;
                border-radius: 18px;
                padding: 7px 9px;
                flex-direction: column;
                gap: 6px;
                z-index: 2100;
                box-shadow: 0 8px 24px rgba(0,0,0,0.7);
                animation: slideDown 0.2s ease-out;
              }
              .memopad-toolbar.active { display: flex; }
              @keyframes slideDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }

              .pad-toolbar-row1 {
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
                gap: 4px;
              }
              .pad-toolbar-row2 {
                display: flex;
                align-items: center;
                width: 100%;
                gap: 6px;
              }

              .pad-palette { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
              .color-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
              .color-dot.active { border-color: #ffffff; transform: scale(1.15); }
              
              .pad-tool-btn {
                background: var(--surface);
                border: 1px solid #3a3a3c;
                border-radius: 7px;
                font-size: clamp(0.7rem, 2vw, 0.74rem);
                color: #ffffff;
                cursor: pointer;
                padding: 4px clamp(4px, 1.2vw, 6px);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                white-space: nowrap;
                line-height: 1;
                gap: 2px;
                flex-shrink: 0;
              }
              .pad-tool-btn:active { transform: scale(0.95); }
              .pad-tool-btn.active { background: #3b82f6; border-color: #60a5fa; }

              .pad-input-box {
                flex: 1;
                display: flex;
                align-items: center;
                background: #121214;
                border-radius: 12px;
                padding: 6px 8px;
                border: 1px solid #3a3a3c;
              }
              .pad-input-box input {
                flex: 1;
                background: transparent;
                border: none;
                color: #ffffff;
                font-size: clamp(0.82rem, 2.4vw, 0.88rem);
                outline: none;
                user-select: text;
              }
              
              .pad-mic-btn {
                background: none;
                border: none;
                cursor: pointer;
                width: 28px;
                height: 28px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
              }
              .pad-mic-btn svg { width: 19px; height: 19px; fill: #8e8e93; }
              .pad-mic-btn.listening svg { fill: #ef4444; animation: micPulse 1.2s infinite; }

              .pad-action-btn {
                background: var(--primary);
                border: none;
                color: #ffffff;
                padding: 5px 9px;
                border-radius: 7px;
                font-size: clamp(0.74rem, 2vw, 0.78rem);
                font-weight: bold;
                cursor: pointer;
                white-space: nowrap;
                flex-shrink: 0;
              }
              .pad-close-btn {
                background: var(--surface);
                border: none;
                color: #ffffff;
                width: 26px;
                height: 26px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 0.8rem;
                cursor: pointer;
                flex-shrink: 0;
              }

              .memopad-text-strip {
                position: absolute;
                top: 110px;
                left: 12px;
                right: 12px;
                background: rgba(37, 99, 235, 0.92);
                color: #ffffff;
                padding: 8px 12px;
                border-radius: 10px;
                font-size: clamp(0.85rem, 2.5vw, 0.92rem);
                font-weight: bold;
                z-index: 2050;
                cursor: move;
                touch-action: none;
                word-break: break-word;
                white-space: pre-wrap;
                line-height: 1.4;
                max-height: 100px;
                overflow-y: auto;
                box-shadow: 0 4px 14px rgba(0,0,0,0.6);
                transition: top 0.15s ease-out;
              }

              .corner-guide {
                position: absolute;
                bottom: calc(12px + env(safe-area-inset-bottom, 0px));
                font-size: clamp(0.68rem, 2vw, 0.72rem);
                color: #52525b;
                pointer-events: none;
                z-index: 2020;
              }
              .corner-guide.left { left: 14px; }
              .corner-guide.right { right: 14px; }

              .archive-subtabs {
                display: flex;
                gap: 6px;
                border-bottom: 1px solid var(--border);
                padding-bottom: 8px;
              }
              .subtab-btn {
                padding: 6px 12px;
                border-radius: 10px;
                background: var(--surface);
                border: none;
                color: var(--muted);
                font-size: 0.82rem;
                font-weight: 600;
                cursor: pointer;
              }
              .subtab-btn.active {
                background: var(--primary);
                color: #ffffff;
              }
            </style>
          </head>
          <body>

            <header>
              <button class="header-btn" onclick="resetToIdeaDrawer()" title="첫 생각">💡</button>
              
              <div class="main-mode-switch">
                <button id="tab-btn-idea" class="mode-btn active" onclick="switchMainMode('idea')">💡 생각서랍</button>
                <button id="tab-btn-plan" class="mode-btn" onclick="switchMainMode('plan')">📋 나의계획</button>
                <button id="tab-btn-pad" class="mode-btn" onclick="openMemoPadDirect()">📑 메모딱지</button>
              </div>

              <div style="display:flex; gap:6px;">
                <button class="header-btn" onclick="openManualModal()" title="가이드">❓</button>
                <button class="header-btn" onclick="openArchiveModal()" title="보관함/휴지통/백업">📂</button>
              </div>
            </header>

