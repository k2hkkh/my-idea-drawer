name: Build Idea Drawer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 파일 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 자바 JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. 생각서랍 & 나의계획 2단 실행형 웹 UI 구성
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <title>생각서랍</title>
            <style>
              :root {
                --bg: #000000;
                --card: #1c1c1e;
                --surface: #2c2c2e;
                --primary: #2563eb;
                --accent: #38bdf8;
                --success: #10b981;
                --warning: #f59e0b;
                --danger: #ef4444;
                --text: #f8fafc;
                --muted: #8e8e93;
                --border: #2c2c2e;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
                background-color: var(--bg);
                color: var(--text);
                height: 100vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
              }
              header {
                padding: 10px 14px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: var(--bg);
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
              }
              .header-btn {
                background: var(--card);
                border: 1px solid var(--border);
                color: #ffffff;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                font-size: 1.05rem;
              }
              
              /* 상단 2분할 모드 전환 탭 */
              .main-mode-switch {
                display: flex;
                background: #141416;
                padding: 3px;
                border-radius: 20px;
                border: 1px solid var(--border);
                gap: 4px;
              }
              .mode-btn {
                padding: 6px 14px;
                border-radius: 16px;
                border: none;
                background: transparent;
                color: var(--muted);
                font-size: 0.85rem;
                font-weight: 700;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 4px;
                transition: all 0.2s;
              }
              .mode-btn.active {
                background: var(--primary);
                color: #ffffff;
                box-shadow: 0 2px 8px rgba(37,99,235,0.4);
              }

              /* 카테고리 바 (생각서랍 전용) */
              .category-bar {
                display: flex;
                padding: 8px 14px;
                background: #121214;
                gap: 6px;
                overflow-x: auto;
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
              }
              .category-pill {
                padding: 5px 12px;
                border-radius: 14px;
                background: var(--card);
                border: 1px solid var(--border);
                font-size: 0.78rem;
                color: var(--muted);
                cursor: pointer;
                white-space: nowrap;
                font-weight: 600;
              }
              .category-pill.active {
                background: var(--primary);
                color: #ffffff;
                border-color: var(--primary);
              }

              /* 뷰 컨테이너 */
              .view-container {
                flex: 1;
                overflow-y: auto;
                padding: 14px;
                display: flex;
                flex-direction: column;
                gap: 12px;
              }
              .empty-canvas {
                margin: auto;
                text-align: center;
                color: #48484a;
                font-size: 0.95rem;
                line-height: 1.6;
              }

              /* 생각 카드 */
              .thought-card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 14px;
                display: flex;
                flex-direction: column;
                gap: 8px;
              }
              .card-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
              }
              .card-badge {
                font-size: 0.75rem;
                padding: 3px 8px;
                border-radius: 6px;
                background: var(--surface);
                color: var(--accent);
                font-weight: 600;
              }
              .card-time { font-size: 0.75rem; color: var(--muted); }
              .card-media-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
                gap: 6px;
                margin-top: 4px;
              }
              .media-thumb-item {
                width: 100%;
                height: 110px;
                object-fit: cover;
                border-radius: 8px;
                border: 1px solid var(--border);
                background: #fff;
              }
              .card-content { font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
              .card-actions {
                display: flex;
                justify-content: flex-end;
                gap: 6px;
                margin-top: 6px;
              }
              .card-btn {
                background: var(--surface);
                border: none;
                color: #ffffff;
                padding: 5px 10px;
                border-radius: 6px;
                font-size: 0.75rem;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 4px;
              }
              .card-btn.delete { color: var(--danger); }
              .card-btn.plan-send { color: var(--accent); }

              /* 나의계획 2단 대시보드 UI */
              .plan-section-title {
                font-size: 0.95rem;
                font-weight: 700;
                color: #ffffff;
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-top: 4px;
                margin-bottom: 2px;
                padding-left: 2px;
              }
              .plan-count-badge {
                font-size: 0.75rem;
                background: var(--surface);
                color: var(--accent);
                padding: 2px 8px;
                border-radius: 10px;
              }
              .plan-card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 12px 14px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                transition: border-color 0.2s;
              }
              .plan-card.completed {
                opacity: 0.6;
                border-color: #27272a;
              }
              .plan-card-top {
                display: flex;
                align-items: center;
                gap: 10px;
              }
              .status-tag {
                font-size: 0.72rem;
                font-weight: 700;
                padding: 4px 8px;
                border-radius: 6px;
                cursor: pointer;
                white-space: nowrap;
              }
              .status-tag.waiting { background: #3f3f46; color: #d4d4d8; }
              .status-tag.progress { background: #1e3a8a; color: #60a5fa; }
              .status-tag.done { background: #064e3b; color: #34d399; }
              .plan-title {
                flex: 1;
                font-size: 0.95rem;
                font-weight: 500;
                color: #ffffff;
              }
              .plan-title.completed {
                text-decoration: line-through;
                color: var(--muted);
              }
              .plan-notes-box {
                background: #121214;
                border-radius: 8px;
                padding: 8px 10px;
                font-size: 0.8rem;
                color: #a1a1aa;
                display: flex;
                flex-direction: column;
                gap: 4px;
                border-left: 2px solid var(--primary);
              }
              .plan-note-item { line-height: 1.4; }

              /* 첨부 미디어 트레이 */
              .attachment-tray {
                display: none;
                padding: 8px 14px;
                gap: 8px;
                overflow-x: auto;
                background: #121214;
                border-top: 1px solid var(--border);
                align-items: center;
                flex-shrink: 0;
              }
              .attachment-tray.active { display: flex; }
              .tray-item { position: relative; width: 60px; height: 60px; flex-shrink: 0; }
              .tray-thumb { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid var(--accent); background: #fff; }
              .tray-remove-btn {
                position: absolute; top: -4px; right: -4px; width: 18px; height: 18px; border-radius: 50%;
                background: var(--danger); color: #fff; font-size: 0.7rem; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;
              }

              /* 하단 캡슐 바 */
              .bottom-bar-wrapper {
                padding: 8px 14px 14px 14px;
                background: var(--bg);
                position: relative;
                flex-shrink: 0;
              }
              .capsule-box {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 30px;
                padding: 6px 10px;
                display: flex;
                align-items: center;
                gap: 8px;
              }
              .btn-plus {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: var(--surface);
                border: none;
                color: #ffffff;
                font-size: 1.3rem;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: transform 0.2s;
              }
              .btn-plus.open { transform: rotate(45deg); background: var(--danger); }
              .main-input {
                flex: 1;
                background: transparent;
                border: none;
                color: #ffffff;
                font-size: 0.95rem;
                outline: none;
                min-height: 24px;
                max-height: 90px;
                resize: none;
                line-height: 1.4;
                user-select: text;
              }
              .main-input::placeholder { color: #636366; }
              .btn-mic {
                background: none;
                border: none;
                color: var(--muted);
                width: 32px;
                height: 32px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
              }
              .btn-mic svg { width: 22px; height: 22px; fill: #8e8e93; }
              .btn-mic.listening svg { fill: #ef4444; animation: micPulse 1.2s infinite; }
              
              .btn-action-send {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: #2563eb;
                border: none;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 2px;
                cursor: pointer;
                color: #ffffff;
                font-size: 1.2rem;
                font-weight: bold;
              }
              .wave-bar { width: 3px; height: 12px; background: #ffffff; border-radius: 2px; }
              .btn-action-send.listening { background: var(--danger); animation: pulseWave 1.2s infinite; }
              .btn-action-send.listening .wave-bar { animation: waveAnim 0.6s infinite alternate ease-in-out; }
              .btn-action-send.listening .wave-bar:nth-child(2) { animation-delay: 0.15s; }
              .btn-action-send.listening .wave-bar:nth-child(3) { animation-delay: 0.3s; }
              @keyframes waveAnim { 0% { height: 6px; } 100% { height: 18px; } }
              @keyframes pulseWave { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
              @keyframes micPulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

              /* + 팝업 메뉴 */
              .plus-menu-popover {
                display: none;
                position: absolute;
                bottom: 74px;
                left: 14px;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 18px;
                padding: 8px 6px;
                flex-direction: column;
                gap: 4px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.8);
                z-index: 50;
                min-width: 170px;
              }
              .plus-menu-popover.active { display: flex; animation: slideUp 0.18s ease-out; }
              @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
              .menu-item {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 14px;
                border-radius: 12px;
                color: #ffffff;
                font-size: 0.9rem;
                font-weight: 500;
                cursor: pointer;
              }
              .menu-item:active { background: var(--surface); }
              .menu-item-icon {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                background: var(--surface);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1rem;
              }

              /* 모달 공통 */
              .modal-full {
                display: none;
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: #000000;
                z-index: 100;
                flex-direction: column;
              }
              .modal-full.active { display: flex; }
              .modal-top {
                padding: 12px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid var(--border);
                background: var(--card);
              }
              .modal-body {
                flex: 1;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 12px;
                overflow-y: auto;
              }

              /* 수정창 내 미디어 툴바 */
              .edit-media-toolbar {
                display: none;
                gap: 6px;
                background: #121214;
                padding: 8px 10px;
                border-radius: 10px;
                border: 1px solid var(--border);
                overflow-x: auto;
              }
              .edit-add-btn {
                background: var(--surface);
                border: 1px solid var(--border);
                color: #ffffff;
                padding: 6px 10px;
                border-radius: 8px;
                font-size: 0.78rem;
                cursor: pointer;
                white-space: nowrap;
                display: flex;
                align-items: center;
                gap: 4px;
              }

              /* 수정창 내 마이크 입력 래퍼 */
              .edit-input-wrapper {
                position: relative;
                width: 100%;
                display: flex;
              }
              .edit-mic-btn {
                position: absolute;
                right: 12px;
                bottom: 12px;
                width: 38px;
                height: 38px;
                border-radius: 50%;
                background: #192233;
                border: 1px solid #2d3d5a;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 2px 8px rgba(0,0,0,0.3);
              }
              .edit-mic-btn svg { width: 20px; height: 20px; fill: #94a3b8; }
              .edit-mic-btn.listening {
                background: var(--danger);
                border-color: #f87171;
                animation: micPulse 1.2s infinite;
              }
              .edit-mic-btn.listening svg { fill: #ffffff; }

              /* 스케치 전용 */
              .palette-bar { display: flex; gap: 8px; align-items: center; }
              .color-dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
              .color-dot.active { border-color: #ffffff; transform: scale(1.1); }
              .canvas-container {
                flex: 1; background: #ffffff; border-radius: 14px; touch-action: none; position: relative; min-height: 260px; margin: 10px;
              }
              canvas { width: 100%; height: 100%; display: block; border-radius: 14px; background: #ffffff; }
            </style>
          </head>
          <body>

            <!-- 헤더 -->
            <header>
              <button class="header-btn" onclick="resetToIdeaDrawer()">💡</button>
              
              <!-- 상단 2분할 탭 -->
              <div class="main-mode-switch">
                <button id="tab-btn-idea" class="mode-btn active" onclick="switchMainMode('idea')">💡 생각서랍</button>
                <button id="tab-btn-plan" class="mode-btn" onclick="switchMainMode('plan')">📋 나의계획</button>
              </div>

              <button class="header-btn" onclick="openArchiveModal()">📂</button>
            </header>

            <!-- 1. 생각서랍 전용 카테고리 바 -->
            <div class="category-bar" id="idea-category-bar">
              <div class="category-pill active" onclick="selectCategory('첫 생각')">💡 첫 생각</div>
              <div class="category-pill" onclick="selectCategory('노트')">📝 노트</div>
              <div class="category-pill" onclick="selectCategory('사진')">📷 사진</div>
              <div class="category-pill" onclick="selectCategory('스케치')">🎨 스케치</div>
              <div class="category-pill" onclick="selectCategory('동영상')">🎬 동영상</div>
              <div class="category-pill" onclick="selectCategory('전체')">📂 전체</div>
            </div>

            <!-- 2. 메인 뷰: 생각서랍 피드 -->
            <div class="view-container" id="idea-feed-container">
              <div class="empty-canvas" id="empty-hint">
                떠오르는 생각을 자유롭게 기록하세요.<br>
                저장 즉시 서랍으로 들어가 깨끗한 화면이 유지됩니다.
              </div>
            </div>

            <!-- 3. 메인 뷰: 나의계획 피드 (2단 실행형 구조) -->
            <div class="view-container" id="plan-feed-container" style="display:none;">
              <!-- 오늘 할 일 섹션 -->
              <div class="plan-section-title">
                <span>⚡ 오늘 집중 (Today Focus)</span>
                <span class="plan-count-badge" id="today-count-badge">0건</span>
              </div>
              <div id="today-plan-list" style="display:flex; flex-direction:column; gap:8px;"></div>

              <!-- 진행 중 및 대기 섹션 -->
              <div class="plan-section-title" style="margin-top:16px;">
                <span>🔄 진행 중 및 보관 (Backlog)</span>
                <span class="plan-count-badge" id="backlog-count-badge">0건</span>
              </div>
              <div id="backlog-plan-list" style="display:flex; flex-direction:column; gap:8px;"></div>
            </div>

            <!-- 첨부된 미디어 트레이 -->
            <div class="attachment-tray" id="attachment-tray"></div>

            <!-- 하단 캡슐 입력 바 -->
            <div class="bottom-bar-wrapper">
              <div class="plus-menu-popover" id="plus-menu">
                <div class="menu-item" onclick="triggerCamera('main')">
                  <div class="menu-item-icon">📷</div>
                  <span>카메라 촬영 추가</span>
                </div>
                <div class="menu-item" onclick="triggerGallery('main')">
                  <div class="menu-item-icon">🖼️</div>
                  <span>사진 선택 (다중)</span>
                </div>
                <div class="menu-item" onclick="openSketchModal('main')">
                  <div class="menu-item-icon">🎨</div>
                  <span>스케치 그려서 추가</span>
                </div>
                <div class="menu-item" onclick="triggerVideo('main')">
                  <div class="menu-item-icon">🎬</div>
                  <span>동영상 추가</span>
                </div>
              </div>

              <div class="capsule-box">
                <button id="btn-plus" class="btn-plus" onclick="togglePlusMenu()">＋</button>
                <textarea id="prompt-input" class="main-input" placeholder="생각을 입력하거나 사진·영상을 덧붙이세요..." rows="1" 
                  oninput="handleInputChange(this); trackCursor(this);" 
                  onkeyup="trackCursor(this)" 
                  onmouseup="trackCursor(this)" 
                  ontouchend="trackCursor(this)" 
                  onfocus="trackCursor(this)"></textarea>
                <button id="btn-mic-main" class="btn-mic" onclick="toggleContinuousVoice('main')">
                  <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </button>
                <button id="btn-wave" class="btn-action-send" onclick="handleSendAction()">
                  <div class="wave-bar"></div>
                  <div class="wave-bar"></div>
                  <div class="wave-bar"></div>
                </button>
              </div>
            </div>

            <!-- 숨김 파일 인풋 -->
            <input type="file" id="camera-file" accept="image/*" capture="environment" style="display:none;" onchange="processMediaFiles(this, '사진')" />
            <input type="file" id="gallery-file" accept="image/*" multiple style="display:none;" onchange="processMediaFiles(this, '사진')" />
            <input type="file" id="video-file" accept="video/*" capture="environment" style="display:none;" onchange="processVideoFile(this)" />

            <!-- 스케치 모달 -->
            <div id="sketch-modal" class="modal-full">
              <div class="modal-top">
                <div class="palette-bar">
                  <div class="color-dot active" style="background:#000000;" onclick="setDrawColor('#000000', this)"></div>
                  <div class="color-dot" style="background:#ef4444;" onclick="setDrawColor('#ef4444', this)"></div>
                  <div class="color-dot" style="background:#2563eb;" onclick="setDrawColor('#2563eb', this)"></div>
                  <div class="color-dot" style="background:#10b981;" onclick="setDrawColor('#10b981', this)"></div>
                  <div class="color-dot" style="background:#f59e0b;" onclick="setDrawColor('#f59e0b', this)"></div>
                </div>
                <div style="display:flex; gap:6px;">
                  <button class="card-btn" style="background:var(--surface);" onclick="clearCanvas()">지우기</button>
                  <button class="card-btn" style="background:var(--primary);" onclick="attachSketch()">＋ 스케치 첨부</button>
                  <button class="card-btn" style="background:var(--danger);" onclick="closeSketchModal()">닫기</button>
                </div>
              </div>
              <div class="canvas-container" id="canvas-wrapper">
                <canvas id="sketch-board"></canvas>
              </div>
            </div>

            <!-- 생각 수정 모달 -->
            <div id="edit-modal" class="modal-full">
              <div class="modal-top">
                <span id="edit-modal-title" style="font-weight:bold; font-size:1rem;">✏️ 생각 수정</span>
                <div style="display:flex; gap:8px;">
                  <button class="card-btn" style="background:var(--primary);" onclick="confirmEditThought()">💾 수정 완료</button>
                  <button class="card-btn" style="background:var(--danger);" onclick="closeEditModal()">취소</button>
                </div>
              </div>
              <div class="modal-body">
                <div id="edit-media-toolbar" class="edit-media-toolbar"></div>
                <div id="edit-media-preview" class="card-media-grid"></div>
                <div class="edit-input-wrapper">
                  <textarea id="edit-input" class="main-input" style="background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 50px 12px 14px; min-height:180px; width:100%;" placeholder="수정할 메모를 입력하거나 마이크로 이어서 말씀하세요..."
                    oninput="trackCursor(this)" onkeyup="trackCursor(this)" onmouseup="trackCursor(this)" ontouchend="trackCursor(this)" onfocus="trackCursor(this)"></textarea>
                  <button id="edit-mic-btn" class="edit-mic-btn" onclick="toggleContinuousVoice('edit')">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- 나의계획 상세/진행메모 수정 모달 -->
            <div id="plan-edit-modal" class="modal-full">
              <div class="modal-top">
                <span style="font-weight:bold; font-size:1rem;">📋 계획 및 진행상황 기록</span>
                <div style="display:flex; gap:8px;">
                  <button class="card-btn" style="background:var(--primary);" onclick="confirmEditPlan()">💾 저장</button>
                  <button class="card-btn" style="background:var(--danger);" onclick="closePlanEditModal()">취소</button>
                </div>
              </div>
              <div class="modal-body">
                <label style="font-size:0.8rem; color:var(--muted);">할 일 / 프로젝트 제목</label>
                <input id="plan-edit-title" class="main-input" style="background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px; font-size:1rem; font-weight:bold;" />

                <label style="font-size:0.8rem; color:var(--muted); margin-top:8px;">진행 메모 추가 (음성 입력 가능)</label>
                <div class="edit-input-wrapper">
                  <textarea id="plan-edit-newnote" class="main-input" style="background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 50px 12px 14px; min-height:100px; width:100%;" placeholder="새로운 진행상황을 말씀하시거나 입력하세요..."
                    oninput="trackCursor(this)" onkeyup="trackCursor(this)" onmouseup="trackCursor(this)" ontouchend="trackCursor(this)" onfocus="trackCursor(this)"></textarea>
                  <button id="plan-mic-btn" class="edit-mic-btn" onclick="toggleContinuousVoice('plan-edit')">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                  </button>
                </div>

                <label style="font-size:0.8rem; color:var(--muted); margin-top:8px;">누적된 진행 기록</label>
                <div id="plan-edit-history" class="plan-notes-box" style="min-height:80px; max-height:160px; overflow-y:auto;"></div>
              </div>
            </div>

            <!-- 보관함 모달 -->
            <div id="archive-modal" class="modal-full">
              <div class="modal-top">
                <span style="font-weight:bold; font-size:1.05rem;">📂 생각보관함 (전체)</span>
                <button class="card-btn" style="background:var(--danger);" onclick="closeArchiveModal()">닫기</button>
              </div>
              <div class="view-container" id="archive-feed"></div>
            </div>

            <script>
              let currentMainMode = 'idea'; // 'idea' 또는 'plan'
              let currentCategory = '첫 생각';
              let currentAttachments = [];
              let editingThoughtId = null;
              let editingMediaList = [];
              let editingPlanId = null;

              let activeTargetContext = 'main';
              let activeVoiceTarget = 'main';
              let isListeningContinuous = false;

              let cursorPositions = {
                'prompt-input': { start: 0, end: 0 },
                'edit-input': { start: 0, end: 0 },
                'plan-edit-newnote': { start: 0, end: 0 }
              };

              function trackCursor(el) {
                if (el && el.id && cursorPositions.hasOwnProperty(el.id)) {
                  cursorPositions[el.id] = { start: el.selectionStart, end: el.selectionEnd };
                }
              }

              let lastProcessedVoice = '';
              let lastProcessedTime = 0;

              /* 상단 모드 전환 (생각서랍 ↔ 나의계획) */
              function switchMainMode(mode) {
                currentMainMode = mode;
                document.getElementById('tab-btn-idea').classList.toggle('active', mode === 'idea');
                document.getElementById('tab-btn-plan').classList.toggle('active', mode === 'plan');

                const ideaCategoryBar = document.getElementById('idea-category-bar');
                const ideaFeed = document.getElementById('idea-feed-container');
                const planFeed = document.getElementById('plan-feed-container');
                const plusBtn = document.getElementById('btn-plus');
                const input = document.getElementById('prompt-input');

                if (mode === 'idea') {
                  ideaCategoryBar.style.display = 'flex';
                  ideaFeed.style.display = 'flex';
                  planFeed.style.display = 'none';
                  plusBtn.style.display = 'flex';
                  input.placeholder = '생각을 입력하거나 사진·영상을 덧붙이세요...';
                  renderFeed();
                } else {
                  ideaCategoryBar.style.display = 'none';
                  ideaFeed.style.display = 'none';
                  planFeed.style.display = 'flex';
                  plusBtn.style.display = 'none'; // 계획 모드에서는 간결성을 위해 미디어 버튼 숨김
                  input.placeholder = '⚡ 오늘 할 일 또는 새로운 계획을 등록하세요...';
                  renderPlanView();
                }
              }

              function resetToIdeaDrawer() {
                switchMainMode('idea');
                selectCategory('첫 생각');
              }

              function selectCategory(cat) {
                currentCategory = cat;
                document.querySelectorAll('.category-pill').forEach(p => {
                  p.classList.toggle('active', p.innerText.includes(cat));
                });
                renderFeed();
              }

              function togglePlusMenu() {
                const menu = document.getElementById('plus-menu');
                const btn = document.getElementById('btn-plus');
                menu.classList.toggle('active');
                btn.classList.toggle('open');
              }
              function closePlusMenu() {
                document.getElementById('plus-menu').classList.remove('active');
                document.getElementById('btn-plus').classList.remove('open');
              }

              function triggerCamera(context = 'main') { activeTargetContext = context; closePlusMenu(); document.getElementById('camera-file').click(); }
              function triggerGallery(context = 'main') { activeTargetContext = context; closePlusMenu(); document.getElementById('gallery-file').click(); }
              function triggerVideo(context = 'main') { activeTargetContext = context; closePlusMenu(); document.getElementById('video-file').click(); }

              function compressImage(file, maxWidth = 800, quality = 0.65) {
                return new Promise((resolve) => {
                  const reader = new FileReader();
                  reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                      const canvas = document.createElement('canvas');
                      let w = img.width, h = img.height;
                      if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
                      canvas.width = w; canvas.height = h;
                      const ctx = canvas.getContext('2d');
                      ctx.drawImage(img, 0, 0, w, h);
                      resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                  };
                  reader.readAsDataURL(file);
                });
              }

              function captureVideoThumbnail(file) {
                return new Promise((resolve) => {
                  const url = URL.createObjectURL(file);
                  const video = document.createElement('video');
                  video.src = url; video.muted = true; video.playsInline = true; video.currentTime = 0.5;
                  video.onloadeddata = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 400;
                    canvas.height = Math.round((video.videoHeight * 400) / video.videoWidth) || 240;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                  };
                  video.onerror = () => { URL.revokeObjectURL(url); resolve(''); };
                });
              }

              async function processMediaFiles(input, type) {
                const files = input.files;
                if (files && files.length > 0) {
                  for (let file of Array.from(files)) {
                    const compressedData = await compressImage(file);
                    const item = { type: type, data: compressedData, isVideo: false };
                    if (activeTargetContext === 'edit') {
                      editingMediaList.push(item);
                      renderEditMediaPreview();
                    } else {
                      currentAttachments.push(item);
                      renderAttachmentTray();
                      updateSendButtonState();
                    }
                  }
                  input.value = '';
                }
              }

              async function processVideoFile(input) {
                const file = input.files[0];
                if (file) {
                  const thumb = await captureVideoThumbnail(file);
                  const item = { type: '동영상', data: thumb || '', isVideo: true };
                  if (activeTargetContext === 'edit') {
                    editingMediaList.push(item);
                    renderEditMediaPreview();
                  } else {
                    currentAttachments.push(item);
                    renderAttachmentTray();
                    updateSendButtonState();
                  }
                  input.value = '';
                }
              }

              function renderAttachmentTray() {
                const tray = document.getElementById('attachment-tray');
                if (currentAttachments.length === 0) { tray.classList.remove('active'); tray.innerHTML = ''; return; }
                tray.classList.add('active');
                tray.innerHTML = currentAttachments.map((item, idx) => `
                  <div class="tray-item">
                    <img src="${item.data}" class="tray-thumb" />
                    <button class="tray-remove-btn" onclick="removeAttachment(${idx})">✕</button>
                  </div>
                `).join('');
              }

              function removeAttachment(idx) {
                currentAttachments.splice(idx, 1);
                renderAttachmentTray();
                updateSendButtonState();
              }

              function handleInputChange(textarea) {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 90) + 'px';
                updateSendButtonState();
              }

              function updateSendButtonState() {
                const text = document.getElementById('prompt-input').value.trim();
                const hasAttachments = currentAttachments.length > 0;
                const waveBtn = document.getElementById('btn-wave');
                if (text || hasAttachments) {
                  waveBtn.innerHTML = '↑';
                } else {
                  waveBtn.innerHTML = '<div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>';
                }
              }

              /* 하단 전송 처리 (생각서랍 / 나의계획 자동 분기) */
              function handleSendAction() {
                const input = document.getElementById('prompt-input');
                const text = input.value.trim();
                const hasAttachments = currentAttachments.length > 0;
                
                if (text || hasAttachments) {
                  if (isListeningContinuous) stopContinuousVoice();

                  if (currentMainMode === 'idea') {
                    let category = '노트';
                    if (hasAttachments) {
                      const hasVideo = currentAttachments.some(a => a.type === '동영상');
                      const hasSketch = currentAttachments.some(a => a.type === '스케치');
                      const hasPhoto = currentAttachments.some(a => a.type === '사진');
                      if (hasVideo) category = '동영상';
                      else if (hasSketch) category = '스케치';
                      else if (hasPhoto) category = '사진';
                    }
                    saveThought(category, text, [...currentAttachments]);
                    selectCategory('첫 생각');
                  } else {
                    // 나의계획 모드: '오늘 할 일'로 즉시 등록
                    savePlan(text, true);
                    renderPlanView();
                  }

                  input.value = '';
                  input.style.height = 'auto';
                  currentAttachments = [];
                  cursorPositions['prompt-input'] = { start: 0, end: 0 };
                  renderAttachmentTray();
                  updateSendButtonState();
                } else {
                  toggleContinuousVoice('main');
                }
              }

              /* 음성 인식 엔진 */
              function toggleContinuousVoice(target) {
                activeVoiceTarget = target;
                closePlusMenu();

                let targetId = 'prompt-input';
                if (target === 'edit') targetId = 'edit-input';
                else if (target === 'plan-edit') targetId = 'plan-edit-newnote';

                const el = document.getElementById(targetId);
                if (el) trackCursor(el);

                if (isListeningContinuous) {
                  stopContinuousVoice();
                } else {
                  startContinuousVoice(target);
                }
              }

              function startContinuousVoice(target) {
                isListeningContinuous = true;
                updateVoiceButtonUI(true);

                if (window.AndroidBridge && window.AndroidBridge.startContinuousSpeech) {
                  window.AndroidBridge.startContinuousSpeech();
                } else {
                  startWebSpeechContinuous();
                }
              }

              function stopContinuousVoice() {
                isListeningContinuous = false;
                updateVoiceButtonUI(false);
                if (window.AndroidBridge && window.AndroidBridge.stopContinuousSpeech) {
                  window.AndroidBridge.stopContinuousSpeech();
                }
              }

              function updateVoiceButtonUI(listening) {
                const btnWave = document.getElementById('btn-wave');
                const btnMicMain = document.getElementById('btn-mic-main');
                const btnMicEdit = document.getElementById('edit-mic-btn');
                const btnMicPlan = document.getElementById('plan-mic-btn');

                [btnWave, btnMicMain, btnMicEdit, btnMicPlan].forEach(btn => {
                  if (btn) {
                    if (listening) btn.classList.add('listening');
                    else btn.classList.remove('listening');
                  }
                });
              }

              let webSpeechInstance = null;
              function startWebSpeechContinuous() {
                const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Speech) { alert('음성인식 기능을 지원하지 않는 기기입니다.'); stopContinuousVoice(); return; }
                webSpeechInstance = new Speech();
                webSpeechInstance.lang = 'ko-KR';
                webSpeechInstance.continuous = true;
                webSpeechInstance.interimResults = false;

                webSpeechInstance.onresult = (e) => {
                  const lastText = e.results[e.results.length - 1][0].transcript;
                  appendVoiceResult(lastText);
                };
                webSpeechInstance.onend = () => {
                  if (isListeningContinuous) {
                    try { webSpeechInstance.start(); } catch (e) {}
                  }
                };
                webSpeechInstance.start();
              }

              function appendVoiceResult(text) {
                if (!text || !text.trim()) return;
                const clean = text.trim();
                const now = Date.now();

                if (clean === lastProcessedVoice && (now - lastProcessedTime < 1800)) return;
                lastProcessedVoice = clean;
                lastProcessedTime = now;

                let targetId = 'prompt-input';
                if (activeVoiceTarget === 'edit') targetId = 'edit-input';
                else if (activeVoiceTarget === 'plan-edit') targetId = 'plan-edit-newnote';

                const el = document.getElementById(targetId);
                if (!el) return;

                let pos = cursorPositions[targetId] || { start: el.value.length, end: el.value.length };
                let start = (pos.start !== undefined && pos.start >= 0) ? pos.start : el.value.length;
                let end = (pos.end !== undefined && pos.end >= 0) ? pos.end : el.value.length;

                const val = el.value;
                const before = val.substring(0, start);
                const after = val.substring(end);

                const needsPreSpace = before.length > 0 && !before.endsWith(' ') && !before.endsWith('\n');
                const needsPostSpace = after.length > 0 && !after.startsWith(' ') && !after.startsWith('\n');

                const insertChunk = (needsPreSpace ? ' ' : '') + clean + (needsPostSpace ? ' ' : '');
                el.value = before + insertChunk + after;

                const nextPos = start + insertChunk.length;
                el.selectionStart = nextPos;
                el.selectionEnd = nextPos;
                cursorPositions[targetId] = { start: nextPos, end: nextPos };

                if (targetId === 'prompt-input') handleInputChange(el);
              }

              window.receiveVoiceResult = function(text) {
                if (text && text.trim()) appendVoiceResult(text);
              };

              window.onSpeechEndedNative = function() {
                if (!isListeningContinuous) updateVoiceButtonUI(false);
              };

              /* 플로팅 버튼 음성 수신 시 무조건 [생각서랍]으로 전환 */
              function pollFloatingVoiceText() {
                if (window.AndroidBridge && window.AndroidBridge.getPendingVoiceText) {
                  try {
                    const text = window.AndroidBridge.getPendingVoiceText();
                    if (text && text.trim().length > 0) {
                      switchMainMode('idea');
                      selectCategory('첫 생각');
                      activeVoiceTarget = 'main';
                      appendVoiceResult(text);
                    }
                  } catch (e) {}
                }
              }
              setInterval(pollFloatingVoiceText, 300);
              window.addEventListener('DOMContentLoaded', pollFloatingVoiceText);

              /* 저장소 관리: 생각서랍 */
              function getThoughtStorage() {
                const data = localStorage.getItem('idea_drawer_storage') || '[]';
                try { return JSON.parse(data); } catch (e) { return []; }
              }
              function setThoughtStorage(arr) {
                try { localStorage.setItem('idea_drawer_storage', JSON.stringify(arr)); } catch (e) {}
                renderFeed();
              }
              function saveThought(category, content, mediaList) {
                const list = getThoughtStorage();
                list.unshift({
                  id: Date.now(),
                  category: category,
                  content: content || '',
                  mediaList: mediaList || [],
                  time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
                });
                setThoughtStorage(list);
              }

              /* 저장소 관리: 나의계획 */
              function getPlanStorage() {
                const data = localStorage.getItem('plan_drawer_storage') || '[]';
                try { return JSON.parse(data); } catch (e) { return []; }
              }
              function setPlanStorage(arr) {
                try { localStorage.setItem('plan_drawer_storage', JSON.stringify(arr)); } catch (e) {}
                renderPlanView();
              }
              function savePlan(title, isToday = true) {
                if (!title || !title.trim()) return;
                const list = getPlanStorage();
                list.unshift({
                  id: Date.now(),
                  title: title.trim(),
                  status: '대기', // '대기' | '진행중' | '완료'
                  isToday: isToday,
                  notes: [],
                  updatedAt: new Date().toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })
                });
                setPlanStorage(list);
              }

              /* 생각서랍 카드 -> 나의계획으로 전송 */
              function sendThoughtToPlan(id) {
                const thought = getThoughtStorage().find(t => t.id === id);
                if (thought) {
                  const title = thought.content ? thought.content.split('\n')[0] : `[${thought.category}] 계획 항목`;
                  savePlan(title, true);
                  alert('⚡ 오늘 할 일 목록에 등록되었습니다!');
                }
              }

              /* 생각서랍 피드 렌더링 */
              function renderFeed() {
                const list = getThoughtStorage();
                const feed = document.getElementById('idea-feed-container');

                if (currentCategory === '첫 생각') {
                  feed.innerHTML = `
                    <div class="empty-canvas">
                      떠오르는 생각을 자유롭게 기록하세요.<br>
                      저장 즉시 서랍으로 들어가 깨끗한 화면이 유지됩니다.
                    </div>
                  `;
                  return;
                }

                const filtered = (currentCategory === '전체') 
                  ? list 
                  : list.filter(i => (i.category || i.type || '').includes(currentCategory));

                if (filtered.length === 0) {
                  feed.innerHTML = `<div class="empty-canvas">저장된 [${currentCategory}] 생각이 없습니다.</div>`;
                  return;
                }

                feed.innerHTML = filtered.map(item => `
                  <div class="thought-card">
                    <div class="card-header">
                      <span class="card-badge">${item.category || item.type || '노트'}</span>
                      <span class="card-time">${item.time}</span>
                    </div>
                    ${item.mediaList && item.mediaList.length > 0 ? `
                      <div class="card-media-grid">
                        ${item.mediaList.map(m => `<img src="${m.data}" class="media-thumb-item" />`).join('')}
                      </div>
                    ` : ''}
                    ${item.content ? `<div class="card-content">${item.content}</div>` : ''}
                    <div class="card-actions">
                      <button class="card-btn plan-send" onclick="sendThoughtToPlan(${item.id})">📋 계획으로</button>
                      <button class="card-btn" onclick="openEditModal(${item.id})">✏️ 수정</button>
                      <button class="card-btn" onclick="copyThought('${encodeURIComponent(item.content || '')}')">📋 복사</button>
                      <button class="card-btn delete" onclick="deleteThought(${item.id})">🗑️ 삭제</button>
                    </div>
                  </div>
                `).join('');
              }

              function copyThought(encoded) {
                const text = decodeURIComponent(encoded);
                navigator.clipboard.writeText(text).then(() => alert('클립보드에 복사되었습니다.'));
              }

              function deleteThought(id) {
                if (confirm('이 생각을 삭제하시겠습니까?')) {
                  const list = getThoughtStorage().filter(i => i.id !== id);
                  setThoughtStorage(list);
                }
              }

              /* 나의계획 피드 렌더링 (2단 구조) */
              function renderPlanView() {
                const list = getPlanStorage();
                const todayList = list.filter(p => p.isToday);
                const backlogList = list.filter(p => !p.isToday);

                document.getElementById('today-count-badge').innerText = `${todayList.length}건`;
                document.getElementById('backlog-count-badge').innerText = `${backlogList.length}건`;

                const todayContainer = document.getElementById('today-plan-list');
                const backlogContainer = document.getElementById('backlog-plan-list');

                if (todayList.length === 0) {
                  todayContainer.innerHTML = '<div style="color:#52525b; font-size:0.85rem; padding:10px 4px;">오늘 집중할 계획이 없습니다. 아래 입력창으로 추가하세요.</div>';
                } else {
                  todayContainer.innerHTML = todayList.map(p => renderPlanCardHtml(p)).join('');
                }

                if (backlogList.length === 0) {
                  backlogContainer.innerHTML = '<div style="color:#52525b; font-size:0.85rem; padding:10px 4px;">보관된 장기 프로젝트나 대기 작업이 없습니다.</div>';
                } else {
                  backlogContainer.innerHTML = backlogList.map(p => renderPlanCardHtml(p)).join('');
                }
              }

              function renderPlanCardHtml(p) {
                const isDone = p.status === '완료';
                const statusClass = (p.status === '진행중') ? 'progress' : (isDone ? 'done' : 'waiting');

                return `
                  <div class="plan-card ${isDone ? 'completed' : ''}">
                    <div class="plan-card-top">
                      <span class="status-tag ${statusClass}" onclick="cyclePlanStatus(${p.id})">${p.status}</span>
                      <div class="plan-title ${isDone ? 'completed' : ''}">${p.title}</div>
                      <span style="font-size:0.75rem; color:var(--muted);">${p.updatedAt}</span>
                    </div>

                    ${p.notes && p.notes.length > 0 ? `
                      <div class="plan-notes-box">
                        ${p.notes.map(n => `<div class="plan-note-item">• ${n}</div>`).join('')}
                      </div>
                    ` : ''}

                    <div class="card-actions" style="margin-top:2px;">
                      <button class="card-btn" onclick="toggleTodayFlag(${p.id})">${p.isToday ? '🔄 보관으로' : '⚡ 오늘로'}</button>
                      <button class="card-btn" onclick="openPlanEditModal(${p.id})">✏️ 메모/수정</button>
                      <button class="card-btn delete" onclick="deletePlan(${p.id})">🗑️ 삭제</button>
                    </div>
                  </div>
                `;
              }

              /* 원터치 상태 순환 (대기 -> 진행중 -> 완료) */
              function cyclePlanStatus(id) {
                const list = getPlanStorage();
                const item = list.find(p => p.id === id);
                if (item) {
                  if (item.status === '대기') item.status = '진행중';
                  else if (item.status === '진행중') item.status = '완료';
                  else item.status = '대기';
                  setPlanStorage(list);
                }
              }

              function toggleTodayFlag(id) {
                const list = getPlanStorage();
                const item = list.find(p => p.id === id);
                if (item) {
                  item.isToday = !item.isToday;
                  setPlanStorage(list);
                }
              }

              function deletePlan(id) {
                if (confirm('이 계획을 삭제하시겠습니까?')) {
                  const list = getPlanStorage().filter(p => p.id !== id);
                  setPlanStorage(list);
                }
              }

              /* 나의계획 상세 수정 모달 */
              function openPlanEditModal(id) {
                const item = getPlanStorage().find(p => p.id === id);
                if (item) {
                  editingPlanId = id;
                  document.getElementById('plan-edit-title').value = item.title;
                  document.getElementById('plan-edit-newnote').value = '';
                  
                  const hist = document.getElementById('plan-edit-history');
                  hist.innerHTML = (item.notes && item.notes.length > 0)
                    ? item.notes.map(n => `<div>• ${n}</div>`).join('')
                    : '<span style="color:#52525b;">기록된 진행 메모가 없습니다.</span>';

                  cursorPositions['plan-edit-newnote'] = { start: 0, end: 0 };
                  document.getElementById('plan-edit-modal').classList.add('active');
                }
              }

              function closePlanEditModal() {
                if (isListeningContinuous) stopContinuousVoice();
                document.getElementById('plan-edit-modal').classList.remove('active');
                editingPlanId = null;
              }

              function confirmEditPlan() {
                const title = document.getElementById('plan-edit-title').value.trim();
                const newNote = document.getElementById('plan-edit-newnote').value.trim();
                const list = getPlanStorage();
                const target = list.find(p => p.id === editingPlanId);

                if (target && title) {
                  target.title = title;
                  if (newNote) {
                    const timeStamp = new Date().toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' });
                    target.notes.push(`[${timeStamp}] ${newNote}`);
                  }
                  target.updatedAt = new Date().toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' });
                  setPlanStorage(list);
                }
                closePlanEditModal();
              }

              /* 생각서랍 수정 모달 */
              function openEditModal(id) {
                const item = getThoughtStorage().find(i => i.id === id);
                if (item) {
                  editingThoughtId = id;
                  editingMediaList = JSON.parse(JSON.stringify(item.mediaList || []));
                  const editArea = document.getElementById('edit-input');
                  editArea.value = item.content || '';
                  cursorPositions['edit-input'] = { start: editArea.value.length, end: editArea.value.length };
                  
                  const cat = item.category || item.type || '노트';
                  document.getElementById('edit-modal-title').innerText = `✏️ [${cat}] 수정`;

                  renderCustomEditToolbar(cat, editingMediaList);
                  renderEditMediaPreview();
                  document.getElementById('edit-modal').classList.add('active');
                }
              }

              function renderCustomEditToolbar(category, mediaList) {
                const toolbar = document.getElementById('edit-media-toolbar');
                let buttons = '';
                if (category.includes('스케치') || mediaList.some(m => m.type === '스케치')) {
                  buttons += `<button class="edit-add-btn" onclick="openSketchModal('edit')">🎨 스케치 추가</button>`;
                } else if (category.includes('사진') || mediaList.some(m => m.type === '사진')) {
                  buttons += `<button class="edit-add-btn" onclick="triggerCamera('edit')">📷 촬영 추가</button><button class="edit-add-btn" onclick="triggerGallery('edit')">🖼️ 사진 추가</button>`;
                } else if (category.includes('동영상') || mediaList.some(m => m.type === '동영상')) {
                  buttons += `<button class="edit-add-btn" onclick="triggerVideo('edit')">🎬 영상 추가</button>`;
                }
                toolbar.style.display = buttons ? 'flex' : 'none';
                toolbar.innerHTML = buttons;
              }

              function renderEditMediaPreview() {
                const mediaBox = document.getElementById('edit-media-preview');
                mediaBox.innerHTML = editingMediaList.map((m, idx) => `
                  <div style="position:relative; width:100%; height:110px;">
                    <img src="${m.data}" class="media-thumb-item" style="width:100%; height:100%; object-fit:cover;" />
                    <button onclick="removeEditMedia(${idx})" style="position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:var(--danger); color:#fff; border:none; font-size:0.75rem; cursor:pointer;">✕</button>
                  </div>
                `).join('');
              }
              function removeEditMedia(idx) { editingMediaList.splice(idx, 1); renderEditMediaPreview(); }

              function closeEditModal() {
                if (isListeningContinuous) stopContinuousVoice();
                document.getElementById('edit-modal').classList.remove('active');
                editingThoughtId = null;
                editingMediaList = [];
              }

              function confirmEditThought() {
                if (isListeningContinuous) stopContinuousVoice();
                const text = document.getElementById('edit-input').value.trim();
                const list = getThoughtStorage();
                const target = list.find(i => i.id === editingThoughtId);
                if (target) {
                  target.content = text;
                  target.mediaList = editingMediaList;
                  if (editingMediaList.length > 0) {
                    if (editingMediaList.some(a => a.type === '동영상')) target.category = '동영상';
                    else if (editingMediaList.some(a => a.type === '스케치')) target.category = '스케치';
                    else if (editingMediaList.some(a => a.type === '사진')) target.category = '사진';
                  } else {
                    target.category = '노트';
                  }
                  target.time = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + ' (수정됨)';
                  setThoughtStorage(list);
                }
                closeEditModal();
              }

              /* 스케치 모달 */
              const canvas = document.getElementById('sketch-board');
              const ctx = canvas.getContext('2d');
              let isDrawing = false;
              let currentColor = '#000000';

              function setDrawColor(color, el) {
                currentColor = color;
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                if (el) el.classList.add('active');
                ctx.strokeStyle = currentColor;
              }

              function openSketchModal(context = 'main') {
                activeTargetContext = context;
                closePlusMenu();
                document.getElementById('sketch-modal').classList.add('active');
                setTimeout(() => {
                  const box = document.getElementById('canvas-wrapper');
                  canvas.width = box.clientWidth || 300;
                  canvas.height = box.clientHeight || 300;
                  ctx.fillStyle = '#ffffff';
                  ctx.fillRect(0, 0, canvas.width, canvas.height);
                  ctx.lineWidth = 4;
                  ctx.lineCap = 'round';
                  ctx.strokeStyle = currentColor;
                }, 50);
              }
              function closeSketchModal() { document.getElementById('sketch-modal').classList.remove('active'); }
              function clearCanvas() { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); }

              function attachSketch() {
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                const item = { type: '스케치', data: dataUrl, isVideo: false };
                if (activeTargetContext === 'edit') {
                  editingMediaList.push(item);
                  renderEditMediaPreview();
                } else {
                  currentAttachments.push(item);
                  renderAttachmentTray();
                  updateSendButtonState();
                }
                closeSketchModal();
              }

              function getPos(e) {
                const r = canvas.getBoundingClientRect();
                const t = e.touches ? e.touches[0] : e;
                return { x: t.clientX - r.left, y: t.clientY - r.top };
              }
              canvas.addEventListener('mousedown', (e) => { isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
              canvas.addEventListener('mousemove', (e) => { if (!isDrawing) return; ctx.strokeStyle = currentColor; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
              canvas.addEventListener('mouseup', () => { isDrawing = false; });
              canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }, { passive: false });
              canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (!isDrawing) return; ctx.strokeStyle = currentColor; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }, { passive: false });
              canvas.addEventListener('touchend', () => { isDrawing = false; });

              function openArchiveModal() {
                document.getElementById('archive-modal').classList.add('active');
                const list = getThoughtStorage();
                const feed = document.getElementById('archive-feed');
                if (list.length === 0) {
                  feed.innerHTML = '<p style="color:#55555c; text-align:center; margin-top:40px;">보관된 생각이 없습니다.</p>';
                  return;
                }
                feed.innerHTML = list.map(item => `
                  <div class="thought-card">
                    <div class="card-header">
                      <span class="card-badge">${item.category || item.type || '노트'}</span>
                      <span class="card-time">${item.time}</span>
                    </div>
                    ${item.mediaList && item.mediaList.length > 0 ? `
                      <div class="card-media-grid">
                        ${item.mediaList.map(m => `<img src="${m.data}" class="media-thumb-item" />`).join('')}
                      </div>
                    ` : ''}
                    ${item.content ? `<div class="card-content">${item.content}</div>` : ''}
                    <div class="card-actions">
                      <button class="card-btn plan-send" onclick="sendThoughtToPlan(${item.id})">📋 계획으로</button>
                      <button class="card-btn" onclick="openEditModal(${item.id})">✏️ 수정</button>
                      <button class="card-btn delete" onclick="deleteThought(${item.id}); openArchiveModal();">🗑️ 삭제</button>
                    </div>
                  </div>
                `).join('');
              }
              function closeArchiveModal() { document.getElementById('archive-modal').classList.remove('active'); }

              selectCategory('첫 생각');
            </script>
          </body>
          </html>
          EOF

      - name: 5. 고정 Keystore 및 노란 전구 플로팅 엔진 주입
        run: |
          cat << 'EOF' > package.json
          {
            "name": "my-idea-drawer",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.k2hkkh.ideadrawer",
            "appName": "생각서랍",
            "webDir": "www"
          }
          EOF

          npm install
          npx cap add android

          # 고정 Keystore 보존
          if [ -f "release.keystore" ]; then
            cp release.keystore android/app/release.keystore
          else
            keytool -genkey -v -keystore android/app/release.keystore -alias ideadrawer -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=IdeaDrawer, OU=Dev, O=Idea, L=Seoul, S=Seoul, C=KR"
            cp android/app/release.keystore release.keystore
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            git add release.keystore
            git commit -m "Save permanent keystore [skip ci]" || true
            git push origin HEAD || true
          fi

          node -e '
          const fs = require("fs");
          const p = "android/app/build.gradle";
          let gradle = fs.readFileSync(p, "utf8");
          const signBlock = `
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "android"
                      keyAlias "ideadrawer"
                      keyPassword "android"
                  }
              }
          `;
          gradle = gradle.replace("android {", "android {" + signBlock);
          gradle = gradle.replace(/buildTypes\s*\{[\s\S]*?release\s*\{/, "buildTypes {\n        debug {\n            signingConfig signingConfigs.release\n        }\n        release {\n            signingConfig signingConfigs.release\n");
          fs.writeFileSync(p, gradle, "utf8");
          '

          BUILD_NUM=${{ github.run_number }}
          sed -i "s/versionCode 1/versionCode $BUILD_NUM/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.$BUILD_NUM\"/g" android/app/build.gradle

          node -e '
          const fs = require("fs");
          const p = "android/app/src/main/AndroidManifest.xml";
          let xml = fs.readFileSync(p, "utf8");
          const perms = "\n    <uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\" />\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-permission android:name=\"android.permission.VIBRATE\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MICROPHONE\" />\n";
          const srv = "\n    <service android:name=\"com.k2hkkh.ideadrawer.FloatingWidgetService\" android:enabled=\"true\" android:exported=\"false\" android:foregroundServiceType=\"microphone\" />\n";
          xml = xml.replace("<application", perms + "    <application");
          xml = xml.replace("</application>", srv + "    </application>");
          fs.writeFileSync(p, xml, "utf8");
          '

          mkdir -p android/app/src/main/java/com/k2hkkh/ideadrawer

          # 노란 전구 다마(💡) 플로팅 위젯 소스코드
          cat << 'EOF' > android/app/src/main/java/com/k2hkkh/ideadrawer/FloatingWidgetService.java
          package com.k2hkkh.ideadrawer;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.Vibrator;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.core.app.NotificationCompat;
          import java.util.ArrayList;

          public class FloatingWidgetService extends Service {
              private WindowManager windowManager;
              private TextView floatingView;
              private SpeechRecognizer speechRecognizer;
              private boolean isListening = false;
              private GradientDrawable normalBg, activeBg;

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();

                  try {
                      Notification notification = new NotificationCompat.Builder(this, "floating_channel")
                              .setContentTitle("생각서랍 플로팅 실행 중")
                              .setContentText("터치하여 바로 음성으로 기록하세요.")
                              .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                              .setPriority(NotificationCompat.PRIORITY_LOW)
                              .build();
                      startForeground(1001, notification);
                  } catch (Exception ignored) {}

                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);

                  floatingView = new TextView(this);
                  floatingView.setText("💡");
                  floatingView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 24);
                  floatingView.setGravity(Gravity.CENTER);

                  normalBg = new GradientDrawable();
                  normalBg.setShape(GradientDrawable.OVAL);
                  normalBg.setColor(Color.parseColor("#1C1C1E"));
                  normalBg.setStroke(2, Color.parseColor("#38BDF8"));

                  activeBg = new GradientDrawable();
                  activeBg.setShape(GradientDrawable.OVAL);
                  activeBg.setColor(Color.parseColor("#EF4444"));

                  floatingView.setBackground(normalBg);

                  int layoutType = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ?
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY :
                          WindowManager.LayoutParams.TYPE_PHONE;

                  final WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          145, 145,
                          layoutType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                  );

                  params.gravity = Gravity.TOP | Gravity.START;
                  params.x = 60;
                  params.y = 300;

                  floatingView.setOnTouchListener(new View.OnTouchListener() {
                      private int initialX, initialY;
                      private float initialTouchX, initialTouchY;

                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  initialX = params.x;
                                  initialY = params.y;
                                  initialTouchX = event.getRawX();
                                  initialTouchY = event.getRawY();
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  params.x = initialX + (int) (event.getRawX() - initialTouchX);
                                  params.y = initialY + (int) (event.getRawY() - initialTouchY);
                                  if (windowManager != null) windowManager.updateViewLayout(floatingView, params);
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  float diffX = Math.abs(event.getRawX() - initialTouchX);
                                  float diffY = Math.abs(event.getRawY() - initialTouchY);
                                  if (diffX < 15 && diffY < 15) {
                                      startFloatingVoice();
                                  }
                                  return true;
                          }
                          return false;
                      }
                  });

                  if (windowManager != null) windowManager.addView(floatingView, params);
              }

              private void startFloatingVoice() {
                  new Handler(Looper.getMainLooper()).post(() -> {
                      if (isListening) {
                          if (speechRecognizer != null) speechRecognizer.stopListening();
                          return;
                      }

                      vibrateDevice();

                      try {
                          if (speechRecognizer != null) {
                              speechRecognizer.destroy();
                              speechRecognizer = null;
                          }

                          speechRecognizer = SpeechRecognizer.createSpeechRecognizer(getApplicationContext());
                          Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                          intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                          intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ko-KR");
                          intent.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, getPackageName());
                          
                          intent.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 6000L);
                          intent.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 6000L);

                          speechRecognizer.setRecognitionListener(new RecognitionListener() {
                              @Override
                              public void onReadyForSpeech(Bundle params) {
                                  isListening = true;
                                  floatingView.setBackground(activeBg);
                                  floatingView.setText("🎙️");
                                  Toast.makeText(getApplicationContext(), "💡 듣고 있습니다. 편하게 말씀하세요...", Toast.LENGTH_SHORT).show();
                              }

                              @Override public void onBeginningOfSpeech() {}
                              @Override public void onRmsChanged(float rmsdB) {}
                              @Override public void onBufferReceived(byte[] buffer) {}
                              @Override public void onEndOfSpeech() {}

                              @Override
                              public void onError(int error) {
                                  resetFloatingButton();
                              }

                              @Override
                              public void onResults(Bundle results) {
                                  resetFloatingButton();
                                  vibrateDevice();
                                  ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                  if (matches != null && !matches.isEmpty()) {
                                      String spokenText = matches.get(0);
                                      SharedPreferences prefs = getSharedPreferences("IdeaPrefs", MODE_PRIVATE);
                                      prefs.edit().putString("PENDING_VOICE", spokenText).apply();

                                      Intent appIntent = new Intent(FloatingWidgetService.this, MainActivity.class);
                                      appIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                                      startActivity(appIntent);
                                  }
                              }

                              @Override public void onPartialResults(Bundle partialResults) {}
                              @Override public void onEvent(int eventType, Bundle params) {}
                          });

                          speechRecognizer.startListening(intent);
                      } catch (Exception e) {
                          resetFloatingButton();
                      }
                  });
              }

              private void vibrateDevice() {
                  try {
                      Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (v != null) v.vibrate(50);
                  } catch (Exception ignored) {}
              }

              private void resetFloatingButton() {
                  isListening = false;
                  floatingView.setBackground(normalBg);
                  floatingView.setText("💡");
                  if (speechRecognizer != null) {
                      try { speechRecognizer.destroy(); } catch (Exception ignored) {}
                      speechRecognizer = null;
                  }
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel("floating_channel", "생각서랍 플로팅", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  resetFloatingButton();
                  if (floatingView != null && windowManager != null) {
                      try { windowManager.removeView(floatingView); } catch (Exception ignored) {}
                  }
              }
          }
          EOF

          # 메인 액티비티 소스코드
          cat << 'EOF' > android/app/src/main/java/com/k2hkkh/ideadrawer/MainActivity.java
          package com.k2hkkh.ideadrawer;

          import android.Manifest;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;

          public class MainActivity extends BridgeActivity {
              private SpeechRecognizer inAppRecognizer;
              private boolean isContinuousMode = false;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestAppPermissions();
                  startWidgetIfAllowed();

                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void startContinuousSpeech() {
                              new Handler(Looper.getMainLooper()).post(() -> {
                                  isContinuousMode = true;
                                  startListeningLoop();
                              });
                          }

                          @JavascriptInterface
                          public void stopContinuousSpeech() {
                              new Handler(Looper.getMainLooper()).post(() -> {
                                  isContinuousMode = false;
                                  if (inAppRecognizer != null) {
                                      inAppRecognizer.stopListening();
                                      inAppRecognizer.destroy();
                                      inAppRecognizer = null;
                                  }
                                  evalJS("if (window.onSpeechEndedNative) window.onSpeechEndedNative();");
                              });
                          }

                          @JavascriptInterface
                          public String getPendingVoiceText() {
                              SharedPreferences prefs = getSharedPreferences("IdeaPrefs", MODE_PRIVATE);
                              String pending = prefs.getString("PENDING_VOICE", "");
                              if (pending != null && !pending.isEmpty()) {
                                  prefs.edit().remove("PENDING_VOICE").apply();
                              }
                              return pending;
                          }
                      }, "AndroidBridge");
                  }
              }

              private void requestAppPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED ||
                          ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{
                                  Manifest.permission.RECORD_AUDIO,
                                  Manifest.permission.CAMERA
                          }, 200);
                      }
                  }
              }

              private void startListeningLoop() {
                  if (!isContinuousMode) return;

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestAppPermissions();
                      isContinuousMode = false;
                      evalJS("if (window.onSpeechEndedNative) window.onSpeechEndedNative();");
                      return;
                  }

                  try {
                      if (inAppRecognizer != null) {
                          inAppRecognizer.destroy();
                          inAppRecognizer = null;
                      }

                      inAppRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                      Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ko-KR");
                      intent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);

                      inAppRecognizer.setRecognitionListener(new RecognitionListener() {
                          @Override public void onReadyForSpeech(Bundle params) {}
                          @Override public void onBeginningOfSpeech() {}
                          @Override public void onRmsChanged(float rmsdB) {}
                          @Override public void onBufferReceived(byte[] buffer) {}
                          @Override public void onEndOfSpeech() {}

                          @Override
                          public void onError(int error) {
                              if (isContinuousMode) {
                                  new Handler(Looper.getMainLooper()).postDelayed(() -> startListeningLoop(), 200);
                              } else {
                                  evalJS("if (window.onSpeechEndedNative) window.onSpeechEndedNative();");
                              }
                          }

                          @Override
                          public void onResults(Bundle results) {
                              ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                              if (matches != null && !matches.isEmpty()) {
                                  sendTextToWebView(matches.get(0));
                              }
                              if (isContinuousMode) {
                                  new Handler(Looper.getMainLooper()).postDelayed(() -> startListeningLoop(), 100);
                              }
                          }

                          @Override public void onPartialResults(Bundle partialResults) {}
                          @Override public void onEvent(int eventType, Bundle params) {}
                      });

                      inAppRecognizer.startListening(intent);
                  } catch (Exception e) {
                      isContinuousMode = false;
                      evalJS("if (window.onSpeechEndedNative) window.onSpeechEndedNative();");
                  }
              }

              private void evalJS(String script) {
                if (getBridge() != null && getBridge().getWebView() != null) {
                    getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript(script, null));
                }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  startWidgetIfAllowed();
              }

              @Override
              public void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
              }

              private void sendTextToWebView(String text) {
                  if (text != null) {
                      String cleanText = text.replace("\\", "\\\\").replace("'", "\\'").replace("\n", " ");
                      evalJS("if (window.receiveVoiceResult) window.receiveVoiceResult('" + cleanText + "');");
                  }
              }

              private void startWidgetIfAllowed() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (Settings.canDrawOverlays(this)) {
                          Intent intent = new Intent(this, FloatingWidgetService.class);
                          try {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  startForegroundService(intent);
                              } else {
                                  startService(intent);
                              }
                          } catch (Exception ignored) {}
                      }
                  } else {
                      Intent intent = new Intent(this, FloatingWidgetService.class);
                      startService(intent);
                  }
              }
          }
