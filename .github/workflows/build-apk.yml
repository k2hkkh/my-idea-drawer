                <div class="manual-card">
                  <div class="manual-title">4. 데이터 백업 및 휴지통 복원</div>
                  <div class="manual-desc">
                    보관함(`📂`)에서 버린 메모딱지를 되살리는 **휴지통**과 스마트폰 교체 시 데이터를 안전하게 보존하는 **백업/복원**을 이용할 수 있습니다.
                  </div>
                </div>
