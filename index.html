<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- 캐시 방지 메타태그 (무중단 배포 시 즉시 반영) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>생각서랍 - 1인 기업가를 위한 AI 아이디어 파이프라인</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandDark: '#171412',
            cardDark: '#24201d',
            borderDark: '#38322d',
            accentGreen: '#709b78',
            accentYellow: '#eab308'
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN (Cloudflare CDN) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <style>
    body {
      background-color: #171412;
      color: #f3f4f6;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    textarea {
      resize: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#171412] text-gray-200 min-h-screen pb-28">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, Component, useRef } = React;

    // --- 동적 AI 검증 분석 알고리즘 엔진 ---
    function evaluateIdeaDynamic(text, category) {
      if (!text) text = "";
      const clean = text.toLowerCase();
      
      let hash = 0;
      for (let i = 0; i < clean.length; i++) {
        hash = (hash << 5) - hash + clean.charCodeAt(i);
        hash |= 0;
      }
      const seed = Math.abs(hash);

      // 1. B2B 확장성
      let b2b = 68 + (seed % 14);
      if (/공공|기관|기업|b2b|납품|솔루션|플랫폼|단체|지자체|행정|시스템|데이터|연계/.test(clean)) b2b += 14;
      if (/초간편|단순|개인|일상|취미|메모|딱지/.test(clean)) b2b -= 6;
      b2b = Math.min(98, Math.max(55, b2b));

      // 2. 시간/비용 절감
      let cost = 72 + ((seed >> 2) % 15);
      if (/초간편|간단|단순|원클릭|자동|절감|단축|즉시|녹음|빠른|효율/.test(clean)) cost += 13;
      if (/공공기관|심사|복잡|공정|대규모/.test(clean)) cost -= 5;
      cost = Math.min(98, Math.max(58, cost));

      // 3. 특허 진입장벽
      let patent = 65 + ((seed >> 4) % 16);
      if (/특허|장치|구조|기구|메커니즘|센서|하드웨어|원천기술|알고리즘/.test(clean) || category === '특허') patent += 16;
      if (/메모|딱지|간단|앱|단순|아이디어/.test(clean)) patent -= 4;
      patent = Math.min(98, Math.max(52, patent));

      // 4. 1인 실행력
      let execution = 70 + ((seed >> 6) % 15);
      if (/1인|혼자|초간편|단순|앱|가벼운|웹|바로/.test(clean)) execution += 14;
      if (/공공기관|하드웨어|금형|공장|인허가|법률|대규모/.test(clean)) execution -= 12;
      execution = Math.min(98, Math.max(50, execution));

      // 맞춤 조언
      let advice = "";
      if (execution >= 85 && cost >= 85) {
        advice = "1인 린 스타트업으로 즉시 개발 및 출시하기에 최적입니다. 최소 기능(MVP)으로 빠르게 시장 피드백을 수집하세요.";
      } else if (patent >= 85) {
        advice = "독창적인 구조와 기술적 차별점이 돋보입니다. 개발 착수 전 선행기술조사를 진행하고 특허 명세서 가출원을 권장합니다.";
      } else if (b2b >= 85) {
        advice = "공공/기업 타깃 시장 규모가 큽니다. 초기 PoC(개념 검증) 사례를 구축하여 시범 사업 제안서 형태로 접근하는 것이 유리합니다.";
      } else if (execution < 65) {
        advice = "아이디어의 잠재력은 높으나 초기 리소스가 많이 필요합니다. 공공 연계나 파트너십을 고려하여 1단계 범위를 축소해 보세요.";
      } else {
        advice = "핵심 가치 제안이 명확합니다. 타깃 사용자의 가장 큰 불편(Pain Point)을 해결하는 단일 핵심 기능에 집중하세요.";
      }

      const avg = (b2b + cost + patent + execution) / 4;
      const statusBadge = avg >= 78 ? "승인" : avg >= 68 ? "검토" : "보완";

      return { b2b, cost, patent, execution, advice, statusBadge };
    }

    // --- 전수 로컬스토리지 복원 & 마이그레이션 모듈 ---
    function loadAndMigrateAllData() {
      const STORAGE_KEY = "my_idea_drawer_data_v2";
      let allFoundItems = [];
      const seenTexts = new Set();

      const normalize = (raw, fallbackCategory = "제품") => {
        const text = typeof raw === 'string' ? raw : (raw.text || raw.content || raw.title || raw.memo || "");
        if (!text || seenTexts.has(text.trim())) return null;
        seenTexts.add(text.trim());

        const category = (typeof raw === 'object' && raw.category) ? raw.category : fallbackCategory;
        const pipeline = (typeof raw === 'object' && raw.pipeline) ? raw.pipeline : "02"; // 기존 데이터는 '02 검증'으로 마이그레이션
        const evaluation = (typeof raw === 'object' && raw.evaluation) ? raw.evaluation : evaluateIdeaDynamic(text, category);

        return {
          id: (typeof raw === 'object' && raw.id) ? String(raw.id) : (Date.now().toString() + Math.random().toString(36).substr(2, 4)),
          category,
          text: text.trim(),
          createdAt: (typeof raw === 'object' && raw.createdAt) ? raw.createdAt : new Date().toISOString(),
          pipeline,
          evaluation
        };
      };

      // 1. 주요 알려진 키 탐색
      const knownKeys = [
        STORAGE_KEY,
        "my_idea_drawer_data",
        "ideas",
        "my_ideas",
        "idea_drawer",
        "my-idea-drawer",
        "ideaDrawer",
        "drawer_ideas",
        "notes",
        "idea_list"
      ];

      knownKeys.forEach(k => {
        try {
          const raw = localStorage.getItem(k);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              parsed.forEach(item => {
                const norm = normalize(item);
                if (norm) allFoundItems.push(norm);
              });
            }
          }
        } catch (e) {}
      });

      // 2. 브라우저 localStorage 전수 조사 (어떤 키든 JSON 배열이나 객체가 있으면 추출)
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k || knownKeys.includes(k)) continue;
          try {
            const raw = localStorage.getItem(k);
            if (raw && (raw.startsWith("[") || raw.startsWith("{"))) {
              const parsed = JSON.parse(raw);
              if (Array.isArray(parsed)) {
                parsed.forEach(item => {
                  const norm = normalize(item);
                  if (norm) allFoundItems.push(norm);
                });
              }
            }
          } catch(e) {}
        }
      } catch(e) {}

      // 복원된 최신 데이터를 최신 표준 키에 영구 보존
      localStorage.setItem(STORAGE_KEY, JSON.stringify(allFoundItems));
      return allFoundItems;
    }

    // --- 에러 바운더리 (화면 멈춤 방어 및 긴급 백업) ---
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() {
        return { hasError: true };
      }
      downloadBackup = () => {
        const data = localStorage.getItem("my_idea_drawer_data_v2") || "[]";
        const blob = new Blob([data], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `idea_drawer_emergency_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      };
      render() {
        if (this.state.hasError) {
          return (
            <div class="p-6 max-w-md mx-auto text-center mt-12 bg-[#24201d] rounded-2xl border border-red-500/40">
              <h2 class="text-xl font-bold text-red-400 mb-2">시스템 안전 모드 전환</h2>
              <p class="text-xs text-gray-400 mb-6">데이터는 안전하게 보관되어 있습니다. 백업을 내려받거나 새로고침하세요.</p>
              <button onClick={this.downloadBackup} class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl text-sm mb-2">
                긴급 데이터 백업 (JSON 다운로드)
              </button>
              <button onClick={() => window.location.reload()} class="w-full py-3 bg-stone-800 text-stone-300 rounded-xl text-sm">
                화면 새로고침
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // --- 메인 App 컴포넌트 ---
    function IdeaDrawerApp() {
      const [tab, setTab] = useState("01"); // 01:생각, 02:검증, 03:보류, 04:실행
      const [category, setCategory] = useState("제품");
      const [inputText, setInputText] = useState("");
      const [ideas, setIdeas] = useState([]);
      const [editingId, setEditingId] = useState(null);
      const [editText, setEditText] = useState("");
      const [showBackupModal, setShowBackupModal] = useState(false);
      const fileInputRef = useRef(null);

      // 데이터 로드 & 전수 마이그레이션 실행
      useEffect(() => {
        const restored = loadAndMigrateAllData();
        setIdeas(restored);
      }, []);

      const saveIdeas = (newIdeas) => {
        setIdeas(newIdeas);
        localStorage.setItem("my_idea_drawer_data_v2", JSON.stringify(newIdeas));
      };

      // 새 생각 등록
      const handleAddIdea = () => {
        if (!inputText.trim()) return;
        const evaluation = evaluateIdeaDynamic(inputText, category);
        const newIdea = {
          id: Date.now().toString(),
          category,
          text: inputText.trim(),
          createdAt: new Date().toISOString(),
          pipeline: "02", // 등록 즉시 02 검증 파이프라인으로 이동
          evaluation
        };
        const updated = [newIdea, ...ideas];
        saveIdeas(updated);
        setInputText("");
        setTab("02"); // 작성 완료 후 바로 02 검증 탭에서 확인
      };

      // 파이프라인 이동 (02 검증 / 03 보류 / 04 실행)
      const movePipeline = (id, targetPipeline) => {
        const updated = ideas.map(item => item.id === id ? { ...item, pipeline: targetPipeline } : item);
        saveIdeas(updated);
      };

      // 삭제
      const deleteIdea = (id) => {
        if (confirm("이 아이디어를 삭제하시겠습니까?")) {
          saveIdeas(ideas.filter(item => item.id !== id));
        }
      };

      // 수정 시작
      const startEditing = (item) => {
        setEditingId(item.id);
        setEditText(item.text);
      };

      // 수정 저장 (내용 변경 시 점수 및 AI 조언 즉시 재계산)
      const saveEdit = (id) => {
        if (!editText.trim()) return;
        const updated = ideas.map(item => {
          if (item.id === id) {
            const reEvaluation = evaluateIdeaDynamic(editText, item.category);
            return {
              ...item,
              text: editText.trim(),
              evaluation: reEvaluation,
              updatedAt: new Date().toISOString()
            };
          }
          return item;
        });
        saveIdeas(updated);
        setEditingId(null);
        setEditText("");
      };

      // JSON 백업 다운로드
      const exportJSON = () => {
        const blob = new Blob([JSON.stringify(ideas, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `생각서랍_전체백업_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
      };

      // JSON 파일 복원
      const importJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (Array.isArray(imported)) {
              saveIdeas(imported);
              alert(`${imported.length}개의 아이디어가 성공적으로 복원되었습니다.`);
              setShowBackupModal(false);
            } else {
              alert("올바른 백업 파일 형식이 아닙니다.");
            }
          } catch (err) {
            alert("파일을 읽는 도중 오류가 발생했습니다.");
          }
        };
        reader.readAsText(file);
      };

      const categories = ["제품", "앱/SW", "비즈니스", "특허", "개발메모"];

      return (
        <div class="max-w-md mx-auto px-4 pt-6">
          {/* 상단 헤더 */}
          <header class="mb-5 flex justify-between items-center">
            <div>
              <h1 class="text-2xl font-bold tracking-tight text-white">생각서랍</h1>
              <p class="text-xs text-stone-400 mt-0.5">1인 기업가를 위한 AI 아이디어 파이프라인</p>
            </div>
            <button
              onClick={() => setShowBackupModal(true)}
              class="px-2.5 py-1.5 bg-[#24201d] border border-stone-700 hover:border-stone-500 rounded-lg text-xs text-stone-300 flex items-center gap-1 shadow-sm"
              title="데이터 백업 및 복원"
            >
              💾 <span>백업/복원</span>
            </button>
          </header>

          {/* 백업 / 복원 모달 */}
          {showBackupModal && (
            <div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div class="bg-[#24201d] border border-stone-700 rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
                <div class="flex justify-between items-center border-b border-stone-800 pb-3">
                  <h3 class="text-sm font-bold text-stone-100">데이터 안전 백업 및 복원</h3>
                  <button onClick={() => setShowBackupModal(false)} class="text-stone-400 hover:text-white text-sm">✕</button>
                </div>
                <p class="text-xs text-stone-400 leading-relaxed">
                  현재 총 <b class="text-amber-400">{ideas.length}개</b>의 아이디어가 로컬에 안전하게 보관되어 있습니다.
                </p>
                <div class="space-y-2 pt-1">
                  <button
                    onClick={exportJSON}
                    class="w-full py-2.5 bg-amber-600/90 hover:bg-amber-600 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-2"
                  >
                    📥 전체 아이디어 JSON 백업 다운로드
                  </button>
                  <button
                    onClick={() => fileInputRef.current.click()}
                    class="w-full py-2.5 bg-stone-800 hover:bg-stone-700 text-stone-300 font-semibold rounded-xl text-xs flex items-center justify-center gap-2"
                  >
                    📤 백업 파일(JSON) 불러와서 복원
                  </button>
                  <input
                    type="file"
                    ref={fileInputRef}
                    onChange={importJSON}
                    accept=".json"
                    class="hidden"
                  />
                </div>
              </div>
            </div>
          )}

          {/* 탭 01: 생각 기록 대형 에디터 */}
          {tab === "01" && (
            <div class="space-y-4">
              {/* 카테고리 칩 */}
              <div class="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar">
                {categories.map((c) => (
                  <button
                    key={c}
                    onClick={() => setCategory(c)}
                    class={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${
                      category === c
                        ? "bg-amber-500/20 text-amber-400 border border-amber-500/40"
                        : "bg-[#24201d] text-stone-400 border border-stone-800"
                    }`}
                  >
                    {c}
                  </button>
                ))}
              </div>

              {/* 대형 작성 에디터 */}
              <div class="bg-[#24201d] border border-stone-800 rounded-2xl p-4 relative shadow-lg">
                <div class="flex justify-between items-center mb-2">
                  <span class="text-xs text-stone-400 font-medium">새로운 발명 및 아이디어 기록</span>
                  {inputText && (
                    <button 
                      onClick={() => setInputText("")}
                      class="text-xs text-stone-500 hover:text-stone-300 px-2 py-0.5 rounded bg-stone-800"
                    >
                      지움 ✕
                    </button>
                  )}
                </div>
                
                <textarea
                  value={inputText}
                  onChange={(e) => setInputText(e.target.value)}
                  placeholder="떠오른 아이디어, 기술적 해결 방법, 비즈니스 구조를 자유롭게 적어보세요..."
                  rows={9}
                  class="w-full bg-transparent text-gray-100 placeholder-stone-600 text-base focus:outline-none leading-relaxed"
                />

                <div class="pt-3 border-t border-stone-800 flex justify-between items-center">
                  <span class="text-xs text-stone-500">{inputText.length}자 입력 중</span>
                  <button
                    onClick={handleAddIdea}
                    disabled={!inputText.trim()}
                    class={`px-5 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition-all shadow-md ${
                      inputText.trim()
                        ? "bg-stone-100 text-stone-900 hover:bg-white active:scale-95 cursor-pointer"
                        : "bg-stone-800 text-stone-600 cursor-not-allowed"
                    }`}
                  >
                    서랍에 넣고 AI 검증하기 →
                  </button>
                </div>
              </div>

              <div class="p-3.5 bg-stone-900/60 rounded-xl border border-stone-800/60 text-xs text-stone-400 leading-relaxed">
                💡 <b class="text-stone-300">알림:</b> 기록된 모든 생각은 하단 <span class="text-amber-400 font-bold">[02 검증]</span> 탭으로 자동 전송되며, 다각도 분석 점수와 AI 조언이 실시간 생성됩니다.
              </div>
            </div>
          )}

          {/* 탭 02, 03, 04 공통 리스트 화면 */}
          {tab !== "01" && (
            <div class="space-y-4">
              {ideas.filter(item => item.pipeline === tab).length === 0 ? (
                <div class="text-center py-16 bg-[#24201d]/50 rounded-2xl border border-dashed border-stone-800">
                  <p class="text-stone-400 text-sm">보관된 아이디어가 없습니다.</p>
                  <p class="text-stone-600 text-xs mt-1">다른 탭을 확인하거나 새 생각을 기록해보세요.</p>
                  <button onClick={() => setTab("01")} class="mt-4 px-4 py-2 bg-stone-800 text-amber-400 rounded-xl text-xs font-semibold">
                    + 새 생각 기록하기
                  </button>
                </div>
              ) : (
                ideas
                  .filter(item => item.pipeline === tab)
                  .map((item) => {
                    const evalData = item.evaluation || evaluateIdeaDynamic(item.text, item.category);
                    const isEditing = editingId === item.id;

                    return (
                      <div key={item.id} class="bg-[#24201d] border border-stone-800 rounded-2xl p-4 shadow-md transition-all">
                        {/* 카드 상단 헤더 */}
                        <div class="flex justify-between items-center mb-3">
                          <div class="flex items-center gap-2">
                            <span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 text-[11px] font-semibold">
                              {item.category || "제품"}
                            </span>
                            <span class="px-2 py-0.5 rounded border border-emerald-600/40 text-emerald-400 text-[11px] font-bold">
                              {evalData.statusBadge || "승인"}
                            </span>
                          </div>

                          <div class="flex items-center gap-1.5">
                            {!isEditing && (
                              <button 
                                onClick={() => startEditing(item)}
                                class="text-xs text-stone-300 hover:text-white px-2.5 py-1 bg-stone-800 hover:bg-stone-700 rounded-lg transition-all"
                              >
                                ✏️ 수정
                              </button>
                            )}
                            <button 
                              onClick={() => deleteIdea(item.id)}
                              class="text-xs text-stone-500 hover:text-red-400 p-1"
                              title="삭제"
                            >
                              ✕
                            </button>
                          </div>
                        </div>

                        {/* 카드 본문 (수정 모드 vs 일반 모드) */}
                        {isEditing ? (
                          <div class="space-y-2 mb-3">
                            <textarea
                              value={editText}
                              onChange={(e) => setEditText(e.target.value)}
                              rows={4}
                              class="w-full p-3 bg-stone-900 border border-amber-500/50 rounded-xl text-sm text-gray-100 focus:outline-none"
                            />
                            <div class="flex justify-end gap-2">
                              <button
                                onClick={() => setEditingId(null)}
                                class="px-3 py-1.5 bg-stone-800 text-stone-400 text-xs rounded-lg"
                              >
                                취소
                              </button>
                              <button
                                onClick={() => saveEdit(item.id)}
                                class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-bold rounded-lg"
                              >
                                저장 & 재검증
                              </button>
                            </div>
                          </div>
                        ) : (
                          <p class="text-sm font-medium text-gray-100 leading-relaxed mb-4 whitespace-pre-wrap">
                            {item.text}
                          </p>
                        )}

                        {/* 동적 평가 점수 */}
                        <div class="space-y-2 mb-3 text-xs">
                          <ScoreBar label="B2B 확장성" score={evalData.b2b} />
                          <ScoreBar label="시간/비용 절감" score={evalData.cost} />
                          <ScoreBar label="특허 진입장벽" score={evalData.patent} />
                          <ScoreBar label="1인 실행력" score={evalData.execution} />
                        </div>

                        {/* AI 조언 */}
                        <div class="p-3 bg-[#1c1815] rounded-xl border border-stone-800/80 mb-3">
                          <div class="text-[11px] font-bold text-amber-400 mb-1 flex items-center gap-1">
                            <span>✨</span> AI 조언
                          </div>
                          <p class="text-xs text-stone-300 leading-relaxed">
                            {evalData.advice}
                          </p>
                        </div>

                        {/* 파이프라인 이동 액션 버튼 */}
                        <div class="grid grid-cols-2 gap-2 pt-1">
                          {tab === "02" && (
                            <>
                              <button
                                onClick={() => movePipeline(item.id, "04")}
                                class="py-2.5 bg-emerald-800/80 hover:bg-emerald-700 text-emerald-100 font-semibold text-xs rounded-xl transition-all"
                              >
                                실행으로 이동
                              </button>
                              <button
                                onClick={() => movePipeline(item.id, "03")}
                                class="py-2.5 bg-stone-800 hover:bg-stone-700 text-stone-300 font-semibold text-xs rounded-xl transition-all"
                              >
                                보류함으로 이동
                              </button>
                            </>
                          )}
                          {tab === "03" && (
                            <>
                              <button
                                onClick={() => movePipeline(item.id, "02")}
                                class="py-2.5 bg-amber-800/70 hover:bg-amber-700 text-amber-100 font-semibold text-xs rounded-xl transition-all"
                              >
                                검증으로 복원
                              </button>
                              <button
                                onClick={() => movePipeline(item.id, "04")}
                                class="py-2.5 bg-emerald-800/80 hover:bg-emerald-700 text-emerald-100 font-semibold text-xs rounded-xl transition-all"
                              >
                                실행으로 이동
                              </button>
                            </>
                          )}
                          {tab === "04" && (
                            <>
                              <button
                                onClick={() => movePipeline(item.id, "02")}
                                class="py-2.5 bg-stone-800 hover:bg-stone-700 text-stone-300 font-semibold text-xs rounded-xl transition-all"
                              >
                                검증단계로 복귀
                              </button>
                              <button
                                onClick={() => movePipeline(item.id, "03")}
                                class="py-2.5 bg-stone-800 hover:bg-stone-700 text-stone-300 font-semibold text-xs rounded-xl transition-all"
                              >
                                보류함으로 이동
                              </button>
                            </>
                          )}
                        </div>
                      </div>
                    );
                  })
              )}
            </div>
          )}

          {/* 하단 고정 4단 내비게이션 바 */}
          <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#1a1715]/95 backdrop-blur-md border-t border-stone-800 px-2 py-2.5 flex justify-around items-center z-40">
            <NavTabButton 
              active={tab === "01"} 
              onClick={() => setTab("01")} 
              icon="✏️" 
              label="01 생각" 
            />
            <NavTabButton 
              active={tab === "02"} 
              onClick={() => setTab("02")} 
              icon="📋" 
              label="02 검증" 
              count={ideas.filter(i => i.pipeline === "02").length}
            />
            <NavTabButton 
              active={tab === "03"} 
              onClick={() => setTab("03")} 
              icon="📥" 
              label="03 보류" 
              count={ideas.filter(i => i.pipeline === "03").length}
            />
            <NavTabButton 
              active={tab === "04"} 
              onClick={() => setTab("04")} 
              icon="🚀" 
              label="04 실행" 
              count={ideas.filter(i => i.pipeline === "04").length}
            />
          </nav>
        </div>
      );
    }

    // --- 점수 바 컴포넌트 ---
    function ScoreBar({ label, score }) {
      return (
        <div class="flex items-center justify-between gap-3 text-stone-300">
          <span class="w-24 text-stone-400 font-medium">{label}</span>
          <div class="flex-1 bg-stone-800 h-2 rounded-full overflow-hidden">
            <div 
              class="bg-emerald-600/80 h-full rounded-full transition-all duration-500" 
              style={{ width: `${score}%` }} 
            />
          </div>
          <span class="w-6 text-right font-semibold text-stone-200">{score}</span>
        </div>
      );
    }

    // --- 하단 탭 버튼 컴포넌트 ---
    function NavTabButton({ active, onClick, icon, label, count }) {
      return (
        <button
          onClick={onClick}
          class={`flex flex-col items-center justify-center py-1 px-3 rounded-xl transition-all relative ${
            active ? "text-amber-400 font-bold" : "text-stone-500 hover:text-stone-300"
          }`}
        >
          <span class="text-base mb-0.5">{icon}</span>
          <span class="text-[11px] tracking-tight">{label}</span>
          {count > 0 && (
            <span class="absolute top-0 right-1 px-1.5 py-0.2 bg-amber-500/30 border border-amber-500/50 text-amber-300 rounded-full text-[9px] font-bold">
              {count}
            </span>
          )}
        </button>
      );
    }

    // 렌더링
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <IdeaDrawerApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
