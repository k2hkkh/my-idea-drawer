<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>생각서랍</title>
  <style>
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --surface: #2c2c2e;
      --primary: #2563eb;
      --accent: #38bdf8;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #8e8e93;
      --border: #2c2c2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
    }
    
    header {
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 6px;
    }
    .main-mode-switch {
      display: flex;
      background: #141416;
      padding: 3px;
      border-radius: 20px;
      border: 1px solid var(--border);
      gap: 2px;
      flex: 1;
    }
    .mode-btn {
      flex: 1;
      padding: 8px 4px;
      border-radius: 16px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: clamp(0.78rem, 2.4vw, 0.88rem);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37,99,235,0.4);
    }

    .category-bar {
      display: flex;
      padding: 8px 12px;
      background: #121214;
      gap: 6px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .category-pill {
      padding: 5px 12px;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
    }
    .category-pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .view-container {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .empty-canvas {
      margin: auto;
      text-align: center;
      color: #71717a;
      font-size: 0.95rem;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .empty-action-btn {
      padding: 10px 18px;
      background: var(--primary);
      color: #ffffff;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(37,99,235,0.3);
    }
    
    .thought-card, .plan-big-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-header, .plan-big-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--surface);
      color: var(--accent);
      font-weight: 600;
    }
    .card-time { font-size: 0.75rem; color: var(--muted); }
    .card-content, .plan-big-title {
      font-size: clamp(0.92rem, 2.7vw, 1.05rem);
      line-height: 1.5;
      white-space: pre-wrap;
      color: #ffffff;
      user-select: text;
    }
    .status-badge-lg {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      background: #27272a;
      color: #e4e4e7;
      cursor: pointer;
    }

    .media-box {
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      margin-top: 4px;
    }
    .media-box img, .media-box video {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      display: block;
    }

    .card-five-buttons {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      white-space: nowrap;
      border-top: 1px solid #27272a;
      padding-top: 10px;
    }
    .five-btn {
      flex: 1;
      min-width: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 2px;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      background: #1c1c1e;
      color: #a1a1aa;
      font-size: clamp(0.68rem, 1.8vw, 0.74rem);
      font-weight: 600;
      cursor: pointer;
    }
    .five-btn.active-backlog { background: #1e3a8a; border-color: #3b82f6; color: #ffffff; font-weight: 700; }

    .plan-time-tabs { display: flex; gap: 4px; width: 100%; flex-shrink: 0; }
    .plan-time-tab {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 2px;
      color: var(--muted);
      font-size: clamp(0.68rem, 2vw, 0.76rem);
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      white-space: nowrap;
    }
    .plan-time-tab.active { background: #1e3a8a; color: #60a5fa; border-color: #3b82f6; }
    .plan-time-tab.focus-tab.active { background: #9a3412; color: #fdba74; border-color: #f97316; }

    /* 하단 입력바 */
    .bottom-bar-wrapper {
      padding: 8px 14px calc(12px + env(safe-area-inset-bottom, 0px)) 14px;
      background: var(--bg);
      position: relative;
      flex-shrink: 0;
      border-top: 1px solid #18181b;
    }
    .capsule-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-plus {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #2c2c2e;
      border: 1px solid #3f3f46;
      color: #ffffff;
      font-size: 1.3rem;
      line-height: 1;
      display: flex !important;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    .btn-plus.open {
      transform: rotate(45deg);
      background: var(--danger);
      border-color: var(--danger);
    }

    .main-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: clamp(0.88rem, 2.6vw, 0.95rem);
      outline: none;
      min-height: 24px;
      max-height: 90px;
      resize: none;
      line-height: 1.4;
      user-select: text;
    }
    .btn-mic {
      background: none;
      border: none;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .btn-mic svg { width: 22px; height: 22px; fill: #8e8e93; transition: fill 0.2s; }
    .btn-mic.recording svg {
      fill: #ef4444;
      animation: pulse-mic 0.9s infinite alternate;
    }
    @keyframes pulse-mic {
      0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(239,68,68,0.4)); }
      100% { transform: scale(1.22); filter: drop-shadow(0 0 8px rgba(239,68,68,0.9)); }
    }

    .btn-action-send {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #2563eb;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
    
    .plus-menu-popover {
      display: none;
      position: absolute;
      bottom: calc(64px + env(safe-area-inset-bottom, 0px));
      left: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 8px 6px;
      flex-direction: column;
      gap: 4px;
      z-index: 50;
      min-width: 200px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .plus-menu-popover.active { display: flex; }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 12px;
      color: #ffffff;
      font-size: 0.88rem;
      cursor: pointer;
      text-decoration: none;
    }
    .menu-item:active { background: var(--surface); }

    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: rgba(0,0,0,0.75);
      z-index: 3000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-backdrop.active { display: flex; }
    .pop-card {
      background: #1c1c1e;
      border: 1px solid #3a3a3c;
      border-radius: 18px;
      padding: 18px;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .pop-textarea {
      width: 100%;
      height: 120px;
      background: #121214;
      border: 1px solid #3a3a3c;
      border-radius: 10px;
      padding: 10px;
      color: #fff;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      user-select: text;
    }
    .pop-btn-row { display: flex; gap: 8px; }
    .pop-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .pop-btn.cancel { background: #2c2c2e; color: #8e8e93; }
    .pop-btn.confirm { background: var(--primary); color: #fff; }
    .pop-btn-choice {
      width: 100%;
      padding: 12px;
      background: #2c2c2e;
      border: 1px solid #3f3f46;
      border-radius: 10px;
      color: #fff;
      font-size: 0.92rem;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
    }

    #memopad-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: #000000;
      z-index: 2000;
      overflow: hidden;
      flex-direction: column;
    }
    #memopad-screen.active { display: flex; }
    .memopad-top-bar {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c1c1e;
      border-bottom: 1px solid #3a3a3c;
      flex-shrink: 0;
    }
    .memopad-collapsible-toolbar {
      display: none;
      background: #141416;
      border-bottom: 1px solid #3a3a3c;
      padding: 10px;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .memopad-collapsible-toolbar.active { display: flex; }
    .pad-palette { display: flex; gap: 8px; align-items: center; overflow-x: auto; }
    .color-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; }
    .color-dot.active { border-color: #ffffff; transform: scale(1.15); }
    .pad-tool-btn {
      background: var(--surface);
      border: 1px solid #3a3a3c;
      color: #fff;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
    .pad-tool-btn.active { background: #3b82f6; border-color: #60a5fa; }
    #memopad-canvas-container { flex: 1; position: relative; width: 100%; height: 100%; overflow: hidden; background: #000000; }
    #memopad-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  </style>
</head>
<body>

  <header>
    <div class="main-mode-switch">
      <button id="tab-btn-idea" class="mode-btn active" onclick="switchMainMode('idea')">💡 생각서랍</button>
      <button id="tab-btn-plan" class="mode-btn" onclick="switchMainMode('plan')">📋 나의계획</button>
      <button class="mode-btn" onclick="openMemoPadDirect()">📑 메모딱지</button>
    </div>
  </header>

  <div class="category-bar" id="idea-category-bar">
    <div class="category-pill active" onclick="selectCategory('첫 생각')">💡 첫 생각</div>
    <div class="category-pill" onclick="selectCategory('노트')">📝 노트</div>
    <div class="category-pill" onclick="selectCategory('사진')">📷 사진</div>
    <div class="category-pill" onclick="selectCategory('동영상')">🎬 동영상</div>
    <div class="category-pill" onclick="selectCategory('전체')">📂 전체</div>
  </div>

  <div class="view-container" id="idea-feed-container"></div>

  <div class="view-container" id="plan-feed-container" style="display:none;">
    <div class="plan-time-tabs">
      <button class="plan-time-tab active" id="ptab-backlog" onclick="switchPlanSubtab('backlog')">🔄 대기</button>
      <button class="plan-time-tab focus-tab" id="ptab-focus" onclick="switchPlanSubtab('focus')">⚡ 집중</button>
      <button class="plan-time-tab" id="ptab-morning" onclick="switchPlanSubtab('morning')">🌅 오전</button>
      <button class="plan-time-tab" id="ptab-afternoon" onclick="switchPlanSubtab('afternoon')">☀️ 오후</button>
      <button class="plan-time-tab" id="ptab-evening" onclick="switchPlanSubtab('evening')">🌙 저녁</button>
      <button class="plan-time-tab" id="ptab-night" onclick="switchPlanSubtab('night')">⏱️ 심야</button>
    </div>
    <div id="plan-card-list" style="display:flex; flex-direction:column; gap:12px;"></div>
  </div>

  <!-- 브라우저 표준 파일 입력기 -->
  <input type="file" id="input-camera-photo" accept="image/*" capture="environment" onchange="handleDirectCapture(event, '사진')" style="position:absolute; width:1px; height:1px; opacity:0; clip:rect(0,0,0,0);" />
  <input type="file" id="input-camera-video" accept="video/*" capture="environment" onchange="handleDirectCapture(event, '동영상')" style="position:absolute; width:1px; height:1px; opacity:0; clip:rect(0,0,0,0);" />
  <input type="file" id="input-album-file" accept="image/*,video/*" multiple onchange="handleDirectCapture(event, null)" style="position:absolute; width:1px; height:1px; opacity:0; clip:rect(0,0,0,0);" />

  <!-- 하단 입력바 -->
  <div class="bottom-bar-wrapper">
    <div class="plus-menu-popover" id="plus-menu">
      <label for="input-camera-photo" class="menu-item" onclick="closePlusMenu()">
        <span>📷 카메라로 사진 촬영</span>
      </label>
      <label for="input-camera-video" class="menu-item" onclick="closePlusMenu()">
        <span>🎥 비디오로 영상 녹화</span>
      </label>
      <label for="input-album-file" class="menu-item" onclick="closePlusMenu()">
        <span>📁 앨범 / 파일에서 선택</span>
      </label>
      <div class="menu-item" onclick="openMemoPadDirect()">
        <span>📑 메모딱지 작성</span>
      </div>
    </div>
    <div class="capsule-box">
      <button id="btn-plus" class="btn-plus" type="button" onclick="togglePlusMenu()">＋</button>
      <textarea id="prompt-input" class="main-input" placeholder="생각을 입력하세요..." rows="1" oninput="handleInputChange(this);"></textarea>
      <button id="btn-mic" class="btn-mic" type="button" onpointerdown="event.preventDefault()" onclick="toggleVoiceInput()">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </button>
      <button id="btn-wave" class="btn-action-send" type="button" onpointerdown="event.preventDefault()" onclick="handleSendAction()">↑</button>
    </div>
  </div>

  <!-- 수정 팝업 모달 -->
  <div id="custom-edit-modal" class="modal-backdrop">
    <div class="pop-card" onclick="event.stopPropagation()">
      <div style="font-weight:bold; font-size:1.05rem; color:#fff;">✏️ 내용 수정</div>
      <textarea id="edit-modal-textarea" class="pop-textarea"></textarea>
      <div class="pop-btn-row">
        <button class="pop-btn cancel" onclick="closeEditModal()">취소</button>
        <button class="pop-btn confirm" onclick="confirmEditModal()">저장</button>
      </div>
    </div>
  </div>

  <!-- 시간 슬롯 모달 -->
  <div id="time-sub-modal" class="modal-backdrop" onclick="closeTimeSlotModal(event)">
    <div class="pop-card" onclick="event.stopPropagation()">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-weight:bold; font-size:1.05rem; color:#fff;">🕒 계획시간 지정</span>
        <button onclick="closeTimeSlotModal()" style="background:transparent; border:none; color:#8e8e93; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="pop-btn-choice" onclick="confirmTimeSlotAssign('morning')">🌅 오전</button>
        <button class="pop-btn-choice" onclick="confirmTimeSlotAssign('afternoon')">☀️ 오후</button>
        <button class="pop-btn-choice" onclick="confirmTimeSlotAssign('evening')">🌙 저녁</button>
        <button class="pop-btn-choice" onclick="confirmTimeSlotAssign('night')">⏱️ 심야</button>
      </div>
    </div>
  </div>

  <!-- 메모딱지 화면 -->
  <div id="memopad-screen">
    <div class="memopad-top-bar">
      <button class="pad-tool-btn" onclick="togglePadToolbar()">⚙️ 도구 상자</button>
      <div style="display:flex; gap:8px;">
        <button onclick="saveMemoPadToDrawer()" style="background:var(--primary); color:#fff; border:none; padding:6px 14px; border-radius:8px; font-size:0.82rem; font-weight:bold; cursor:pointer;">저장</button>
        <button onclick="closeMemoPadDirect()" style="background:var(--surface); color:#fff; border:none; width:28px; height:28px; border-radius:50%; font-size:0.85rem; cursor:pointer;">✕</button>
      </div>
    </div>

    <div id="memopad-collapsible-toolbar" class="memopad-collapsible-toolbar">
      <div class="pad-palette">
        <div class="color-dot active" style="background:#ffffff;" onclick="setPadColor('#ffffff', this)"></div>
        <div class="color-dot" style="background:#facc15;" onclick="setPadColor('#facc15', this)"></div>
        <div class="color-dot" style="background:#38bdf8;" onclick="setPadColor('#38bdf8', this)"></div>
        <div class="color-dot" style="background:#ef4444;" onclick="setPadColor('#ef4444', this)"></div>
        <div style="width:1px; height:20px; background:#3a3a3c; margin:0 4px;"></div>
        <button id="pad-eraser-btn" class="pad-tool-btn" onclick="togglePadEraser()">🧹 지우개</button>
        <button class="pad-tool-btn" onclick="undoPadStroke()">↩️ 되돌리기</button>
        <button class="pad-tool-btn" onclick="clearPadCanvas()">🔄 전체삭제</button>
      </div>
      <div style="display:flex; align-items:center; background:#121214; border-radius:10px; padding:4px 8px; border:1px solid #3a3a3c; gap:6px;">
        <input id="memopad-text-input" type="text" placeholder="메모할 텍스트 입력..." style="flex:1; background:transparent; border:none; color:#fff; font-size:0.88rem; outline:none;" />
        <button id="btn-pad-mic" class="btn-mic" type="button" onpointerdown="event.preventDefault()" onclick="togglePadVoiceInput()" title="메모딱지 음성입력">
          <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
      </div>
    </div>

    <div id="memopad-canvas-container">
      <canvas id="memopad-canvas"></canvas>
    </div>
  </div>

  <script>
    const DB_NAME = 'IdeaDrawerDB';
    const DB_VERSION = 1;
    let dbInstance = null;

    function initDB() {
      return new Promise((resolve, reject) => {
        if (dbInstance) return resolve(dbInstance);
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('thoughts')) {
            db.createObjectStore('thoughts', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('plans')) {
            db.createObjectStore('plans', { keyPath: 'id' });
          }
        };
        req.onsuccess = (e) => {
          dbInstance = e.target.result;
          resolve(dbInstance);
        };
        req.onerror = (e) => reject(e.target.error);
      });
    }

    async function dbGetAll(storeName) {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const store = tx.objectStore(storeName);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbPut(storeName, item) {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        const store = tx.objectStore(storeName);
        store.put(item);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbDelete(storeName, id) {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        const store = tx.objectStore(storeName);
        store.delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function handleDirectCapture(event, defaultType) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      const input = document.getElementById('prompt-input');
      const extraText = input.value.trim();

      for (const file of Array.from(files)) {
        const isVid = file.type.startsWith('video');
        const finalType = defaultType || (isVid ? '동영상' : '사진');
        const dataUrl = await readFileDataURL(file);
        const mediaObj = { type: finalType, data: dataUrl, isVideo: isVid };

        if (currentMainMode === 'plan') {
          const plan = {
            id: Date.now() + Math.random(),
            title: extraText || (finalType + ' 메모'),
            status: '대기',
            timeSlot: (currentPlanSubtab === 'focus' || currentPlanSubtab === 'backlog') ? 'none' : currentPlanSubtab,
            isFocus: currentPlanSubtab === 'focus',
            mediaList: [mediaObj],
            updatedAt: new Date().toLocaleDateString()
          };
          await dbPut('plans', plan);
          renderPlanView();
        } else {
          await saveThought(finalType, extraText, [mediaObj]);
          selectCategory(defaultType || '전체');
        }
      }

      input.value = '';
      input.style.height = 'auto';
      event.target.value = '';
    }

    function readFileDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = (e) => reject(e);
        reader.readAsDataURL(file);
      });
    }

    function toggleVoiceInput() {
      closePlusMenu();
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('현재 브라우저에서는 음성 인식을 지원하지 않습니다.');
        return;
      }

      const micBtn = document.getElementById('btn-mic');

      if (isVoiceRecording) {
        isVoiceRecording = false;
        if (recognition) recognition.stop();
        micBtn.classList.remove('recording');
        return;
      }

      if (isPadVoiceRecording) togglePadVoiceInput();

      try {
        recognition = new SpeechRecognition();
        recognition.lang = 'ko-KR';
        recognition.continuous = true;
        recognition.interimResults = false;

        isVoiceRecording = true;
        micBtn.classList.add('recording');

        recognition.onresult = function(event) {
          const input = document.getElementById('prompt-input');
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
              const transcript = event.results[i][0].transcript.trim();
              if (transcript) {
                insertTextAtCursor(input, transcript);
              }
            }
          }
        };

        recognition.onerror = function(event) {
          console.warn('Speech error:', event.error);
          if (event.error === 'not-allowed') {
            alert('마이크 사용 권한이 필요합니다.');
            isVoiceRecording = false;
            micBtn.classList.remove('recording');
          }
        };

        recognition.onend = function() {
          if (isVoiceRecording) {
            try { recognition.start(); } catch (e) {}
          } else {
            micBtn.classList.remove('recording');
          }
        };

        recognition.start();
      } catch (err) {
        console.error('Speech error:', err);
        isVoiceRecording = false;
        micBtn.classList.remove('recording');
      }
    }

    function insertTextAtCursor(element, textToInsert) {
      const start = element.selectionStart ?? element.value.length;
      const end = element.selectionEnd ?? element.value.length;
      const val = element.value;

      const needSpaceBefore = start > 0 && !/[\s\n]/.test(val[start - 1]);
      const needSpaceAfter = end < val.length && !/[\s\n]/.test(val[end]);

      const formatted = (needSpaceBefore ? ' ' : '') + textToInsert + (needSpaceAfter ? ' ' : '');
      
      element.value = val.substring(0, start) + formatted + val.substring(end);
      
      const newPos = start + formatted.length;
      element.selectionStart = newPos;
      element.selectionEnd = newPos;
      element.focus();
      if (element.tagName.toLowerCase() === 'textarea') {
        handleInputChange(element);
      }
    }

    let padCanvas, padCtx, isDrawing = false, padColor = '#ffffff', isEraser = false, historyArr = [];

    function openMemoPadDirect() {
      closePlusMenu();
      const screen = document.getElementById('memopad-screen');
      screen.classList.add('active');
      padCanvas = document.getElementById('memopad-canvas');
      padCtx = padCanvas.getContext('2d');
      
      requestAnimationFrame(() => {
        const container = document.getElementById('memopad-canvas-container');
        const rect = container.getBoundingClientRect();
        padCanvas.width = Math.round(rect.width);
        padCanvas.height = Math.round(rect.height);
        
        padCtx.fillStyle = '#000000';
        padCtx.fillRect(0, 0, padCanvas.width, padCanvas.height);
        padCtx.lineCap = 'round';
        padCtx.lineJoin = 'round';
        setPadColor('#ffffff', document.querySelector('.color-dot'));
        historyArr = [];
      });
    }

    function closeMemoPadDirect() {
      if (isPadVoiceRecording) togglePadVoiceInput();
      document.getElementById('memopad-screen').classList.remove('active');
      document.getElementById('memopad-collapsible-toolbar').classList.remove('active');

    function togglePadToolbar() {
      const toolbar = document.getElementById('memopad-collapsible-toolbar');
      toolbar.classList.toggle('active');
      setTimeout(() => {
        const container = document.getElementById('memopad-canvas-container');
        const rect = container.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          const imgData = padCtx.getImageData(0, 0, padCanvas.width, padCanvas.height);
          padCanvas.width = Math.round(rect.width);
          padCanvas.height = Math.round(rect.height);
          padCtx.fillStyle = '#000000';
          padCtx.fillRect(0, 0, padCanvas.width, padCanvas.height);
          padCtx.putImageData(imgData, 0, 0);
          padCtx.lineCap = 'round';
          padCtx.lineJoin = 'round';
          padCtx.strokeStyle = isEraser ? '#000000' : padColor;
          padCtx.lineWidth = isEraser ? 24 : 3.5;
        }
      }, 50);
    }

    function setPadColor(color, el) {
      padColor = color;
      isEraser = false;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      if (el) el.classList.add('active');
      document.getElementById('pad-eraser-btn').classList.remove('active');
      padCtx.strokeStyle = padColor;
      padCtx.lineWidth = 3.5;
    }

    function togglePadEraser() {
      isEraser = !isEraser;
      document.getElementById('pad-eraser-btn').classList.toggle('active', isEraser);
      padCtx.strokeStyle = isEraser ? '#000000' : padColor;
      padCtx.lineWidth = isEraser ? 24 : 3.5;
    }

    function saveCanvasState() {
      if (historyArr.length > 20) historyArr.shift();
      historyArr.push(padCtx.getImageData(0, 0, padCanvas.width, padCanvas.height));
    }

    function undoPadStroke() {
      if (historyArr.length > 0) padCtx.putImageData(historyArr.pop(), 0, 0);
    }

    function clearPadCanvas() {
      if (confirm('캔버스를 모두 지우시겠습니까?')) {
        saveCanvasState();
        padCtx.fillStyle = '#000000';
        padCtx.fillRect(0, 0, padCanvas.width, padCanvas.height);
      }
    }

    async function saveMemoPadToDrawer() {

      const text = document.getElementById('memopad-text-input').value.trim();

      await saveThought('메모딱지', text, [{ type: '메모딱지', data: dataUrl, isVideo: false }]);
      closeMemoPadDirect();
      document.getElementById('memopad-text-input').value = '';
      switchMainMode('idea');
      selectCategory('전체');
    }

    function getCanvasCoordinates(e) {
      const rect = padCanvas.getBoundingClientRect();
      const scaleX = padCanvas.width / rect.width;
      const scaleY = padCanvas.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    window.addEventListener('DOMContentLoaded', async () => {
      padCanvas = document.getElementById('memopad-canvas');
      
      padCanvas.addEventListener('pointerdown', (e) => {
        padCanvas.setPointerCapture(e.pointerId);
        isDrawing = true;
        saveCanvasState();
        const pos = getCanvasCoordinates(e);
        padCtx.beginPath();
        padCtx.moveTo(pos.x, pos.y);
      });

      padCanvas.addEventListener('pointermove', (e) => {
        if (!isDrawing) return;
        const pos = getCanvasCoordinates(e);
        padCtx.lineTo(pos.x, pos.y);
        padCtx.stroke();
      });

      padCanvas.addEventListener('pointerup', (e) => {
        if (isDrawing) {
          isDrawing = false;
          padCanvas.releasePointerCapture(e.pointerId);
        }
      });

      selectCategory('첫 생각');

      /* URL 파라미터(?mode=voice) 감지 시 마이크 자동 실행 */
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('mode') === 'voice') {
        switchMainMode('idea');
        selectCategory('첫 생각');
        setTimeout(() => {
          if (!isVoiceRecording) {
            toggleVoiceInput();
          }
        }, 350);
      }
    });
  </script>
</body>
</html>
