<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- 캐시 방지 메타태그 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>생각서랍 - 1인 기업가를 위한 AI 아이디어 파이프라인</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandDark: '#171412',
            cardDark: '#24201d',
            borderDark: '#38322d',
            accentGreen: '#709b78',
            accentYellow: '#eab308'
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN (Cloudflare) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <style>
    body {
      background-color: #171412;
      color: #f3f4f6;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    textarea {
      resize: none;
    }
  </style>
</head>
<body class="bg-[#171412] text-gray-200 min-h-screen pb-24">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, Component } = React;

    // --- 에러 바운더리 (화면 멈춤 방어 및 긴급 백업 모듈) ---
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught:", error, errorInfo);
      }
      downloadBackup = () => {
        const data = localStorage.getItem("my_idea_drawer_data_v2") || localStorage.getItem("my_idea_drawer_data") || "[]";
        const blob = new Blob([data], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `idea_drawer_emergency_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      };
      render() {
        if (this.state.hasError) {
          return (
            <div class="p-6 max-w-md mx-auto text-center mt-12 bg-[#24201d] rounded-2xl border border-red-500/40">
              <h2 class="text-xl font-bold text-red-400 mb-2">시스템 일시 오류 발생</h2>
              <p class="text-sm text-gray-400 mb-6">데이터 보호를 위해 안전 모드로 전환되었습니다. 작성하신 아이디어는 안전하게 로컬에 보관되어 있습니다.</p>
              <div class="space-y-3">
                <button onClick={this.downloadBackup} class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl text-sm">
                  긴급 데이터 백업(JSON 다운로드)
                </button>
                <button onClick={() => window.location.reload()} class="w-full py-3 bg-gray-700 hover:bg-gray-600 text-white rounded-xl text-sm">
                  새로고침
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // --- 동적 AI 검증 분석 알고리즘 엔진 ---
    function evaluateIdeaDynamic(text, category) {
      const clean = text.toLowerCase();
      
      // 텍스트 기반 가중치 해시 생성
      let hash = 0;
      for (let i = 0; i < clean.length; i++) {
        hash = (hash << 5) - hash + clean.charCodeAt(i);
        hash |= 0;
      }
      const seed = Math.abs(hash);

      // 1. B2B 확장성
      let b2b = 68 + (seed % 14);
      if (/공공|기관|기업|b2b|납품|솔루션|플랫폼|단체|지자체|행정|시스템|데이터/.test(clean)) b2b += 14;
      if (/초간편|단순|개인|일상|취미|메모/.test(clean)) b2b -= 6;
      b2b = Math.min(98, Math.max(55, b2b));

      // 2. 시간/비용 절감
      let cost = 72 + ((seed >> 2) % 15);
      if (/초간편|간단|단순|원클릭|자동|절감|단축|즉시|녹음|빠른|효율/.test(clean)) cost += 13;
      if (/공공기관|심사|복잡|공정|대규모/.test(clean)) cost -= 5;
      cost = Math.min(98, Math.max(58, cost));

      // 3. 특허 진입장벽
      let patent = 65 + ((seed >> 4) % 16);
      if (/특허|장치|구조|기구|메커니즘|센서|하드웨어|원천기술|알고리즘/.test(clean) || category === '특허') patent += 16;
      if (/메모|딱지|간단|앱|단순|아이디어/.test(clean)) patent -= 4;
      patent = Math.min(98, Math.max(52, patent));

      // 4. 1인 실행력
      let execution = 70 + ((seed >> 6) % 15);
      if (/1인|혼자|초간편|단순|앱|가벼운|웹|바로/.test(clean)) execution += 14;
      if (/공공기관|하드웨어|금형|공장|인가|인허가|법률|대규모/.test(clean)) execution -= 12;
      execution = Math.min(98, Math.max(50, execution));

      // 맞춤형 AI 조언 도출
      let advice = "";
      if (execution >= 85 && cost >= 85) {
        advice = "1인 린 스타트업으로 즉시 개발 및 출시하기에 최적입니다. 최소 기능(MVP)으로 빠르게 시장 피드백을 수집하세요.";
      } else if (patent >= 85) {
        advice = "독창적인 구조와 기술적 차별점이 돋보입니다. 개발 착수 전 선행기술조사를 진행하고 특허 명세서 가출원을 권장합니다.";
      } else if (b2b >= 85) {
        advice = "공공/기업 타깃 시장 규모가 큽니다. 초기 PoC(개념 검증) 사례를 구축하여 시범 사업 제안서 형태로 접근하는 것이 유리합니다.";
      } else if (execution < 65) {
        advice = "아이디어의 잠재력은 높으나 초기 리소스가 많이 필요합니다. 공공 연계나 파트너십을 고려하여 1단계 범위를 축소해 보세요.";
      } else {
        advice = "핵심 가치 제안이 명확합니다. 타깃 사용자의 가장 큰 불편(Pain Point)을 해결하는 단일 핵심 기능에 집중하세요.";
      }

      const avg = (b2b + cost + patent + execution) / 4;
      const statusBadge = avg >= 78 ? "승인" : avg >= 68 ? "검토" : "재설계";

      return { b2b, cost, patent, execution, advice, statusBadge };
    }

    // --- 메인 App 컴포넌트 ---
    function IdeaDrawerApp() {
      const [tab, setTab] = useState("01"); // 01:생각, 02:검증, 03:보류, 04:실행
      const [category, setCategory] = useState("제품");
      const [inputText, setInputText] = useState("");
      const [ideas, setIdeas] = useState([]);
      const [editingId, setEditingId] = useState(null);
      const [editText, setEditText] = useState("");

      // 데이터 마이그레이션 & 초기 로드
      useEffect(() => {
        try {
          const oldData = localStorage.getItem("my_idea_drawer_data");
          const v2Data = localStorage.getItem("my_idea_drawer_data_v2");
          
          if (v2Data) {
            setIdeas(JSON.parse(v2Data));
          } else if (oldData) {
            // 구버전 데이터 호환 마이그레이션
            const parsed = JSON.parse(oldData);
            const migrated = parsed.map(item => ({
              ...item,
              pipeline: item.pipeline || "02", // 기존 기록은 02(검증)으로 마이그레이션
              evaluation: item.evaluation || evaluateIdeaDynamic(item.text, item.category || "제품")
            }));
            setIdeas(migrated);
            localStorage.setItem("my_idea_drawer_data_v2", JSON.stringify(migrated));
          }
        } catch (e) {
          console.error("데이터 로드 실패:", e);
        }
      }, []);

      // 데이터 저장
      const saveIdeas = (newIdeas) => {
        setIdeas(newIdeas);
        localStorage.setItem("my_idea_drawer_data_v2", JSON.stringify(newIdeas));
      };

      // 새 생각 등록 (02 검증 파이프라인으로 전송)
      const handleAddIdea = () => {
        if (!inputText.trim()) return;
        const evaluation = evaluateIdeaDynamic(inputText, category);
        const newIdea = {
          id: Date.now().toString(),
          category,
          text: inputText.trim(),
          createdAt: new Date().toISOString(),
          pipeline: "02", // 02: 검증단계
          evaluation
        };
        const updated = [newIdea, ...ideas];
        saveIdeas(updated);
        setInputText("");
        setTab("02"); // 작성 후 바로 검증 결과로 전환
      };

      // 파이프라인 이동 (02 검증 / 03 보류 / 04 실행)
      const movePipeline = (id, targetPipeline) => {
        const updated = ideas.map(item => {
          if (item.id === id) {
            return { ...item, pipeline: targetPipeline };
          }
          return item;
        });
        saveIdeas(updated);
      };

      // 아이디어 삭제
      const deleteIdea = (id) => {
        if (confirm("이 아이디어를 삭제하시겠습니까?")) {
          saveIdeas(ideas.filter(item => item.id !== id));
        }
      };

      // 내용 수정 모드 시작
      const startEditing = (item) => {
        setEditingId(item.id);
        setEditText(item.text);
      };

      // 내용 수정 저장
      const saveEdit = (id) => {
        if (!editText.trim()) return;
        const updated = ideas.map(item => {
          if (item.id === id) {
            const reEvaluation = evaluateIdeaDynamic(editText, item.category);
            return {
              ...item,
              text: editText.trim(),
              evaluation: reEvaluation,
              updatedAt: new Date().toISOString()
            };
          }
          return item;
        });
        saveIdeas(updated);
        setEditingId(null);
        setEditText("");
      };

      const categories = ["제품", "앱/SW", "비즈니스", "특허", "개발메모"];

      return (
        <div class="max-w-md mx-auto px-4 pt-6">
          {/* 상단 헤더 */}
          <header class="mb-5 flex justify-between items-start">
            <div>
              <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                생각서랍
              </h1>
              <p class="text-xs text-stone-400 mt-0.5">1인 기업가를 위한 AI 아이디어 파이프라인</p>
            </div>
          </header>

          {/* 탭 01: 생각 기록 대형 에디터 */}
          {tab === "01" && (
            <div class="space-y-4">
              {/* 카테고리 칩 선택 */}
              <div class="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar">
                {categories.map((c) => (
                  <button
                    key={c}
                    onClick={() => setCategory(c)}
                    class={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${
                      category === c
                        ? "bg-amber-500/20 text-amber-400 border border-amber-500/40"
                        : "bg-[#24201d] text-stone-400 border border-stone-800"
                    }`}
                  >
                    {c}
                  </button>
                ))}
              </div>

              {/* 입력 카드 */}
              <div class="bg-[#24201d] border border-stone-800 rounded-2xl p-4 relative shadow-lg">
                <div class="flex justify-between items-center mb-2">
                  <span class="text-xs text-stone-400 font-medium">새로운 발명 및 아이디어</span>
                  {inputText && (
                    <button 
                      onClick={() => setInputText("")}
                      class="text-xs text-stone-500 hover:text-stone-300 px-2 py-0.5 rounded bg-stone-800/80"
                    >
                      지움 ✕
                    </button>
                  )}
                </div>
                
                <textarea
                  value={inputText}
                  onChange={(e) => setInputText(e.target.value)}
                  placeholder="떠오른 아이디어, 기술적 해결 방법, 비즈니스 구조를 자유롭게 적어보세요..."
                  rows={9}
                  class="w-full bg-transparent text-gray-100 placeholder-stone-600 text-base focus:outline-none leading-relaxed"
                />

                <div class="pt-3 border-t border-stone-800 flex justify-between items-center">
                  <span class="text-xs text-stone-500">{inputText.length}자 입력 중</span>
                  <button
                    onClick={handleAddIdea}
                    disabled={!inputText.trim()}
                    class={`px-6 py-2.5 rounded-xl font-bold text-sm transition-all shadow-md ${
                      inputText.trim()
                        ? "bg-stone-200 text-stone-900 hover:bg-white active:scale-95"
                        : "bg-stone-800 text-stone-600 cursor-not-allowed"
                    }`}
                  >
                    서랍에 넣고 AI 검증하기 →
                  </button>
                </div>
              </div>

              <div class="p-3.5 bg-stone-900/60 rounded-xl border border-stone-800/60 text-xs text-stone-400 leading-relaxed">
                💡 <b class="text-stone-300">작성 팁:</b> 아이디어를 작성하면 AI 검증 엔진이 <span class="text-amber-400">B2B 확장성, 시간/비용 절감, 특허 진입장벽, 1인 실행력</span>을 즉시 다각도로 정밀 분석합니다.
              </div>
            </div>
          )}

          {/* 탭 02, 03, 04 공통 리스트 렌더링 */}
          {tab !== "01" && (
            <div class="space-y-4">
              {ideas.filter(item => item.pipeline === tab).length === 0 ? (
                <div class="text-center py-16 bg-[#24201d]/50 rounded-2xl border border-dashed border-stone-800">
                  <p class="text-stone-500 text-sm">보관된 아이디어가 없습니다.</p>
                  <button onClick={() => setTab("01")} class="mt-3 text-xs text-amber-400 underline">
                    새 생각 기록하러 가기
                  </button>
                </div>
              ) : (
                ideas
                  .filter(item => item.pipeline === tab)
                  .map((item) => {
                    const evalData = item.evaluation || evaluateIdeaDynamic(item.text, item.category);
                    const isEditing = editingId === item.id;

                    return (
                      <div key={item.id} class="bg-[#24201d] border border-stone-800/90 rounded-2xl p-4 shadow-md transition-all">
                        {/* 카드 헤더 (카테고리 + 상태배지 + 수정/삭제) */}
                        <div class="flex justify-between items-center mb-3">
                          <div class="flex items-center gap-2">
                            <span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 text-[11px] font-semibold">
                              {item.category || "제품"}
                            </span>
                            <span class="px-2 py-0.5 rounded border border-emerald-600/40 text-emerald-400 text-[11px] font-bold">
                              {evalData.statusBadge || "승인"}
                            </span>
                          </div>

                          <div class="flex items-center gap-2">
                            {!isEditing && (
                              <button 
                                onClick={() => startEditing(item)}
                                class="text-xs text-stone-400 hover:text-stone-200 px-2 py-1 bg-stone-800 rounded-md"
                              >
                                수정
                              </button>
                            )}
                            <button 
                              onClick={() => deleteIdea(item.id)}
                              class="text-xs text-stone-500 hover:text-red-400 px-1"
                            >
                              ✕
                            </button>
                          </div>
                        </div>

                        {/* 카드 본문 (일반 모드 vs 수정 모드) */}
                        {isEditing ? (
                          <div class="space-y-2 mb-3">
                            <textarea
                              value={editText}
                              onChange={(e) => setEditText(e.target.value)}
                              rows={4}
                              class="w-full p-2.5 bg-stone-900 border border-stone-700 rounded-xl text-sm text-gray-100 focus:outline-none focus:border-amber-500"
                            />
                            <div class="flex justify-end gap-2">
                              <button
                                onClick={() => setEditingId(null)}
                                class="px-3 py-1.5 bg-stone-800 text-stone-400 text-xs rounded-lg"
                              >
                                취소
                              </button>
                              <button
                                onClick={() => saveEdit(item.id)}
                                class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-bold rounded-lg"
                              >
                                수정 완료
                              </button>
                            </div>
                          </div>
                        ) : (
                          <p class="text-sm font-medium text-gray-100 leading-relaxed mb-4 whitespace-pre-wrap">
                            {item.text}
                          </p>
                        )}

                        {/* 평가 점수 그래프 */}
                        <div class="space-y-2 mb-3 text-xs">
                          <ScoreBar label="B2B 확장성" score={evalData.b2b} />
                          <ScoreBar label="시간/비용 절감" score={evalData.cost} />
                          <ScoreBar label="특허 진입장벽" score={evalData.patent} />
                          <ScoreBar label="1인 실행력" score={evalData.execution} />
                        </div>

                        {/* AI 조언 상자 */}
                        <div class="p-3 bg-[#1c1815] rounded-xl border border-stone-800/80 mb-3">
                          <div class="text-[11px] font-bold text-amber-400 mb-1">AI 조언</div>
                          <p class="text-xs text-stone-300 leading-relaxed">
                            {evalData.advice}
                          </p>
                        </div>

                        {/* 하단 액션 버튼들 */}
                        <div class="grid grid-cols-2 gap-2 pt-1">
                          {tab === "02" && (
                            <>
                              <button
                                onClick={() => movePipeline(item.id, "04")}
                                class="py-2 bg-emerald-800/80 hover:bg-emerald-700 text-emerald-100 font-semibold text-xs rounded-xl transition-all"
                              >
                                실행으로 이동
                              </button>
                              <button
                                onClick={() => movePipeline(item.id, "03")}
                                class="py-2 bg-stone-800 hover:bg-stone-700 text-stone-300 font-semibold text-xs rounded-xl transition-all"
                              >
                                보류함으로 이동
                              </button>
                            </>
                          )}
                          {tab === "03" && (
                            <>
                              <button
                                onClick={() => movePipeline(item.id, "02")}
                                class="py-2 bg-amber-800/70 hover:bg-amber-700 text-amber-100 font-semibold text-xs rounded-xl transition-all"
                              >
                                검증으로 복원
                              </button>
                              <button
                                onClick={() => movePipeline(item.id, "04")}
                                class="py-2 bg-emerald-800/80 hover:bg-emerald-700 text-emerald-100 font-semibold text-xs rounded-xl transition-all"
                              >
                                실행으로 이동
                              </button>
                            </>
                          )}
                          {tab === "04" && (
                            <>
                              <button
                                onClick={() => movePipeline(item.id, "02")}
                                class="py-2 bg-stone-800 hover:bg-stone-700 text-stone-300 font-semibold text-xs rounded-xl transition-all"
                              >
                                검증단계로 복귀
                              </button>
                              <button
                                onClick={() => movePipeline(item.id, "03")}
                                class="py-2 bg-stone-800 hover:bg-stone-700 text-stone-300 font-semibold text-xs rounded-xl transition-all"
                              >
                                보류함으로 이동
                              </button>
                            </>
                          )}
                        </div>
                      </div>
                    );
                  })
              )}
            </div>
          )}

          {/* 하단 고정 4단 내비게이션 바 */}
          <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#1a1715]/95 backdrop-blur-md border-t border-stone-800/80 px-2 py-2 flex justify-around items-center z-50">
            <NavTabButton 
              active={tab === "01"} 
              onClick={() => setTab("01")} 
              icon="✏️" 
              label="01 생각" 
            />
            <NavTabButton 
              active={tab === "02"} 
              onClick={() => setTab("02")} 
              icon="📋" 
              label="02 검증" 
              count={ideas.filter(i => i.pipeline === "02").length}
            />
            <NavTabButton 
              active={tab === "03"} 
              onClick={() => setTab("03")} 
              icon="📥" 
              label="03 보류" 
              count={ideas.filter(i => i.pipeline === "03").length}
            />
            <NavTabButton 
              active={tab === "04"} 
              onClick={() => setTab("04")} 
              icon="🚀" 
              label="04 실행" 
              count={ideas.filter(i => i.pipeline === "04").length}
            />
          </nav>
        </div>
      );
    }

    // --- 서브 컴포넌트: 점수 바 ---
    function ScoreBar({ label, score }) {
      return (
        <div class="flex items-center justify-between gap-3 text-stone-300">
          <span class="w-24 text-stone-400 font-medium">{label}</span>
          <div class="flex-1 bg-stone-800 h-2 rounded-full overflow-hidden">
            <div 
              class="bg-emerald-600/80 h-full rounded-full transition-all duration-500" 
              style={{ width: `${score}%` }} 
            />
          </div>
          <span class="w-6 text-right font-semibold text-stone-200">{score}</span>
        </div>
      );
    }

    // --- 서브 컴포넌트: 하단 탭 버튼 ---
    function NavTabButton({ active, onClick, icon, label, count }) {
      return (
        <button
          onClick={onClick}
          class={`flex flex-col items-center justify-center py-1 px-3 rounded-xl transition-all relative ${
            active ? "text-amber-400 font-bold" : "text-stone-500 hover:text-stone-300"
          }`}
        >
          <span class="text-base mb-0.5">{icon}</span>
          <span class="text-[11px] tracking-tight">{label}</span>
          {count > 0 && (
            <span class="absolute top-0 right-1 px-1.5 py-0.2 bg-stone-700 text-stone-300 rounded-full text-[9px]">
              {count}
            </span>
          )}
        </button>
      );
    }

    // 렌더링
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <IdeaDrawerApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
