<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>생각서랍</title>
  <style>
    :root {
      --bg: #000000; --card: #1c1c1e; --surface: #2c2c2e; --primary: #2563eb; --accent: #38bdf8; --danger: #ef4444; --text: #f8fafc; --muted: #8e8e93; --border: #2c2c2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; background-color: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; padding-top: env(safe-area-inset-top, 0px); }
    header { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 6px; }
    .header-btn { background: var(--card); border: 1px solid var(--border); color: #ffffff; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.05rem; flex-shrink: 0; }
    .main-mode-switch { display: flex; background: #141416; padding: 3px; border-radius: 20px; border: 1px solid var(--border); gap: 2px; flex: 1; justify-content: center; max-width: 320px; }
    .mode-btn { padding: 6px clamp(6px, 1.8vw, 10px); border-radius: 16px; border: none; background: transparent; color: var(--muted); font-size: clamp(0.72rem, 2.2vw, 0.8rem); font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 3px; white-space: nowrap; }
    .mode-btn.active { background: var(--primary); color: #ffffff; box-shadow: 0 2px 8px rgba(37,99,235,0.4); }
    .category-bar { display: flex; padding: 8px 12px; background: #121214; gap: 6px; overflow-x: auto; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .category-pill { padding: 5px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); font-size: 0.78rem; color: var(--muted); cursor: pointer; white-space: nowrap; font-weight: 600; }
    .category-pill.active { background: var(--primary); color: #ffffff; border-color: var(--primary); }
    .view-container { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .empty-canvas { margin: auto; text-align: center; color: #52525b; font-size: 0.95rem; line-height: 1.6; }
    .thought-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .card-badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 6px; background: var(--surface); color: var(--accent); font-weight: 600; }
    .card-time { font-size: 0.75rem; color: var(--muted); }
    .card-content { font-size: clamp(0.92rem, 2.7vw, 1.05rem); line-height: 1.5; white-space: pre-wrap; color: #ffffff; }
    .card-five-buttons { display: flex; gap: 5px; overflow-x: auto; white-space: nowrap; border-top: 1px solid #27272a; padding-top: 10px; }
    .five-btn { flex: 1; min-width: 50px; display: inline-flex; align-items: center; justify-content: center; padding: 7px 4px; border-radius: 8px; border: 1px solid #3f3f46; background: #1c1c1e; color: #a1a1aa; font-size: clamp(0.7rem, 2vw, 0.76rem); font-weight: 600; cursor: pointer; }
    .five-btn.active-backlog { background: #1e3a8a; border-color: #3b82f6; color: #ffffff; font-weight: 700; }
    .five-btn.active-time { background: #0369a1; border-color: #38bdf8; color: #ffffff; font-weight: 700; }
    .five-btn.active-focus { background: #7c2d12; border-color: #ea580c; color: #ffedd5; font-weight: 700; }
    
    /* 암전 메모딱지 화면 */
    #memopad-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: #000000; z-index: 2000; touch-action: none; overflow: hidden; }
    #memopad-screen.active { display: block; }
    #memopad-canvas { width: 100vw; height: 100dvh; display: block; background: #000000; }
    .memopad-toolbar { display: none; position: absolute; top: 12px; left: 12px; right: 12px; background: rgba(28,28,30,0.95); backdrop-filter: blur(10px); border: 1px solid #3a3a3c; border-radius: 16px; padding: 8px; gap: 6px; z-index: 2100; flex-direction: column; }
    .memopad-toolbar.active { display: flex; }

    .bottom-bar-wrapper { padding: 8px 14px calc(14px + env(safe-area-inset-bottom, 0px)) 14px; background: var(--bg); position: relative; flex-shrink: 0; }
    .capsule-box { background: var(--card); border: 1px solid var(--border); border-radius: 30px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; }
    .btn-plus { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: none; color: #ffffff; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-plus.open { transform: rotate(45deg); background: var(--danger); }
    .main-input { flex: 1; background: transparent; border: none; color: #ffffff; font-size: clamp(0.88rem, 2.6vw, 0.95rem); outline: none; min-height: 24px; max-height: 90px; resize: none; line-height: 1.4; user-select: text; }
    .btn-mic { background: none; border: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .btn-mic svg { width: 22px; height: 22px; fill: #8e8e93; }
    .btn-action-send { width: 36px; height: 36px; border-radius: 50%; background: #2563eb; border: none; display: flex; align-items: center; justify-content: center; gap: 2px; cursor: pointer; color: #ffffff; font-size: 1.2rem; font-weight: bold; flex-shrink: 0; }
    .plus-menu-popover { display: none; position: absolute; bottom: 74px; left: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 8px 6px; flex-direction: column; gap: 4px; z-index: 50; min-width: 170px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .plus-menu-popover.active { display: flex; }
    .menu-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; color: #ffffff; font-size: 0.9rem; cursor: pointer; }
    .menu-item:active { background: var(--surface); }
  </style>
</head>
<body>

  <header>
    <button class="header-btn" onclick="resetToIdeaDrawer()" title="첫 생각">💡</button>
    <div class="main-mode-switch">
      <button id="tab-btn-idea" class="mode-btn active" onclick="switchMainMode('idea')">💡 생각서랍</button>
      <button id="tab-btn-plan" class="mode-btn" onclick="switchMainMode('plan')">📋 나의계획</button>
      <button class="mode-btn" onclick="openMemoPadDirect()">📑 메모딱지</button>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="header-btn" onclick="localStorage.clear(); location.reload();" title="초기화">🧹</button>
    </div>
  </header>

  <div class="category-bar" id="idea-category-bar">
    <div class="category-pill active" onclick="selectCategory('첫 생각')">💡 첫 생각</div>
    <div class="category-pill" onclick="selectCategory('노트')">📝 노트</div>
    <div class="category-pill" onclick="selectCategory('사진')">📷 사진</div>
    <div class="category-pill" onclick="selectCategory('동영상')">🎬 동영상</div>
    <div class="category-pill" onclick="selectCategory('전체')">📂 전체</div>
  </div>

  <div class="view-container" id="idea-feed-container">
    <div class="empty-canvas">떠오르는 생각을 기록하세요. 저장 즉시 서랍으로 들어갑니다.</div>
  </div>

  <div class="view-container" id="plan-feed-container" style="display:none;">
    <div class="plan-time-tabs">
      <button class="plan-time-tab active" id="ptab-backlog" onclick="switchPlanSubtab('backlog')">🔄 대기</button>
      <button class="plan-time-tab focus-tab" id="ptab-focus" onclick="switchPlanSubtab('focus')">⚡ 집중</button>
      <button class="plan-time-tab" id="ptab-morning" onclick="switchPlanSubtab('morning')">🌅 오전</button>
      <button class="plan-time-tab" id="ptab-afternoon" onclick="switchPlanSubtab('afternoon')">☀️ 오후</button>
      <button class="plan-time-tab" id="ptab-evening" onclick="switchPlanSubtab('evening')">🌙 저녁</button>
      <button class="plan-time-tab" id="ptab-night" onclick="switchPlanSubtab('night')">⏱️ 심야</button>
    </div>
    <div id="plan-card-list" style="display:flex; flex-direction:column; gap:12px;"></div>
  </div>

  <div class="attachment-tray" id="attachment-tray" style="display:none; padding:8px 14px; gap:8px; overflow-x:auto; background:#121214;"></div>

  <div class="bottom-bar-wrapper">
    <div class="plus-menu-popover" id="plus-menu">
      <div class="menu-item" onclick="triggerNativeCamera()"><span>📷 카메라 촬영 추가</span></div>
      <div class="menu-item" onclick="triggerNativeGallery()"><span>🖼️ 사진 선택 (다중)</span></div>
      <div class="menu-item" onclick="triggerNativeVideo()"><span>🎬 동영상 촬영 추가</span></div>
      <div class="menu-item" onclick="openMemoPadDirect()"><span>📑 메모딱지 작성</span></div>
    </div>
    <div class="capsule-box">
      <button id="btn-plus" class="btn-plus" onclick="togglePlusMenu()">＋</button>
      <textarea id="prompt-input" class="main-input" placeholder="생각을 입력하세요..." rows="1" oninput="handleInputChange(this);"></textarea>
      <button class="btn-mic" onpointerdown="event.preventDefault()" onclick="triggerVoiceInput()">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </button>
      <button id="btn-wave" class="btn-action-send" onpointerdown="event.preventDefault()" onclick="handleSendAction()">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      </button>
    </div>
  </div>

  <!-- 암전 메모딱지 인터페이스 -->
  <div id="memopad-screen">
    <div id="memopad-toolbar" class="memopad-toolbar">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="color:#fff; font-size:0.85rem; font-weight:bold;">📑 메모딱지</span>
        <div style="display:flex; gap:6px;">
          <button onclick="saveMemoPadToDrawer()" style="background:var(--primary); color:#fff; border:none; padding:4px 10px; border-radius:6px; font-size:0.75rem; font-weight:bold;">저장</button>
          <button onclick="closeMemoPadDirect()" style="background:var(--surface); color:#fff; border:none; width:22px; height:22px; border-radius:50%; font-size:0.75rem;">✕</button>
        </div>
      </div>
      <input id="memopad-text-input" type="text" placeholder="말씀하시거나 텍스트 입력..." style="background:#121214; border:1px solid #3a3a3c; color:#fff; padding:6px; border-radius:8px; font-size:0.85rem; outline:none;" />
    </div>
    <canvas id="memopad-canvas"></canvas>
  </div>

  <script>
    let currentMainMode = 'idea', currentCategory = '첫 생각', currentAttachments = [];
    let currentPlanSubtab = 'backlog';

    function switchMainMode(mode) {
      currentMainMode = mode;
      document.getElementById('tab-btn-idea').classList.toggle('active', mode === 'idea');
      document.getElementById('tab-btn-plan').classList.toggle('active', mode === 'plan');
      document.getElementById('idea-category-bar').style.display = (mode === 'idea') ? 'flex' : 'none';
      document.getElementById('idea-feed-container').style.display = (mode === 'idea') ? 'flex' : 'none';
      document.getElementById('plan-feed-container').style.display = (mode === 'plan') ? 'flex' : 'none';
      document.getElementById('btn-plus').style.display = (mode === 'idea') ? 'flex' : 'none';
      if (mode === 'idea') renderFeed(); else renderPlanView();
    }
    function resetToIdeaDrawer() { switchMainMode('idea'); selectCategory('첫 생각'); }
    function selectCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.category-pill').forEach(p => p.classList.toggle('active', p.innerText.includes(cat)));
      renderFeed();
    }
    function togglePlusMenu() { document.getElementById('plus-menu').classList.toggle('active'); }
    function closePlusMenu() { document.getElementById('plus-menu').classList.remove('active'); }

    /* 네이티브 카메라 연동 */
    function triggerNativeCamera() { closePlusMenu(); if (window.AndroidBridge && window.AndroidBridge.openCamera) window.AndroidBridge.openCamera(); }
    function triggerNativeGallery() { closePlusMenu(); if (window.AndroidBridge && window.AndroidBridge.openGallery) window.AndroidBridge.openGallery(); }
    function triggerNativeVideo() { closePlusMenu(); if (window.AndroidBridge && window.AndroidBridge.openVideo) window.AndroidBridge.openVideo(); }

    window.receiveMediaResult = function(base64Data, type) {
      if (base64Data) {
        currentAttachments.push({ type: type, data: base64Data, isVideo: (type === '동영상') });
        renderAttachmentTray();
      }
    };
    function renderAttachmentTray() {
      const tray = document.getElementById('attachment-tray');
      if (currentAttachments.length === 0) { tray.style.display = 'none'; tray.innerHTML = ''; return; }
      tray.style.display = 'flex';
      tray.innerHTML = currentAttachments.map((item, idx) => `
        <div style="position:relative; width:60px; height:60px; flex-shrink:0;">
          <img src="${item.data}" style="width:100%; height:100%; object-fit:cover; border-radius:8px;" />
          <button style="position:absolute; top:-4px; right:-4px; width:18px; height:18px; border-radius:50%; background:var(--danger); color:#fff; border:none;" onclick="currentAttachments.splice(${idx},1);renderAttachmentTray();">✕</button>
        </div>
      `).join('');
    }

    function handleInputChange(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 90) + 'px';
    }

    function handleSendAction() {
      const input = document.getElementById('prompt-input');
      const text = input.value.trim();
      if (text || currentAttachments.length > 0) {
        if (currentMainMode === 'idea') {
          let cat = '노트';
          if (currentAttachments.length > 0) cat = currentAttachments.some(a => a.type === '동영상') ? '동영상' : '사진';
          saveThought(cat, text, [...currentAttachments]);
          selectCategory('첫 생각');
        } else {
          savePlanToBacklog(text);
          renderPlanView();
        }
        input.value = ''; input.style.height = 'auto'; currentAttachments = [];
        renderAttachmentTray();
      } else {
        triggerVoiceInput();
      }
    }

    /* 음성 입력 시간 및 띄어쓰기 최적화 (구글 다이얼로그) */
    function triggerVoiceInput() {
      closePlusMenu();
      if (window.AndroidBridge && window.AndroidBridge.openSpeechDialog) {
        window.AndroidBridge.openSpeechDialog();
      }
    }
    window.receiveVoiceResult = function(text) {
      if (text && text.trim()) {
        const el = document.getElementById('prompt-input');
        el.value += (el.value ? ' ' : '') + text.trim().replace(/\s+/g, ' ');
        handleInputChange(el);
      }
    };

    /* 스토리지 관리 */
    function getThoughtStorage() {
      try { return Array.from(new Map(JSON.parse(localStorage.getItem('idea_drawer_storage') || '[]').map(i => [i.id, i])).values()); } catch(e) { return []; }
    }
    function setThoughtStorage(arr) {
      localStorage.setItem('idea_drawer_storage', JSON.stringify(arr));
      renderFeed();
    }
    function saveThought(cat, content, media) {
      const list = getThoughtStorage();
      list.unshift({ id: Date.now() + Math.random(), category: cat, content: content || '', mediaList: media || [], time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) });
      setThoughtStorage(list);
    }
    function getPlanStorage() {
      try { return Array.from(new Map(JSON.parse(localStorage.getItem('plan_drawer_storage') || '[]').map(i => [i.id, i])).values()); } catch(e) { return []; }
    }
    function setPlanStorage(arr) {
      localStorage.setItem('plan_drawer_storage', JSON.stringify(arr));
      renderPlanView();
    }
    function savePlanToBacklog(title) {
      if (!title || !title.trim()) return;
      const list = getPlanStorage();
      list.unshift({ id: Date.now() + Math.random(), title: title.trim(), status: '대기', timeSlot: 'none', isFocus: false, updatedAt: new Date().toLocaleDateString() });
      setPlanStorage(list);
      switchPlanSubtab('backlog');
    }

    function transferThoughtDirect(id, type) {
      let thoughts = getThoughtStorage();
      const item = thoughts.find(t => t.id === id);
      if (!item) return;
      const plans = getPlanStorage();
      const isFocus = (type === 'focus');
      plans.unshift({ id: Date.now() + Math.random(), title: item.content || '메모', status: '대기', timeSlot: 'none', isFocus: isFocus, mediaList: item.mediaList || [], updatedAt: new Date().toLocaleDateString() });
      setPlanStorage(plans);
      setThoughtStorage(thoughts.filter(t => t.id !== id));
    }

    function reassignPlanSlotDirect(id, type) {
      const plans = getPlanStorage();
      const item = plans.find(p => p.id === id);
      if (item) {
        if (type === 'focus') item.isFocus = !item.isFocus;
        else if (type === 'backlog') { item.isFocus = false; item.timeSlot = 'none'; }
        setPlanStorage(plans);
      }
    }

    function renderFeed() {
      const list = getThoughtStorage();
      const feed = document.getElementById('idea-feed-container');
      if (currentCategory === '첫 생각') {
        feed.innerHTML = `<div class="empty-canvas">떠오르는 생각을 기록하세요. 저장 즉시 서랍으로 들어갑니다.</div>`;
        return;
      }
      const filtered = (currentCategory === '전체') ? list : list.filter(i => (i.category || '').includes(currentCategory));
      if (filtered.length === 0) {
        feed.innerHTML = `<div class="empty-canvas">[${currentCategory}] 생각이 없습니다.</div>`;
        return;
      }
      feed.innerHTML = filtered.map(item => `
        <div class="thought-card">
          <div class="card-header"><span class="card-badge">${item.category || '노트'}</span><span class="card-time">${item.time}</span></div>
          ${item.mediaList && item.mediaList.length > 0 ? `<div>${item.mediaList.map(m => `<img src="${m.data}" style="width:100%; max-height:240px; object-fit:contain; background:#000;" />`).join('')}</div>` : ''}
          ${item.content ? `<div class="card-content">${item.content}</div>` : ''}
          <div class="card-five-buttons">
            <button class="five-btn active-backlog" onclick="transferThoughtDirect(${item.id}, 'backlog')">🔄 대기</button>
            <button class="five-btn" onclick="transferThoughtDirect(${item.id}, 'focus')">⚡ 지금집중</button>
            <button class="five-btn" onclick="navigator.clipboard.writeText('${(item.content||'').replace(/'/g, '&#39;')}')">📋 복사</button>
            <button class="five-btn" style="color:#f87171;" onclick="setThoughtStorage(getThoughtStorage().filter(i=>i.id !== ${item.id}))">🗑️ 삭제</button>
          </div>
        </div>
      `).join('');
    }

    function switchPlanSubtab(tab) {
      currentPlanSubtab = tab;
      document.querySelectorAll('.plan-time-tab').forEach(b => b.classList.remove('active'));
      const cur = document.getElementById(`ptab-${tab}`);
      if (cur) cur.classList.add('active');
      renderPlanView();
    }

    function renderPlanView() {
      const list = getPlanStorage();
      const container = document.getElementById('plan-card-list');
      let filtered = [];
      if (currentPlanSubtab === 'focus') filtered = list.filter(p => p.isFocus);
      else if (currentPlanSubtab === 'backlog') filtered = list.filter(p => !p.isFocus && (!p.timeSlot || p.timeSlot === 'none'));
      else filtered = list.filter(p => !p.isFocus && p.timeSlot === currentPlanSubtab);

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-canvas" style="padding:40px 0;">해당 탭에 일과가 없습니다.</div>';
        return;
      }

      container.innerHTML = filtered.map(p => `
        <div class="plan-big-card">
          <div class="plan-big-card-top">
            <span class="status-badge-lg waiting" onclick="p.status=(p.status==='대기'?'진행중':'대기');setPlanStorage(getPlanStorage());">${p.status}</span>
            <div class="plan-big-title">${p.title}</div>
          </div>
          <div class="card-five-buttons">
            <button class="five-btn active-backlog" onclick="reassignPlanSlotDirect(${p.id}, 'backlog')">🔄 대기</button>
            <button class="five-btn" onclick="reassignPlanSlotDirect(${p.id}, 'focus')">⚡ 지금집중</button>
            <button class="five-btn" style="color:#f87171;" onclick="setPlanStorage(getPlanStorage().filter(x=>x.id !== ${p.id}))">🗑️ 삭제</button>
          </div>
        </div>
      `).join('');
    }

    /* 암전 메모딱지 로직 */
    let padCanvas, padCtx, isDrawing = false;
    function openMemoPadDirect() {
      closePlusMenu();
      document.getElementById('memopad-screen').classList.add('active');
      document.getElementById('memopad-toolbar').classList.add('active');
      padCanvas = document.getElementById('memopad-canvas');
      padCtx = padCanvas.getContext('2d');
      padCanvas.width = window.innerWidth;
      padCanvas.height = window.innerHeight;
      padCtx.fillStyle = '#000000';
      padCtx.fillRect(0, 0, padCanvas.width, padCanvas.height);
      padCtx.strokeStyle = '#ffffff';
      padCtx.lineWidth = 3;
      padCtx.lineCap = 'round';
    }
    function closeMemoPadDirect() {
      document.getElementById('memopad-screen').classList.remove('active');
      document.getElementById('memopad-toolbar').classList.remove('active');
    }
    function saveMemoPadToDrawer() {
      const text = document.getElementById('memopad-text-input').value.trim();
      const dataUrl = padCanvas.toDataURL('image/jpeg', 0.85);
      saveThought('메모딱지', text, [{ type: '메모딱지', data: dataUrl, isVideo: false }]);
      closeMemoPadDirect();
      switchMainMode('idea');
      selectCategory('전체');
    }

    padCanvas = document.getElementById('memopad-canvas');
    padCanvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      isDrawing = true;
      const t = e.touches[0];
      padCtx.beginPath();
      padCtx.moveTo(t.clientX, t.clientY);
    });
    padCanvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!isDrawing) return;
      const t = e.touches[0];
      padCtx.lineTo(t.clientX, t.clientY);
      padCtx.stroke();
    });
    padCanvas.addEventListener('touchend', () => { isDrawing = false; });

    selectCategory('첫 생각');
  </script>
</body>
</html>
